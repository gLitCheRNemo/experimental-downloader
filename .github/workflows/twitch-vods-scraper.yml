name: Twitch VODs Scraper

on:
  workflow_dispatch:
    inputs:
      channel_url:
        description: 'Twitch channel URL'
        required: true
        type: string
      link_range:
        description: 'Which VOD links to extract (e.g., 1, 1-5, 3,7,10-15)'
        required: false
        default: '1-10'
        type: string
      scroll_count:
        description: 'Number of times to scroll down (0-20)'
        required: false
        default: '3'
        type: string
      bale_token:
        description: 'Bale Bot Token'
        required: true
        type: string
      bale_chat_id:
        description: 'Bale Chat ID'
        required: true
        type: string

jobs:
  scrape-vods:
    runs-on: ubuntu-latest
    steps:
      - name: Mask sensitive inputs
        run: |
          echo "::add-mask::${{ inputs.bale_token }}"
          echo "::add-mask::${{ inputs.bale_chat_id }}"
          echo "✅ Sensitive inputs masked"

      - name: Install dependencies with Stealth Plugin
        run: |
          sudo apt-get update
          sudo apt-get install -y wget gnupg
          wget -q -O - https://dl-ssl.google.com/linux/linux_signing_key.pub | sudo apt-key add -
          sudo sh -c 'echo "deb [arch=amd64] http://dl.google.com/linux/chrome/deb/ stable main" >> /etc/apt/sources.list.d/google.list'
          sudo apt-get update
          sudo apt-get install -y google-chrome-stable
          mkdir -p scraper
          cd scraper
          npm init -y
          npm install puppeteer-extra puppeteer-extra-plugin-stealth puppeteer

      - name: Create scraper script with Stealth Plugin
        run: |
          cat > scraper/index.js << 'EOF'
          const puppeteer = require('puppeteer-extra');
          const StealthPlugin = require('puppeteer-extra-plugin-stealth');
          const fs = require('fs');
          
          // Apply stealth plugin to evade detection
          puppeteer.use(StealthPlugin());

          function expandRange(rangeStr, maxValue) {
            var result = [];
            var parts = rangeStr.split(',');
            for (var p = 0; p < parts.length; p++) {
              var part = parts[p].trim();
              if (part.indexOf('-') !== -1) {
                var rangeParts = part.split('-');
                var start = parseInt(rangeParts[0], 10);
                var end = parseInt(rangeParts[1], 10);
                var min = Math.min(start, end);
                var max = Math.max(start, end);
                for (var i = min; i <= max && i <= maxValue; i++) {
                  if (result.indexOf(i) === -1) result.push(i);
                }
              } else if (part !== '') {
                var num = parseInt(part, 10);
                if (!isNaN(num) && num <= maxValue && result.indexOf(num) === -1) {
                  result.push(num);
                }
              }
            }
            result.sort(function(a, b) { return a - b; });
            return result;
          }

          (async function() {
            var browser = null;
            try {
              console.log('🚀 Launching Chrome with Stealth Plugin...');
              browser = await puppeteer.launch({
                executablePath: '/usr/bin/google-chrome-stable',
                args: [
                  '--no-sandbox',
                  '--disable-setuid-sandbox',
                  '--disable-dev-shm-usage',
                  '--disable-blink-features=AutomationControlled',
                  '--disable-features=IsolateOrigins,site-per-process'
                ],
                headless: 'new'
              });

              var page = await browser.newPage();
              await page.setViewport({ width: 1920, height: 1080 });
              
              // Set realistic user agent
              await page.setUserAgent('Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36');

              var channelUrl = process.env.CHANNEL_URL;
              channelUrl = channelUrl.replace(/\/$/, '');
              var videosUrl = channelUrl;
              if (channelUrl.indexOf('/videos') === -1) {
                videosUrl = channelUrl + '/videos';
              }

              console.log('🌐 Navigating to: ' + videosUrl);
              await page.goto(videosUrl, { waitUntil: 'networkidle2', timeout: 60000 });

              console.log('⏳ Waiting for page to load...');
              await new Promise(function(r) { setTimeout(r, 5000); });

              var scrollCount = parseInt(process.env.SCROLL_COUNT, 10) || 3;
              console.log('📜 Scrolling ' + scrollCount + ' times...');
              for (var s = 0; s < scrollCount; s++) {
                await page.evaluate(function() { window.scrollBy(0, window.innerHeight); });
                await new Promise(function(r) { setTimeout(r, 2000); });
              }
              await new Promise(function(r) { setTimeout(r, 3000); });

              console.log('🔍 Extracting VOD links...');
              var vods = [];
              var seenUrls = {};

              var cards = await page.$$('a[href*="/videos/"], a[href*="/v/"]');

              console.log('Found ' + cards.length + ' candidate links');

              for (var c = 0; c < cards.length; c++) {
                try {
                  var href = await page.evaluate(function(el) { return el.getAttribute('href'); }, cards[c]);
                  if (!href) continue;
                  if (href.indexOf('/') === 0) href = 'https://www.twitch.tv' + href;
                  var cleanUrl = href.split('?')[0];
                  if (cleanUrl.indexOf('/videos/') === -1 && cleanUrl.indexOf('/v/') === -1) continue;
                  if (seenUrls[cleanUrl]) continue;
                  seenUrls[cleanUrl] = true;

                  var title = await page.evaluate(function(el) {
                    var card = el.closest('[data-test-selector="video-card"], .tw-card, article');
                    if (card) {
                      var t = card.querySelector('[data-test-selector="video-card-title"], .tw-title, h3, h4');
                      if (t) return t.textContent.trim();
                    }
                    return 'Untitled';
                  }, cards[c]);

                  vods.push({ url: cleanUrl, title: title || 'Untitled' });
                  console.log('  ✅ Found: ' + title);
                } catch(e) {
                  console.log('  ⚠️ Error processing card: ' + e.message);
                }
              }

              console.log('📊 Total VODs found: ' + vods.length);
              
              if (vods.length === 0) {
                console.log('No VODs found with link method, trying regex fallback...');
                var pageContent = await page.content();
                var matches = pageContent.match(/https:\/\/www\.twitch\.tv\/videos\/\d+/g);
                if (matches) {
                  var uniqueMatches = {};
                  for (var m = 0; m < matches.length; m++) {
                    if (!uniqueMatches[matches[m]]) {
                      uniqueMatches[matches[m]] = true;
                      vods.push({ url: matches[m], title: 'VOD ' + (Object.keys(uniqueMatches).length) });
                    }
                  }
                  console.log('Found ' + vods.length + ' VODs via regex');
                }
              }

              if (vods.length === 0) {
                console.error('❌ No VODs found');
                await page.screenshot({ path: '/tmp/debug.png' });
                console.log('📸 Screenshot saved to /tmp/debug.png');
                process.exit(1);
              }

              var range = process.env.LINK_RANGE || '1-10';
              var indices = expandRange(range, vods.length);
              var selected = [];

              for (var i = 0; i < indices.length; i++) {
                var idx = indices[i];
                if (idx >= 1 && idx <= vods.length) selected.push(vods[idx - 1]);
              }

              console.log('✅ Selected ' + selected.length + ' VODs');

              var output = '';
              var links = '';
              for (var i = 0; i < selected.length; i++) {
                output = output + (i+1) + '. ' + selected[i].title + '\n   ' + selected[i].url + '\n\n';
                links = links + selected[i].url + '\n';
              }

              fs.writeFileSync('/tmp/vod_links.txt', links);
              fs.writeFileSync('/tmp/vod_full_list.txt', output);
              fs.writeFileSync('/tmp/link_count.txt', String(selected.length));

              var channelParts = channelUrl.replace(/\/$/, '').split('/');
              var channelName = channelParts[channelParts.length - 1];
              fs.writeFileSync('/tmp/channel_name.txt', channelName);

              console.log('🎉 Done!');
              await browser.close();
            } catch(err) {
              console.error('❌ Error:', err.message);
              process.exit(1);
            } finally {
              if (browser) await browser.close();
            }
          })();
          EOF

      - name: Run scraper
        run: |
          cd scraper
          export CHANNEL_URL="${{ inputs.channel_url }}"
          export LINK_RANGE="${{ inputs.link_range }}"
          export SCROLL_COUNT="${{ inputs.scroll_count }}"
          node index.js

      - name: Upload debug screenshot
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: debug-screenshot
          path: /tmp/debug.png
          retention-days: 1

      - name: Save results
        run: |
          if [ -f /tmp/vod_links.txt ]; then
            echo "VOD_LINKS=$(cat /tmp/vod_links.txt)" >> $GITHUB_ENV
            echo "VOD_FULL_LIST=$(cat /tmp/vod_full_list.txt)" >> $GITHUB_ENV
            echo "LINK_COUNT=$(cat /tmp/link_count.txt)" >> $GITHUB_ENV
            echo "CHANNEL_NAME=$(cat /tmp/channel_name.txt)" >> $GITHUB_ENV
            echo "✅ Results saved"
          else
            echo "❌ No results found - checking if debug screenshot exists"
            if [ -f /tmp/debug.png ]; then
              echo "Debug screenshot available in artifacts"
            fi
            exit 1
          fi

      - name: Send to Bale
        if: success()
        run: |
          TOKEN="${{ inputs.bale_token }}"
          CHAT_ID="${{ inputs.bale_chat_id }}"
          CHANNEL="${{ env.CHANNEL_NAME }}"
          COUNT="${{ env.LINK_COUNT }}"
          LIST="${{ env.VOD_FULL_LIST }}"
          
          # Truncate if too long
          if [ ${#LIST} -gt 3500 ]; then
            LIST="${LIST:0:3500}..."
          fi
          
          curl -s -X POST "https://tapi.bale.ai/bot${TOKEN}/sendMessage" \
            -d "chat_id=${CHAT_ID}" \
            -d "text=🎥 Twitch VODs Extracted!%0A%0A📺 Channel: ${CHANNEL}%0A📋 VODs found: ${COUNT}%0A%0A${LIST}%0A💡 Use these with your Video Downloader." \
            -d "parse_mode=Markdown"

      - name: Cleanup
        run: rm -rf scraper /tmp/vod_* /tmp/debug.png