name: Twitch VODs Scraper

on:
  workflow_dispatch:
    inputs:
      channel_url:
        description: 'Twitch channel URL'
        required: true
        type: string
      link_range:
        description: 'Which VOD links to extract (e.g., 1, 1-5, 3,7,10-15)'
        required: false
        default: '1-10'
        type: string
      scroll_count:
        description: 'Number of times to scroll down (0-20)'
        required: false
        default: '3'
        type: string
      bale_token:
        description: 'Bale Bot Token'
        required: true
        type: string
      bale_chat_id:
        description: 'Bale Chat ID'
        required: true
        type: string

jobs:
  scrape-vods:
    runs-on: ubuntu-latest
    steps:
      - name: Mask sensitive inputs
        run: |
          echo "::add-mask::${{ inputs.bale_token }}"
          echo "::add-mask::${{ inputs.bale_chat_id }}"

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y wget gnupg
          wget -q -O - https://dl-ssl.google.com/linux/linux_signing_key.pub | sudo apt-key add -
          sudo sh -c 'echo "deb [arch=amd64] http://dl.google.com/linux/chrome/deb/ stable main" >> /etc/apt/sources.list.d/google.list'
          sudo apt-get update
          sudo apt-get install -y google-chrome-stable
          mkdir -p scraper
          cd scraper
          npm init -y
          npm install puppeteer

      - name: Scrape VODs
        run: |
          cd scraper
          node -e "
          const puppeteer = require('puppeteer');
          const fs = require('fs');

          (async () => {
            const browser = await puppeteer.launch({
              executablePath: '/usr/bin/google-chrome-stable',
              args: ['--no-sandbox', '--disable-setuid-sandbox'],
              headless: 'new'
            });
            const page = await browser.newPage();
            
            let url = process.env.CHANNEL_URL;
            url = url.replace(/\/$/, '');
            if (!url.endsWith('/videos')) url = url + '/videos';
            
            console.log('Navigating to:', url);
            await page.goto(url, { waitUntil: 'networkidle2', timeout: 60000 });
            await new Promise(r => setTimeout(r, 5000));
            
            const scrolls = parseInt(process.env.SCROLL_COUNT) || 3;
            for (let i = 0; i < scrolls; i++) {
              await page.evaluate(() => window.scrollBy(0, window.innerHeight));
              await new Promise(r => setTimeout(r, 2000));
            }
            await new Promise(r => setTimeout(r, 3000));
            
            const vods = await page.evaluate(() => {
              const links = document.querySelectorAll('a[href*=\"/videos/\"], a[href*=\"/v/\"]');
              const seen = {};
              const results = [];
              for (const link of links) {
                let href = link.getAttribute('href');
                if (!href) continue;
                if (href.startsWith('/')) href = 'https://www.twitch.tv' + href;
                const clean = href.split('?')[0];
                if (!clean.includes('/videos/') && !clean.includes('/v/')) continue;
                if (seen[clean]) continue;
                seen[clean] = true;
                let title = 'Untitled';
                const card = link.closest('[data-test-selector=\"video-card\"], .tw-card');
                if (card) {
                  const titleEl = card.querySelector('[data-test-selector=\"video-card-title\"], .tw-title, h3');
                  if (titleEl) title = titleEl.textContent.trim();
                }
                results.push({ url: clean, title: title });
              }
              return results;
            });
            
            console.log('Found', vods.length, 'VODs');
            if (vods.length === 0) process.exit(1);
            
            function expandRange(rangeStr, maxVal) {
              const result = [];
              const parts = rangeStr.split(',');
              for (const part of parts) {
                const p = part.trim();
                if (p.includes('-')) {
                  const [start, end] = p.split('-').map(Number);
                  const min = Math.min(start, end);
                  const max = Math.max(start, end);
                  for (let i = min; i <= max && i <= maxVal; i++) {
                    if (!result.includes(i)) result.push(i);
                  }
                } else {
                  const num = parseInt(p, 10);
                  if (!isNaN(num) && num <= maxVal && !result.includes(num)) {
                    result.push(num);
                  }
                }
              }
              result.sort((a,b) => a - b);
              return result;
            }
            
            const range = process.env.LINK_RANGE || '1-10';
            const indices = expandRange(range, vods.length);
            const selected = indices.map(i => vods[i-1]).filter(v => v);
            
            let output = '';
            let links = '';
            for (let i = 0; i < selected.length; i++) {
              output += (i+1) + '. ' + selected[i].title + '\n   ' + selected[i].url + '\n\n';
              links += selected[i].url + '\n';
            }
            
            fs.writeFileSync('/tmp/vod_links.txt', links);
            fs.writeFileSync('/tmp/vod_full_list.txt', output);
            fs.writeFileSync('/tmp/link_count.txt', String(selected.length));
            
            const channelName = url.replace(/\/$/, '').split('/').pop();
            fs.writeFileSync('/tmp/channel_name.txt', channelName);
            
            console.log('Done');
            await browser.close();
          })();"

      - name: Save results
        run: |
          echo "VOD_LINKS=$(cat /tmp/vod_links.txt)" >> $GITHUB_ENV
          echo "VOD_FULL_LIST=$(cat /tmp/vod_full_list.txt)" >> $GITHUB_ENV
          echo "LINK_COUNT=$(cat /tmp/link_count.txt)" >> $GITHUB_ENV
          echo "CHANNEL_NAME=$(cat /tmp/channel_name.txt)" >> $GITHUB_ENV

      - name: Send to Bale
        run: |
          TOKEN="${{ inputs.bale_token }}"
          CHAT_ID="${{ inputs.bale_chat_id }}"
          curl -s -X POST "https://tapi.bale.ai/bot${TOKEN}/sendMessage" \
            -d "chat_id=${CHAT_ID}" \
            -d "text=🎥 Twitch VODs Extracted!%0A%0A📺 Channel: ${{ env.CHANNEL_NAME }}%0A📋 VODs found: ${{ env.LINK_COUNT }}%0A%0A${{ env.VOD_FULL_LIST }}%0A💡 Use these with your Video Downloader." \
            -d "parse_mode=Markdown"

      - name: Cleanup
        run: rm -rf scraper /tmp/vod_*