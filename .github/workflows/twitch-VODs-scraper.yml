name: Twitch VODs Scraper

on:
  workflow_dispatch:
    inputs:
      channel_url:
        description: '🔗 Twitch channel URL (e.g., https://www.twitch.tv/foolish or https://www.twitch.tv/foolish/videos)'
        required: true
        type: string
      link_range:
        description: '📋 Which VOD links to extract (e.g., 1 = first link, 1-5 = first 5 links, 3,7,10-15 = mixed)'
        required: false
        default: '1-10'
        type: string
      scroll_count:
        description: '📜 Number of times to scroll down to load more videos (0-20)'
        required: false
        default: '3'
        type: string
      parts_size:
        description: '🫙 Parts size for download links file (MB)'
        required: false
        type: string
        default: '45'
      bale_token:
        description: '🤖 Bale Bot Token (for sending the VOD links)'
        required: true
        type: string
      bale_chat_id:
        description: '💬 Bale Chat ID (for sending the VOD links)'
        required: true
        type: string

jobs:
  scrape-vods:
    runs-on: ubuntu-latest

    steps:
      - name: Mask sensitive inputs
        run: |
          echo "::add-mask::${{ inputs.bale_token }}"
          echo "::add-mask::${{ inputs.bale_chat_id }}"

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js and Puppeteer
        run: |
          sudo apt-get update
          sudo apt-get install -y wget gnupg
          # Install Chrome browser
          wget -q -O - https://dl-ssl.google.com/linux/linux_signing_key.pub | sudo apt-key add -
          sudo sh -c 'echo "deb [arch=amd64] http://dl.google.com/linux/chrome/deb/ stable main" >> /etc/apt/sources.list.d/google.list'
          sudo apt-get update
          sudo apt-get install -y google-chrome-stable
          # Setup Node.js project
          mkdir -p scraper_script
          cd scraper_script
          npm init -y
          npm install puppeteer

      - name: Scrape Twitch VOD links and titles
        id: scrape
        run: |
          CHANNEL_URL="${{ inputs.channel_url }}"
          LINK_RANGE="${{ inputs.link_range }}"
          SCROLL_COUNT="${{ inputs.scroll_count }}"

          cd scraper_script
          node << 'EOF'
          const puppeteer = require('puppeteer');
          const fs = require('fs');

          // Function to expand ranges like "1-5" or "1,3,5-7"
          function expandRange(rangeStr, maxValue) {
            const result = new Set();
            const parts = rangeStr.split(',');

            for (const part of parts) {
              part = part.trim();
              if (part.includes('-')) {
                const [start, end] = part.split('-').map(Number);
                const min = Math.min(start, end);
                const max = Math.max(start, end);
                for (let i = min; i <= max && i <= maxValue; i++) {
                  result.add(i);
                }
              } else if (part !== '') {
                const num = parseInt(part, 10);
                if (!isNaN(num) && num <= maxValue) {
                  result.add(num);
                }
              }
            }

            return Array.from(result).sort((a, b) => a - b);
          }

          (async () => {
            let browser;
            try {
              console.log('🚀 Launching Chrome browser...');
              browser = await puppeteer.launch({
                executablePath: '/usr/bin/google-chrome-stable',
                args: [
                  '--no-sandbox',
                  '--disable-setuid-sandbox',
                  '--disable-dev-shm-usage',
                  '--disable-gpu',
                  '--disable-web-security',
                  '--disable-features=IsolateOrigins,site-per-process'
                ],
                headless: 'new'
              });

              const page = await browser.newPage();

              // Set viewport
              await page.setViewport({ width: 1920, height: 1080 });

              // Navigate to the channel's videos page
              let channelUrl = process.env.CHANNEL_URL;
              channelUrl = channelUrl.replace(/\/$/, '');
              let videosUrl = channelUrl;
              if (!channelUrl.endsWith('/videos')) {
                videosUrl = channelUrl + '/videos';
              }

              console.log(`🌐 Navigating to: ${videosUrl}`);
              await page.goto(videosUrl, {
                waitUntil: 'networkidle2',
                timeout: 60000
              });

              console.log('⏳ Waiting 5 seconds for initial page load...');
              await new Promise(resolve => setTimeout(resolve, 5000));

              // Scroll down to load more videos
              const scrollCount = parseInt(process.env.SCROLL_COUNT, 10) || 3;
              console.log(`📜 Scrolling down ${scrollCount} times to load more videos...`);
              for (let i = 0; i < scrollCount; i++) {
                await page.evaluate(() => {
                  window.scrollBy(0, window.innerHeight);
                });
                await new Promise(resolve => setTimeout(resolve, 2000));
              }

              await new Promise(resolve => setTimeout(resolve, 3000));

              // ------------------------------------------------------------------
              // ENHANCED EXTRACTION: Get both VOD URLs and their Titles
              // ------------------------------------------------------------------
              console.log('🔍 Extracting VOD links and titles from page...');

              // Find all video cards on the page
              const videoCards = await page.$$('a[data-test-selector="video-card-link"], a[href*="/videos/"], a[href*="/v/"]');

              const vods = [];
              const processedUrls = new Set();

              for (const card of videoCards) {
                try {
                  // Get the VOD URL
                  let href = await page.evaluate(el => el.getAttribute('href'), card);
                  if (!href) continue;

                  if (href.startsWith('/')) {
                    href = 'https://www.twitch.tv' + href;
                  }
                  const cleanUrl = href.split('?')[0];

                  if (!cleanUrl.includes('/videos/') && !cleanUrl.includes('/v/')) continue;
                  if (processedUrls.has(cleanUrl)) continue;

                  // --- NEW: Extract the video title ---
                  // Titles are typically found within a title element or heading inside the card
                  let title = await page.evaluate(el => {
                    // Try to find the title in common Twitch title selectors
                    const titleEl = el.querySelector('[data-test-selector="video-card-title"], .tw-title, h3, .video-title');
                    if (titleEl) {
                      return titleEl.textContent.trim();
                    }
                    // Fallback: look for any heading inside the card
                    const heading = el.querySelector('h2, h3, h4');
                    if (heading) {
                      return heading.textContent.trim();
                    }
                    return null;
                  }, card);

                  // Get a more reliable title from the page context if the above fails
                  if (!title) {
                    title = await page.evaluate((url) => {
                      // Find the parent card that contains this link and look for a title element
                      const linkElement = document.querySelector(`a[href="${url}"]`);
                      if (linkElement) {
                        const card = linkElement.closest('[data-test-selector="video-card"], .tw-card, article');
                        if (card) {
                          const titleEl = card.querySelector('[data-test-selector="video-card-title"], .tw-title, h3, h4, .video-title');
                          if (titleEl) return titleEl.textContent.trim();
                        }
                      }
                      return 'Untitled VOD';
                    }, cleanUrl);
                  }

                  if (!title) title = 'Untitled VOD';

                  processedUrls.add(cleanUrl);
                  vods.push({ url: cleanUrl, title: title });
                } catch (err) {
                  console.log(`  ⚠️ Error processing card: ${err.message}`);
                }
              }

              // Fallback method using general selectors if the card method didn't work well
              if (vods.length === 0) {
                console.log('  Retrying with fallback extraction method...');
                const vodsFromPage = await page.evaluate(() => {
                  const results = [];
                  const links = document.querySelectorAll('a[href*="/videos/"], a[href*="/v/"]');
                  const uniqueUrls = new Set();

                  for (const link of links) {
                    let href = link.getAttribute('href');
                    if (href) {
                      if (href.startsWith('/')) href = 'https://www.twitch.tv' + href;
                      const cleanUrl = href.split('?')[0];
                      if (!cleanUrl.includes('/videos/') && !cleanUrl.includes('/v/')) continue;
                      if (uniqueUrls.has(cleanUrl)) continue;
                      uniqueUrls.add(cleanUrl);

                      // Try to find title near the link
                      let title = 'Untitled VOD';
                      const parent = link.closest('[data-test-selector="video-card"], .tw-card, article, div') ;
                      if (parent) {
                        const titleEl = parent.querySelector('[data-test-selector="video-card-title"], .tw-title, h3, h4, .video-title');
                        if (titleEl) title = titleEl.textContent.trim();
                      }
                      results.push({ url: cleanUrl, title: title });
                    }
                  }
                  return results;
                });
                
                for (const vod of vodsFromPage) {
                  if (!processedUrls.has(vod.url)) {
                    processedUrls.add(vod.url);
                    vods.push(vod);
                  }
                }
              }

              console.log(`\n📊 Found ${vods.length} unique VODs on the page`);
              if (vods.length === 0) {
                console.error('❌ No VODs found on the page');
                process.exit(1);
              }

              // Display all found VODs
              console.log('\n📋 All found VODs:');
              vods.forEach((vod, index) => {
                console.log(`  ${index + 1}. ${vod.title}`);
                console.log(`     ${vod.url}`);
              });

              // Parse the link range
              const linkRange = process.env.LINK_RANGE || '1-10';
              const maxIndex = vods.length;
              const selectedIndices = expandRange(linkRange, maxIndex);

              if (selectedIndices.length === 0) {
                console.error(`❌ No valid indices in range "${linkRange}". Max index is ${maxIndex}`);
                process.exit(1);
              }

              // Get selected VODs
              const selectedVods = [];
              for (const idx of selectedIndices) {
                if (idx >= 1 && idx <= maxIndex) {
                  selectedVods.push(vods[idx - 1]);
                }
              }

              console.log(`\n✅ Selected ${selectedVods.length} VOD(s) (range: ${linkRange})`);
              console.log('\n📋 Selected VODs:');
              selectedVods.forEach((vod, idx) => {
                console.log(`  ${idx + 1}. ${vod.title}`);
                console.log(`     ${vod.url}`);
              });

              // Save to files
              let linksOnly = '';
              let titlesOnly = '';
              let formattedOutput = '';

              selectedVods.forEach((vod, idx) => {
                linksOnly += vod.url + '\n';
                titlesOnly += vod.title + '\n';
                formattedOutput += `${idx + 1}. ${vod.title}\n   ${vod.url}\n\n`;
              });

              fs.writeFileSync('/tmp/vod_links.txt', linksOnly);
              fs.writeFileSync('/tmp/vod_titles.txt', titlesOnly);
              fs.writeFileSync('/tmp/vod_full_list.txt', formattedOutput);
              fs.writeFileSync('/tmp/link_count.txt', String(selectedVods.length));

              // Save all VODs for reference
              let allFormatted = '';
              vods.forEach((vod, idx) => {
                allFormatted += `${idx + 1}. ${vod.title}\n   ${vod.url}\n\n`;
              });
              fs.writeFileSync('/tmp/all_vods.txt', allFormatted);

              // Save channel name
              const channelName = channelUrl.replace(/\/$/, '').split('/').pop();
              fs.writeFileSync('/tmp/channel_name.txt', channelName);

              console.log('\n✅ Successfully extracted VODs with titles!');

            } catch (error) {
              console.error('❌ Error:', error.message);
              process.exit(1);
            } finally {
              if (browser) {
                await browser.close();
                console.log('🔒 Browser closed.');
              }
            }
          })();
          EOF

          cd ..

          # Read the extracted data
          VOD_LINKS=$(cat /tmp/vod_links.txt 2>/dev/null)
          VOD_TITLES=$(cat /tmp/vod_titles.txt 2>/dev/null)
          VOD_FULL_LIST=$(cat /tmp/vod_full_list.txt 2>/dev/null)
          ALL_VODS=$(cat /tmp/all_vods.txt 2>/dev/null)
          LINK_COUNT=$(cat /tmp/link_count.txt 2>/dev/null)
          CHANNEL_NAME=$(cat /tmp/channel_name.txt 2>/dev/null)

          if [ -z "$VOD_LINKS" ]; then
            echo "❌ Failed to extract VOD links"
            exit 1
          fi

          echo "VOD_LINKS=$VOD_LINKS" >> $GITHUB_ENV
          echo "VOD_TITLES=$VOD_TITLES" >> $GITHUB_ENV
          echo "VOD_FULL_LIST=$VOD_FULL_LIST" >> $GITHUB_ENV
          echo "ALL_VODS=$ALL_VODS" >> $GITHUB_ENV
          echo "LINK_COUNT=$LINK_COUNT" >> $GITHUB_ENV
          echo "CHANNEL_NAME=$CHANNEL_NAME" >> $GITHUB_ENV

          echo "✅ Extracted $LINK_COUNT VOD(s) with titles from channel: $CHANNEL_NAME"

      - name: Save VOD data to files
        run: |
          echo "${{ env.VOD_LINKS }}" > vod_links.txt
          echo "${{ env.VOD_TITLES }}" > vod_titles.txt
          echo "${{ env.VOD_FULL_LIST }}" > vod_full_list.txt
          echo "${{ env.ALL_VODS }}" > all_vods.txt

      - name: Upload VOD data as artifacts
        uses: actions/upload-artifact@v4
        with:
          name: vod-data
          path: |
            vod_links.txt
            vod_titles.txt
            vod_full_list.txt
            all_vods.txt
          retention-days: 1

      - name: Send VOD links with titles to Bale bot
        run: |
          TOKEN="${{ inputs.bale_token }}"
          CHAT_ID="${{ inputs.bale_chat_id }}"
          VOD_FULL_LIST="${{ env.VOD_FULL_LIST }}"
          LINK_COUNT="${{ env.LINK_COUNT }}"
          CHANNEL_NAME="${{ env.CHANNEL_NAME }}"
          CURRENT_TIME=$(date '+%Y-%m-%d %H:%M:%S UTC')

          # Build message with formatted VOD list (includes titles and links)
          MESSAGE="🎥 *Twitch VODs Extracted with Titles!*
          
📺 **Channel:** ${CHANNEL_NAME}
📋 **VODs found:** ${LINK_COUNT}
🕐 **Fetched:** ${CURRENT_TIME}

⬇️ **Selected VODs (Title & Link):**

${VOD_FULL_LIST}

💡 You can now use these links with your Video Downloader (VDS) workflow."

          # Truncate message if it's too long (Bale has character limits)
          if [ ${#MESSAGE} -gt 4000 ]; then
            echo "Message too long, truncating..."
            MESSAGE="${MESSAGE:0:3900}..."
          fi

          echo "Sending message to Bale Bot..."

          RESPONSE=$(curl -s -w "\n%{http_code}" -X POST "https://tapi.bale.ai/bot${TOKEN}/sendMessage" \
            -d "chat_id=${CHAT_ID}" \
            -d "text=${MESSAGE}" \
            -d "parse_mode=Markdown")

          HTTP_CODE=$(echo "$RESPONSE" | tail -n1)
          BODY=$(echo "$RESPONSE" | sed '$d')

          if [ "$HTTP_CODE" -eq 200 ]; then
            echo "✅ VOD links and titles sent successfully to Bale!"
          else
            echo "❌ Failed to send message to Bale. HTTP code: $HTTP_CODE"
            echo "Response: $BODY"
            exit 1
          fi

      - name: Show summary
        run: |
          echo "## 📊 Twitch VOD Scraper Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Item | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| Channel URL | ${{ inputs.channel_url }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Channel Name | ${{ env.CHANNEL_NAME }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Scroll count | ${{ inputs.scroll_count }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Link range requested | ${{ inputs.link_range }} |" >> $GITHUB_STEP_SUMMARY
          echo "| VODs selected | ${{ env.LINK_COUNT }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Selected VODs with Titles:" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "${{ env.VOD_FULL_LIST }}" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

      - name: Cleanup
        run: |
          rm -f /tmp/vod_links.txt /tmp/vod_titles.txt /tmp/vod_full_list.txt /tmp/all_vods.txt /tmp/link_count.txt /tmp/channel_name.txt
          rm -rf scraper_script
          echo "🧹 Cleaned up temporary files"