name: Screenshot Sender

on:
  workflow_dispatch:
    inputs:
      website_url:
        description: '🔗 Website URL to screenshot or record'
        required: true
        type: string
      output_name:
        description: '📝 Output file name (without extension)'
        required: true
        default: 'screenshot'
        type: string
      full_page:
        description: '📄 Take full-page screenshot (scrolls entire page) - Only for screenshots'
        required: false
        default: true
        type: boolean
      screenshot_count:
        description: '🔢 Number of screenshots to take (1-20) - Only for screenshots'
        required: false
        default: '1'
        type: string
      delay_seconds:
        description: '⏱️ Delay between screenshots (seconds) - Only for screenshots'
        required: false
        default: '0'
        type: string
      record_seconds:
        description: '🎥 Record video for X seconds (if empty, takes screenshots)'
        required: false
        type: string
        default: ''
      parts_size:
        description: '🫙 Parts size (MB)'
        required: false
        type: string
        default: '45'
      bale_token:
        description: '🤖 Bale Bot Token (for sending files)'
        required: true
        type: string
      bale_chat_id:
        description: '💬 Bale Chat ID (for sending files)'
        required: true
        type: string

jobs:
  # ============================================
  # JOB 1: Capture content (screenshots or video) and create README
  # ============================================
  capture-and-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 0

      - name: Prepare screenshot branch
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git fetch origin

          if git ls-remote --exit-code --heads origin screenshot; then
            git checkout screenshot
            git pull origin screenshot
          else
            git checkout --orphan screenshot
            git rm -rf . || true
            mkdir -p screenshot
            git commit --allow-empty -m "[bot] Initialize screenshot branch"
            git push --set-upstream origin screenshot
          fi

      - name: Setup Puppeteer and FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          mkdir -p capture_script
          cd capture_script
          npm init -y
          npm install puppeteer puppeteer-screen-recorder

      - name: Capture (screenshots or video)
        id: capture
        run: |
          OUTPUT_NAME="${{ inputs.output_name }}"
          WEBSITE_URL="${{ inputs.website_url }}"
          FULL_PAGE="${{ inputs.full_page }}"
          SCREENSHOT_COUNT="${{ inputs.screenshot_count }}"
          DELAY_SECONDS="${{ inputs.delay_seconds }}"
          RECORD_SECONDS="${{ inputs.record_seconds }}"
          
          mkdir -p capture_output
          
          cd capture_script
          
          if [ -n "$RECORD_SECONDS" ]; then
            echo "=========================================="
            echo "🎥 RECORDING MODE: ${RECORD_SECONDS} seconds"
            echo "=========================================="
            
            node << 'EOF'
            const puppeteer = require('puppeteer');
            const { PuppeteerScreenRecorder } = require('puppeteer-screen-recorder');
            const path = require('path');
            
            (async () => {
              const browser = await puppeteer.launch({
                args: ['--no-sandbox', '--disable-setuid-sandbox', '--autoplay-policy=no-user-gesture-required'],
                headless: 'new'
              });
              const page = await browser.newPage();
              
              // Enable audio
              await page.browserContext().overridePermissions(process.env.WEBSITE_URL, ['microphone']);
              
              const url = process.env.WEBSITE_URL;
              const outputName = process.env.OUTPUT_NAME;
              const recordSeconds = parseInt(process.env.RECORD_SECONDS, 10);
              
              console.log(`Navigating to: ${url}`);
              await page.goto(url, { waitUntil: 'networkidle2' });
              
              console.log('Waiting 5 seconds for page to stabilize...');
              await new Promise(resolve => setTimeout(resolve, 5000));
              
              const outputDir = path.join('..', 'capture_output');
              const videoPath = path.join(outputDir, `${outputName}.mp4`);
              
              console.log(`Starting recording for ${recordSeconds} seconds...`);
              const recorder = new PuppeteerScreenRecorder(page, {
                fps: 25,
                videoBitrate: 2000,
                recordDurationLimit: recordSeconds
              });
              
              await recorder.start(videoPath);
              console.log(`Recording in progress...`);
              
              // Wait for the specified duration
              await new Promise(resolve => setTimeout(resolve, recordSeconds * 1000));
              
              await recorder.stop();
              console.log(`✅ Recording saved: ${outputName}.mp4`);
              
              await browser.close();
            })().catch(err => {
              console.error('Error:', err);
              process.exit(1);
            });
            EOF
            echo "CAPTURE_TYPE=video" >> $GITHUB_ENV
            echo "CAPTURE_COUNT_ACTUAL=1" >> $GITHUB_ENV
            
          else
            echo "=========================================="
            echo "📸 SCREENSHOT MODE"
            echo "=========================================="
            
            node << 'EOF'
            const puppeteer = require('puppeteer');
            const fs = require('fs');
            const path = require('path');
            
            (async () => {
              const browser = await puppeteer.launch({
                args: ['--no-sandbox', '--disable-setuid-sandbox'],
                headless: 'new'
              });
              const page = await browser.newPage();
              
              await page.setViewport({ width: 1920, height: 1080 });
              
              const url = process.env.WEBSITE_URL;
              const outputName = process.env.OUTPUT_NAME;
              const fullPage = process.env.FULL_PAGE === 'true';
              const screenshotCount = parseInt(process.env.SCREENSHOT_COUNT, 10) || 1;
              const delaySeconds = parseInt(process.env.DELAY_SECONDS, 10) || 0;
              
              console.log(`Navigating to: ${url}`);
              console.log(`Full-page mode: ${fullPage}`);
              console.log(`Screenshots to take: ${screenshotCount}`);
              console.log(`Delay between screenshots: ${delaySeconds}s`);
              
              await page.goto(url, { waitUntil: 'networkidle2' });
              
              console.log('Waiting 5 seconds for initial page load...');
              await new Promise(resolve => setTimeout(resolve, 5000));
              
              const captureDir = path.join('..', 'capture_output');
              if (!fs.existsSync(captureDir)) {
                fs.mkdirSync(captureDir, { recursive: true });
              }
              
              for (let i = 1; i <= screenshotCount; i++) {
                let filename;
                if (screenshotCount === 1) {
                  filename = `${outputName}.png`;
                } else {
                  filename = `${outputName}_${i}.png`;
                }
                const filePath = path.join(captureDir, filename);
                
                console.log(`Taking screenshot ${i}/${screenshotCount}: ${filename}`);
                
                if (fullPage) {
                  await page.screenshot({ path: filePath, fullPage: true });
                } else {
                  await page.screenshot({ path: filePath, fullPage: false });
                }
                
                console.log(`  ✅ Saved: ${filename}`);
                
                if (i < screenshotCount && delaySeconds > 0) {
                  console.log(`  ⏱️  Waiting ${delaySeconds} seconds...`);
                  await new Promise(resolve => setTimeout(resolve, delaySeconds * 1000));
                }
              }
              
              console.log(`\n✅ All ${screenshotCount} screenshot(s) completed!`);
              await browser.close();
            })().catch(err => {
              console.error('Error:', err);
              process.exit(1);
            });
            EOF
            
            cd ..
            CAPTURE_COUNT_ACTUAL=$(ls -1 capture_output/*.png 2>/dev/null | wc -l)
            echo "CAPTURE_COUNT_ACTUAL=$CAPTURE_COUNT_ACTUAL" >> $GITHUB_ENV
            echo "CAPTURE_TYPE=screenshot" >> $GITHUB_ENV
            echo "✅ Created $CAPTURE_COUNT_ACTUAL screenshot(s)"
          fi
          
          cd ..
        env:
          WEBSITE_URL: ${{ inputs.website_url }}
          OUTPUT_NAME: ${{ inputs.output_name }}
          FULL_PAGE: ${{ inputs.full_page }}
          SCREENSHOT_COUNT: ${{ inputs.screenshot_count }}
          DELAY_SECONDS: ${{ inputs.delay_seconds }}
          RECORD_SECONDS: ${{ inputs.record_seconds }}

      # ============================================
      # Process captured files (zip or video)
      # ============================================
      - name: Process captured files into archives
        id: process
        run: |
          cd capture_output
          
          OUTPUT_NAME="${{ inputs.output_name }}"
          PARTS_SIZE="${{ inputs.parts_size }}"
          CAPTURE_COUNT="${{ env.CAPTURE_COUNT_ACTUAL }}"
          CAPTURE_TYPE="${{ env.CAPTURE_TYPE }}"
          
          echo "Capture type: $CAPTURE_TYPE"
          echo "Found files in capture_output:"
          ls -la
          
          if [ "$CAPTURE_TYPE" = "video" ]; then
            echo "=========================================="
            echo "Processing video file"
            echo "=========================================="
            
            VIDEO_FILE="${OUTPUT_NAME}.mp4"
            if [ -f "$VIDEO_FILE" ]; then
              FILE_SIZE=$(stat -c%s "$VIDEO_FILE")
              FILE_SIZE_MB=$((FILE_SIZE / 1024 / 1024))
              echo "Video size: ${FILE_SIZE_MB} MB"
              echo "Split size limit: ${PARTS_SIZE} MB"
              
              if [ $FILE_SIZE_MB -le $PARTS_SIZE ]; then
                echo "Creating single ZIP file (within size limit)"
                zip -0 "${OUTPUT_NAME}.zip" "${VIDEO_FILE}"
                rm -f "${VIDEO_FILE}"
                echo "SINGLE_FILE=true" >> $GITHUB_ENV
              else
                echo "Creating split ZIP archive (exceeds size limit)"
                zip -0 -s ${PARTS_SIZE}m "${OUTPUT_NAME}.zip" "${VIDEO_FILE}"
                rm -f "${VIDEO_FILE}"
                echo "SINGLE_FILE=false" >> $GITHUB_ENV
              fi
            else
              echo "ERROR: Video file $VIDEO_FILE not found!"
              exit 1
            fi
            
          else
            # Screenshot processing (original logic)
            echo "SCREENSHOT_COUNT from env: $CAPTURE_COUNT"
            echo "Found PNG file(s) in capture_output folder:"
            ls -la *.png 2>/dev/null || echo "No PNG files found"
            
            if [ "$CAPTURE_COUNT" -gt 1 ] 2>/dev/null; then
              echo "=========================================="
              echo "Multiple screenshots detected ($CAPTURE_COUNT files)"
              echo "Creating folder: ${OUTPUT_NAME}_screenshots"
              echo "=========================================="
              
              mkdir -p "${OUTPUT_NAME}_screenshots"
              mv *.png "${OUTPUT_NAME}_screenshots/"
              
              echo "Files moved to folder:"
              ls -la "${OUTPUT_NAME}_screenshots/"
              
              TOTAL_SIZE=$(du -sb "${OUTPUT_NAME}_screenshots" | cut -f1)
              TOTAL_SIZE_MB=$((TOTAL_SIZE / 1024 / 1024))
              echo "Total combined size: ${TOTAL_SIZE_MB} MB"
              echo "Split size limit: ${PARTS_SIZE} MB"
              
              if [ $TOTAL_SIZE_MB -le $PARTS_SIZE ]; then
                echo "Creating single ZIP file (within size limit)"
                zip -0 -r "${OUTPUT_NAME}.zip" "${OUTPUT_NAME}_screenshots"
                echo "✅ Created: ${OUTPUT_NAME}.zip"
                echo "SINGLE_FILE=true" >> $GITHUB_ENV
              else
                echo "Creating split ZIP archive (exceeds size limit)"
                zip -0 -r -s ${PARTS_SIZE}m "${OUTPUT_NAME}.zip" "${OUTPUT_NAME}_screenshots"
                echo "✅ Created split archive parts"
                echo "SINGLE_FILE=false" >> $GITHUB_ENV
              fi
              
              rm -rf "${OUTPUT_NAME}_screenshots"
              echo "Removed temporary folder"
              
            else
              echo "=========================================="
              echo "Single screenshot detected"
              echo "=========================================="
              
              PNG_FILE="${OUTPUT_NAME}.png"
              if [ -f "$PNG_FILE" ]; then
                FILE_SIZE=$(stat -c%s "$PNG_FILE")
                FILE_SIZE_MB=$((FILE_SIZE / 1024 / 1024))
                echo "File size: ${FILE_SIZE_MB} MB"
                echo "Split size limit: ${PARTS_SIZE} MB"
                
                if [ $FILE_SIZE_MB -le $PARTS_SIZE ]; then
                  echo "Creating single ZIP file"
                  zip -0 "${OUTPUT_NAME}.zip" "${PNG_FILE}"
                  rm -f "${PNG_FILE}"
                  echo "SINGLE_FILE=true" >> $GITHUB_ENV
                else
                  echo "Creating split ZIP archive"
                  zip -0 -s ${PARTS_SIZE}m "${OUTPUT_NAME}.zip" "${PNG_FILE}"
                  rm -f "${PNG_FILE}"
                  echo "SINGLE_FILE=false" >> $GITHUB_ENV
                fi
              else
                echo "ERROR: PNG file $PNG_FILE not found!"
                exit 1
              fi
            fi
          fi
          
          echo ""
          echo "Files in capture_output after processing:"
          ls -la
          
          cd ..

      - name: Generate README with Download Links
        run: |
          rm -f README.md
          
          CAPTURE_TYPE="${{ env.CAPTURE_TYPE }}"
          RECORD_SECONDS="${{ inputs.record_seconds }}"
          
          if [ "$CAPTURE_TYPE" = "video" ]; then
            echo "# 🎥 Screen Recording - ${RECORD_SECONDS} seconds" > README.md
          else
            echo "# 📸 Screenshot Download Links" > README.md
          fi
          echo "Generated on: $(date)" >> README.md
          echo "" >> README.md
          echo "## 📥 Download Links" >> README.md
          
          # Check if capture_output folder has any files
          if [ -d "capture_output" ] && [ "$(ls -A capture_output)" ]; then
            for file in capture_output/*; do
              if [ -f "$file" ]; then
                filename=$(basename "$file")
                encoded_filename=$(python3 -c "import urllib.parse, sys; print(urllib.parse.quote(sys.argv[1]))" "$filename")
                url="https://github.com/${{ github.repository }}/raw/screenshot/capture_output/$encoded_filename"
                echo "- [Download $filename]($url)" >> README.md
              fi
            done
          else
            echo "No files found to link." >> README.md
          fi

      - name: Commit and Push in Batches of 5
        run: |
          # Check if capture_output folder exists and has files
          if [ ! -d "capture_output" ] || [ -z "$(ls -A capture_output)" ]; then
            echo "No files to commit"
            exit 0
          fi
          
          # Rename folder from capture_output to screenshot for consistency
          if [ -d "capture_output" ]; then
            mv capture_output screenshot
          fi
          
          ls screenshot/* 2>/dev/null > file_list.txt || true
          
          TOTAL_FILES=$(cat file_list.txt | wc -l)
          echo "Total files to commit: $TOTAL_FILES"
          
          if [ "$TOTAL_FILES" -eq 0 ]; then
            echo "No new files to commit"
            exit 0
          fi
          
          BATCH_SIZE=5
          BATCH_NUM=1
          
          while [ $(cat file_list.txt | wc -l) -gt 0 ]; do
            BATCH_FILES=$(head -n $BATCH_SIZE file_list.txt)
            
            tail -n +$((BATCH_SIZE + 1)) file_list.txt > temp_list.txt 2>/dev/null || touch temp_list.txt
            mv temp_list.txt file_list.txt
            
            for file in $BATCH_FILES; do
              if [ -f "$file" ]; then
                git add "$file"
              fi
            done
            
            if [ $BATCH_NUM -eq 1 ] && [ -f "README.md" ]; then
              git add README.md
            fi
            
            git commit -m "[bot] Add capture files batch $BATCH_NUM ($(echo $BATCH_FILES | wc -w) files)"
            git push
            
            echo "✅ Batch $BATCH_NUM committed and pushed"
            BATCH_NUM=$((BATCH_NUM + 1))
            sleep 2
          done
          
          echo "✅ All $TOTAL_FILES files committed and pushed in batches"
          rm -f file_list.txt temp_list.txt

      - name: Upload README as artifact for next job
        uses: actions/upload-artifact@v4
        with:
          name: readme-file
          path: README.md
          retention-days: 1

  # ============================================
  # JOB 2: Send files to Bale bot using README links
  # ============================================
  send-to-bot:
    runs-on: ubuntu-latest
    needs: capture-and-release
    if: always() && needs.capture-and-release.result == 'success'
    
    steps:
      - name: Mask sensitive inputs
        run: |
          echo "::add-mask::${{ inputs.bale_token }}"
          echo "::add-mask::${{ inputs.bale_chat_id }}"

      - name: Download README artifact from previous job
        uses: actions/download-artifact@v4
        with:
          name: readme-file
          path: .

      - name: Extract links from README.md
        id: extract
        run: |
          if [ ! -f "README.md" ]; then
            echo "❌ README.md not found!"
            exit 1
          fi
          
          echo "README.md contents:"
          echo "=========================================="
          cat README.md
          echo "=========================================="
          
          # Clear previous file
          > extracted_links.txt
          
          # Extract links using both patterns
          grep -oP '\]\(\Khttps://[^)]+' README.md >> extracted_links.txt 2>/dev/null || true
          grep -oE 'https://raw\.githubusercontent\.com/[^ ]+' README.md >> extracted_links.txt 2>/dev/null || true
          
          # Clean up and sort
          sort -u extracted_links.txt -o extracted_links.txt
          sed -i '/^$/d' extracted_links.txt
          
          LINK_COUNT=$(wc -l < extracted_links.txt)
          echo "LINK_COUNT=$LINK_COUNT" >> $GITHUB_ENV
          
          echo ""
          echo "Found $LINK_COUNT links in README.md:"
          echo "=========================================="
          cat extracted_links.txt
          echo "=========================================="
          
          if [ "$LINK_COUNT" -eq 0 ]; then
            echo "❌ No download links found in README.md"
            exit 1
          fi

      - name: Download files using wget
        run: |
          mkdir -p downloaded_files
          cd downloaded_files
          
          LINK_NUM=1
          while IFS= read -r LINK; do
            if [ -n "$LINK" ]; then
              echo "=========================================="
              echo "Downloading file $LINK_NUM of ${{ env.LINK_COUNT }} from:"
              echo "$LINK"
              echo "=========================================="
              
              wget --content-disposition --trust-server-names --max-redirect=5 "$LINK"
              
              DOWNLOADED_FILE=$(ls -1 | head -n 1)
              echo "Downloaded file: $DOWNLOADED_FILE"
              
              if [ -f "$DOWNLOADED_FILE" ] && [ -s "$DOWNLOADED_FILE" ]; then
                SIZE=$(stat -c%s "$DOWNLOADED_FILE")
                SIZE_MB=$((SIZE / 1024 / 1024))
                echo "✅ Downloaded: $DOWNLOADED_FILE (${SIZE_MB} MB)"
                echo "$DOWNLOADED_FILE:SUCCESS:$SIZE" >> ../download_status.txt
              else
                echo "❌ Failed to download from: $LINK"
                echo "unknown:FAILED:0" >> ../download_status.txt
              fi
              
              LINK_NUM=$((LINK_NUM + 1))
              echo ""
            fi
          done < ../extracted_links.txt
          
          cd ..
          
          echo "Files in downloaded_files directory:"
          ls -lh downloaded_files/

      - name: Send files to Bale bot
        run: |
          TOKEN="${{ inputs.bale_token }}"
          CHAT_ID="${{ inputs.bale_chat_id }}"
          LINK_COUNT="${{ env.LINK_COUNT }}"
          RECORD_SECONDS="${{ inputs.record_seconds }}"
          
          if [ -n "$RECORD_SECONDS" ]; then
            curl -s -X POST "https://tapi.bale.ai/bot${TOKEN}/sendMessage" \
              -d "chat_id=${CHAT_ID}" \
              -d "text=🎥 Found ${LINK_COUNT} file part(s) for video recording.%0A⬇️ Downloading and sending..."
          else
            curl -s -X POST "https://tapi.bale.ai/bot${TOKEN}/sendMessage" \
              -d "chat_id=${CHAT_ID}" \
              -d "text=📸 Found ${LINK_COUNT} file part(s) in README.%0A⬇️ Downloading and sending..."
          fi
          
          cd downloaded_files
          
          FILE_NUM=1
          for FILE in *; do
            if [ -f "$FILE" ] && [ -s "$FILE" ]; then
              SIZE=$(stat -c%s "$FILE")
              SIZE_MB=$((SIZE / 1024 / 1024))
              
              echo "Sending file $FILE_NUM: $FILE (${SIZE_MB} MB)"
              
              curl -s -X POST "https://tapi.bale.ai/bot${TOKEN}/sendDocument" \
                -F "chat_id=${CHAT_ID}" \
                -F "document=@${FILE}" \
                -F "caption=${FILE} | ${SIZE_MB} MB"
              
              echo "✅ Sent $FILE"
              
              FILE_NUM=$((FILE_NUM + 1))
              sleep 1
            fi
          done
          
          cd ..
          
          SENT_COUNT=$((FILE_NUM - 1))
          curl -s -X POST "https://tapi.bale.ai/bot${TOKEN}/sendMessage" \
            -d "chat_id=${CHAT_ID}" \
            -d "text=✅ Done! Sent ${SENT_COUNT} file(s) from ${LINK_COUNT} link(s)."

      - name: Show summary
        run: |
          echo "## 📊 Capture Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Item | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| URL | ${{ inputs.website_url }} |" >> $GITHUB_STEP_SUMMARY
          if [ -n "${{ inputs.record_seconds }}" ]; then
            echo "| Mode | Video Recording (${RECORD_SECONDS}s) |" >> $GITHUB_STEP_SUMMARY
          else
            echo "| Mode | Screenshots |" >> $GITHUB_STEP_SUMMARY
            echo "| Full-page mode | ${{ inputs.full_page }} |" >> $GITHUB_STEP_SUMMARY
            echo "| Screenshots requested | ${{ inputs.screenshot_count }} |" >> $GITHUB_STEP_SUMMARY
            echo "| Delay between shots | ${{ inputs.delay_seconds }} seconds |" >> $GITHUB_STEP_SUMMARY
          fi
          echo "| Links found in README | ${{ env.LINK_COUNT }} |" >> $GITHUB_STEP_SUMMARY
          if [ -f "download_status.txt" ]; then
            SUCCESS_COUNT=$(grep -c ":SUCCESS:" download_status.txt || echo "0")
            FAILED_COUNT=$(grep -c ":FAILED:" download_status.txt || echo "0")
            echo "| Successfully downloaded | $SUCCESS_COUNT |" >> $GITHUB_STEP_SUMMARY
            echo "| Failed downloads | $FAILED_COUNT |" >> $GITHUB_STEP_SUMMARY
          fi
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Extracted links from README.md:" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          cat extracted_links.txt >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

      - name: Cleanup
        run: |
          rm -f README.md download_status.txt extracted_links.txt
          rm -rf downloaded_files
          echo "🧹 Cleaned up temporary files"