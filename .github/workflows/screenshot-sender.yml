name: Screenshot Sender

on:
  workflow_dispatch:
    inputs:
      website_url:
        description: '🔗 Website URL to screenshot'
        required: true
        type: string
      output_name:
        description: '📝 Output file name (without extension)'
        required: true
        default: 'screenshot'
        type: string
      parts_size:
        description: '🫙 Parts size (MB)'
        required: false
        type: string
        default: '45'
      bale_token:
        description: '🤖 Bale Bot Token (for sending files)'
        required: true
        type: string
      bale_chat_id:
        description: '💬 Bale Chat ID (for sending files)'
        required: true
        type: string

jobs:
  # ============================================
  # JOB 1: Take screenshot and create README
  # ============================================
  screenshot-and-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 0

      - name: Prepare screenshot branch
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git fetch origin

          if git ls-remote --exit-code --heads origin screenshot; then
            git checkout screenshot
            git pull origin screenshot
          else
            git checkout --orphan screenshot
            git rm -rf . || true
            mkdir -p screenshot
            git commit --allow-empty -m "[bot] Initialize screenshot branch"
            git push --set-upstream origin screenshot
          fi

      - name: Setup Puppeteer
        run: |
          mkdir -p screenshot_script
          cd screenshot_script
          npm init -y
          npm install puppeteer

      - name: Take screenshot
        id: screenshot
        run: |
          OUTPUT_NAME="${{ inputs.output_name }}"
          WEBSITE_URL="${{ inputs.website_url }}"
          mkdir -p screenshot
          
          cd screenshot_script
          node << 'EOF'
          const puppeteer = require('puppeteer');
          
          (async () => {
            const browser = await puppeteer.launch({
              args: ['--no-sandbox', '--disable-setuid-sandbox'],
              headless: 'new'
            });
            const page = await browser.newPage();
            
            await page.setViewport({ width: 1920, height: 1080 });
            
            const url = process.env.WEBSITE_URL;
            console.log(`Navigating to: ${url}`);
            await page.goto(url, { waitUntil: 'networkidle2' });
            
            console.log('Waiting 20 seconds for full page load...');
            await new Promise(resolve => setTimeout(resolve, 20000));
            
            const outputName = process.env.OUTPUT_NAME;
            await page.screenshot({ path: `../screenshot/${outputName}.png`, fullPage: false });
            console.log(`Screenshot saved: screenshot/${outputName}.png`);
            
            await browser.close();
          })().catch(err => {
            console.error('Error:', err);
            process.exit(1);
          });
          EOF
          
          echo "FILE_NAME=$OUTPUT_NAME" >> $GITHUB_ENV
        env:
          WEBSITE_URL: ${{ inputs.website_url }}
          OUTPUT_NAME: ${{ inputs.output_name }}

      - name: Split screenshot into parts
        run: |
          OUTPUT_NAME="${{ inputs.output_name }}"
          cd screenshot
          zip -0 -s "${{ inputs.parts_size }}m" "${OUTPUT_NAME}.zip" "${OUTPUT_NAME}.png"
          cd ..
          echo "Split completed"

      - name: Generate README with Download Links
        run: |
          rm -f README.md
          
          echo "# 📸 Screenshot Download Links" > README.md
          echo "Generated on: $(date)" >> README.md
          echo "" >> README.md
          echo "URL: ${{ inputs.website_url }}" >> README.md
          echo "" >> README.md
          
          for file in screenshot/*; do
            if [ -f "$file" ]; then
              filename=$(basename "$file")
              encoded_filename=$(python3 -c "import urllib.parse, sys; print(urllib.parse.quote(sys.argv[1]))" "$filename")
              url="https://github.com/${{ github.repository }}/raw/screenshot/screenshot/$encoded_filename"
              echo "- [Download $filename]($url)" >> README.md
            fi
          done

      - name: Commit and Push in Batches of 5
        run: |
          ls screenshot/* 2>/dev/null > file_list.txt || true
          
          TOTAL_FILES=$(cat file_list.txt | wc -l)
          echo "Total files to commit: $TOTAL_FILES"
          
          if [ "$TOTAL_FILES" -eq 0 ]; then
            echo "No new files to commit"
            exit 0
          fi
          
          BATCH_SIZE=5
          BATCH_NUM=1
          
          while [ $(cat file_list.txt | wc -l) -gt 0 ]; do
            BATCH_FILES=$(head -n $BATCH_SIZE file_list.txt)
            
            tail -n +$((BATCH_SIZE + 1)) file_list.txt > temp_list.txt 2>/dev/null || touch temp_list.txt
            mv temp_list.txt file_list.txt
            
            for file in $BATCH_FILES; do
              if [ -f "$file" ]; then
                git add "$file"
              fi
            done
            
            if [ $BATCH_NUM -eq 1 ] && [ -f "README.md" ]; then
              git add README.md
            fi
            
            git commit -m "[bot] Add screenshot files batch $BATCH_NUM ($(echo $BATCH_FILES | wc -w) files)"
            git push
            
            echo "✅ Batch $BATCH_NUM committed and pushed"
            BATCH_NUM=$((BATCH_NUM + 1))
            sleep 2
          done
          
          echo "✅ All $TOTAL_FILES files committed and pushed in batches"
          rm -f file_list.txt temp_list.txt

      - name: Upload README as artifact for next job
        uses: actions/upload-artifact@v4
        with:
          name: readme-file
          path: README.md
          retention-days: 1

  # ============================================
  # JOB 2: Send files to Bale bot using README links
  # ============================================
  send-to-bot:
    runs-on: ubuntu-latest
    needs: screenshot-and-release
    if: always() && needs.screenshot-and-release.result == 'success'
    
    steps:
      - name: Mask sensitive inputs
        run: |
          echo "::add-mask::${{ inputs.bale_token }}"
          echo "::add-mask::${{ inputs.bale_chat_id }}"

      - name: Download README artifact from previous job
        uses: actions/download-artifact@v4
        with:
          name: readme-file
          path: .

      - name: Extract links from README.md
        id: extract
        run: |
          if [ ! -f "README.md" ]; then
            echo "❌ README.md not found!"
            exit 1
          fi
          
          echo "README.md contents:"
          echo "=========================================="
          cat README.md
          echo "=========================================="
          
          # Extract all download links from README.md
          grep -oP '\]\(\Khttps://[^)]+' README.md > extracted_links.txt 2>/dev/null || true
          grep -oE 'https://raw\.githubusercontent\.com/[^ ]+' README.md >> extracted_links.txt 2>/dev/null || true
          
          # Remove Windows line endings
          sed -i 's/\r$//' extracted_links.txt
          
          sort -u extracted_links.txt -o extracted_links.txt
          sed -i '/^$/d' extracted_links.txt
          
          LINK_COUNT=$(wc -l < extracted_links.txt)
          echo "LINK_COUNT=$LINK_COUNT" >> $GITHUB_ENV
          
          echo ""
          echo "Found $LINK_COUNT links in README.md:"
          echo "=========================================="
          cat extracted_links.txt
          echo "=========================================="
          
          if [ "$LINK_COUNT" -eq 0 ]; then
            echo "❌ No download links found in README.md"
            exit 1
          fi

      - name: Download files using wget
        run: |
          mkdir -p downloaded_files
          cd downloaded_files
          
          LINK_NUM=1
          while IFS= read -r LINK || [ -n "$LINK" ]; do
            if [ -n "$LINK" ]; then
              echo "=========================================="
              echo "Downloading file $LINK_NUM of ${{ env.LINK_COUNT }} from:"
              echo "$LINK"
              echo "=========================================="
              
              wget --content-disposition --trust-server-names --max-redirect=5 "$LINK"
              
              if [ $? -eq 0 ]; then
                DOWNLOADED_FILE=$(ls -1 | head -n 1)
                echo "✅ Downloaded: $DOWNLOADED_FILE"
              else
                echo "❌ Failed to download from: $LINK"
              fi
              
              LINK_NUM=$((LINK_NUM + 1))
              echo ""
            fi
          done < ../extracted_links.txt
          
          cd ..
          
          echo "Files in downloaded_files directory:"
          ls -lh downloaded_files/

      - name: Send files to Bale bot
        run: |
          TOKEN="${{ inputs.bale_token }}"
          CHAT_ID="${{ inputs.bale_chat_id }}"
          LINK_COUNT="${{ env.LINK_COUNT }}"
          
          curl -s -X POST "https://tapi.bale.ai/bot${TOKEN}/sendMessage" \
            -d "chat_id=${CHAT_ID}" \
            -d "text=📸 Found ${LINK_COUNT} link(s). Downloading and sending..."
          
          cd downloaded_files
          
          FILE_NUM=1
          for FILE in *; do
            if [ -f "$FILE" ] && [ -s "$FILE" ]; then
              SIZE=$(stat -c%s "$FILE")
              SIZE_MB=$((SIZE / 1024 / 1024))
              
              echo "Sending file $FILE_NUM: $FILE (${SIZE_MB} MB)"
              
              curl -s -X POST "https://tapi.bale.ai/bot${TOKEN}/sendDocument" \
                -F "chat_id=${CHAT_ID}" \
                -F "document=@${FILE}" \
                -F "caption=${FILE} | ${SIZE_MB} MB"
              
              echo "✅ Sent $FILE"
              
              FILE_NUM=$((FILE_NUM + 1))
              sleep 1
            fi
          done
          
          cd ..
          
          SENT_COUNT=$((FILE_NUM - 1))
          curl -s -X POST "https://tapi.bale.ai/bot${TOKEN}/sendMessage" \
            -d "chat_id=${CHAT_ID}" \
            -d "text=✅ Done! Sent ${SENT_COUNT} file(s)."

      - name: Show summary
        run: |
          echo "## 📊 Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Item | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| Links found in README | ${{ env.LINK_COUNT }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Extracted links from README.md:" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          cat extracted_links.txt >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

      - name: Cleanup
        run: |
          rm -f README.md extracted_links.txt
          rm -rf downloaded_files
          echo "🧹 Cleaned up temporary files"