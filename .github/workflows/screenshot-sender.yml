name: Thumbnail Downloader

on:
  workflow_dispatch:
    inputs:
      youtube_url:
        description: '🔗 YouTube video URL'
        required: true
        type: string
      output_name:
        description: '📝 Output file name (without extension)'
        required: false
        type: string
        default: 'thumbnail'
      bale_token:
        description: '🤖 Bale Bot Token (for sending files)'
        required: true
        type: string
      bale_chat_id:
        description: '💬 Bale Chat ID (for sending files)'
        required: true
        type: string

jobs:
  download-thumbnail:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 0

      - name: Setup FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg curl
          ffmpeg -version

      - name: Setup yt-dlp
        run: |
          pip install yt-dlp --upgrade

      - name: Download thumbnail (fixed with fallback methods)
        id: download_thumbnail
        run: |
          mkdir -p thumbnails
          cd thumbnails
          
          OUTPUT_NAME="${{ inputs.output_name }}"
          if [ -z "$OUTPUT_NAME" ]; then
            OUTPUT_NAME="thumbnail"
          fi
          
          echo "Attempting to download thumbnail for: ${{ inputs.youtube_url }}"
          
          # Try yt-dlp first
          yt-dlp --skip-download \
                 --write-thumbnail \
                 --convert-thumbnails jpg \
                 --ppa "ThumbnailsConvertor:-qmin 1 -q:v 1" \
                 --output "${OUTPUT_NAME}.%(ext)s" \
                 "${{ inputs.youtube_url }}" || true
          
          # Fallback: direct URL extraction using video ID
          if [ ! -f "${OUTPUT_NAME}.jpg" ] && [ ! -f "${OUTPUT_NAME}.webp" ]; then
            echo "yt-dlp method failed. Trying direct URL extraction..."
            
            # Extract video ID
            VIDEO_ID=$(echo "${{ inputs.youtube_url }}" | grep -oE '(v=|\/)([a-zA-Z0-9_-]{11})' | head -1 | sed 's/^v=//' | sed 's/^\///')
            
            if [ -n "$VIDEO_ID" ]; then
              echo "Video ID: $VIDEO_ID"
              
              # Try each quality level in order
              # maxresdefault (best, but not always available)
              curl -L -o "${OUTPUT_NAME}.jpg" "https://img.youtube.com/vi/${VIDEO_ID}/maxresdefault.jpg" 2>/dev/null
              if [ -f "${OUTPUT_NAME}.jpg" ] && [ $(stat -c%s "${OUTPUT_NAME}.jpg") -gt 10000 ]; then
                echo "✅ Downloaded maxresdefault.jpg"
              else
                # sddefault (good quality)
                curl -L -o "${OUTPUT_NAME}.jpg" "https://img.youtube.com/vi/${VIDEO_ID}/sddefault.jpg" 2>/dev/null
                if [ -f "${OUTPUT_NAME}.jpg" ] && [ $(stat -c%s "${OUTPUT_NAME}.jpg") -gt 5000 ]; then
                  echo "✅ Downloaded sddefault.jpg"
                else
                  # hqdefault (medium quality)
                  curl -L -o "${OUTPUT_NAME}.jpg" "https://img.youtube.com/vi/${VIDEO_ID}/hqdefault.jpg" 2>/dev/null
                  if [ -f "${OUTPUT_NAME}.jpg" ] && [ $(stat -c%s "${OUTPUT_NAME}.jpg") -gt 3000 ]; then
                    echo "✅ Downloaded hqdefault.jpg"
                  else
                    # mqdefault (lowest quality)
                    curl -L -o "${OUTPUT_NAME}.jpg" "https://img.youtube.com/vi/${VIDEO_ID}/mqdefault.jpg" 2>/dev/null
                    echo "✅ Downloaded mqdefault.jpg"
                  fi
                fi
              fi
            fi
          fi
          
          # Convert WebP to JPG if needed
          if [ -f "${OUTPUT_NAME}.webp" ]; then
            echo "Converting WebP to JPG..."
            ffmpeg -i "${OUTPUT_NAME}.webp" -q:v 1 "${OUTPUT_NAME}.jpg" -y
            rm -f "${OUTPUT_NAME}.webp"
          fi
          
          # Verify success
          if [ -f "${OUTPUT_NAME}.jpg" ]; then
            FILE_SIZE=$(stat -c%s "${OUTPUT_NAME}.jpg")
            FILE_SIZE_KB=$((FILE_SIZE / 1024))
            echo "✅ Thumbnail downloaded successfully: ${OUTPUT_NAME}.jpg (${FILE_SIZE_KB} KB)"
            echo "THUMBNAIL_EXISTS=true" >> $GITHUB_ENV
            echo "THUMBNAIL_FILE=${OUTPUT_NAME}.jpg" >> $GITHUB_ENV
          else
            echo "❌ FAILED: No thumbnail could be downloaded"
            echo "THUMBNAIL_EXISTS=false" >> $GITHUB_ENV
            exit 1
          fi
          
          cd ..

      - name: Generate README with Download Links
        if: env.THUMBNAIL_EXISTS == 'true'
        run: |
          rm -f README.md
          
          echo "# 🖼️ Thumbnail Download Link" > README.md
          echo "Generated on: $(date)" >> README.md
          echo "" >> README.md
          echo "## 📥 Download Link" >> README.md
          
          cd thumbnails
          for file in *; do
            if [ -f "$file" ]; then
              filename=$(basename "$file")
              encoded_filename=$(python3 -c "import urllib.parse, sys; print(urllib.parse.quote(sys.argv[1]))" "$filename")
              url="https://github.com/${{ github.repository }}/raw/thumbnails/thumbnails/$encoded_filename"
              echo "- [Download $filename]($url)" >> ../README.md
            fi
          done
          cd ..

      - name: Commit and Push
        if: env.THUMBNAIL_EXISTS == 'true'
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git fetch origin
          
          # Check if thumbnails branch exists, create if not
          if git ls-remote --exit-code --heads origin thumbnails; then
            git checkout thumbnails
            git pull origin thumbnails
          else
            git checkout --orphan thumbnails
            git rm -rf . || true
            mkdir -p thumbnails
            git commit --allow-empty -m "[bot] Initialize thumbnails branch"
            git push --set-upstream origin thumbnails
          fi
          
          # Add files
          git add README.md thumbnails/
          
          # Commit and push
          git commit -m "[bot] Add thumbnail: ${{ inputs.output_name }}"
          git push
          
          echo "✅ Committed and pushed successfully"

      - name: Upload README as artifact
        if: env.THUMBNAIL_EXISTS == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: readme-file
          path: README.md
          retention-days: 1

      - name: Upload thumbnail as artifact
        if: env.THUMBNAIL_EXISTS == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: thumbnail-file
          path: thumbnails/
          retention-days: 1

  send-to-bot:
    runs-on: ubuntu-latest
    needs: download-thumbnail
    if: always() && needs.download-thumbnail.result == 'success'
    
    steps:
      - name: Mask sensitive inputs
        run: |
          echo "::add-mask::${{ inputs.bale_token }}"
          echo "::add-mask::${{ inputs.bale_chat_id }}"

      - name: Download README artifact
        uses: actions/download-artifact@v4
        with:
          name: readme-file
          path: .

      - name: Download thumbnail artifact
        uses: actions/download-artifact@v4
        with:
          name: thumbnail-file
          path: thumbnails/

      - name: Extract links from README.md
        id: extract
        run: |
          if [ ! -f "README.md" ]; then
            echo "❌ README.md not found!"
            exit 1
          fi
          
          echo "README.md contents:"
          cat README.md
          
          # Extract links using both patterns
          > extracted_links.txt
          grep -oP '\]\(\Khttps://[^)]+' README.md >> extracted_links.txt 2>/dev/null || true
          grep -oE 'https://raw\.githubusercontent\.com/[^ ]+' README.md >> extracted_links.txt 2>/dev/null || true
          
          sort -u extracted_links.txt -o extracted_links.txt
          sed -i '/^$/d' extracted_links.txt
          
          LINK_COUNT=$(wc -l < extracted_links.txt)
          echo "LINK_COUNT=$LINK_COUNT" >> $GITHUB_ENV
          
          echo "Found $LINK_COUNT links:"
          cat extracted_links.txt
          
          if [ "$LINK_COUNT" -eq 0 ]; then
            echo "❌ No download links found"
            exit 1
          fi

      - name: Download and send thumbnail
        run: |
          TOKEN="${{ inputs.bale_token }}"
          CHAT_ID="${{ inputs.bale_chat_id }}"
          
          # Download the file
          LINK=$(cat extracted_links.txt | head -1)
          echo "Downloading from: $LINK"
          wget --content-disposition --trust-server-names "$LINK"
          
          # Find downloaded file
          DOWNLOADED_FILE=$(ls -1 | head -1)
          echo "Downloaded: $DOWNLOADED_FILE"
          
          # Send to Bale
          curl -s -X POST "https://tapi.bale.ai/bot${TOKEN}/sendPhoto" \
            -F "chat_id=${CHAT_ID}" \
            -F "photo=@${DOWNLOADED_FILE}" \
            -F "caption=🖼️ Thumbnail downloaded successfully!%0A📁 File: ${DOWNLOADED_FILE}"
          
          echo "✅ Sent to Bale"

      - name: Cleanup
        run: |
          rm -f README.md extracted_links.txt
          rm -rf thumbnails downloaded_files