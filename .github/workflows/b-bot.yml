name: B Bot

on:
  workflow_dispatch:
    inputs:
      youtube_url:
        description: '🔗 YouTube video URL(s)'
        required: true
        type: string
      quality:
        description: '🎬 Video quality'
        required: true
        default: 'best'
        type: choice
        options:
          - best
          - 2160
          - 1440
          - 1080
          - 720
          - 480
          - audio
      parts_size:
        description: '🫙 Parts size (MB)'
        required: false
        type: string
        default: '45'
      bale_token:
        description: '🤖 Bale Bot Token'
        required: true
        type: string
      bale_chat_id:
        description: '💬 Bale Chat ID'
        required: true
        type: string
      delay_seconds:
        description: '⏱️ Delay between parts (seconds)'
        required: false
        type: string
        default: '2'

jobs:
  download-split-and-send:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 0

      - name: Mask sensitive inputs
        run: |
          echo "::add-mask::${{ inputs.bale_token }}"
          echo "::add-mask::${{ inputs.bale_chat_id }}"

      - name: Setup FFmpeg
        run: |
          wget https://github.com/yt-dlp/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-linux64-gpl.tar.xz
          tar -xf ffmpeg-master-latest-linux64-gpl.tar.xz
          sudo mv ffmpeg-master-latest-linux64-gpl/bin/ffmpeg /usr/local/bin/
          sudo mv ffmpeg-master-latest-linux64-gpl/bin/ffprobe /usr/local/bin/
          ffmpeg -version

      - name: Setup WARP
        run: |
          docker rm -f warp 2>/dev/null || true
          docker network create warp-net 2>/dev/null || true

          docker run -d \
            --name warp \
            --restart=always \
            --network warp-net \
            -p 1080:1080 \
            --cap-add NET_ADMIN \
            --sysctl net.ipv6.conf.all.disable_ipv6=0 \
            --sysctl net.ipv4.conf.all.src_valid_mark=1 \
            -v warp-data:/var/lib/cloudflare-warp \
            caomingjun/warp

          echo "Waiting for WARP to initialize..."

          WARP_READY=false
          for i in {1..10}; do
            RESULT=$(curl -s --max-time 3 --socks5-hostname 127.0.0.1:1080 https://cloudflare.com/cdn-cgi/trace 2>/dev/null || true)
            
            if echo "$RESULT" | grep -qE "warp=(on|plus)"; then
              echo "WARP proxy is ready! (Took $i attempts)"
              echo "$RESULT" | grep -E "^(ip|warp|colo)="
              WARP_READY=true
              break
            fi
            
            echo "Attempt $i/10 - WARP not ready, waiting 3s..."
            sleep 3
          done

          if [ "$WARP_READY" = false ]; then
            echo "WARP failed to activate fully, continuing anyway..."
            echo "Last response: $RESULT"
          fi

      - name: Setup yt-dlp
        run: |
          sudo apt-get install -y python3-pip curl
          pip install yt-dlp --pre

          curl -fsSL https://deno.land/install.sh | sh
          export DENO_INSTALL="$HOME/.deno"
          export PATH="$DENO_INSTALL/bin:$PATH"
          echo "$DENO_INSTALL/bin" >> $GITHUB_PATH
          deno --version
          
      - name: Download video
        id: download
        run: |
          QUALITY="${{ inputs.quality }}"
          
          if [ "$QUALITY" = "audio" ]; then
            FORMAT_OPTS="-f bestaudio --extract-audio --audio-format mp3"
          elif [ "$QUALITY" = "best" ]; then
            FORMAT_OPTS="-f bestvideo+bestaudio/best --merge-output-format mp4"
          else
            FORMAT_OPTS="-f bestvideo[height<=${QUALITY}]+bestaudio/best[height<=${QUALITY}] --merge-output-format mp4"
          fi
          
          mkdir -p tmpvideos
          cd tmpvideos
          yt-dlp --remote-components ejs:github --proxy "socks5://127.0.0.1:1080" $FORMAT_OPTS -o "video.%(ext)s" "${{ inputs.youtube_url }}"

          # Find the downloaded file
          VIDEO_FILE=$(ls -1 | head -n 1)
          echo "VIDEO_FILE=$VIDEO_FILE" >> $GITHUB_ENV
          
          docker stop warp || true

      - name: Split video (ZIP method)
        id: split
        run: |
          PARTS_SIZE="${{ inputs.parts_size }}"
          
          echo "Splitting video into ${PARTS_SIZE}MB parts using zip..."
          
          mkdir -p parts
          
          cd tmpvideos
          
          VIDEO_FILE="${{ env.VIDEO_FILE }}"
          
          if [ -z "$VIDEO_FILE" ] || [ ! -f "$VIDEO_FILE" ]; then
            echo "ERROR: Video file not found: $VIDEO_FILE"
            ls -la
            exit 1
          fi
          
          echo "Found video file: $VIDEO_FILE"
          FILE_SIZE=$(stat -c%s "$VIDEO_FILE")
          FILE_SIZE_MB=$((FILE_SIZE / 1024 / 1024))
          echo "File size: ${FILE_SIZE_MB} MB"
          
          # Create a split ZIP archive
          zip -s ${PARTS_SIZE}m -r ../parts/video_split.zip "$VIDEO_FILE"
          
          if [ $? -ne 0 ]; then
            echo "ERROR: zip command failed"
            exit 1
          fi
          
          cd ../parts
          
          # Rename parts to clean naming
          for part in video_split.z*; do
            if [ -f "$part" ]; then
              NUM=$(echo "$part" | grep -o 'z[0-9]*' | sed 's/z//')
              if [ -n "$NUM" ]; then
                NEW_NAME="video.z$(printf "%02d" $NUM)"
                mv "$part" "$NEW_NAME"
                echo "Renamed: $part -> $NEW_NAME"
              fi
            fi
          done
          
          # Handle the final .zip file
          if [ -f "video_split.zip" ]; then
            mv "video_split.zip" "video.zip"
            echo "Renamed: video_split.zip -> video.zip"
          fi
          
          TOTAL_PARTS=$(ls video.z* video.zip 2>/dev/null | wc -l)
          echo "TOTAL_PARTS=$TOTAL_PARTS" >> $GITHUB_ENV
          echo "Total parts created: $TOTAL_PARTS"
          
          # Create short README file
          echo "HOW TO EXTRACT: Download ALL parts (.z01, .z02, ..., .zip) to the same folder, then extract video.zip with 7-Zip or WinRAR" > README.txt
          
          # List files for debugging
          ls -lh

      - name: Send parts to Bale
        run: |
          TOKEN="${{ inputs.bale_token }}"
          CHAT_ID="${{ inputs.bale_chat_id }}"
          DELAY="${{ inputs.delay_seconds }}"
          
          # Validate delay is a number
          if ! [[ "$DELAY" =~ ^[0-9]+$ ]]; then
            echo "Invalid delay value. Using default 2 seconds."
            DELAY=2
          fi
          
          cd parts
          
          # Send README.txt first
          if [ -f "README.txt" ]; then
            echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
            echo "📄 Sending README.txt with instructions..."
            echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
            
            curl -s -X POST "https://tapi.bale.ai/bot${TOKEN}/sendDocument" \
              -F "chat_id=${CHAT_ID}" \
              -F "document=@README.txt" \
              -F "caption=📋 Extract video.zip with 7-Zip"
            
            echo "✅ README.txt sent"
            sleep $DELAY
          fi
          
          # Get list of .z* parts
          ZIP_PARTS=$(ls video.z* 2>/dev/null | sort -V)
          TOTAL_PARTS=$(echo "$ZIP_PARTS" | wc -l)
          
          # Count final .zip if it exists
          if [ -f "video.zip" ]; then
            TOTAL_PARTS=$((TOTAL_PARTS + 1))
          fi
          
          echo "Found $TOTAL_PARTS total parts to send"
          echo "Delay between parts: $DELAY seconds"
          PART_NUM=1
          FAILED_PARTS=""
          
          # Send all .z* parts first
          for part in $ZIP_PARTS; do
            FILE_SIZE=$(stat -c%s "$part")
            FILE_SIZE_MB=$((FILE_SIZE / 1024 / 1024))
            
            echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
            echo "📤 Sending part $PART_NUM of $TOTAL_PARTS: $part (${FILE_SIZE_MB} MB)"
            echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
            
            RESPONSE=$(curl -s -w "\n%{http_code}" -X POST "https://tapi.bale.ai/bot${TOKEN}/sendDocument" \
              -F "chat_id=${CHAT_ID}" \
              -F "document=@${part}" \
              -F "caption=📹 Part ${PART_NUM}/${TOTAL_PARTS} | ${FILE_SIZE_MB}MB")
            
            HTTP_CODE=$(echo "$RESPONSE" | tail -n1)
            
            if [ "$HTTP_CODE" -eq 200 ]; then
              echo "✅ Part $PART_NUM sent successfully!"
            else
              echo "❌ Failed to send part $PART_NUM (HTTP $HTTP_CODE)"
              FAILED_PARTS="$FAILED_PARTS $PART_NUM"
            fi
            
            PART_NUM=$((PART_NUM + 1))
            
            if [ $PART_NUM -le $TOTAL_PARTS ]; then
              echo "⏳ Waiting $DELAY seconds before next part..."
              sleep $DELAY
            fi
          done
          
          # Send the final .zip file last
          if [ -f "video.zip" ]; then
            FILE_SIZE=$(stat -c%s "video.zip")
            FILE_SIZE_MB=$((FILE_SIZE / 1024 / 1024))
            
            echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
            echo "📤 Sending FINAL part $PART_NUM of $TOTAL_PARTS: video.zip (${FILE_SIZE_MB} MB)"
            echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
            
            RESPONSE=$(curl -s -w "\n%{http_code}" -X POST "https://tapi.bale.ai/bot${TOKEN}/sendDocument" \
              -F "chat_id=${CHAT_ID}" \
              -F "document=@video.zip" \
              -F "caption=✅ FINAL - EXTRACT THIS FILE! | ${FILE_SIZE_MB}MB | Use 7-Zip")
            
            HTTP_CODE=$(echo "$RESPONSE" | tail -n1)
            
            if [ "$HTTP_CODE" -eq 200 ]; then
              echo "✅ Final part sent successfully!"
            else
              echo "❌ Failed to send final part (HTTP $HTTP_CODE)"
              FAILED_PARTS="$FAILED_PARTS $PART_NUM"
            fi
          fi
          
          echo ""
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          
          # Send completion message
          if [ -z "$FAILED_PARTS" ]; then
            MESSAGE="✅ Done! $TOTAL_PARTS parts sent. Delay: ${DELAY}s%0A%0A📋 Extract video.zip with 7-Zip"
            echo "✅ All $TOTAL_PARTS parts sent successfully!"
          else
            MESSAGE="⚠️ Partial failure. Failed parts:${FAILED_PARTS}"
            echo "⚠️ Some parts failed: $FAILED_PARTS"
          fi
          
          curl -s -X POST "https://tapi.bale.ai/bot${TOKEN}/sendMessage" \
            -d "chat_id=${CHAT_ID}" \
            -d "text=${MESSAGE}"
          
          if [ -n "$FAILED_PARTS" ]; then
            exit 1
          fi

      - name: Cleanup
        run: |
          rm -rf tmpvideos parts
          echo "🧹 Cleaned up temporary files"