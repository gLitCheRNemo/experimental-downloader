name: B Bot

on:
  workflow_dispatch:
    inputs:
      youtube_url:
        description: '🔗 YouTube video URL(s)'
        required: true
        type: string
      quality:
        description: '🎬 Video quality'
        required: true
        default: 'best'
        type: choice
        options:
          - best
          - 2160
          - 1440
          - 1080
          - 720
          - 480
          - audio
      parts_size:
        description: '🫙 Parts size (MB)'
        required: false
        type: string
        default: '45'
      bale_token:
        description: '🤖 Bale Bot Token'
        required: true
        type: string
      bale_chat_id:
        description: '💬 Bale Chat ID'
        required: true
        type: string
      delay_seconds:
        description: '⏱️ Delay between parts (seconds)'
        required: false
        type: string
        default: '2'

jobs:
  download-split-and-send:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 0

      - name: Mask sensitive inputs
        run: |
          echo "::add-mask::${{ inputs.bale_token }}"
          echo "::add-mask::${{ inputs.bale_chat_id }}"

      - name: Setup FFmpeg
        run: |
          wget https://github.com/yt-dlp/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-linux64-gpl.tar.xz
          tar -xf ffmpeg-master-latest-linux64-gpl.tar.xz
          sudo mv ffmpeg-master-latest-linux64-gpl/bin/ffmpeg /usr/local/bin/
          sudo mv ffmpeg-master-latest-linux64-gpl/bin/ffprobe /usr/local/bin/
          ffmpeg -version

      - name: Setup WARP
        run: |
          docker rm -f warp 2>/dev/null || true
          docker network create warp-net 2>/dev/null || true

          docker run -d \
            --name warp \
            --restart=always \
            --network warp-net \
            -p 1080:1080 \
            --cap-add NET_ADMIN \
            --sysctl net.ipv6.conf.all.disable_ipv6=0 \
            --sysctl net.ipv4.conf.all.src_valid_mark=1 \
            -v warp-data:/var/lib/cloudflare-warp \
            caomingjun/warp

          echo "Waiting for WARP to initialize..."

          WARP_READY=false
          for i in {1..10}; do
            RESULT=$(curl -s --max-time 3 --socks5-hostname 127.0.0.1:1080 https://cloudflare.com/cdn-cgi/trace 2>/dev/null || true)
            
            if echo "$RESULT" | grep -qE "warp=(on|plus)"; then
              echo "WARP proxy is ready! (Took $i attempts)"
              echo "$RESULT" | grep -E "^(ip|warp|colo)="
              WARP_READY=true
              break
            fi
            
            echo "Attempt $i/10 - WARP not ready, waiting 3s..."
            sleep 3
          done

          if [ "$WARP_READY" = false ]; then
            echo "WARP failed to activate fully, continuing anyway..."
            echo "Last response: $RESULT"
          fi

      - name: Setup yt-dlp
        run: |
          sudo apt-get install -y python3-pip curl
          pip install yt-dlp --pre

          curl -fsSL https://deno.land/install.sh | sh
          export DENO_INSTALL="$HOME/.deno"
          export PATH="$DENO_INSTALL/bin:$PATH"
          echo "$DENO_INSTALL/bin" >> $GITHUB_PATH
          deno --version
          
      - name: Download video
        id: download
        run: |
          QUALITY="${{ inputs.quality }}"
          
          if [ "$QUALITY" = "audio" ]; then
            FORMAT_OPTS="-f bestaudio --extract-audio --audio-format mp3"
          elif [ "$QUALITY" = "best" ]; then
            FORMAT_OPTS="-f bestvideo+bestaudio/best --merge-output-format mp4"
          else
            FORMAT_OPTS="-f bestvideo[height<=${QUALITY}]+bestaudio/best[height<=${QUALITY}] --merge-output-format mp4"
          fi
          
          mkdir -p tmpvideos
          cd tmpvideos
          yt-dlp --remote-components ejs:github --proxy "socks5://127.0.0.1:1080" $FORMAT_OPTS "${{ inputs.youtube_url }}"

          FILE=$(ls -1 | head -n 1)
          echo "FILE=$FILE" >> $GITHUB_ENV
          
          docker stop warp || true

      - name: Split video into parts (Original ZIP method)
        id: split
        run: |
          PARTS_SIZE="${{ inputs.parts_size }}"
          ORIGINAL_FILE="${{ env.FILE }}"
          
          echo "Splitting $ORIGINAL_FILE into ${PARTS_SIZE}MB parts using zip..."
          
          mkdir -p parts
          
          # Create a split ZIP archive (creates .z01, .z02, ..., .zip)
          cd tmpvideos
          zip -s ${PARTS_SIZE}m -r ../parts/video_split.zip "$ORIGINAL_FILE"
          cd ..
          
          cd parts
          
          # Rename parts to video.z01, video.z02, ..., video.zip
          for part in video_split.z* video_split.zip; do
            if [ -f "$part" ]; then
              if [[ "$part" == video_split.zip ]]; then
                mv "$part" "video.zip"
              else
                NUM=$(echo "$part" | grep -o 'z[0-9]*' | sed 's/z//')
                mv "$part" "video.z$(printf "%02d" $NUM)"
              fi
            fi
          done
          
          # Fix single-digit numbers (z1 -> z01)
          for part in video.z?; do
            if [ -f "$part" ]; then
              NUM=$(echo "$part" | grep -o 'z[0-9]' | sed 's/z//')
              if [ ${#NUM} -eq 1 ]; then
                mv "$part" "video.z0${NUM}"
              fi
            fi
          done
          
          TOTAL_PARTS=$(ls -1 video.z* video.zip 2>/dev/null | wc -l)
          echo "TOTAL_PARTS=$TOTAL_PARTS" >> $GITHUB_ENV
          echo "Total parts created: $TOTAL_PARTS"
          
          ls -lh video.z* video.zip 2>/dev/null

      - name: Send parts to Bale with Retry
        run: |
          TOKEN="${{ inputs.bale_token }}"
          CHAT_ID="${{ inputs.bale_chat_id }}"
          DELAY="${{ inputs.delay_seconds }}"
          [[ ! "$DELAY" =~ ^[0-9]+$ ]] && DELAY=2
          
          # Retry function for sending parts
          send_with_retry() {
            local file="$1"
            local caption="$2"
            local max_retries=3
            local attempt=1
            
            while [ $attempt -le $max_retries ]; do
              echo "  Attempt $attempt of $max_retries..."
              
              RESPONSE=$(curl -s -w "\n%{http_code}" -X POST "https://tapi.bale.ai/bot${TOKEN}/sendDocument" \
                -F "chat_id=${CHAT_ID}" \
                -F "document=@${file}" \
                -F "caption=${caption}")
              
              HTTP_CODE=$(echo "$RESPONSE" | tail -n1)
              
              if [ "$HTTP_CODE" -eq 200 ]; then
                echo "  ✅ Sent successfully on attempt $attempt"
                return 0
              else
                echo "  ❌ Failed with HTTP $HTTP_CODE (attempt $attempt)"
                if [ $attempt -lt $max_retries ]; then
                  sleep_time=$((2 ** attempt))
                  echo "  ⏳ Retrying in $sleep_time seconds..."
                  sleep $sleep_time
                fi
              fi
              
              attempt=$((attempt + 1))
            done
            
            echo "  ❌ Failed after $max_retries attempts"
            return 1
          }
          
          cd parts
          
          # Send .z* parts first
          PART_NUM=1
          FAILED=""
          for part in $(ls video.z* 2>/dev/null | sort -V); do
            SIZE=$(stat -c%s "$part")
            SIZE_MB=$((SIZE / 1024 / 1024))
            echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
            echo "📤 Sending $part (${SIZE_MB}MB) - Part $PART_NUM/${{ env.TOTAL_PARTS }}"
            echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
            
            CAPTION="📹 Part $PART_NUM/${{ env.TOTAL_PARTS }} | ${SIZE_MB}MB"
            
            if send_with_retry "$part" "$CAPTION"; then
              echo "✅ Part $PART_NUM completed"
            else
              echo "❌ Part $PART_NUM failed permanently"
              FAILED="$FAILED $PART_NUM"
            fi
            
            PART_NUM=$((PART_NUM + 1))
            [ $PART_NUM -le ${{ env.TOTAL_PARTS }} ] && sleep $DELAY
          done
          
          # Send final .zip last with retry
          if [ -f "video.zip" ]; then
            SIZE=$(stat -c%s "video.zip")
            SIZE_MB=$((SIZE / 1024 / 1024))
            echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
            echo "📤 Sending final video.zip (${SIZE_MB}MB)"
            echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
            
            CAPTION="✅ FINAL - Extract this file with 7-Zip | ${SIZE_MB}MB"
            
            if ! send_with_retry "video.zip" "$CAPTION"; then
              FAILED="$FAILED final"
            fi
          fi
          
          echo ""
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          
          # Completion message
          if [ -z "$FAILED" ]; then
            curl -s -X POST "https://tapi.bale.ai/bot${TOKEN}/sendMessage" \
              -d "chat_id=${CHAT_ID}" \
              -d "text=✅ Done! ${{ env.TOTAL_PARTS }} parts sent. Delay: ${DELAY}s"
          else
            curl -s -X POST "https://tapi.bale.ai/bot${TOKEN}/sendMessage" \
              -d "chat_id=${CHAT_ID}" \
              -d "text=⚠️ Partial failure. Failed parts:$FAILED"
            exit 1
          fi

      - name: Cleanup
        run: rm -rf tmpvideos parts