name: B Bot

on:
  workflow_dispatch:
    inputs:
      youtube_url:
        description: YouTube video URL
        required: true
        type: string
      quality:
        description: Video quality
        required: true
        default: best
        type: choice
        options:
          - best
          - 2160
          - 1440
          - 1080
          - 720
          - 480
          - audio
      parts_size:
        description: Parts size in MB
        required: false
        type: string
        default: '45'
      bale_token:
        description: Bale Bot Token
        required: true
        type: string
      bale_chat_id:
        description: Bale Chat ID
        required: true
        type: string
      delay_seconds:
        description: Delay between parts in seconds
        required: false
        type: string
        default: '2'

jobs:
  download-split-and-send:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 0

      - name: Mask sensitive inputs
        run: |
          echo "::add-mask::${{ inputs.bale_token }}"
          echo "::add-mask::${{ inputs.bale_chat_id }}"

      - name: Setup FFmpeg
        run: |
          wget https://github.com/yt-dlp/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-linux64-gpl.tar.xz
          tar -xf ffmpeg-master-latest-linux64-gpl.tar.xz
          sudo mv ffmpeg-master-latest-linux64-gpl/bin/ffmpeg /usr/local/bin/
          sudo mv ffmpeg-master-latest-linux64-gpl/bin/ffprobe /usr/local/bin/
          ffmpeg -version

      - name: Setup WARP
        run: |
          docker rm -f warp 2>/dev/null || true
          docker network create warp-net 2>/dev/null || true
          docker run -d \
            --name warp \
            --restart=always \
            --network warp-net \
            -p 1080:1080 \
            --cap-add NET_ADMIN \
            --sysctl net.ipv6.conf.all.disable_ipv6=0 \
            --sysctl net.ipv4.conf.all.src_valid_mark=1 \
            -v warp-data:/var/lib/cloudflare-warp \
            caomingjun/warp
          sleep 15

      - name: Setup yt-dlp
        run: |
          sudo apt-get install -y python3-pip curl
          pip install yt-dlp --pre
          curl -fsSL https://deno.land/install.sh | sh
          export DENO_INSTALL="$HOME/.deno"
          export PATH="$DENO_INSTALL/bin:$PATH"
          echo "$DENO_INSTALL/bin" >> $GITHUB_PATH
          deno --version

      - name: Download video
        id: download
        run: |
          QUALITY="${{ inputs.quality }}"
          if [ "$QUALITY" = "audio" ]; then
            FORMAT_OPTS="-f bestaudio --extract-audio --audio-format mp3"
          elif [ "$QUALITY" = "best" ]; then
            FORMAT_OPTS="-f bestvideo+bestaudio/best --merge-output-format mp4"
          else
            FORMAT_OPTS="-f bestvideo[height<=${QUALITY}]+bestaudio/best[height<=${QUALITY}] --merge-output-format mp4"
          fi
          mkdir -p tmpvideos
          cd tmpvideos
          yt-dlp --remote-components ejs:github --proxy "socks5://127.0.0.1:1080" $FORMAT_OPTS "${{ inputs.youtube_url }}"
          FILE=$(ls -1 | head -n 1)
          SAFE_NAME=$(echo "$FILE" | sed 's/ /_/g')
          echo "FILE=$FILE" >> $GITHUB_ENV
          echo "SAFE_NAME=$SAFE_NAME" >> $GITHUB_ENV
          docker stop warp || true

      - name: Split video into parts
        id: split
        run: |
          PARTS_SIZE="${{ inputs.parts_size }}"
          SAFE_NAME="${{ env.SAFE_NAME }}"
          
          echo "Splitting video into ${PARTS_SIZE}MB parts..."
          
          # Create a clean parts folder
          rm -rf parts
          mkdir -p parts
          
          cd tmpvideos
          
          # Create split ZIP archive directly into the parts folder
          # This creates: video_name.z01, video_name.z02, ..., video_name.zip
          zip -r -0 -s ${PARTS_SIZE}m "../parts/${SAFE_NAME}.zip" "."
          
          if [ $? -ne 0 ]; then
            echo "ERROR: zip command failed!"
            exit 1
          fi
          
          cd ..
          
          # Verify and list files in parts folder
          cd parts
          echo "Files in parts folder:"
          ls -la
          
          # Count the number of split parts (excluding the final .zip)
          if ls ${SAFE_NAME}.z* 1> /dev/null 2>&1; then
            TOTAL_PARTS=$(ls -1 ${SAFE_NAME}.z* | wc -l)
            echo "SINGLE_FILE=false" >> $GITHUB_ENV
          else
            TOTAL_PARTS=1
            echo "SINGLE_FILE=true" >> $GITHUB_ENV
          fi
          
          echo "TOTAL_PARTS=$TOTAL_PARTS" >> $GITHUB_ENV
          echo "Total parts created: $TOTAL_PARTS"
          ls -lh

      - name: Send files to Bale
        run: |
          TOKEN="${{ inputs.bale_token }}"
          CHAT_ID="${{ inputs.bale_chat_id }}"
          DELAY="${{ inputs.delay_seconds }}"
          if ! [[ "$DELAY" =~ ^[0-9]+$ ]]; then
            DELAY=2
          fi
          
          cd parts
          SAFE_NAME="${{ env.SAFE_NAME }}"
          VIDEO_NAME=$(echo "$SAFE_NAME" | sed 's/_/ /g')
          
          # Send video name with down arrow
          echo "Sending video title: $VIDEO_NAME"
          curl -s -X POST "https://tapi.bale.ai/bot${TOKEN}/sendMessage" \
            -d "chat_id=${CHAT_ID}" \
            -d "text=${VIDEO_NAME}%0A⬇️"
          
          # Send all files from the parts folder one by one
          ALL_FILES=$(ls -1 | sort -V)
          TOTAL_FILES=$(echo "$ALL_FILES" | wc -l)
          FILE_NUM=1
          FAILED=""
          
          echo "Found $TOTAL_FILES files to send"
          
          for file in $ALL_FILES; do
            if [ -f "$file" ]; then
              SIZE=$(stat -c%s "$file")
              SIZE_MB=$((SIZE / 1024 / 1024))
              
              echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
              echo "Sending file $FILE_NUM of $TOTAL_FILES: $file (${SIZE_MB} MB)"
              echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
              
              # Determine caption based on file type
              if [[ "$file" == *.zip ]] && [ "$TOTAL_FILES" -gt 1 ]; then
                CAPTION="FINAL - Extract this file | ${SIZE_MB}MB"
              elif [[ "$file" == *.zip ]]; then
                CAPTION="${VIDEO_NAME} | ${SIZE_MB}MB"
              else
                CAPTION="Part $FILE_NUM of $TOTAL_FILES | ${SIZE_MB}MB"
              fi
              
              curl -s -X POST "https://tapi.bale.ai/bot${TOKEN}/sendDocument" \
                -F "chat_id=${CHAT_ID}" \
                -F "document=@${file}" \
                -F "caption=${CAPTION}"
              
              if [ $? -ne 0 ]; then
                FAILED="$FAILED $file"
              fi
              
              FILE_NUM=$((FILE_NUM + 1))
              
              if [ $FILE_NUM -le $TOTAL_FILES ]; then
                echo "Waiting $DELAY seconds before next file..."
                sleep $DELAY
              fi
            fi
          done
          
          echo ""
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          
          # Send completion message
          if [ -z "$FAILED" ]; then
            curl -s -X POST "https://tapi.bale.ai/bot${TOKEN}/sendMessage" \
              -d "chat_id=${CHAT_ID}" \
              -d "text=Done! $TOTAL_FILES files sent. Delay: ${DELAY}s"
            echo "✅ All $TOTAL_FILES files sent successfully!"
          else
            curl -s -X POST "https://tapi.bale.ai/bot${TOKEN}/sendMessage" \
              -d "chat_id=${CHAT_ID}" \
              -d "text=Partial failure. Failed files:$FAILED"
            echo "❌ Some files failed: $FAILED"
            exit 1
          fi

      - name: Cleanup
        run: rm -rf tmpvideos parts