name: B Bot

on:
  workflow_dispatch:
    inputs:
      youtube_url:
        description: '🔗 YouTube video URL(s)'
        required: true
        type: string
      quality:
        description: '🎬 Video quality'
        required: true
        default: 'best'
        type: choice
        options:
          - best
          - 2160
          - 1440
          - 1080
          - 720
          - 480
          - audio
      parts_size:
        description: '🫙 Parts size (MB)'
        required: false
        type: string
        default: '45'
      bale_token:
        description: '🤖 Bale Bot Token (from BotFather)'
        required: true
        type: string
      bale_chat_id:
        description: '💬 Bale Chat ID'
        required: true
        type: string
      delay_seconds:
        description: '⏱️ Delay between sending parts (seconds)'
        required: false
        type: string
        default: '2'

jobs:
  download-split-and-send:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 0

      - name: Mask sensitive inputs
        run: |
          echo "::add-mask::${{ inputs.bale_token }}"
          echo "::add-mask::${{ inputs.bale_chat_id }}"

      - name: Setup FFmpeg
        run: |
          wget https://github.com/yt-dlp/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-linux64-gpl.tar.xz
          tar -xf ffmpeg-master-latest-linux64-gpl.tar.xz
          sudo mv ffmpeg-master-latest-linux64-gpl/bin/ffmpeg /usr/local/bin/
          sudo mv ffmpeg-master-latest-linux64-gpl/bin/ffprobe /usr/local/bin/
          ffmpeg -version

      - name: Setup WARP
        run: |
          docker rm -f warp 2>/dev/null || true
          docker network create warp-net 2>/dev/null || true

          docker run -d \
            --name warp \
            --restart=always \
            --network warp-net \
            -p 1080:1080 \
            --cap-add NET_ADMIN \
            --sysctl net.ipv6.conf.all.disable_ipv6=0 \
            --sysctl net.ipv4.conf.all.src_valid_mark=1 \
            -v warp-data:/var/lib/cloudflare-warp \
            caomingjun/warp

          echo "Waiting for WARP to initialize..."

          WARP_READY=false
          for i in {1..10}; do
            RESULT=$(curl -s --max-time 3 --socks5-hostname 127.0.0.1:1080 https://cloudflare.com/cdn-cgi/trace 2>/dev/null || true)
            
            if echo "$RESULT" | grep -qE "warp=(on|plus)"; then
              echo "WARP proxy is ready! (Took $i attempts)"
              echo "$RESULT" | grep -E "^(ip|warp|colo)="
              WARP_READY=true
              break
            fi
            
            echo "Attempt $i/10 - WARP not ready, waiting 3s..."
            sleep 3
          done

          if [ "$WARP_READY" = false ]; then
            echo "WARP failed to activate fully, continuing anyway..."
            echo "Last response: $RESULT"
          fi

      - name: Setup yt-dlp
        run: |
          sudo apt-get install -y python3-pip curl
          pip install yt-dlp --pre

          curl -fsSL https://deno.land/install.sh | sh
          export DENO_INSTALL="$HOME/.deno"
          export PATH="$DENO_INSTALL/bin:$PATH"
          echo "$DENO_INSTALL/bin" >> $GITHUB_PATH
          deno --version
          
      - name: Download video
        id: download
        run: |
          QUALITY="${{ inputs.quality }}"
          
          if [ "$QUALITY" = "audio" ]; then
            FORMAT_OPTS="-f bestaudio --extract-audio --audio-format mp3"
          elif [ "$QUALITY" = "best" ]; then
            FORMAT_OPTS="-f bestvideo+bestaudio/best --merge-output-format mp4"
          else
            FORMAT_OPTS="-f bestvideo[height<=${QUALITY}]+bestaudio/best[height<=${QUALITY}] --merge-output-format mp4"
          fi
          
          mkdir -p tmpvideos
          cd tmpvideos
          yt-dlp --remote-components ejs:github --proxy "socks5://127.0.0.1:1080" $FORMAT_OPTS "${{ inputs.youtube_url }}"

          FILE=$(ls -1 | head -n 1)
          SAFE_NAME=$(echo "$FILE" | sed 's/^[[:space:]]*//' | tr ' ' '_')
          echo "FILE=$FILE" >> $GITHUB_ENV
          echo "SAFE_NAME=$SAFE_NAME" >> $GITHUB_ENV
          
          docker stop warp || true

      - name: Split video into ZIP parts (Ourtube method)
        id: split
        run: |
          PARTS_SIZE="${{ inputs.parts_size }}"
          ORIGINAL_FILE="${{ env.FILE }}"
          SAFE_NAME="${{ env.SAFE_NAME }}"
          
          echo "Splitting $ORIGINAL_FILE into ${PARTS_SIZE}MB ZIP parts..."
          
          mkdir -p parts
          cd tmpvideos
          
          # Ourtube's exact split command: -0 = no compression, -s = split
          zip -0 -s ${PARTS_SIZE}m "../parts/${SAFE_NAME}.zip" "$ORIGINAL_FILE"
          
          cd ..
          cd parts
          
          # Count the parts created
          TOTAL_PARTS=$(ls -1 ${SAFE_NAME}.z* ${SAFE_NAME}.zip 2>/dev/null | wc -l)
          echo "TOTAL_PARTS=$TOTAL_PARTS" >> $GITHUB_ENV
          echo "Total parts created: $TOTAL_PARTS"
          
          # Create short README for Android users
          cat > README.txt << 'EOF'
📋 HOW TO EXTRACT ON ANDROID:
1. Download ALL parts (.z01, .z02, ..., .zip)
2. Open ZArchiver app
3. Tap on the .zip file
4. Select "Extract here"

The video will be restored!
EOF
          
          ls -lh ${SAFE_NAME}.z* ${SAFE_NAME}.zip 2>/dev/null

      - name: Send parts to Bale
        run: |
          TOKEN="${{ inputs.bale_token }}"
          CHAT_ID="${{ inputs.bale_chat_id }}"
          DELAY="${{ inputs.delay_seconds }}"
          [[ ! "$DELAY" =~ ^[0-9]+$ ]] && DELAY=2
          
          cd parts
          SAFE_NAME="${{ env.SAFE_NAME }}"
          
          # Send README.txt first
          if [ -f "README.txt" ]; then
            echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
            echo "📄 Sending README.txt with instructions..."
            echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
            
            curl -s -X POST "https://tapi.bale.ai/bot${TOKEN}/sendDocument" \
              -F "chat_id=${CHAT_ID}" \
              -F "document=@README.txt" \
              -F "caption=📋 Extract the .zip file with ZArchiver"
            
            echo "✅ README.txt sent"
            sleep $DELAY
          fi
          
          # Send all .z* parts
          PART_NUM=1
          FAILED=""
          
          for part in $(ls ${SAFE_NAME}.z* 2>/dev/null | sort -V); do
            SIZE=$(stat -c%s "$part")
            SIZE_MB=$((SIZE / 1024 / 1024))
            echo "Sending $part (${SIZE_MB}MB) - Part $PART_NUM/${{ env.TOTAL_PARTS }}"
            
            curl -s -X POST "https://tapi.bale.ai/bot${TOKEN}/sendDocument" \
              -F "chat_id=${CHAT_ID}" \
              -F "document=@${part}" \
              -F "caption=📹 Part $PART_NUM/${{ env.TOTAL_PARTS }} | ${SIZE_MB}MB"
            
            [ $? -ne 0 ] && FAILED="$FAILED $PART_NUM"
            PART_NUM=$((PART_NUM + 1))
            [ $PART_NUM -le ${{ env.TOTAL_PARTS }} ] && sleep $DELAY
          done
          
          # Send final .zip
          if [ -f "${SAFE_NAME}.zip" ]; then
            SIZE=$(stat -c%s "${SAFE_NAME}.zip")
            SIZE_MB=$((SIZE / 1024 / 1024))
            echo "Sending ${SAFE_NAME}.zip (${SIZE_MB}MB)"
            
            curl -s -X POST "https://tapi.bale.ai/bot${TOKEN}/sendDocument" \
              -F "chat_id=${CHAT_ID}" \
              -F "document=@${SAFE_NAME}.zip" \
              -F "caption=✅ FINAL - Extract this file with ZArchiver | ${SIZE_MB}MB"
          fi
          
          # Completion message
          if [ -z "$FAILED" ]; then
            curl -s -X POST "https://tapi.bale.ai/bot${TOKEN}/sendMessage" \
              -d "chat_id=${CHAT_ID}" \
              -d "text=✅ Done! ${{ env.TOTAL_PARTS }} parts sent. Delay: ${DELAY}s"
          else
            curl -s -X POST "https://tapi.bale.ai/bot${TOKEN}/sendMessage" \
              -d "chat_id=${CHAT_ID}" \
              -d "text=⚠️ Partial failure. Failed parts:$FAILED"
            exit 1
          fi

      - name: Cleanup
        run: rm -rf tmpvideos parts