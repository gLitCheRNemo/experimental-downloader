name: B Bot

on:
  workflow_dispatch:
    inputs:
      youtube_url:
        description: '🔗 YouTube video URL(s)'
        required: true
        type: string
      quality:
        description: '🎬 Video quality'
        required: true
        default: 'best'
        type: choice
        options:
          - best
          - 2160
          - 1440
          - 1080
          - 720
          - 480
          - audio
      parts_size:
        description: '🫙 Parts size (MB)'
        required: false
        type: string
        default: '45'
      bale_token:
        description: '🤖 Bale Bot Token (from BotFather)'
        required: true
        type: string
      bale_chat_id:
        description: '💬 Bale Chat ID'
        required: true
        type: string

jobs:
  download-split-and-send:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 0

      - name: Mask sensitive inputs
        run: |
          echo "::add-mask::${{ inputs.bale_token }}"
          echo "::add-mask::${{ inputs.bale_chat_id }}"

      - name: Setup FFmpeg
        run: |
          wget https://github.com/yt-dlp/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-linux64-gpl.tar.xz
          tar -xf ffmpeg-master-latest-linux64-gpl.tar.xz
          sudo mv ffmpeg-master-latest-linux64-gpl/bin/ffmpeg /usr/local/bin/
          sudo mv ffmpeg-master-latest-linux64-gpl/bin/ffprobe /usr/local/bin/
          ffmpeg -version

      - name: Setup WARP
        run: |
          docker rm -f warp 2>/dev/null || true
          docker network create warp-net 2>/dev/null || true

          docker run -d \
            --name warp \
            --restart=always \
            --network warp-net \
            -p 1080:1080 \
            --cap-add NET_ADMIN \
            --sysctl net.ipv6.conf.all.disable_ipv6=0 \
            --sysctl net.ipv4.conf.all.src_valid_mark=1 \
            -v warp-data:/var/lib/cloudflare-warp \
            caomingjun/warp

          echo "Waiting for WARP to initialize..."

          WARP_READY=false
          for i in {1..10}; do
            RESULT=$(curl -s --max-time 3 --socks5-hostname 127.0.0.1:1080 https://cloudflare.com/cdn-cgi/trace 2>/dev/null || true)
            
            if echo "$RESULT" | grep -qE "warp=(on|plus)"; then
              echo "WARP proxy is ready! (Took $i attempts)"
              echo "$RESULT" | grep -E "^(ip|warp|colo)="
              WARP_READY=true
              break
            fi
            
            echo "Attempt $i/10 - WARP not ready, waiting 3s..."
            sleep 3
          done

          if [ "$WARP_READY" = false ]; then
            echo "WARP failed to activate fully, continuing anyway..."
            echo "Last response: $RESULT"
          fi

      - name: Setup yt-dlp
        run: |
          sudo apt-get install -y python3-pip curl
          pip install yt-dlp --pre

          curl -fsSL https://deno.land/install.sh | sh
          export DENO_INSTALL="$HOME/.deno"
          export PATH="$DENO_INSTALL/bin:$PATH"
          echo "$DENO_INSTALL/bin" >> $GITHUB_PATH
          deno --version
          
      - name: Download video
        id: download
        run: |
          QUALITY="${{ inputs.quality }}"
          
          if [ "$QUALITY" = "audio" ]; then
            FORMAT_OPTS="-f bestaudio --extract-audio --audio-format mp3"
          elif [ "$QUALITY" = "best" ]; then
            FORMAT_OPTS="-f bestvideo+bestaudio/best --merge-output-format mp4"
          else
            FORMAT_OPTS="-f bestvideo[height<=${QUALITY}]+bestaudio/best[height<=${QUALITY}] --merge-output-format mp4"
          fi
          
          mkdir -p tmpvideos
          cd tmpvideos
          yt-dlp --remote-components ejs:github --proxy "socks5://127.0.0.1:1080" $FORMAT_OPTS "${{ inputs.youtube_url }}"

          FILE=$(ls -1 | head -n 1)
          SAFE_NAME=$(echo "$FILE" | sed 's/^[[:space:]]*//' | tr ' ' '_')
          echo "FILE=$FILE" >> $GITHUB_ENV
          echo "SAFE_NAME=$SAFE_NAME" >> $GITHUB_ENV
          
          docker stop warp || true

      - name: Split video into parts
        id: split
        run: |
          PARTS_SIZE="${{ inputs.parts_size }}"
          ORIGINAL_FILE="${{ env.FILE }}"
          
          echo "Splitting $ORIGINAL_FILE into ${PARTS_SIZE}MB parts..."
          
          mkdir -p parts
          cd tmpvideos
          
          split -b ${PARTS_SIZE}M -d "$ORIGINAL_FILE" "../parts/part_"
          
          cd ../parts
          
          for part in part_*; do
            mv "$part" "${part}.part"
          done
          
          TOTAL_PARTS=$(ls -1 *.part | wc -l)
          echo "TOTAL_PARTS=$TOTAL_PARTS" >> $GITHUB_ENV
          echo "Total parts created: $TOTAL_PARTS"
          
          ls -lh *.part

      - name: Send parts one by one to Bale (Auto Proxy Fallback & Retry)
        run: |
          TOKEN="${{ inputs.bale_token }}"
          CHAT_ID="${{ inputs.bale_chat_id }}"
          
          cd parts
          
          PARTS_LIST=$(ls -1 part_*.part | sort -V)
          TOTAL_PARTS=$(echo "$PARTS_LIST" | wc -l)
          
          # Define proxy list to try (order matters - will fall through if one fails)
          PROXY_LIST=(
            "http://proxy.github.com:8080"
            "http://localhost:8080"
            ""
          )
          
          # Function to send a file with retry and proxy fallback
          send_with_retry() {
            local file="$1"
            local part_num="$2"
            local total_parts="$3"
            local max_retries=3
            
            for proxy in "${PROXY_LIST[@]}"; do
              echo "🔄 Trying proxy: ${proxy:-'DIRECT (no proxy)'}"
              
              # Set proxy environment
              if [ -n "$proxy" ]; then
                export HTTP_PROXY="$proxy"
                export HTTPS_PROXY="$proxy"
              else
                unset HTTP_PROXY
                unset HTTPS_PROXY
              fi
              
              for attempt in $(seq 1 $max_retries); do
                echo "  Attempt $attempt of $max_retries..."
                
                RESPONSE=$(curl -s -w "\n%{http_code}" --connect-timeout 30 --max-time 120 \
                  -X POST "https://tapi.bale.ai/bot${TOKEN}/sendDocument" \
                  -F "chat_id=${CHAT_ID}" \
                  -F "document=@${file}" \
                  -F "caption=🎬 Video: ${{ env.SAFE_NAME }}%0A📦 Part: ${part_num}/${total_parts}%0A🎚️ Quality: ${{ inputs.quality }}%0A🔗 Source: ${{ inputs.youtube_url }}")
                
                HTTP_CODE=$(echo "$RESPONSE" | tail -n1)
                BODY=$(echo "$RESPONSE" | sed '$d')
                
                if [ "$HTTP_CODE" -eq 200 ]; then
                  echo "  ✅ Part $part_num sent successfully via ${proxy:-'DIRECT'}"
                  return 0
                else
                  echo "  ❌ Failed (HTTP $HTTP_CODE) - attempt $attempt"
                  echo "  Response: $BODY"
                  
                  if [ $attempt -lt $max_retries ]; then
                    sleep_time=$((2 ** attempt))
                    echo "  ⏳ Waiting $sleep_time seconds before retry..."
                    sleep $sleep_time
                  fi
                fi
              done
              
              echo "  ⚠️ Proxy ${proxy:-'DIRECT'} failed after $max_retries attempts, trying next proxy..."
            done
            
            echo "❌ All proxies failed for part $part_num"
            return 1
          }
          
          echo "Found $TOTAL_PARTS parts to send"
          PART_NUM=1
          FAILED_PARTS=""
          
          for part in $PARTS_LIST; do
            FILE_SIZE=$(stat -c%s "$part")
            FILE_SIZE_MB=$((FILE_SIZE / 1024 / 1024))
            
            echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
            echo "📤 Sending part $PART_NUM of $TOTAL_PARTS: $part (${FILE_SIZE_MB} MB)"
            echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
            
            if send_with_retry "$part" "$PART_NUM" "$TOTAL_PARTS"; then
              echo "✅ Part $PART_NUM completed"
            else
              echo "❌ Part $PART_NUM failed permanently"
              FAILED_PARTS="$FAILED_PARTS $PART_NUM"
            fi
            
            PART_NUM=$((PART_NUM + 1))
            
            if [ $PART_NUM -le $TOTAL_PARTS ] && [ -z "$FAILED_PARTS" ]; then
              echo "⏳ Waiting 2 seconds before next part..."
              sleep 2
            fi
          done
          
          echo ""
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          
          # Send completion summary
          if [ -z "$FAILED_PARTS" ]; then
            MESSAGE="✅ DOWNLOAD COMPLETE!%0A%0A📹 Video: ${{ env.SAFE_NAME }}%0A📦 Total parts: ${TOTAL_PARTS}%0A🎬 Quality: ${{ inputs.quality }}%0A🔗 Source: ${{ inputs.youtube_url }}%0A%0A✨ All parts sent successfully!"
            echo "✅ All $TOTAL_PARTS parts sent successfully!"
          else
            MESSAGE="⚠️ DOWNLOAD PARTIALLY COMPLETE%0A%0A📹 Video: ${{ env.SAFE_NAME }}%0A📦 Total parts: ${TOTAL_PARTS}%0A❌ Failed parts:${FAILED_PARTS}%0A🎬 Quality: ${{ inputs.quality }}%0A🔗 Source: ${{ inputs.youtube_url }}%0A%0A⚠️ Some parts failed. Please re-run the workflow."
            echo "⚠️ Some parts failed: $FAILED_PARTS"
          fi
          
          # Try each proxy for the completion message as well
          for proxy in "${PROXY_LIST[@]}"; do
            if [ -n "$proxy" ]; then
              export HTTP_PROXY="$proxy"
              export HTTPS_PROXY="$proxy"
            else
              unset HTTP_PROXY
              unset HTTPS_PROXY
            fi
            
            RESPONSE=$(curl -s -w "\n%{http_code}" -X POST "https://tapi.bale.ai/bot${TOKEN}/sendMessage" \
              -d "chat_id=${CHAT_ID}" \
              -d "text=${MESSAGE}")
            
            HTTP_CODE=$(echo "$RESPONSE" | tail -n1)
            
            if [ "$HTTP_CODE" -eq 200 ]; then
              echo "✅ Completion message sent via ${proxy:-'DIRECT'}"
              break
            fi
          done
          
          if [ -n "$FAILED_PARTS" ]; then
            exit 1
          fi

      - name: Cleanup
        run: |
          rm -rf tmpvideos parts
          echo "🧹 Cleaned up temporary files"