name: B Bot

on:
  workflow_dispatch:
    inputs:
      youtube_url:
        description: '🔗 YouTube video URL(s)'
        required: true
        type: string
      quality:
        description: '🎬 Video quality'
        required: true
        default: 'best'
        type: choice
        options:
          - best
          - 2160
          - 1440
          - 1080
          - 720
          - 480
          - audio
      parts_size:
        description: '🫙 Parts size (MB)'
        required: false
        type: string
        default: '45'
      bale_token:
        description: '🤖 Bale Bot Token (from BotFather)'
        required: true
        type: string
      bale_chat_id:
        description: '💬 Bale Chat ID'
        required: true
        type: string
      delay_seconds:
        description: '⏱️ Delay between sending parts (seconds)'
        required: false
        type: string
        default: '2'

jobs:
  download-split-and-send:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 0

      - name: Mask sensitive inputs
        run: |
          echo "::add-mask::${{ inputs.bale_token }}"
          echo "::add-mask::${{ inputs.bale_chat_id }}"

      - name: Setup FFmpeg
        run: |
          wget https://github.com/yt-dlp/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-linux64-gpl.tar.xz
          tar -xf ffmpeg-master-latest-linux64-gpl.tar.xz
          sudo mv ffmpeg-master-latest-linux64-gpl/bin/ffmpeg /usr/local/bin/
          sudo mv ffmpeg-master-latest-linux64-gpl/bin/ffprobe /usr/local/bin/
          ffmpeg -version

      - name: Setup WARP
        run: |
          docker rm -f warp 2>/dev/null || true
          docker network create warp-net 2>/dev/null || true

          docker run -d \
            --name warp \
            --restart=always \
            --network warp-net \
            -p 1080:1080 \
            --cap-add NET_ADMIN \
            --sysctl net.ipv6.conf.all.disable_ipv6=0 \
            --sysctl net.ipv4.conf.all.src_valid_mark=1 \
            -v warp-data:/var/lib/cloudflare-warp \
            caomingjun/warp

          echo "Waiting for WARP to initialize..."

          WARP_READY=false
          for i in {1..10}; do
            RESULT=$(curl -s --max-time 3 --socks5-hostname 127.0.0.1:1080 https://cloudflare.com/cdn-cgi/trace 2>/dev/null || true)
            
            if echo "$RESULT" | grep -qE "warp=(on|plus)"; then
              echo "WARP proxy is ready! (Took $i attempts)"
              echo "$RESULT" | grep -E "^(ip|warp|colo)="
              WARP_READY=true
              break
            fi
            
            echo "Attempt $i/10 - WARP not ready, waiting 3s..."
            sleep 3
          done

          if [ "$WARP_READY" = false ]; then
            echo "WARP failed to activate fully, continuing anyway..."
            echo "Last response: $RESULT"
          fi

      - name: Setup yt-dlp
        run: |
          sudo apt-get install -y python3-pip curl
          pip install yt-dlp --pre

          curl -fsSL https://deno.land/install.sh | sh
          export DENO_INSTALL="$HOME/.deno"
          export PATH="$DENO_INSTALL/bin:$PATH"
          echo "$DENO_INSTALL/bin" >> $GITHUB_PATH
          deno --version
          
      - name: Download video
        id: download
        run: |
          QUALITY="${{ inputs.quality }}"
          
          if [ "$QUALITY" = "audio" ]; then
            FORMAT_OPTS="-f bestaudio --extract-audio --audio-format mp3"
            EXTENSION="mp3"
          elif [ "$QUALITY" = "best" ]; then
            FORMAT_OPTS="-f bestvideo+bestaudio/best --merge-output-format mp4"
            EXTENSION="mp4"
          else
            FORMAT_OPTS="-f bestvideo[height<=${QUALITY}]+bestaudio/best[height<=${QUALITY}] --merge-output-format mp4"
            EXTENSION="mp4"
          fi
          
          mkdir -p tmpvideos
          cd tmpvideos
          yt-dlp --remote-components ejs:github --proxy "socks5://127.0.0.1:1080" $FORMAT_OPTS -o "video.${EXTENSION}" "${{ inputs.youtube_url }}"

          FILE="video.${EXTENSION}"
          SAFE_NAME=$(echo "video" | tr ' ' '_')
          echo "FILE=$FILE" >> $GITHUB_ENV
          echo "SAFE_NAME=$SAFE_NAME" >> $GITHUB_ENV
          
          docker stop warp || true

      - name: Split video into parts (Original ZIP method)
        id: split
        run: |
          PARTS_SIZE="${{ inputs.parts_size }}"
          ORIGINAL_FILE="${{ env.FILE }}"
          
          echo "Splitting $ORIGINAL_FILE into ${PARTS_SIZE}MB parts using zip..."
          
          mkdir -p parts
          
          # Create a split ZIP archive
          # This creates: video_split.z01, video_split.z02, ..., video_split.zip
          cd tmpvideos
          zip -s ${PARTS_SIZE}m -r ../parts/video_split.zip "$ORIGINAL_FILE"
          cd ..
          
          cd parts
          
          # Rename parts to have consistent naming
          COUNTER=1
          for part in video_split.z* video_split.zip; do
            if [ -f "$part" ]; then
              if [[ "$part" == video_split.zip ]]; then
                mv "$part" "video.zip"
              else
                # Extract the number from .z01, .z02, etc.
                NUM=$(echo "$part" | grep -o 'z[0-9]*' | sed 's/z//')
                mv "$part" "video.z$(printf "%02d" $NUM)"
              fi
            fi
          done
          
          # Also handle the case where zip creates .z01, .z02 without a leading zero
          for part in video.z?; do
            if [ -f "$part" ]; then
              NUM=$(echo "$part" | grep -o 'z[0-9]' | sed 's/z//')
              if [ ${#NUM} -eq 1 ]; then
                mv "$part" "video.z0${NUM}"
              fi
            fi
          done
          
          TOTAL_PARTS=$(ls -1 video.z* video.zip 2>/dev/null | wc -l)
          echo "TOTAL_PARTS=$TOTAL_PARTS" >> $GITHUB_ENV
          echo "Total parts created: $TOTAL_PARTS"
          
          ls -lh video.z* video.zip 2>/dev/null
          
          # Create a README with reassembly instructions
          cat > README.txt << 'EOF'
📋 HOW TO REASSEMBLE THE VIDEO:

You have received a split ZIP archive consisting of:
- video.z01, video.z02, ... (the split parts)
- video.zip (the final part / index)

To reassemble:
1. Download ALL parts (.z01, .z02, ..., .zip) to the same folder
2. Extract the video.zip file using any archive tool (7-Zip, WinRAR, etc.)
   - Windows: Right-click video.zip → Extract Here
   - Linux/Mac: unzip video.zip

The video will be restored exactly as downloaded from YouTube.
EOF
          
          ls -la

      - name: Send parts one by one to Bale as Documents
        run: |
          TOKEN="${{ inputs.bale_token }}"
          CHAT_ID="${{ inputs.bale_chat_id }}"
          DELAY="${{ inputs.delay_seconds }}"
          
          # Validate delay is a number
          if ! [[ "$DELAY" =~ ^[0-9]+$ ]]; then
            echo "Invalid delay value. Using default 2 seconds."
            DELAY=2
          fi
          
          cd parts
          
          # Send README.txt first
          if [ -f "README.txt" ]; then
            echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
            echo "📄 Sending README.txt with reassembly instructions..."
            echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
            
            curl -s -X POST "https://tapi.bale.ai/bot${TOKEN}/sendDocument" \
              -F "chat_id=${CHAT_ID}" \
              -F "document=@README.txt" \
              -F "caption=📋 HOW TO REASSEMBLE THE VIDEO:%0A%0A1. Download ALL parts (.z01, .z02, ..., .zip)%0A2. Save them in the same folder%0A3. Extract the video.zip file%0A%0AThe video will be restored!"
            
            echo "✅ README.txt sent"
            sleep $DELAY
          fi
          
          # Get list of parts: .z01, .z02, ..., .zip (send .zip last)
          ZIP_PARTS=$(ls -1 video.z* 2>/dev/null | sort -V)
          FINAL_ZIP="video.zip"
          
          TOTAL_PARTS=$(echo "$ZIP_PARTS" | wc -l)
          if [ -f "$FINAL_ZIP" ]; then
            TOTAL_PARTS=$((TOTAL_PARTS + 1))
          fi
          
          echo "Found $TOTAL_PARTS parts to send"
          echo "Delay between parts: $DELAY seconds"
          PART_NUM=1
          FAILED_PARTS=""
          
          # Send all .z* parts first
          for part in $ZIP_PARTS; do
            FILE_SIZE=$(stat -c%s "$part")
            FILE_SIZE_MB=$((FILE_SIZE / 1024 / 1024))
            
            echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
            echo "📤 Sending part $PART_NUM of $TOTAL_PARTS: $part (${FILE_SIZE_MB} MB)"
            echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
            
            RESPONSE=$(curl -s -w "\n%{http_code}" -X POST "https://tapi.bale.ai/bot${TOKEN}/sendDocument" \
              -F "chat_id=${CHAT_ID}" \
              -F "document=@${part}" \
              -F "caption=🎬 Video: ${{ env.SAFE_NAME }}%0A📦 Part: ${PART_NUM}/${TOTAL_PARTS} (${part})%0A🎚️ Quality: ${{ inputs.quality }}%0A📁 Size: ${FILE_SIZE_MB} MB%0A🔗 Source: ${{ inputs.youtube_url }}%0A%0A📋 You need ALL parts to reassemble! Download video.zip last.")
            
            HTTP_CODE=$(echo "$RESPONSE" | tail -n1)
            
            if [ "$HTTP_CODE" -eq 200 ]; then
              echo "✅ Part $PART_NUM sent successfully!"
            else
              echo "❌ Failed to send part $PART_NUM (HTTP $HTTP_CODE)"
              FAILED_PARTS="$FAILED_PARTS $PART_NUM"
            fi
            
            PART_NUM=$((PART_NUM + 1))
            
            if [ $PART_NUM -le $TOTAL_PARTS ]; then
              echo "⏳ Waiting $DELAY seconds before next part..."
              sleep $DELAY
            fi
          done
          
          # Send the final .zip file last
          if [ -f "$FINAL_ZIP" ]; then
            FILE_SIZE=$(stat -c%s "$FINAL_ZIP")
            FILE_SIZE_MB=$((FILE_SIZE / 1024 / 1024))
            
            echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
            echo "📤 Sending FINAL part $PART_NUM of $TOTAL_PARTS: $FINAL_ZIP (${FILE_SIZE_MB} MB)"
            echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
            
            RESPONSE=$(curl -s -w "\n%{http_code}" -X POST "https://tapi.bale.ai/bot${TOKEN}/sendDocument" \
              -F "chat_id=${CHAT_ID}" \
              -F "document=@${FINAL_ZIP}" \
              -F "caption=🎬 FINAL PART - EXTRACT THIS FILE!%0A%0AVideo: ${{ env.SAFE_NAME }}%0A📦 Part: ${PART_NUM}/${TOTAL_PARTS} (video.zip)%0A🎚️ Quality: ${{ inputs.quality }}%0A🔗 Source: ${{ inputs.youtube_url }}%0A%0A📋 TO EXTRACT:%0A1. Download ALL parts (.z01, .z02, ..., .zip)%0A2. Save them in the same folder%0A3. Extract video.zip with 7-Zip or WinRAR%0A%0AThe video will be restored!")
            
            HTTP_CODE=$(echo "$RESPONSE" | tail -n1)
            
            if [ "$HTTP_CODE" -eq 200 ]; then
              echo "✅ Final part sent successfully!"
            else
              echo "❌ Failed to send final part (HTTP $HTTP_CODE)"
              FAILED_PARTS="$FAILED_PARTS $PART_NUM"
            fi
          fi
          
          echo ""
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          
          # Send completion message
          if [ -z "$FAILED_PARTS" ]; then
            MESSAGE="✅ DOWNLOAD COMPLETE!%0A%0A📹 Video: ${{ env.SAFE_NAME }}%0A📦 Total parts: ${TOTAL_PARTS}%0A🎬 Quality: ${{ inputs.quality }}%0A🔗 Source: ${{ inputs.youtube_url }}%0A%0A✨ All parts sent successfully! (Delay: ${DELAY}s between parts)%0A%0A📋 TO EXTRACT:%0A1. Download ALL parts (.z01, .z02, ..., .zip)%0A2. Save them in the same folder%0A3. Extract the video.zip file%0A%0AThe video will be restored!"
            echo "✅ All $TOTAL_PARTS parts sent successfully!"
          else
            MESSAGE="⚠️ DOWNLOAD PARTIALLY COMPLETE%0A%0A📹 Video: ${{ env.SAFE_NAME }}%0A📦 Total parts: ${TOTAL_PARTS}%0A❌ Failed parts:${FAILED_PARTS}%0A🎬 Quality: ${{ inputs.quality }}%0A🔗 Source: ${{ inputs.youtube_url }}%0A%0A⚠️ Some parts failed. Please re-run the workflow."
            echo "⚠️ Some parts failed: $FAILED_PARTS"
          fi
          
          curl -s -X POST "https://tapi.bale.ai/bot${TOKEN}/sendMessage" \
            -d "chat_id=${CHAT_ID}" \
            -d "text=${MESSAGE}"
          
          if [ -n "$FAILED_PARTS" ]; then
            exit 1
          fi

      - name: Cleanup
        run: |
          rm -rf tmpvideos parts
          echo "🧹 Cleaned up temporary files"