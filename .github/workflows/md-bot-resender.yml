name: 2- MD Bot - Resender

on:
  workflow_dispatch:
    inputs:
      part_number:
        description: Missing part number (e.g., 15 for .z15, or "final" for .zip)
        required: true
        type: string
      bale_token:
        description: Bale Bot Token
        required: true
        type: string
      bale_chat_id:
        description: Bale Chat ID
        required: true
        type: string

jobs:
  resend:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Mask sensitive inputs
        run: |
          echo "::add-mask::${{ inputs.bale_token }}"
          echo "::add-mask::${{ inputs.bale_chat_id }}"

      - name: Fetch file list from branch
        run: |
          BRANCH_NAME="md-parts"
          REPO="${{ github.repository }}"
          
          # Get the list of files from the branch
          git clone --depth 1 --branch $BRANCH_NAME "https://github.com/${REPO}.git" branch_files
          cd branch_files
          echo "Files in branch:"
          ls -la
          cd ..
          
          # Find the base name (e.g., video_name)
          BASE_NAME=$(ls branch_files | grep -v README.md | grep '\.z' | head -1 | sed 's/\.z[0-9][0-9]$//')
          echo "BASE_NAME=$BASE_NAME" >> $GITHUB_ENV

      - name: Resend missing part
        run: |
          TOKEN="${{ inputs.bale_token }}"
          CHAT_ID="${{ inputs.bale_chat_id }}"
          PART_NUM="${{ inputs.part_number }}"
          BRANCH_NAME="md-parts"
          REPO="${{ github.repository }}"
          BASE_NAME="${{ env.BASE_NAME }}"
          
          # Determine which file to fetch
          if [ "$PART_NUM" = "final" ] || [ "$PART_NUM" = "0" ]; then
            FILE_NAME="${BASE_NAME}.zip"
            CAPTION="📦 FINAL PART (Extract this file)"
          else
            PART_NUM_PADDED=$(printf "%02d" $PART_NUM)
            FILE_NAME="${BASE_NAME}.z${PART_NUM_PADDED}"
            CAPTION="📦 Missing Part ${PART_NUM}"
          fi
          
          RAW_URL="https://raw.githubusercontent.com/${REPO}/${BRANCH_NAME}/${FILE_NAME}"
          
          echo "Downloading: $FILE_NAME"
          curl -L -o "$FILE_NAME" "$RAW_URL"
          
          if [ ! -f "$FILE_NAME" ]; then
            echo "ERROR: Failed to download $FILE_NAME"
            exit 1
          fi
          
          SIZE=$(stat -c%s "$FILE_NAME")
          SIZE_MB=$((SIZE / 1024 / 1024))
          
          curl -s -X POST "https://tapi.bale.ai/bot${TOKEN}/sendDocument" \
            -F "chat_id=${CHAT_ID}" \
            -F "document=@${FILE_NAME}" \
            -F "caption=${CAPTION} | ${SIZE_MB} MB"
          
          curl -s -X POST "https://tapi.bale.ai/bot${TOKEN}/sendMessage" \
            -d "chat_id=${CHAT_ID}" \
            -d "text=✅ ${FILE_NAME} sent!"