name: Wget Downloader V2

on:
  workflow_dispatch:
    inputs:
      link:
        description: '🔗 Direct Link'
        required: true
        type: string
      use_warp:
        description: '🛡️ Use WARP (sometimes helps | +40s)'
        required: true
        default: false
        type: boolean
      parts_size:
        description: '🫙 Parts size (MB)'
        required: false
        type: string
        default: '45'

jobs:
  download-and-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 0

      - name: Prepare wget branch
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git fetch origin

          if git ls-remote --exit-code --heads origin wget; then
            git checkout wget
            git pull origin wget
          else
            git checkout --orphan wget
            git rm -rf . || true
            mkdir -p wget
            git commit --allow-empty -m "[bot] Initialize wget branch"
            git push --set-upstream origin wget
          fi

      - name: Setup WARP
        if: ${{ inputs.use_warp }}
        run: |
          docker rm -f warp 2>/dev/null || true
          docker network create warp-net 2>/dev/null || true

          docker run -d \
            --name warp \
            --restart=always \
            --network warp-net \
            -p 1080:1080 \
            --cap-add NET_ADMIN \
            --sysctl net.ipv6.conf.all.disable_ipv6=0 \
            --sysctl net.ipv4.conf.all.src_valid_mark=1 \
            -v warp-data:/var/lib/cloudflare-warp \
            caomingjun/warp

          echo "Waiting for WARP to initialize..."

          WARP_READY=false
          for i in {1..10}; do
            RESULT=$(curl -s --max-time 3 --socks5-hostname 127.0.0.1:1080 https://1.1.1.1/cdn-cgi/trace 2>/dev/null || true)
            
            if echo "$RESULT" | grep -qE "warp=(on|plus)"; then
              echo "WARP proxy is ready! (Took $i attempts)"
              echo "$RESULT" | grep -E "^(ip|warp|colo)="
              WARP_READY=true
              break
            fi
            
            echo "Attempt $i/10 - WARP not ready, waiting 3s..."
            sleep 3
          done

          if [ "$WARP_READY" = false ]; then
            echo "WARP failed to activate fully, continuing anyway..."
            echo "Last response: $RESULT"
          fi

      - name: Download
        id: download
        run: |
          mkdir -p tmpwget
          cd tmpwget
          
          if [ ${{ inputs.use_warp }} == 'true' ]; then
            echo "Using WARP proxy..."
            export http_proxy=socks5h://127.0.0.1:1080
          fi

          wget --content-disposition --trust-server-names "${{ github.event.inputs.link }}"

          # find name
          FILE=$(ls -1 | head -n 1)
          FILE_NO_EXTENSION="${FILE%.*}"
          SAFE_NAME=$(echo "$FILE" | sed 's/[^a-zA-Z0-9]/_/g' | tr -s '_' | sed 's/^_//;s/_$//')
          echo "SAFE_NAME=$SAFE_NAME" >> $GITHUB_ENV

          # zip
          mkdir -p ../wget
          zip -0 -s "${{ inputs.parts_size }}m" "../wget/${SAFE_NAME}.zip" "$FILE"

      - name: Stop WARP
        if: ${{ inputs.use_warp }}
        run: |
          docker stop warp || true

      - name: Generate README with Download Links
        run: |
          rm -f README.md
          
          echo "# 📥 Wget Download Links" > README.md
          echo "Generated on: $(date)" >> README.md
          echo "" >> README.md
          
          for file in wget/*; do
            if [ -f "$file" ]; then
              filename=$(basename "$file")
              encoded_filename=$(python3 -c "import urllib.parse, sys; print(urllib.parse.quote(sys.argv[1]))" "$filename")
              url="https://github.com/${{ github.repository }}/raw/wget/wget/$encoded_filename"
              echo "- [Download $filename]($url)" >> README.md
            fi
          done
          
      # ============================================
      # FIXED: Commit and Push in Batches of 5
      # (Adapted from video-downloader-2.yml)
      # ============================================
      - name: Commit and Push in Batches of 5
        run: |
          # Add README first (always included)
          git add README.md
          
          # Store list of files in a temporary file
          ls wget/* 2>/dev/null > file_list.txt || true
          
          # Count total files
          TOTAL_FILES=$(cat file_list.txt | wc -l)
          echo "Total files to commit: $TOTAL_FILES"
          
          if [ "$TOTAL_FILES" -eq 0 ]; then
            echo "No files to commit besides README"
            git commit -m "[bot] Update README.md only"
            git push
            echo "✅ README committed and pushed"
            exit 0
          fi
          
          # Set batch size (5 files per commit)
          BATCH_SIZE=5
          BATCH_NUM=1
          
          # Process files in batches
          while [ $(cat file_list.txt | wc -l) -gt 0 ]; do
            # Take first BATCH_SIZE files
            BATCH_FILES=$(head -n $BATCH_SIZE file_list.txt)
            
            # Remove these files from the list for next iteration
            tail -n +$((BATCH_SIZE + 1)) file_list.txt > temp_list.txt 2>/dev/null || touch temp_list.txt
            mv temp_list.txt file_list.txt
            
            # Add this batch of files
            for file in $BATCH_FILES; do
              if [ -f "$file" ]; then
                git add "$file"
              fi
            done
            
            # Commit this batch
            git commit -m "[bot] Add wget files batch $BATCH_NUM ($(echo $BATCH_FILES | wc -w) files)"
            
            # Push after each batch
            git push
            
            echo "✅ Batch $BATCH_NUM committed and pushed"
            BATCH_NUM=$((BATCH_NUM + 1))
            
            # Small delay to avoid overwhelming GitHub
            sleep 2
          done
          
          echo "✅ All $TOTAL_FILES files committed and pushed in batches"
          rm -f file_list.txt temp_list.txt