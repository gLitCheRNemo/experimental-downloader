name: 3- Branch Remover + Cleaner

on:
  workflow_dispatch:
    inputs:
      branch_names:
        description: 'Branch names to delete (space-separated, e.g., videos md-parts wget)'
        required: true
        type: string
      confirm_deletion:
        description: 'Type "DELETE" to confirm you want to remove these branches'
        required: true
        type: string
      size_limit:
        description: '📏 Size limit in MB (files larger than this will be removed from history)'
        required: false
        default: '10'
        type: string

permissions:
  contents: write

jobs:
  # ============================================
  # JOB 1: Delete multiple branches
  # ============================================
  delete-branches:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate and delete branches
        id: validate
        run: |
          BRANCHES_INPUT="${{ github.event.inputs.branch_names }}"
          CONFIRM="${{ github.event.inputs.confirm_deletion }}"
          
          echo "========================================"
          echo "🔍 Validating deletion request"
          echo "========================================"
          echo "Requested branches: $BRANCHES_INPUT"
          echo ""
          
          # SAFETY CHECK 1: Verify confirmation text
          if [ "$CONFIRM" != "DELETE" ]; then
            echo "❌ ERROR: Confirmation text does not match."
            echo "   Please type exactly 'DELETE' in the confirmation field."
            exit 1
          fi
          
          # Convert space-separated input to array
          BRANCHES=($BRANCHES_INPUT)
          VALID_BRANCHES=""
          FAILED_BRANCHES=""
          
          git fetch origin
          
          for BRANCH in "${BRANCHES[@]}"; do
            echo ""
            echo "Checking branch: $BRANCH"
            
            # SAFETY CHECK 2: Refuse to delete main/master branch
            if [ "$BRANCH" = "main" ] || [ "$BRANCH" = "master" ]; then
              echo "  ❌ ERROR: Cannot delete the default branch '$BRANCH'"
              FAILED_BRANCHES="$FAILED_BRANCHES $BRANCH"
              continue
            fi
            
            # SAFETY CHECK 3: Verify the branch actually exists
            if git ls-remote --exit-code --heads origin "$BRANCH" > /dev/null 2>&1; then
              echo "  ✅ Branch '$BRANCH' exists and can be deleted"
              VALID_BRANCHES="$VALID_BRANCHES $BRANCH"
            else
              echo "  ❌ Branch '$BRANCH' does not exist"
              FAILED_BRANCHES="$FAILED_BRANCHES $BRANCH"
            fi
          done
          
          echo ""
          echo "========================================"
          echo "Validation summary:"
          echo "========================================"
          echo "Valid branches to delete:${VALID_BRANCHES:- none}"
          echo "Failed branches (skipped):${FAILED_BRANCHES:- none}"
          echo ""
          
          if [ -z "$VALID_BRANCHES" ]; then
            echo "❌ No valid branches to delete. Exiting."
            exit 1
          fi
          
          echo "VALID_BRANCHES=$VALID_BRANCHES" >> $GITHUB_OUTPUT

      - name: Delete each valid branch
        if: success() && steps.validate.outputs.VALID_BRANCHES != ''
        run: |
          BRANCHES="${{ steps.validate.outputs.VALID_BRANCHES }}"
          
          for BRANCH in $BRANCHES; do
            echo "========================================"
            echo "Deleting branch: $BRANCH"
            echo "========================================"
            
            git push origin --delete "$BRANCH"
            
            if [ $? -eq 0 ]; then
              echo "✅ Branch '$BRANCH' deleted successfully"
            else
              echo "❌ Failed to delete branch '$BRANCH'"
            fi
            echo ""
          done

      - name: Success message
        if: success()
        run: |
          echo "========================================"
          echo "✅ Branch deletion completed!"
          echo "========================================"
          echo ""
          echo "The following branches were deleted: ${{ steps.validate.outputs.VALID_BRANCHES }}"
          echo ""
          echo "Raw file links (raw.githubusercontent.com) will now return 404 errors for these branches."

      - name: Failure message (if validation failed)
        if: failure() && steps.validate.outcome == 'failure'
        run: |
          echo "========================================"
          echo "❌ Branch deletion failed"
          echo "========================================"
          echo ""
          echo "Possible reasons:"
          echo "  - You didn't type 'DELETE' in the confirmation field"
          echo "  - No valid branches were found to delete"
          echo ""
          echo "No changes were made to your repository."

  # ============================================
  # JOB 2: Clear hidden storage (always runs)
  # ============================================
  check-status:
    name: 📊 Check Repository Status
    needs: delete-branches
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Fetch full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 📊 Show repository status summary
        run: |
          SIZE_LIMIT="${{ github.event.inputs.size_limit }}"
          SIZE_LIMIT_BYTES=$((SIZE_LIMIT * 1024 * 1024))
          
          echo "## 📊 Repository Status Before Cleaning" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### ⚙️ Settings" >> $GITHUB_STEP_SUMMARY
          echo "| Setting | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|---------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| Size limit | ${SIZE_LIMIT} MB |" >> $GITHUB_STEP_SUMMARY
          echo "| Files larger than ${SIZE_LIMIT}MB will be removed | ✅ |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          echo "### 📦 Repository Size" >> $GITHUB_STEP_SUMMARY
          echo "| Item | Size |" >> $GITHUB_STEP_SUMMARY
          echo "|------|------|" >> $GITHUB_STEP_SUMMARY
          echo "| .git folder | $(du -sh .git | cut -f1) |" >> $GITHUB_STEP_SUMMARY
          echo "| Objects | $(du -sh .git/objects | cut -f1) |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          echo "### 🔢 Number of Commits" >> $GITHUB_STEP_SUMMARY
          echo "**$(git rev-list --count HEAD)** commits" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          echo "### 📁 Files larger than ${SIZE_LIMIT}MB in history" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          git rev-list --objects --all | \
            git cat-file --batch-check='%(objecttype) %(objectname) %(objectsize) %(rest)' | \
            sed -n 's/^blob //p' | \
            awk -v LIMIT=$SIZE_LIMIT_BYTES '$2 >= LIMIT { print $3, int($2/1048576) "MB" }' | \
            sort -k2 -rn | head -20 >> $GITHUB_STEP_SUMMARY || echo "No files found ✅" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

  clean-history:
    name: 🗑️ Clean Repository History
    needs: check-status
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Fetch full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: ⚙️ Install git-filter-repo
        run: pip install git-filter-repo

      - name: 🧹 Remove files larger than selected size from history
        run: |
          SIZE_LIMIT="${{ github.event.inputs.size_limit }}"
          echo "Removing files larger than ${SIZE_LIMIT}MB from history..."
          git filter-repo --strip-blobs-bigger-than ${SIZE_LIMIT}M --force

      - name: 🚀 Push changes to repository
        run: |
          git remote add origin https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git
          git push --force --all
          git push --force --tags

      - name: ✅ Show final result
        run: |
          echo "## ✅ Cleaning completed successfully!" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### ⚙️ Settings used" >> $GITHUB_STEP_SUMMARY
          echo "| Setting | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|---------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| Size limit | ${{ github.event.inputs.size_limit }} MB |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 📏 New repository size" >> $GITHUB_STEP_SUMMARY
          echo "| Item | Size |" >> $GITHUB_STEP_SUMMARY
          echo "|------|------|" >> $GITHUB_STEP_SUMMARY
          echo "| .git folder | $(du -sh .git | cut -f1) |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "🎉 All files larger than ${{ github.event.inputs.size_limit }}MB have been removed from history!" >> $GITHUB_STEP_SUMMARY