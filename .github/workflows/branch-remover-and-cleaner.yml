name: 3- Branch Remover + Cleaner

on:
  workflow_dispatch:
    inputs:
      branch_names:
        description: 'Branch names to delete (space-separated, e.g., videos md-parts wget)'
        required: true
        type: string
      confirm_deletion:
        description: 'Type "DELETE" to confirm you want to remove these branches'
        required: true
        type: string
      size_limit:
        description: '📏 Size limit in MB (files larger than this will be removed from history)'
        required: false
        default: '10'
        type: string

permissions:
  contents: write

jobs:
  # ============================================
  # JOB 1: Calculate branch sizes before deletion
  # ============================================
  calculate-branch-sizes:
    runs-on: ubuntu-latest
    outputs:
      branch_sizes: ${{ steps.calc.outputs.branch_sizes }}
      total_branch_size_bytes: ${{ steps.calc.outputs.total_branch_size_bytes }}
      total_branch_size_human: ${{ steps.calc.outputs.total_branch_size_human }}
      branch_names: ${{ steps.calc.outputs.branch_names }}
    steps:
      - name: Calculate branch sizes
        id: calc
        run: |
          BRANCHES_INPUT="${{ inputs.branch_names }}"
          BRANCHES=($BRANCHES_INPUT)
          TOTAL_SIZE=0
          BRANCH_SIZES=""
          
          for BRANCH in "${BRANCHES[@]}"; do
            echo "Calculating size for branch: $BRANCH"
            
            # Clone only the specific branch to calculate its size
            git clone --depth 1 --branch "$BRANCH" "https://github.com/${{ github.repository }}.git" "temp_${BRANCH}"
            cd "temp_${BRANCH}"
            
            # Calculate size of the branch (excluding .git)
            BRANCH_SIZE=$(du -sb . | cut -f1)
            TOTAL_SIZE=$((TOTAL_SIZE + BRANCH_SIZE))
            
            # Convert to human-readable
            if [ $BRANCH_SIZE -gt 1073741824 ]; then
              SIZE_HR=$(echo "scale=2; $BRANCH_SIZE / 1073741824" | bc)
              SIZE_HR="${SIZE_HR} GB"
            elif [ $BRANCH_SIZE -gt 1048576 ]; then
              SIZE_HR=$(echo "scale=2; $BRANCH_SIZE / 1048576" | bc)
              SIZE_HR="${SIZE_HR} MB"
            else
              SIZE_HR=$(echo "scale=2; $BRANCH_SIZE / 1024" | bc)
              SIZE_HR="${SIZE_HR} KB"
            fi
            
            BRANCH_SIZES="${BRANCH_SIZES}${BRANCH}: ${SIZE_HR}%0A"
            
            cd ..
            rm -rf "temp_${BRANCH}"
          done
          
          # Convert total size to human-readable
          if [ $TOTAL_SIZE -gt 1073741824 ]; then
            TOTAL_HR=$(echo "scale=2; $TOTAL_SIZE / 1073741824" | bc)
            TOTAL_HR="${TOTAL_HR} GB"
          elif [ $TOTAL_SIZE -gt 1048576 ]; then
            TOTAL_HR=$(echo "scale=2; $TOTAL_SIZE / 1048576" | bc)
            TOTAL_HR="${TOTAL_HR} MB"
          else
            TOTAL_HR=$(echo "scale=2; $TOTAL_SIZE / 1024" | bc)
            TOTAL_HR="${TOTAL_HR} KB"
          fi
          
          echo "branch_sizes=$BRANCH_SIZES" >> $GITHUB_OUTPUT
          echo "total_branch_size_bytes=$TOTAL_SIZE" >> $GITHUB_OUTPUT
          echo "total_branch_size_human=$TOTAL_HR" >> $GITHUB_OUTPUT
          echo "branch_names=$BRANCHES_INPUT" >> $GITHUB_OUTPUT

  # ============================================
  # JOB 2: Delete multiple branches
  # ============================================
  delete-branches:
    runs-on: ubuntu-latest
    needs: calculate-branch-sizes
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate and delete branches
        id: validate
        run: |
          BRANCHES_INPUT="${{ inputs.branch_names }}"
          CONFIRM="${{ github.event.inputs.confirm_deletion }}"
          
          echo "========================================"
          echo "🔍 Validating deletion request"
          echo "========================================"
          echo "Requested branches: $BRANCHES_INPUT"
          echo ""
          
          if [ "$CONFIRM" != "DELETE" ]; then
            echo "❌ ERROR: Confirmation text does not match."
            exit 1
          fi
          
          BRANCHES=($BRANCHES_INPUT)
          VALID_BRANCHES=""
          
          git fetch origin
          
          for BRANCH in "${BRANCHES[@]}"; do
            if [ "$BRANCH" = "main" ] || [ "$BRANCH" = "master" ]; then
              echo "❌ Cannot delete default branch: $BRANCH"
              continue
            fi
            
            if git ls-remote --exit-code --heads origin "$BRANCH" > /dev/null 2>&1; then
              VALID_BRANCHES="$VALID_BRANCHES $BRANCH"
            else
              echo "❌ Branch does not exist: $BRANCH"
            fi
          done
          
          echo "VALID_BRANCHES=$VALID_BRANCHES" >> $GITHUB_OUTPUT

      - name: Delete branches
        if: success() && steps.validate.outputs.VALID_BRANCHES != ''
        run: |
          for BRANCH in ${{ steps.validate.outputs.VALID_BRANCHES }}; do
            git push origin --delete "$BRANCH"
            echo "✅ Deleted branch: $BRANCH"
          done

  # ============================================
  # JOB 3: Clear hidden storage and calculate sizes
  # ============================================
  clean-and-report:
    runs-on: ubuntu-latest
    needs: [calculate-branch-sizes, delete-branches]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Calculate hidden storage BEFORE cleaning
        id: before_hidden
        run: |
          HIDDEN_BYTES=$(du -sb .git/objects | cut -f1)
          echo "hidden_bytes=$HIDDEN_BYTES" >> $GITHUB_OUTPUT
          
          if [ $HIDDEN_BYTES -gt 1073741824 ]; then
            HIDDEN_HR=$(echo "scale=2; $HIDDEN_BYTES / 1073741824" | bc)
            echo "hidden_human=${HIDDEN_HR} GB" >> $GITHUB_OUTPUT
          elif [ $HIDDEN_BYTES -gt 1048576 ]; then
            HIDDEN_MB=$(echo "scale=2; $HIDDEN_BYTES / 1048576" | bc)
            echo "hidden_human=${HIDDEN_MB} MB" >> $GITHUB_OUTPUT
          else
            HIDDEN_KB=$(echo "scale=2; $HIDDEN_BYTES / 1024" | bc)
            echo "hidden_human=${HIDDEN_KB} KB" >> $GITHUB_OUTPUT
          fi

      - name: Install git-filter-repo
        run: pip install git-filter-repo

      - name: Remove files larger than size limit from history
        run: |
          SIZE_LIMIT="${{ inputs.size_limit }}"
          git filter-repo --strip-blobs-bigger-than ${SIZE_LIMIT}M --force

      - name: Push cleaned history
        run: |
          git remote add origin https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git
          git push --force --all
          git push --force --tags

      - name: Calculate hidden storage AFTER cleaning
        id: after_hidden
        run: |
          HIDDEN_BYTES=$(du -sb .git/objects | cut -f1)
          echo "hidden_bytes=$HIDDEN_BYTES" >> $GITHUB_OUTPUT
          
          if [ $HIDDEN_BYTES -gt 1073741824 ]; then
            HIDDEN_HR=$(echo "scale=2; $HIDDEN_BYTES / 1073741824" | bc)
            echo "hidden_human=${HIDDEN_HR} GB" >> $GITHUB_OUTPUT
          elif [ $HIDDEN_BYTES -gt 1048576 ]; then
            HIDDEN_MB=$(echo "scale=2; $HIDDEN_BYTES / 1048576" | bc)
            echo "hidden_human=${HIDDEN_MB} MB" >> $GITHUB_OUTPUT
          else
            HIDDEN_KB=$(echo "scale=2; $HIDDEN_BYTES / 1024" | bc)
            echo "hidden_human=${HIDDEN_KB} KB" >> $GITHUB_OUTPUT
          fi

      - name: Calculate hidden storage removed
        id: removed_hidden
        run: |
          BEFORE=${{ steps.before_hidden.outputs.hidden_bytes }}
          AFTER=${{ steps.after_hidden.outputs.hidden_bytes }}
          REMOVED=$((BEFORE - AFTER))
          echo "removed_bytes=$REMOVED" >> $GITHUB_OUTPUT
          
          if [ $REMOVED -gt 1073741824 ]; then
            REMOVED_HR=$(echo "scale=2; $REMOVED / 1073741824" | bc)
            echo "removed_human=${REMOVED_HR} GB" >> $GITHUB_OUTPUT
          elif [ $REMOVED -gt 1048576 ]; then
            REMOVED_MB=$(echo "scale=2; $REMOVED / 1048576" | bc)
            echo "removed_human=${REMOVED_MB} MB" >> $GITHUB_OUTPUT
          else
            REMOVED_KB=$(echo "scale=2; $REMOVED / 1024" | bc)
            echo "removed_human=${REMOVED_KB} KB" >> $GITHUB_OUTPUT
          fi

      - name: Send report to Bale bot
        run: |
          TOKEN="${{ secrets.BALE_TOKEN }}"
          CHAT_ID="${{ secrets.BALE_CHAT_ID }}"
          BRANCH_NAMES="${{ needs.calculate-branch-sizes.outputs.branch_names }}"
          BRANCH_SIZES="${{ needs.calculate-branch-sizes.outputs.branch_sizes }}"
          TOTAL_BRANCH_SIZE="${{ needs.calculate-branch-sizes.outputs.total_branch_size_human }}"
          HIDDEN_BEFORE="${{ steps.before_hidden.outputs.hidden_human }}"
          HIDDEN_AFTER="${{ steps.after_hidden.outputs.hidden_human }}"
          HIDDEN_REMOVED="${{ steps.removed_hidden.outputs.removed_human }}"
          SIZE_LIMIT="${{ inputs.size_limit }}"
          
          MESSAGE="🧹 **CLEANUP REPORT** 🧹%0A%0A"
          MESSAGE="${MESSAGE}📂 **Deleted Branches:** ${BRANCH_NAMES}%0A"
          MESSAGE="${MESSAGE}📊 **Total branch size removed:** ${TOTAL_BRANCH_SIZE}%0A%0A"
          MESSAGE="${MESSAGE}🗄️ **Hidden Storage (before):** ${HIDDEN_BEFORE}%0A"
          MESSAGE="${MESSAGE}🗑️ **Hidden Storage removed:** ${HIDDEN_REMOVED}%0A"
          MESSAGE="${MESSAGE}✨ **Hidden Storage (now):** ${HIDDEN_AFTER}%0A%0A"
          MESSAGE="${MESSAGE}⚙️ **Size limit:** ${SIZE_LIMIT} MB%0A"
          MESSAGE="${MESSAGE}✅ All files larger than ${SIZE_LIMIT}MB removed from history"
          
          curl -s -X POST "https://tapi.bale.ai/bot${TOKEN}/sendMessage" \
            -d "chat_id=${CHAT_ID}" \
            -d "text=${MESSAGE}"

      - name: Show summary in GitHub
        run: |
          echo "## ✅ Cleaning completed successfully!" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 📂 Deleted Branches" >> $GITHUB_STEP_SUMMARY
          echo "**${{ needs.calculate-branch-sizes.outputs.branch_names }}**" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 📊 Size Report" >> $GITHUB_STEP_SUMMARY
          echo "| Item | Size |" >> $GITHUB_STEP_SUMMARY
          echo "|------|------|" >> $GITHUB_STEP_SUMMARY
          echo "| Branches removed | ${{ needs.calculate-branch-sizes.outputs.total_branch_size_human }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Hidden storage (before) | ${{ steps.before_hidden.outputs.hidden_human }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Hidden storage removed | ${{ steps.removed_hidden.outputs.removed_human }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Hidden storage (now) | ${{ steps.after_hidden.outputs.hidden_human }} |" >> $GITHUB_STEP_SUMMARY