name: 3- MD Bot - Cleanup

on:
  workflow_dispatch:

jobs:
  cleanup:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Delete md-parts branch
        run: |
          BRANCH_NAME="md-parts"
          echo "Deleting branch: $BRANCH_NAME"
          
          if git ls-remote --exit-code --heads origin "$BRANCH_NAME"; then
            git push origin --delete "$BRANCH_NAME"
            echo "✅ Branch $BRANCH_NAME deleted. Storage freed."
          else
            echo "⚠️ Branch $BRANCH_NAME does not exist or was already deleted."
          fi