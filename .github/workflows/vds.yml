name: 1- Video Downloader & Sender

on:
  workflow_dispatch:
    inputs:
      youtube_url:
        description: '🔗 YouTube video or playlist URL'
        required: true
        type: string
      quality:
        description: '🎬 Video quality'
        required: true
        default: 'best'
        type: choice
        options:
          - best
          - 2160
          - 1440
          - 1080
          - 720
          - 480
          - audio
      playlist_items:
        description: '📋 Playlist items to download (e.g., 1-10, 5, 3-19). Leave empty for all. For single video, leave empty too.'
        required: false
        type: string
        default: ''
      parts_size:
        description: '🫙 Parts size (MB)'
        required: false
        type: string
        default: '45'
      bale_token:
        description: '🤖 Bale Bot Token (for sending files)'
        required: true
        type: string
      bale_chat_id:
        description: '💬 Bale Chat ID (for sending files)'
        required: true
        type: string

jobs:
  # ============================================
  # JOB 1: Download YouTube videos/playlist and create READMEs
  # ============================================
  download-and-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Mask sensitive inputs
        run: |
          echo "::add-mask::${{ inputs.bale_token }}"
          echo "::add-mask::${{ inputs.bale_chat_id }}"
          echo "✅ Sensitive inputs masked"

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 0

      - name: Prepare videos branch
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git fetch origin

          if git ls-remote --exit-code --heads origin videos; then
            git checkout videos
            git pull origin videos
          else
            git checkout --orphan videos
            git rm -rf . || true
            git commit --allow-empty -m "[bot] Initialize videos branch"
            git push --set-upstream origin videos
          fi

      - name: Setup FFmpeg
        run: |
          wget https://github.com/yt-dlp/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-linux64-gpl.tar.xz
          tar -xf ffmpeg-master-latest-linux64-gpl.tar.xz
          sudo mv ffmpeg-master-latest-linux64-gpl/bin/ffmpeg /usr/local/bin/
          sudo mv ffmpeg-master-latest-linux64-gpl/bin/ffprobe /usr/local/bin/
          ffmpeg -version

      - name: Setup WARP
        run: |
          docker rm -f warp 2>/dev/null || true
          docker network create warp-net 2>/dev/null || true

          docker run -d \
            --name warp \
            --restart=always \
            --network warp-net \
            -p 1080:1080 \
            --cap-add NET_ADMIN \
            --sysctl net.ipv6.conf.all.disable_ipv6=0 \
            --sysctl net.ipv4.conf.all.src_valid_mark=1 \
            -v warp-data:/var/lib/cloudflare-warp \
            caomingjun/warp

          echo "Waiting for WARP to initialize..."

          WARP_READY=false
          for i in {1..10}; do
            RESULT=$(curl -s --max-time 3 --socks5-hostname 127.0.0.1:1080 https://cloudflare.com/cdn-cgi/trace 2>/dev/null || true)

            if echo "$RESULT" | grep -qE "warp=(on|plus)"; then
              echo "WARP proxy is ready! (Took $i attempts)"
              echo "$RESULT" | grep -E "^(ip|warp|colo)="
              WARP_READY=true
              break
            fi

            echo "Attempt $i/10 - WARP not ready, waiting 3s..."
            sleep 3
          done

          if [ "$WARP_READY" = false ]; then
            echo "WARP failed to activate fully, continuing anyway..."
            echo "Last response: $RESULT"
          fi

      - name: Setup yt-dlp
        run: |
          sudo apt-get install -y python3-pip curl
          pip install yt-dlp --pre

          curl -fsSL https://deno.land/install.sh | sh
          export DENO_INSTALL="$HOME/.deno"
          export PATH="$DENO_INSTALL/bin:$PATH"
          echo "$DENO_INSTALL/bin" >> $GITHUB_PATH
          deno --version

      # ============================================
      # STEP 1: Check if URL is a playlist and extract video IDs/titles
      # ============================================
      - name: Check if URL is a playlist and extract video data
        id: extract_playlist
        run: |
          URL="${{ inputs.youtube_url }}"
          PLAYLIST_ITEMS="${{ inputs.playlist_items }}"
          
          if [[ "$URL" == *"list="* ]] || [[ "$URL" == *"&list="* ]]; then
            echo "IS_PLAYLIST=true" >> $GITHUB_ENV
            echo "✅ Detected as playlist URL"
            
            if [ -n "$PLAYLIST_ITEMS" ]; then
              ITEMS_OPTION="--playlist-items $PLAYLIST_ITEMS"
              echo "Using playlist items: $PLAYLIST_ITEMS"
            else
              ITEMS_OPTION=""
              echo "Downloading entire playlist"
            fi
            
            echo "Extracting video IDs and titles from playlist..."
            yt-dlp --flat-playlist --print "%(id)s|%(playlist_index)04d|%(title)s" $ITEMS_OPTION "$URL" > video_data.txt
            
            VIDEO_COUNT=$(wc -l < video_data.txt)
            echo "VIDEO_COUNT=$VIDEO_COUNT" >> $GITHUB_ENV
            echo "Found $VIDEO_COUNT videos in playlist"
            
            echo "Extracted video data (with playlist index):"
            cat video_data.txt
            
          else
            echo "IS_PLAYLIST=false" >> $GITHUB_ENV
            echo "Single video URL detected"
          fi
          
          echo "$IS_PLAYLIST" > mode.txt

      # ============================================
      # STEP 2: Download videos (playlist or single)
      # ============================================
      - name: Download playlist videos
        id: download_playlist
        if: env.IS_PLAYLIST == 'true'
        run: |
          QUALITY="${{ inputs.quality }}"
          URL="${{ inputs.youtube_url }}"
          PLAYLIST_ITEMS="${{ inputs.playlist_items }}"
          
          if [ "$QUALITY" = "audio" ]; then
            FORMAT_OPTS="-f bestaudio --extract-audio --audio-format mp3"
          elif [ "$QUALITY" = "best" ]; then
            FORMAT_OPTS="-f bestvideo+bestaudio/best --merge-output-format mp4"
          else
            FORMAT_OPTS="-f bestvideo[height<=${QUALITY}]+bestaudio/best[height<=${QUALITY}] --merge-output-format mp4"
          fi
          
          mkdir -p tmpvideos
          cd tmpvideos
          
          # Use playlist index in filename for proper sorting
          if [ -n "$PLAYLIST_ITEMS" ]; then
            echo "Downloading playlist items: $PLAYLIST_ITEMS"
            yt-dlp --remote-components ejs:github --proxy "socks5://127.0.0.1:1080" \
              $FORMAT_OPTS \
              --playlist-items "$PLAYLIST_ITEMS" \
              --output "%(playlist_index)04d - %(title)s.%(ext)s" \
              "$URL"
          else
            echo "Downloading entire playlist"
            yt-dlp --remote-components ejs:github --proxy "socks5://127.0.0.1:1080" \
              $FORMAT_OPTS \
              --output "%(playlist_index)04d - %(title)s.%(ext)s" \
              "$URL"
          fi
          
          echo "Downloaded files:"
          ls -la
          
          cd ..

      - name: Download single video
        id: download_single
        if: env.IS_PLAYLIST == 'false'
        run: |
          QUALITY="${{ inputs.quality }}"
          URL="${{ inputs.youtube_url }}"
          
          if [ "$QUALITY" = "audio" ]; then
            FORMAT_OPTS="-f bestaudio --extract-audio --audio-format mp3"
          elif [ "$QUALITY" = "best" ]; then
            FORMAT_OPTS="-f bestvideo+bestaudio/best --merge-output-format mp4"
          else
            FORMAT_OPTS="-f bestvideo[height<=${QUALITY}]+bestaudio/best[height<=${QUALITY}] --merge-output-format mp4"
          fi
          
          mkdir -p tmpvideos
          cd tmpvideos
          yt-dlp --remote-components ejs:github --proxy "socks5://127.0.0.1:1080" \
            $FORMAT_OPTS \
            --output "%(title)s.%(ext)s" \
            "$URL"
          
          cd ..
          
          cd tmpvideos
          for f in *.mp4 *.mkv *.webm *.mp3 *.m4a; do
            if [ -f "$f" ]; then
              TITLE="${f%.*}"
              echo "|0001|${TITLE}" > ../video_data.txt
              break
            fi
          done
          cd ..
          
          echo "VIDEO_COUNT=1" >> $GITHUB_ENV

      # ============================================
      # STEP 3: Download thumbnails using extracted video IDs
      # ============================================
      - name: Download thumbnails from extracted video data
        run: |
          if [ ! -f "video_data.txt" ]; then
            echo "No video_data.txt found, skipping thumbnail download"
            exit 0
          fi
          
          echo "=========================================="
          echo "Downloading thumbnails using extracted video IDs"
          echo "=========================================="
          
          mkdir -p thumbnails_temp
          
          VIDEO_NUM=1
          while IFS='|' read -r VIDEO_ID PLAYLIST_IDX VIDEO_TITLE; do
            if [ -z "$VIDEO_ID" ]; then
              continue
            fi
            
            echo "Processing video $VIDEO_NUM: $VIDEO_TITLE (ID: $VIDEO_ID, Index: $PLAYLIST_IDX)"
            
            SAFE_NAME=$(echo "$VIDEO_TITLE" | sed 's/[^a-zA-Z0-9]/_/g' | tr -s '_' | sed 's/^_//;s/_$//')
            if [ -z "$SAFE_NAME" ]; then
              SAFE_NAME="video_$VIDEO_NUM"
            fi
            
            # Prepend playlist index for proper sorting
            SAFE_NAME="${PLAYLIST_IDX}_${SAFE_NAME}"
            
            mkdir -p "thumbnails_temp/$SAFE_NAME"
            
            THUMBNAIL_DOWNLOADED=false
            
            if wget -q --timeout=10 "https://img.youtube.com/vi/${VIDEO_ID}/maxresdefault.jpg" -O "thumbnails_temp/${SAFE_NAME}/thumbnail.jpg" 2>/dev/null; then
              if [ -f "thumbnails_temp/${SAFE_NAME}/thumbnail.jpg" ] && [ $(stat -c%s "thumbnails_temp/${SAFE_NAME}/thumbnail.jpg") -gt 10000 ]; then
                THUMBNAIL_DOWNLOADED=true
                echo "  ✅ Downloaded maxresdefault.jpg"
              else
                rm -f "thumbnails_temp/${SAFE_NAME}/thumbnail.jpg"
              fi
            fi
            
            if [ "$THUMBNAIL_DOWNLOADED" = false ]; then
              if wget -q --timeout=10 "https://img.youtube.com/vi/${VIDEO_ID}/sddefault.jpg" -O "thumbnails_temp/${SAFE_NAME}/thumbnail.jpg" 2>/dev/null; then
                if [ -f "thumbnails_temp/${SAFE_NAME}/thumbnail.jpg" ] && [ $(stat -c%s "thumbnails_temp/${SAFE_NAME}/thumbnail.jpg") -gt 5000 ]; then
                  THUMBNAIL_DOWNLOADED=true
                  echo "  ✅ Downloaded sddefault.jpg"
                else
                  rm -f "thumbnails_temp/${SAFE_NAME}/thumbnail.jpg"
                fi
              fi
            fi
            
            if [ "$THUMBNAIL_DOWNLOADED" = false ]; then
              if wget -q --timeout=10 "https://img.youtube.com/vi/${VIDEO_ID}/hqdefault.jpg" -O "thumbnails_temp/${SAFE_NAME}/thumbnail.jpg" 2>/dev/null; then
                if [ -f "thumbnails_temp/${SAFE_NAME}/thumbnail.jpg" ] && [ $(stat -c%s "thumbnails_temp/${SAFE_NAME}/thumbnail.jpg") -gt 2000 ]; then
                  THUMBNAIL_DOWNLOADED=true
                  echo "  ✅ Downloaded hqdefault.jpg"
                else
                  rm -f "thumbnails_temp/${SAFE_NAME}/thumbnail.jpg"
                fi
              fi
            fi
            
            if [ "$THUMBNAIL_DOWNLOADED" = false ]; then
              echo "  ⚠️ Could not download thumbnail"
              touch "thumbnails_temp/${SAFE_NAME}/thumbnail.jpg"
            fi
            
            echo "${SAFE_NAME}|${VIDEO_TITLE}|${VIDEO_ID}" >> video_folder_map.txt
            
            VIDEO_NUM=$((VIDEO_NUM + 1))
          done < video_data.txt
          
          echo "✅ Thumbnail download complete"

      # ============================================
      # STEP 4: Process each video (split, move thumbnails, create READMEs)
      # ============================================
      - name: Process each video
        id: process
        run: |
          cd tmpvideos
          
          # Get list of video files and sort numerically by the playlist index prefix
          VIDEO_FILES=()
          
          # Use version sort which handles numbers naturally
          VIDEO_FILES=($(ls -1 *.mp4 *.mkv *.webm *.mp3 *.m4a 2>/dev/null | sort -V))
          
          if [ ${#VIDEO_FILES[@]} -eq 0 ]; then
            echo "No video files found in tmpvideos!"
            ls -la
            exit 1
          fi
          
          TOTAL_VIDEOS=${#VIDEO_FILES[@]}
          echo "TOTAL_VIDEOS=$TOTAL_VIDEOS" >> $GITHUB_ENV
          echo "Found $TOTAL_VIDEOS video(s) to process"
          
          echo "Sorted video order (using version sort):"
          for i in "${!VIDEO_FILES[@]}"; do
            echo "  $((i+1)). ${VIDEO_FILES[$i]}"
          done
          
          README_NUM=1
          > ../video_info.txt
          
          for VIDEO_FILE in "${VIDEO_FILES[@]}"; do
            echo "=========================================="
            echo "Processing: $VIDEO_FILE"
            echo "=========================================="
            
            # Extract the playlist index if present (format: "0001 - title.mp4")
            PLAYLIST_IDX=""
            if [[ "$VIDEO_FILE" =~ ^([0-9]+)[[:space:]]*- ]]; then
              PLAYLIST_IDX="${BASH_REMATCH[1]}"
              # Remove the index prefix for the title
              VIDEO_TITLE="${VIDEO_FILE#* - }"
              VIDEO_TITLE="${VIDEO_TITLE%.*}"
            else
              VIDEO_TITLE="${VIDEO_FILE%.*}"
            fi
            
            echo "Video title: $VIDEO_TITLE"
            echo "Playlist index: ${PLAYLIST_IDX:-'none'}"
            
            SAFE_NAME=$(echo "$VIDEO_TITLE" | sed 's/[^a-zA-Z0-9]/_/g' | tr -s '_' | sed 's/^_//;s/_$//')
            
            # Prepend playlist index for proper sorting if available
            if [ -n "$PLAYLIST_IDX" ]; then
              VIDEO_FOLDER="${PLAYLIST_IDX}_${SAFE_NAME}"
            else
              VIDEO_FOLDER="$SAFE_NAME"
            fi
            
            mkdir -p "../$VIDEO_FOLDER"
            
            echo "Splitting video into ${SAFE_NAME}.zip parts..."
            zip -0 -s "${{ inputs.parts_size }}m" "../${VIDEO_FOLDER}/${SAFE_NAME}.zip" "$VIDEO_FILE"
            
            if [ $? -ne 0 ]; then
              echo "Failed to split $VIDEO_FILE"
              exit 1
            fi
            
            # Find matching thumbnail in thumbnails_temp
            for thumb_dir in ../thumbnails_temp/*; do
              if [ -d "$thumb_dir" ] && [[ "$thumb_dir" == *"${VIDEO_TITLE}"* ]] || [[ "$thumb_dir" == *"${SAFE_NAME}"* ]]; then
                if [ -f "$thumb_dir/thumbnail.jpg" ]; then
                  mv "$thumb_dir/thumbnail.jpg" "../${VIDEO_FOLDER}/thumbnail.jpg"
                  echo "✅ Moved thumbnail to ${VIDEO_FOLDER}/thumbnail.jpg"
                  break
                fi
              fi
            done
            
            # Generate README
            if [ $README_NUM -eq 1 ]; then
              README_NAME="README.md"
            else
              README_NAME="README${README_NUM}.md"
            fi
            
            echo "Creating README: $README_NAME"
            
            {
              echo "# 📥 Download Links - ${VIDEO_TITLE}"
              echo ""
              echo "Generated on: $(date)"
              echo ""
              echo "## Download Links"
              echo ""
            } > "../$README_NAME"
            
            # Add thumbnail link if it exists
            if [ -f "../${VIDEO_FOLDER}/thumbnail.jpg" ]; then
              encoded_thumb=$(python3 -c "import urllib.parse, sys; print(urllib.parse.quote(sys.argv[1]))" "thumbnail.jpg")
              thumb_url="https://github.com/${{ github.repository }}/raw/videos/${VIDEO_FOLDER}/$encoded_thumb"
              echo "- [Download Thumbnail]($thumb_url)" >> "../$README_NAME"
              echo "✅ Added thumbnail link to README"
            fi
            
            # Add links to split zip files - SORTED NUMERICALLY
            # This fixes the .z10 after .z99 issue
            ZIP_FILES=()
            for file in "../${VIDEO_FOLDER}"/*.z[0-9]* "../${VIDEO_FOLDER}"/*.zip; do
              if [ -f "$file" ]; then
                ZIP_FILES+=("$(basename "$file")")
              fi
            done
            
            # Sort zip files using version sort (handles .z2, .z10, .z100 correctly)
            IFS=$'\n' ZIP_FILES=($(sort -V <<<"${ZIP_FILES[*]}"))
            unset IFS
            
            for filename in "${ZIP_FILES[@]}"; do
              encoded_filename=$(python3 -c "import urllib.parse, sys; print(urllib.parse.quote(sys.argv[1]))" "$filename")
              url="https://github.com/${{ github.repository }}/raw/videos/${VIDEO_FOLDER}/$encoded_filename"
              echo "- [Download $filename]($url)" >> "../$README_NAME"
            done
            
            # Get video ID
            VIDEO_ID=""
            if [ "$IS_PLAYLIST" = "false" ]; then
              VIDEO_URL="${{ inputs.youtube_url }}"
              VIDEO_ID=$(echo "$VIDEO_URL" | grep -oP '(?<=v=)[^&]+|(?<=youtu\.be/)[^?]+|(?<=embed/)[^?]+|(?<=shorts/)[^?]+' | head -1)
            fi
            
            echo "${VIDEO_TITLE}|${VIDEO_ID}|${README_NAME}" >> ../video_info.txt
            
            README_NUM=$((README_NUM + 1))
          done
          
          cd ..

      # ============================================
      # STEP 5: Batch commit zip parts (5 files per commit)
      # ============================================
      - name: Batch commit zip parts
        run: |
          echo "Starting batch commits for all video folders"
          
          # Sort video folders numerically by their prefix (using version sort)
          VIDEO_FOLDERS=()
          for VIDEO_FOLDER in */; do
            VIDEO_FOLDER="${VIDEO_FOLDER%/}"
            if [ ! -d "$VIDEO_FOLDER" ]; then
              continue
            fi
            if [[ "$VIDEO_FOLDER" == README* ]]; then
              continue
            fi
            if [[ "$VIDEO_FOLDER" == thumbnails_temp* ]]; then
              continue
            fi
            VIDEO_FOLDERS+=("$VIDEO_FOLDER")
          done
          
          # Sort folders using version sort
          IFS=$'\n' VIDEO_FOLDERS=($(sort -V <<<"${VIDEO_FOLDERS[*]}"))
          unset IFS
          
          for VIDEO_FOLDER in "${VIDEO_FOLDERS[@]}"; do
            echo "Processing folder: $VIDEO_FOLDER"
            
            FILES=()
            for f in "$VIDEO_FOLDER"/*.z[0-9]* "$VIDEO_FOLDER"/*.zip; do
              if [ -f "$f" ]; then
                FILES+=("$f")
              fi
            done
            
            # Sort files using version sort for correct numerical order
            if [ ${#FILES[@]} -gt 0 ]; then
              IFS=$'\n' FILES=($(sort -V <<<"${FILES[*]}"))
              unset IFS
            fi
            
            if [ -f "$VIDEO_FOLDER/thumbnail.jpg" ]; then
              FILES+=("$VIDEO_FOLDER/thumbnail.jpg")
            fi
            
            if [ ${#FILES[@]} -eq 0 ]; then
              echo "No files found in $VIDEO_FOLDER"
              continue
            fi
            
            TOTAL_FILES=${#FILES[@]}
            echo "Found $TOTAL_FILES files to commit in $VIDEO_FOLDER"
            
            BATCH_SIZE=5
            BATCH_NUM=1
            BATCH_FILES=()
            
            for FILE in "${FILES[@]}"; do
              BATCH_FILES+=("$FILE")
              
              if [ ${#BATCH_FILES[@]} -ge $BATCH_SIZE ]; then
                echo "Committing batch $BATCH_NUM for $VIDEO_FOLDER"
                git add "${BATCH_FILES[@]}"
                git commit -m "[bot] Add ${VIDEO_FOLDER} batch $BATCH_NUM (${#BATCH_FILES[@]} files)"
                git push
                echo "Batch $BATCH_NUM committed and pushed"
                
                BATCH_FILES=()
                BATCH_NUM=$((BATCH_NUM + 1))
                sleep 2
              fi
            done
            
            if [ ${#BATCH_FILES[@]} -gt 0 ]; then
              echo "Committing final batch for $VIDEO_FOLDER"
              git add "${BATCH_FILES[@]}"
              git commit -m "[bot] Add ${VIDEO_FOLDER} final batch (${#BATCH_FILES[@]} files)"
              git push
              echo "Final batch committed and pushed"
              sleep 2
            fi
          done

      # ============================================
      # STEP 6: Batch commit README files
      # ============================================
      - name: Batch commit README files
        run: |
          echo "Committing README files in batches of 5"
          
          README_FILES=()
          for f in README*.md; do
            if [ -f "$f" ]; then
              README_FILES+=("$f")
            fi
          done
          
          if [ ${#README_FILES[@]} -eq 0 ]; then
            echo "No README files to commit"
            exit 0
          fi
          
          # Sort README files naturally (README.md, README2.md, README10.md, etc.)
          IFS=$'\n' README_FILES=($(sort -V <<<"${README_FILES[*]}"))
          unset IFS
          
          BATCH_SIZE=5
          BATCH_NUM=1
          BATCH_README=()
          
          for README in "${README_FILES[@]}"; do
            BATCH_README+=("$README")
            
            if [ ${#BATCH_README[@]} -ge $BATCH_SIZE ]; then
              echo "Committing README batch $BATCH_NUM"
              git add "${BATCH_README[@]}"
              git commit -m "[bot] Add READMEs batch $BATCH_NUM (${#BATCH_README[@]} files)"
              git push
              echo "README batch $BATCH_NUM committed and pushed"
              
              BATCH_README=()
              BATCH_NUM=$((BATCH_NUM + 1))
              sleep 2
            fi
          done
          
          if [ ${#BATCH_README[@]} -gt 0 ]; then
            echo "Committing final README batch"
            git add "${BATCH_README[@]}"
            git commit -m "[bot] Add READMEs final batch (${#BATCH_README[@]} files)"
            git push
            echo "Final README batch committed and pushed"
          fi

      # ============================================
      # STEP 7: Create master README for playlists
      # ============================================
      - name: Create master README
        if: env.IS_PLAYLIST == 'true'
        run: |
          if [ -f "video_info.txt" ] && [ "$(wc -l < video_info.txt)" -gt 1 ]; then
            echo "Creating master README..."
            
            echo "# 🎬 Playlist Download Complete" > MASTER_README.md
            echo "" >> MASTER_README.md
            echo "Generated on: $(date)" >> MASTER_README.md
            echo "" >> MASTER_README.md
            echo "## Downloaded Videos" >> MASTER_README.md
            echo "" >> MASTER_README.md
            
            README_NUM=1
            while IFS='|' read -r title video_id readme_name; do
              if [ $README_NUM -eq 1 ]; then
                echo "1. [${title}](./README.md)" >> MASTER_README.md
              else
                echo "${README_NUM}. [${title}](./${readme_name})" >> MASTER_README.md
              fi
              README_NUM=$((README_NUM + 1))
            done < video_info.txt
            
            git add MASTER_README.md
            git commit -m "[bot] Add master playlist README"
            git push
          fi
          
          if [ -f "video_info.txt" ]; then
            TOTAL_VIDEOS=$(wc -l < video_info.txt)
            echo "TOTAL_VIDEOS=$TOTAL_VIDEOS" >> $GITHUB_ENV
          fi
          
          docker stop warp || true

      # ============================================
      # STEP 8: Save artifacts for Job 2
      # ============================================
      - name: Save single video artifacts
        if: env.IS_PLAYLIST == 'false'
        run: |
          VIDEO_TITLE=""
          for f in tmpvideos/*.mp4 tmpvideos/*.mkv tmpvideos/*.webm tmpvideos/*.mp3 tmpvideos/*.m4a; do
            if [ -f "$f" ]; then
              VIDEO_TITLE=$(basename "$f" | sed 's/\.[^.]*$//')
              break
            fi
          done
          echo "$VIDEO_TITLE" > video_title.txt
          echo "README.md" > readme_name.txt
          
          SAFE_NAME=$(echo "$VIDEO_TITLE" | sed 's/[^a-zA-Z0-9]/_/g' | tr -s '_')
          echo "${SAFE_NAME}/thumbnail.jpg" > thumbnail_path.txt

      - name: Save mode artifact for Job 2
        run: |
          echo "${{ env.IS_PLAYLIST }}" > mode.txt

      - name: Upload mode artifact
        uses: actions/upload-artifact@v4
        with:
          name: mode-info
          path: mode.txt
          retention-days: 1

      - name: Upload single video artifacts
        if: env.IS_PLAYLIST == 'false'
        uses: actions/upload-artifact@v4
        with:
          name: single-video-info
          path: |
            video_title.txt
            readme_name.txt
            thumbnail_path.txt
          retention-days: 1

      - name: Upload playlist artifacts
        if: env.IS_PLAYLIST == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: playlist-info
          path: video_info.txt
          retention-days: 1

      - name: Cleanup temp folders
        run: |
          rm -rf tmpvideos thumbnails_temp

  # ============================================
  # JOB 2: Send files to Bale bot
  # ============================================
  send-to-bot:
    runs-on: ubuntu-latest
    needs: download-and-release
    if: always() && needs.download-and-release.result == 'success'

    steps:
      - name: Mask sensitive inputs
        run: |
          echo "::add-mask::${{ inputs.bale_token }}"
          echo "::add-mask::${{ inputs.bale_chat_id }}"

      - name: Download mode artifact
        uses: actions/download-artifact@v4
        with:
          name: mode-info
          path: .

      - name: Check if playlist or single from artifact
        id: check_mode
        run: |
          if [ -f "mode.txt" ]; then
            MODE=$(cat mode.txt)
            if [ "$MODE" = "true" ]; then
              echo "MODE=playlist" >> $GITHUB_ENV
              echo "Playlist mode detected from artifact"
            else
              echo "MODE=single" >> $GITHUB_ENV
              echo "Single video mode detected from artifact"
            fi
          else
            if [ -f "video_info.txt" ]; then
              echo "MODE=playlist" >> $GITHUB_ENV
            else
              echo "MODE=single" >> $GITHUB_ENV
            fi
          fi

      # ============================================
      # SINGLE VIDEO MODE
      # ============================================
      - name: Download single video artifacts
        if: env.MODE == 'single'
        uses: actions/download-artifact@v4
        with:
          name: single-video-info
          path: .

      - name: Get single video info
        if: env.MODE == 'single'
        run: |
          VIDEO_TITLE=$(cat video_title.txt)
          README_NAME=$(cat readme_name.txt)
          echo "VIDEO_TITLE=$VIDEO_TITLE" >> $GITHUB_ENV
          echo "README_NAME=$README_NAME" >> $GITHUB_ENV

      - name: Fetch README and send single video
        if: env.MODE == 'single'
        run: |
          README_FILE="${{ env.README_NAME }}"
          BRANCH_NAME="videos"
          REPO="${{ github.repository }}"
          
          README_URL="https://raw.githubusercontent.com/${REPO}/${BRANCH_NAME}/${README_FILE}"
          echo "Fetching README from: $README_URL"
          
          curl -L -o "$README_FILE" "$README_URL"
          
          grep -oE 'https://[^ )]+\.(z[0-9]+|zip)' "$README_FILE" | sort -V > extracted_links.txt
          
          LINK_COUNT=$(wc -l < extracted_links.txt)
          echo "LINK_COUNT=$LINK_COUNT" >> $GITHUB_ENV
          
          mkdir -p downloaded_files
          cd downloaded_files
          while IFS= read -r LINK; do
            wget --content-disposition --trust-server-names --max-redirect=5 "$LINK"
          done < ../extracted_links.txt
          cd ..
          
          TOKEN="${{ inputs.bale_token }}"
          CHAT_ID="${{ inputs.bale_chat_id }}"
          VIDEO_TITLE="${{ env.VIDEO_TITLE }}"
          QUALITY="${{ inputs.quality }}"
          
          if [ "$QUALITY" = "best" ]; then
            QUALITY_DISPLAY="Best"
          elif [ "$QUALITY" = "audio" ]; then
            QUALITY_DISPLAY="Audio Only"
          else
            QUALITY_DISPLAY="${QUALITY}p"
          fi
          
          THUMBNAIL_PATH=$(cat thumbnail_path.txt 2>/dev/null || echo "")
          if [ -f "$THUMBNAIL_PATH" ]; then
            cp "$THUMBNAIL_PATH" thumbnail.jpg
          fi
          
          if [ -f "thumbnail.jpg" ]; then
            CAPTION=$(printf "🎬 *%s*\n🎚️ Quality: %s\n\n📦 Found %s link(s)\n⬇️ Downloading and sending..." "$VIDEO_TITLE" "$QUALITY_DISPLAY" "$LINK_COUNT")
            curl -s -X POST "https://tapi.bale.ai/bot${TOKEN}/sendPhoto" \
              -F "chat_id=${CHAT_ID}" \
              -F "photo=@thumbnail.jpg" \
              -F "caption=${CAPTION}" \
              -F "parse_mode=Markdown"
          else
            curl -s -X POST "https://tapi.bale.ai/bot${TOKEN}/sendMessage" \
              -d "chat_id=${CHAT_ID}" \
              -d "text=🎬 *${VIDEO_TITLE}%0A🎚️ Quality: ${QUALITY_DISPLAY}%0A%0A📦 Found ${LINK_COUNT} link(s)%0A⬇️ Downloading and sending..." \
              -d "parse_mode=Markdown"
          fi
          
          cd downloaded_files
          for FILE in *; do
            if [ -f "$FILE" ] && [ -s "$FILE" ]; then
              SIZE=$(stat -c%s "$FILE")
              SIZE_MB=$((SIZE / 1024 / 1024))
              curl -s -X POST "https://tapi.bale.ai/bot${TOKEN}/sendDocument" \
                -F "chat_id=${CHAT_ID}" \
                -F "document=@${FILE}" \
                -F "caption=${FILE} | ${SIZE_MB}MB"
              sleep 1
            fi
          done
          cd ..
          
          curl -s -X POST "https://tapi.bale.ai/bot${TOKEN}/sendMessage" \
            -d "chat_id=${CHAT_ID}" \
            -d "text=✅ Done! Sent ${LINK_COUNT} file(s)."

      # ============================================
      # PLAYLIST MODE
      # ============================================
      - name: Download playlist artifacts
        if: env.MODE == 'playlist'
        uses: actions/download-artifact@v4
        with:
          name: playlist-info
          path: .

      - name: Process and send each video in playlist
        if: env.MODE == 'playlist'
        run: |
          TOKEN="${{ inputs.bale_token }}"
          CHAT_ID="${{ inputs.bale_chat_id }}"
          QUALITY="${{ inputs.quality }}"
          
          if [ "$QUALITY" = "best" ]; then
            QUALITY_DISPLAY="Best"
          elif [ "$QUALITY" = "audio" ]; then
            QUALITY_DISPLAY="Audio Only"
          else
            QUALITY_DISPLAY="${QUALITY}p"
          fi
          
          TOTAL_VIDEOS=$(wc -l < video_info.txt)
          
          VIDEO_NUM=1
          while IFS='|' read -r video_title video_id readme_name; do
            echo "Sending video $VIDEO_NUM: $video_title"
            
            README_URL="https://raw.githubusercontent.com/${{ github.repository }}/videos/${readme_name}"
            curl -L -o "$readme_name" "$README_URL"
            
            # Extract and sort links numerically
            grep -oE 'https://[^ )]+\.(z[0-9]+|zip)' "$readme_name" | sort -V > extracted_links.txt
            LINK_COUNT=$(wc -l < extracted_links.txt)
            
            SAFE_NAME=$(echo "$video_title" | sed 's/[^a-zA-Z0-9]/_/g' | tr -s '_' | sed 's/^_//;s/_$//')
            THUMBNAIL_URL="https://raw.githubusercontent.com/${{ github.repository }}/videos/${SAFE_NAME}/thumbnail.jpg"
            curl -L -o "thumbnail_${VIDEO_NUM}.jpg" "$THUMBNAIL_URL" 2>/dev/null || true
            
            mkdir -p "video_${VIDEO_NUM}"
            cd "video_${VIDEO_NUM}"
            
            LINK_NUM=1
            while IFS= read -r LINK; do
              echo "Downloading part $LINK_NUM of $LINK_COUNT"
              wget --content-disposition --trust-server-names --max-redirect=5 "$LINK"
              LINK_NUM=$((LINK_NUM + 1))
            done < ../extracted_links.txt
            
            if [ -f "../thumbnail_${VIDEO_NUM}.jpg" ] && [ -s "../thumbnail_${VIDEO_NUM}.jpg" ]; then
              CAPTION=$(printf "🎬 *%s*\n🎚️ Quality: %s\n\n📋 Video %s of %s\n📦 Found %s link(s)\n⬇️ Download complete!" "$video_title" "$QUALITY_DISPLAY" "$VIDEO_NUM" "$TOTAL_VIDEOS" "$LINK_COUNT")
              curl -s -X POST "https://tapi.bale.ai/bot${TOKEN}/sendPhoto" \
                -F "chat_id=${CHAT_ID}" \
                -F "photo=@../thumbnail_${VIDEO_NUM}.jpg" \
                -F "caption=${CAPTION}" \
                -F "parse_mode=Markdown"
            else
              TEXT_MSG=$(printf "🎬 *%s*\n🎚️ Quality: %s\n\n📋 Video %s of %s\n📦 Found %s link(s)\n⬇️ Download complete!" "$video_title" "$QUALITY_DISPLAY" "$VIDEO_NUM" "$TOTAL_VIDEOS" "$LINK_COUNT")
              curl -s -X POST "https://tapi.bale.ai/bot${TOKEN}/sendMessage" \
                -d "chat_id=${CHAT_ID}" \
                -d "text=${TEXT_MSG}" \
                -d "parse_mode=Markdown"
            fi
            
            # Send files in sorted order
            for FILE in *; do
              if [ -f "$FILE" ] && [ -s "$FILE" ]; then
                SIZE=$(stat -c%s "$FILE")
                SIZE_MB=$((SIZE / 1024 / 1024))
                curl -s -X POST "https://tapi.bale.ai/bot${TOKEN}/sendDocument" \
                  -F "chat_id=${CHAT_ID}" \
                  -F "document=@${FILE}" \
                  -F "caption=${FILE} | ${SIZE_MB}MB"
                sleep 1
              fi
            done
            
            cd ..
            rm -rf "video_${VIDEO_NUM}" extracted_links.txt "thumbnail_${VIDEO_NUM}.jpg"
            
            VIDEO_NUM=$((VIDEO_NUM + 1))
            sleep 2
          done < video_info.txt
          
          curl -s -X POST "https://tapi.bale.ai/bot${TOKEN}/sendMessage" \
            -d "chat_id=${CHAT_ID}" \
            -d "text=✅ *Playlist Download Complete!*%0A%0A📋 Successfully sent ${TOTAL_VIDEOS} videos%0A🎚️ Quality: ${QUALITY_DISPLAY}" \
            -d "parse_mode=Markdown"

      - name: Show summary
        run: |
          echo "## 📊 Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Item | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| Mode | ${{ env.MODE }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Quality | ${{ inputs.quality }} |" >> $GITHUB_STEP_SUMMARY
          if [ "${{ env.MODE }}" = "playlist" ]; then
            echo "| Videos in playlist | $(wc -l < video_info.txt 2>/dev/null || echo '0') |" >> $GITHUB_STEP_SUMMARY
          fi

      - name: Cleanup
        run: |
          rm -f README*.md video_title.txt download_status.txt extracted_links.txt readme_name.txt thumbnail.jpg video_info.txt mode.txt
          rm -rf downloaded_files tmpvideos thumbnails_temp
          echo "Cleaned up temporary files"