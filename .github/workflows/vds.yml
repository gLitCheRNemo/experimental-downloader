name: 1- Video Downloader & Sender

on:
  workflow_dispatch:
    inputs:
      youtube_url:
        description: '🔗 YouTube video or playlist URL'
        required: true
        type: string
      quality:
        description: '🎬 Video quality'
        required: true
        default: 'best'
        type: choice
        options:
          - best
          - 2160
          - 1440
          - 1080
          - 720
          - 480
          - audio
      playlist_items:
        description: '📋 Playlist items to download (e.g., 5, 3-19, 1-10, or leave empty for all/single)'
        required: false
        type: string
        default: ''
      parts_size:
        description: '🫙 Parts size (MB)'
        required: false
        type: string
        default: '45'
      bale_token:
        description: '🤖 Bale Bot Token (for sending files)'
        required: true
        type: string
      bale_chat_id:
        description: '💬 Bale Chat ID (for sending files)'
        required: true
        type: string

jobs:
  # ============================================
  # JOB 1: Download YouTube videos/playlist and create READMEs
  # ============================================
  download-and-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 0

      - name: Prepare videos branch
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git fetch origin

          if git ls-remote --exit-code --heads origin videos; then
            git checkout videos
            git pull origin videos
          else
            git checkout --orphan videos
            git rm -rf . || true
            git commit --allow-empty -m "[bot] Initialize videos branch"
            git push --set-upstream origin videos
          fi

      - name: Setup FFmpeg
        run: |
          wget https://github.com/yt-dlp/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-linux64-gpl.tar.xz
          tar -xf ffmpeg-master-latest-linux64-gpl.tar.xz
          sudo mv ffmpeg-master-latest-linux64-gpl/bin/ffmpeg /usr/local/bin/
          sudo mv ffmpeg-master-latest-linux64-gpl/bin/ffprobe /usr/local/bin/
          ffmpeg -version

      - name: Setup WARP
        run: |
          docker rm -f warp 2>/dev/null || true
          docker network create warp-net 2>/dev/null || true

          docker run -d \
            --name warp \
            --restart=always \
            --network warp-net \
            -p 1080:1080 \
            --cap-add NET_ADMIN \
            --sysctl net.ipv6.conf.all.disable_ipv6=0 \
            --sysctl net.ipv4.conf.all.src_valid_mark=1 \
            -v warp-data:/var/lib/cloudflare-warp \
            caomingjun/warp

          echo "Waiting for WARP to initialize..."

          WARP_READY=false
          for i in {1..10}; do
            RESULT=$(curl -s --max-time 3 --socks5-hostname 127.0.0.1:1080 https://cloudflare.com/cdn-cgi/trace 2>/dev/null || true)
            
            if echo "$RESULT" | grep -qE "warp=(on|plus)"; then
              echo "WARP proxy is ready! (Took $i attempts)"
              echo "$RESULT" | grep -E "^(ip|warp|colo)="
              WARP_READY=true
              break
            fi
            
            echo "Attempt $i/10 - WARP not ready, waiting 3s..."
            sleep 3
          done

          if [ "$WARP_READY" = false ]; then
            echo "WARP failed to activate fully, continuing anyway..."
            echo "Last response: $RESULT"
          fi

      - name: Setup yt-dlp
        run: |
          sudo apt-get install -y python3-pip curl
          pip install yt-dlp --pre

          curl -fsSL https://deno.land/install.sh | sh
          export DENO_INSTALL="$HOME/.deno"
          export PATH="$DENO_INSTALL/bin:$PATH"
          echo "$DENO_INSTALL/bin" >> $GITHUB_PATH
          deno --version
          
      # ============================================
      # CHECK IF URL IS A PLAYLIST
      # ============================================
      - name: Check if URL is a playlist
        id: check_playlist
        run: |
          URL="${{ inputs.youtube_url }}"
          if [[ "$URL" == *"list="* ]] || [[ "$URL" == *"&list="* ]]; then
            echo "IS_PLAYLIST=true" >> $GITHUB_ENV
            echo "✅ Detected as playlist URL"
          else
            echo "IS_PLAYLIST=false" >> $GITHUB_ENV
            echo "Single video URL detected"
          fi

      # ============================================
      # DOWNLOAD PLAYLIST (multiple videos)
      # ============================================
      - name: Download playlist videos
        id: download_playlist
        if: env.IS_PLAYLIST == 'true'
        run: |
          QUALITY="${{ inputs.quality }}"
          PLAYLIST_ITEMS="${{ inputs.playlist_items }}"
          
          if [ "$QUALITY" = "audio" ]; then
            FORMAT_OPTS="-f bestaudio --extract-audio --audio-format mp3"
          elif [ "$QUALITY" = "best" ]; then
            FORMAT_OPTS="-f bestvideo+bestaudio/best --merge-output-format mp4"
          else
            FORMAT_OPTS="-f bestvideo[height<=${QUALITY}]+bestaudio/best[height<=${QUALITY}] --merge-output-format mp4"
          fi
          
          mkdir -p tmpvideos
          cd tmpvideos
          
          # Build playlist items option
          if [ -n "$PLAYLIST_ITEMS" ]; then
            echo "Downloading playlist items: $PLAYLIST_ITEMS"
            yt-dlp --remote-components ejs:github --proxy "socks5://127.0.0.1:1080" \
              $FORMAT_OPTS \
              --playlist-items "$PLAYLIST_ITEMS" \
              --output "%(title)s.%(ext)s" \
              "${{ inputs.youtube_url }}"
          else
            echo "Downloading entire playlist"
            yt-dlp --remote-components ejs:github --proxy "socks5://127.0.0.1:1080" \
              $FORMAT_OPTS \
              --output "%(title)s.%(ext)s" \
              "${{ inputs.youtube_url }}"
          fi
          
          # List downloaded files
          echo "Downloaded files:"
          ls -la
          
          # Count downloaded videos
          VIDEO_COUNT=$(ls -1 *.mp4 *.mkv *.webm *.mp3 *.m4a 2>/dev/null | wc -l)
          echo "VIDEO_COUNT=$VIDEO_COUNT" >> $GITHUB_ENV
          echo "✅ Downloaded $VIDEO_COUNT videos from playlist"
          
          cd ..

      # ============================================
      # DOWNLOAD SINGLE VIDEO (original behavior)
      # ============================================
      - name: Download single video
        id: download_single
        if: env.IS_PLAYLIST == 'false'
        run: |
          QUALITY="${{ inputs.quality }}"
          
          if [ "$QUALITY" = "audio" ]; then
            FORMAT_OPTS="-f bestaudio --extract-audio --audio-format mp3"
          elif [ "$QUALITY" = "best" ]; then
            FORMAT_OPTS="-f bestvideo+bestaudio/best --merge-output-format mp4"
          else
            FORMAT_OPTS="-f bestvideo[height<=${QUALITY}]+bestaudio/best[height<=${QUALITY}] --merge-output-format mp4"
          fi
          
          mkdir -p tmpvideos
          cd tmpvideos
          yt-dlp --remote-components ejs:github --proxy "socks5://127.0.0.1:1080" \
            $FORMAT_OPTS \
            --output "%(title)s.%(ext)s" \
            "${{ inputs.youtube_url }}"

          # Find the downloaded file
          FILE=$(ls -1 | head -n 1)
          FILE_NO_EXTENSION="${FILE%.*}"
          echo "FILE=$FILE" >> $GITHUB_ENV
          echo "FILE_NO_EXTENSION=$FILE_NO_EXTENSION" >> $GITHUB_ENV
          
          # Capture video title for header message
          VIDEO_TITLE=$(echo "$FILE" | sed 's/\.[^.]*$//')
          echo "VIDEO_TITLE=$VIDEO_TITLE" >> $GITHUB_ENV
          
          # Create a safe folder name
          SAFE_NAME=$(echo "$FILE" | sed 's/\.[^.]*$//' | sed 's/[^a-zA-Z0-9]/_/g' | tr -s '_')
          echo "SAFE_NAME=$SAFE_NAME" >> $GITHUB_ENV
          
          # Extract video ID for thumbnail
          VIDEO_URL="${{ inputs.youtube_url }}"
          VIDEO_ID=$(echo "$VIDEO_URL" | grep -oP '(?<=v=)[^&]+|(?<=youtu\.be/)[^?]+|(?<=embed/)[^?]+|(?<=shorts/)[^?]+' | head -1)
          echo "VIDEO_ID=$VIDEO_ID" >> $GITHUB_ENV
          
          echo "VIDEO_COUNT=1" >> $GITHUB_ENV
          
          cd ..

      # ============================================
      # PROCESS EACH VIDEO (split, thumbnail, folder)
      # ============================================
      - name: Process each video
        id: process
        run: |
          cd tmpvideos
          
          # Create an array of video files
          VIDEO_FILES=()
          while IFS= read -r file; do
            VIDEO_FILES+=("$file")
          done < <(ls -1 *.mp4 *.mkv *.webm *.mp3 *.m4a 2>/dev/null | sort)
          
          TOTAL_VIDEOS=${#VIDEO_FILES[@]}
          echo "TOTAL_VIDEOS=$TOTAL_VIDEOS" >> $GITHUB_ENV
          echo "Processing $TOTAL_VIDEOS video(s)"
          
          # Counter for README numbering
          README_NUM=1
          
          for VIDEO_FILE in "${VIDEO_FILES[@]}"; do
            VIDEO_TITLE="${VIDEO_FILE%.*}"
            SAFE_NAME=$(echo "$VIDEO_TITLE" | sed 's/[^a-zA-Z0-9]/_/g' | tr -s '_' | sed 's/^_//;s/_$//')
            VIDEO_FOLDER="$SAFE_NAME"
            
            echo "=========================================="
            echo "Processing: $VIDEO_TITLE"
            echo "=========================================="
            
            # Create folder for this video
            mkdir -p "../$VIDEO_FOLDER"
            
            # Split the video file
            zip -0 -s "${{ inputs.parts_size }}m" "../${VIDEO_FOLDER}/${SAFE_NAME}.zip" "$VIDEO_FILE"
            
            # Get video ID for thumbnail (single video mode already has it, playlist mode needs extraction)
            if [ "${{ env.IS_PLAYLIST }}" = "true" ]; then
              # Extract video ID from filename or use yt-dlp
              VIDEO_ID=$(yt-dlp --get-id "https://www.youtube.com/watch?v=$VIDEO_FILE" 2>/dev/null || echo "")
              if [ -z "$VIDEO_ID" ]; then
                # Try to extract from the actual video file info
                VIDEO_ID=$(yt-dlp --get-id "$VIDEO_FILE" 2>/dev/null || echo "")
              fi
            else
              VIDEO_ID="${{ env.VIDEO_ID }}"
            fi
            
            # Download thumbnail
            if [ -n "$VIDEO_ID" ]; then
              THUMBNAIL_DOWNLOADED=false
              
              # Try maxresdefault.jpg
              if wget -q --timeout=10 "https://img.youtube.com/vi/${VIDEO_ID}/maxresdefault.jpg" -O "../${VIDEO_FOLDER}/thumbnail.jpg" 2>/dev/null; then
                if [ -f "../${VIDEO_FOLDER}/thumbnail.jpg" ] && [ $(stat -c%s "../${VIDEO_FOLDER}/thumbnail.jpg") -gt 10000 ]; then
                  THUMBNAIL_DOWNLOADED=true
                else
                  rm -f "../${VIDEO_FOLDER}/thumbnail.jpg"
                fi
              fi
              
              # Try sddefault.jpg
              if [ "$THUMBNAIL_DOWNLOADED" = false ]; then
                if wget -q --timeout=10 "https://img.youtube.com/vi/${VIDEO_ID}/sddefault.jpg" -O "../${VIDEO_FOLDER}/thumbnail.jpg" 2>/dev/null; then
                  if [ -f "../${VIDEO_FOLDER}/thumbnail.jpg" ] && [ $(stat -c%s "../${VIDEO_FOLDER}/thumbnail.jpg") -gt 5000 ]; then
                    THUMBNAIL_DOWNLOADED=true
                  else
                    rm -f "../${VIDEO_FOLDER}/thumbnail.jpg"
                  fi
                fi
              fi
              
              # Try hqdefault.jpg
              if [ "$THUMBNAIL_DOWNLOADED" = false ]; then
                if wget -q --timeout=10 "https://img.youtube.com/vi/${VIDEO_ID}/hqdefault.jpg" -O "../${VIDEO_FOLDER}/thumbnail.jpg" 2>/dev/null; then
                  if [ -f "../${VIDEO_FOLDER}/thumbnail.jpg" ] && [ $(stat -c%s "../${VIDEO_FOLDER}/thumbnail.jpg") -gt 2000 ]; then
                    THUMBNAIL_DOWNLOADED=true
                  else
                    rm -f "../${VIDEO_FOLDER}/thumbnail.jpg"
                  fi
                fi
              fi
            fi
            
            # Generate README for this video
            README_NAME="README"
            if [ $README_NUM -eq 1 ]; then
              README_NAME="README.md"
            else
              README_NAME="README${README_NUM}.md"
            fi
            
            cd ..
            
            echo "# 📥 Download Links - ${VIDEO_TITLE}" > "$README_NAME"
            echo "Generated on: $(date)" >> "$README_NAME"
            echo "" >> "$README_NAME"
            
            # Add links to files in this video's folder
            for file in "${VIDEO_FOLDER}"/*; do
              if [ -f "$file" ]; then
                filename=$(basename "$file")
                encoded_filename=$(python3 -c "import urllib.parse, sys; print(urllib.parse.quote(sys.argv[1]))" "$filename")
                url="https://github.com/${{ github.repository }}/raw/videos/${VIDEO_FOLDER}/$encoded_filename"
                echo "- [Download $filename]($url)" >> "$README_NAME"
              fi
            done
            
            # Commit this video's folder and README
            git add "$VIDEO_FOLDER"
            git add "$README_NAME"
            git commit -m "[bot] Add video: $VIDEO_TITLE"
            git push
            
            echo "✅ Committed: $VIDEO_TITLE"
            
            # Save video info for batch processing
            echo "${VIDEO_TITLE}|${VIDEO_ID}|${README_NAME}" >> ../video_info.txt
            
            cd tmpvideos
            README_NUM=$((README_NUM + 1))
          done
          
          cd ..
          
          # Create a master README that links to all video READMEs (only for playlists)
          if [ "${{ env.IS_PLAYLIST }}" = "true" ] && [ "$TOTAL_VIDEOS" -gt 1 ]; then
            echo "# 🎬 Playlist Download Complete" > MASTER_README.md
            echo "Generated on: $(date)" >> MASTER_VIDEOS.md
            echo "" >> MASTER_README.md
            echo "## Downloaded Videos" >> MASTER_README.md
            echo "" >> MASTER_README.md
            
            README_NUM=1
            while IFS='|' read -r title video_id readme_name; do
              if [ $README_NUM -eq 1 ]; then
                echo "1. [${title}](./README.md)" >> MASTER_README.md
              else
                echo "${README_NUM}. [${title}](./${readme_name})" >> MASTER_README.md
              fi
              README_NUM=$((README_NUM + 1))
            done < video_info.txt
            
            git add MASTER_README.md
            git commit -m "[bot] Add master playlist README"
            git push
          fi
          
          # Save video info for Job 2
          echo "VIDEO_INFO=$(cat video_info.txt)" >> $GITHUB_ENV
          echo "TOTAL_VIDEOS=$TOTAL_VIDEOS" >> $GITHUB_ENV
          
          docker stop warp || true

      # ============================================
      # SINGLE VIDEO MODE: Save artifacts (backward compatible)
      # ============================================
      - name: Save single video artifacts
        if: env.IS_PLAYLIST == 'false'
        run: |
          echo "${{ env.VIDEO_TITLE }}" > video_title.txt
          echo "${{ env.README_NAME }}" > readme_name.txt
          echo "${{ env.SAFE_NAME }}/thumbnail.jpg" > thumbnail_path.txt
          
          # Upload thumbnail if exists
          if [ -f "${{ env.SAFE_NAME }}/thumbnail.jpg" ]; then
            echo "THUMBNAIL_EXISTS=true" >> $GITHUB_ENV
          fi

      - name: Upload single video artifacts
        if: env.IS_PLAYLIST == 'false'
        uses: actions/upload-artifact@v4
        with:
          name: single-video-info
          path: |
            video_title.txt
            readme_name.txt
            thumbnail_path.txt
          retention-days: 1

      - name: Upload playlist artifacts
        if: env.IS_PLAYLIST == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: playlist-info
          path: video_info.txt
          retention-days: 1

  # ============================================
  # JOB 2: Send files to Bale bot
  # ============================================
  send-to-bot:
    runs-on: ubuntu-latest
    needs: download-and-release
    if: always() && needs.download-and-release.result == 'success'
    
    steps:
      - name: Mask sensitive inputs
        run: |
          echo "::add-mask::${{ inputs.bale_token }}"
          echo "::add-mask::${{ inputs.bale_chat_id }}"

      - name: Check if playlist or single
        id: check_mode
        run: |
          if [ -f "video_info.txt" ]; then
            echo "MODE=playlist" >> $GITHUB_ENV
            echo "Playlist mode detected"
          else
            echo "MODE=single" >> $GITHUB_ENV
            echo "Single video mode detected"
          fi

      # ============================================
      # SINGLE VIDEO MODE: Original send behavior
      # ============================================
      - name: Download single video artifacts
        if: env.MODE == 'single'
        uses: actions/download-artifact@v4
        with:
          name: single-video-info
          path: .

      - name: Get single video info
        if: env.MODE == 'single'
        run: |
          VIDEO_TITLE=$(cat video_title.txt)
          README_NAME=$(cat readme_name.txt)
          echo "VIDEO_TITLE=$VIDEO_TITLE" >> $GITHUB_ENV
          echo "README_NAME=$README_NAME" >> $GITHUB_ENV

      - name: Fetch README and send single video
        if: env.MODE == 'single'
        run: |
          README_FILE="${{ env.README_NAME }}"
          BRANCH_NAME="videos"
          REPO="${{ github.repository }}"
          
          README_URL="https://raw.githubusercontent.com/${REPO}/${BRANCH_NAME}/${README_FILE}"
          echo "Fetching README from: $README_URL"
          
          curl -L -o "$README_FILE" "$README_URL"
          
          # Extract download links
          grep -oE 'https://[^ )]+\.(z[0-9]+|zip)' "$README_FILE" > extracted_links.txt
          
          LINK_COUNT=$(wc -l < extracted_links.txt)
          echo "LINK_COUNT=$LINK_COUNT" >> $GITHUB_ENV
          
          # Download files
          mkdir -p downloaded_files
          cd downloaded_files
          while IFS= read -r LINK; do
            wget --content-disposition --trust-server-names --max-redirect=5 "$LINK"
          done < ../extracted_links.txt
          cd ..
          
          # Send thumbnail and files
          TOKEN="${{ inputs.bale_token }}"
          CHAT_ID="${{ inputs.bale_chat_id }}"
          VIDEO_TITLE="${{ env.VIDEO_TITLE }}"
          QUALITY="${{ inputs.quality }}"
          
          if [ "$QUALITY" = "best" ]; then
            QUALITY_DISPLAY="Best"
          elif [ "$QUALITY" = "audio" ]; then
            QUALITY_DISPLAY="Audio Only"
          else
            QUALITY_DISPLAY="${QUALITY}p"
          fi
          
          # Try to find thumbnail from the folder
          THUMBNAIL_PATH=$(cat thumbnail_path.txt 2>/dev/null || echo "")
          if [ -f "$THUMBNAIL_PATH" ]; then
            cp "$THUMBNAIL_PATH" thumbnail.jpg
          fi
          
          if [ -f "thumbnail.jpg" ]; then
            CAPTION=$(printf "🎬 *%s*\n🎚️ Quality: %s\n\n📦 Found %s link(s)\n⬇️ Downloading and sending..." "$VIDEO_TITLE" "$QUALITY_DISPLAY" "$LINK_COUNT")
            curl -s -X POST "https://tapi.bale.ai/bot${TOKEN}/sendPhoto" \
              -F "chat_id=${CHAT_ID}" \
              -F "photo=@thumbnail.jpg" \
              -F "caption=${CAPTION}" \
              -F "parse_mode=Markdown"
          else
            curl -s -X POST "https://tapi.bale.ai/bot${TOKEN}/sendMessage" \
              -d "chat_id=${CHAT_ID}" \
              -d "text=🎬 *${VIDEO_TITLE}%0A🎚️ Quality: ${QUALITY_DISPLAY}%0A%0A📦 Found ${LINK_COUNT} link(s)%0A⬇️ Downloading and sending..." \
              -d "parse_mode=Markdown"
          fi
          
          # Send files
          cd downloaded_files
          for FILE in *; do
            if [ -f "$FILE" ] && [ -s "$FILE" ]; then
              SIZE=$(stat -c%s "$FILE")
              SIZE_MB=$((SIZE / 1024 / 1024))
              curl -s -X POST "https://tapi.bale.ai/bot${TOKEN}/sendDocument" \
                -F "chat_id=${CHAT_ID}" \
                -F "document=@${FILE}" \
                -F "caption=${FILE} | ${SIZE_MB}MB"
              sleep 1
            fi
          done
          cd ..
          
          curl -s -X POST "https://tapi.bale.ai/bot${TOKEN}/sendMessage" \
            -d "chat_id=${CHAT_ID}" \
            -d "text=✅ Done! Sent ${LINK_COUNT} file(s)."

      # ============================================
      # PLAYLIST MODE: Process each video in order
      # ============================================
      - name: Download playlist artifacts
        if: env.MODE == 'playlist'
        uses: actions/download-artifact@v4
        with:
          name: playlist-info
          path: .

      - name: Process and send each video in playlist
        if: env.MODE == 'playlist'
        run: |
          TOKEN="${{ inputs.bale_token }}"
          CHAT_ID="${{ inputs.bale_chat_id }}"
          QUALITY="${{ inputs.quality }}"
          
          if [ "$QUALITY" = "best" ]; then
            QUALITY_DISPLAY="Best"
          elif [ "$QUALITY" = "audio" ]; then
            QUALITY_DISPLAY="Audio Only"
          else
            QUALITY_DISPLAY="${QUALITY}p"
          fi
          
          # Send initial playlist message
          TOTAL_VIDEOS=$(wc -l < video_info.txt)
          curl -s -X POST "https://tapi.bale.ai/bot${TOKEN}/sendMessage" \
            -d "chat_id=${CHAT_ID}" \
            -d "text=🎬 *Playlist Download Started!*%0A%0A📋 Total videos: ${TOTAL_VIDEOS}%0A🎚️ Quality: ${QUALITY_DISPLAY}%0A%0A⬇️ Processing each video in order..." \
            -d "parse_mode=Markdown"
          
          VIDEO_NUM=1
          while IFS='|' read -r video_title video_id readme_name; do
            echo "=========================================="
            echo "Sending video $VIDEO_NUM: $video_title"
            echo "=========================================="
            
            # Fetch the README for this video
            README_URL="https://raw.githubusercontent.com/${{ github.repository }}/videos/${readme_name}"
            curl -L -o "$readme_name" "$README_URL"
            
            # Extract download links
            grep -oE 'https://[^ )]+\.(z[0-9]+|zip)' "$readme_name" > extracted_links.txt
            LINK_COUNT=$(wc -l < extracted_links.txt)
            
            # Send video info message
            curl -s -X POST "https://tapi.bale.ai/bot${TOKEN}/sendMessage" \
              -d "chat_id=${CHAT_ID}" \
              -d "text=🎬 *${video_title}*%0A📋 Video ${VIDEO_NUM} of ${TOTAL_VIDEOS}%0A📦 Found ${LINK_COUNT} link(s)%0A⬇️ Downloading and sending..." \
              -d "parse_mode=Markdown"
            
            # Download the thumbnail for this video (if available)
            # The thumbnail is stored in the video's folder on the branch
            THUMBNAIL_URL="https://raw.githubusercontent.com/${{ github.repository }}/videos/$(echo "$video_title" | sed 's/[^a-zA-Z0-9]/_/g' | tr -s '_' | sed 's/^_//;s/_$//')/thumbnail.jpg"
            curl -L -o "thumbnail_${VIDEO_NUM}.jpg" "$THUMBNAIL_URL" 2>/dev/null || true
            
            # Download the actual video parts
            mkdir -p "video_${VIDEO_NUM}"
            cd "video_${VIDEO_NUM}"
            
            LINK_NUM=1
            while IFS= read -r LINK; do
              echo "Downloading part $LINK_NUM of $LINK_COUNT"
              wget --content-disposition --trust-server-names --max-redirect=5 "$LINK"
              LINK_NUM=$((LINK_NUM + 1))
            done < ../extracted_links.txt
            
            # Send thumbnail with caption
            if [ -f "../thumbnail_${VIDEO_NUM}.jpg" ] && [ -s "../thumbnail_${VIDEO_NUM}.jpg" ]; then
              CAPTION=$(printf "🎬 *%s*\n🎚️ Quality: %s\n\n📦 Found %s link(s)\n⬇️ Download complete!" "$video_title" "$QUALITY_DISPLAY" "$LINK_COUNT")
              curl -s -X POST "https://tapi.bale.ai/bot${TOKEN}/sendPhoto" \
                -F "chat_id=${CHAT_ID}" \
                -F "photo=@../thumbnail_${VIDEO_NUM}.jpg" \
                -F "caption=${CAPTION}" \
                -F "parse_mode=Markdown"
            fi
            
            # Send all file parts
            for FILE in *; do
              if [ -f "$FILE" ] && [ -s "$FILE" ]; then
                SIZE=$(stat -c%s "$FILE")
                SIZE_MB=$((SIZE / 1024 / 1024))
                curl -s -X POST "https://tapi.bale.ai/bot${TOKEN}/sendDocument" \
                  -F "chat_id=${CHAT_ID}" \
                  -F "document=@${FILE}" \
                  -F "caption=${FILE} | ${SIZE_MB}MB"
                sleep 1
              fi
            done
            
            cd ..
            
            # Clean up for this video
            rm -rf "video_${VIDEO_NUM}" extracted_links.txt "thumbnail_${VIDEO_NUM}.jpg"
            
            VIDEO_NUM=$((VIDEO_NUM + 1))
            sleep 2
          done < video_info.txt
          
          # Send completion message
          curl -s -X POST "https://tapi.bale.ai/bot${TOKEN}/sendMessage" \
            -d "chat_id=${CHAT_ID}" \
            -d "text=✅ *Playlist Download Complete!*%0A%0A📋 Successfully sent ${TOTAL_VIDEOS} videos%0A🎚️ Quality: ${QUALITY_DISPLAY}" \
            -d "parse_mode=Markdown"

      - name: Show summary
        run: |
          echo "## 📊 Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Item | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| Mode | ${{ env.MODE }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Quality | ${{ inputs.quality }} |" >> $GITHUB_STEP_SUMMARY
          if [ "${{ env.MODE }}" = "playlist" ]; then
            echo "| Videos in playlist | $(wc -l < video_info.txt 2>/dev/null || echo '0') |" >> $GITHUB_STEP_SUMMARY
          fi

      - name: Cleanup
        run: |
          rm -f README*.md video_title.txt download_status.txt extracted_links.txt readme_name.txt thumbnail.jpg video_info.txt
          rm -rf downloaded_files tmpvideos
          echo "🧹 Cleaned up temporary files"