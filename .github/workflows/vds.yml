name: 1- Video Downloader & Sender

on:
  workflow_dispatch:
    inputs:
      youtube_urls:
        description: '🔗 YouTube video URL(s) (space-separated for multiple)'
        required: true
        type: string
      quality:
        description: '🎬 Video quality'
        required: true
        default: 'best'
        type: choice
        options:
          - best
          - 2160
          - 1440
          - 1080
          - 720
          - 480
          - audio
      parts_size:
        description: '🫙 Parts size (MB)'
        required: false
        type: string
        default: '45'
      bale_token:
        description: '🤖 Bale Bot Token (for sending files)'
        required: true
        type: string
      bale_chat_id:
        description: '💬 Bale Chat ID (for sending files)'
        required: true
        type: string

jobs:
  # ============================================
  # JOB 1: Download multiple YouTube videos and create READMEs
  # ============================================
  download-and-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 0

      - name: Prepare videos branch
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git fetch origin

          if git ls-remote --exit-code --heads origin videos; then
            git checkout videos
            git pull origin videos
          else
            git checkout --orphan videos
            git rm -rf . || true
            mkdir -p videos
            git commit --allow-empty -m "[bot] Initialize videos branch"
            git push --set-upstream origin videos
          fi

      - name: Setup FFmpeg
        run: |
          wget https://github.com/yt-dlp/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-linux64-gpl.tar.xz
          tar -xf ffmpeg-master-latest-linux64-gpl.tar.xz
          sudo mv ffmpeg-master-latest-linux64-gpl/bin/ffmpeg /usr/local/bin/
          sudo mv ffmpeg-master-latest-linux64-gpl/bin/ffprobe /usr/local/bin/
          ffmpeg -version

      - name: Setup WARP
        run: |
          docker rm -f warp 2>/dev/null || true
          docker network create warp-net 2>/dev/null || true

          docker run -d \
            --name warp \
            --restart=always \
            --network warp-net \
            -p 1080:1080 \
            --cap-add NET_ADMIN \
            --sysctl net.ipv6.conf.all.disable_ipv6=0 \
            --sysctl net.ipv4.conf.all.src_valid_mark=1 \
            -v warp-data:/var/lib/cloudflare-warp \
            caomingjun/warp

          echo "Waiting for WARP to initialize..."

          WARP_READY=false
          for i in {1..10}; do
            RESULT=$(curl -s --max-time 3 --socks5-hostname 127.0.0.1:1080 https://cloudflare.com/cdn-cgi/trace 2>/dev/null || true)
            
            if echo "$RESULT" | grep -qE "warp=(on|plus)"; then
              echo "WARP proxy is ready! (Took $i attempts)"
              echo "$RESULT" | grep -E "^(ip|warp|colo)="
              WARP_READY=true
              break
            fi
            
            echo "Attempt $i/10 - WARP not ready, waiting 3s..."
            sleep 3
          done

          if [ "$WARP_READY" = false ]; then
            echo "WARP failed to activate fully, continuing anyway..."
            echo "Last response: $RESULT"
          fi

      - name: Setup yt-dlp
        run: |
          sudo apt-get install -y python3-pip curl
          pip install yt-dlp --pre

          curl -fsSL https://deno.land/install.sh | sh
          export DENO_INSTALL="$HOME/.deno"
          export PATH="$DENO_INSTALL/bin:$PATH"
          echo "$DENO_INSTALL/bin" >> $GITHUB_PATH
          deno --version

      - name: Count URLs and create README files
        id: prepare
        run: |
          URLS="${{ inputs.youtube_urls }}"
          URL_ARRAY=($URLS)
          TOTAL_VIDEOS=${#URL_ARRAY[@]}
          echo "TOTAL_VIDEOS=$TOTAL_VIDEOS" >> $GITHUB_ENV
          
          # Create README files for each video BEFORE downloading
          for i in $(seq 1 $TOTAL_VIDEOS); do
            if [ $i -eq 1 ]; then
              README_NAME="README.md"
            else
              README_NAME="README${i}.md"
            fi
            
            cd videos
            echo "# 📥 Download Links - Video $i" > "$README_NAME"
            echo "Generated on: $(date)" >> "$README_NAME"
            echo "" >> "$README_NAME"
            echo "Waiting for download to complete..." >> "$README_NAME"
            cd ..
            
            echo "Created placeholder README: $README_NAME"
          done
          
          # Commit placeholder READMEs first
          git add videos/README*.md
          git commit -m "[bot] Create placeholder README files for $TOTAL_VIDEOS videos"
          git push
          echo "✅ Placeholder README files committed"

      - name: Download multiple videos and update READMEs
        id: download
        run: |
          QUALITY="${{ inputs.quality }}"
          URLS="${{ inputs.youtube_urls }}"
          
          # Build format options
          if [ "$QUALITY" = "audio" ]; then
            FORMAT_OPTS="-f bestaudio --extract-audio --audio-format mp3"
          elif [ "$QUALITY" = "best" ]; then
            FORMAT_OPTS="-f bestvideo+bestaudio/best --merge-output-format mp4"
          else
            FORMAT_OPTS="-f bestvideo[height<=${QUALITY}]+bestaudio/best[height<=${QUALITY}] --merge-output-format mp4"
          fi

          URL_ARRAY=($URLS)
          TOTAL_VIDEOS=${#URL_ARRAY[@]}
          VIDEO_NAMES=""
          README_NAMES=""
          
          VIDEO_COUNT=0
          
          for URL in "${URL_ARRAY[@]}"; do
            VIDEO_COUNT=$((VIDEO_COUNT + 1))
            echo "=========================================="
            echo "Downloading video $VIDEO_COUNT of $TOTAL_VIDEOS"
            echo "URL: $URL"
            echo "=========================================="
            
            # Create README filename for this video
            if [ $VIDEO_COUNT -eq 1 ]; then
              README_NAME="README.md"
            else
              README_NAME="README${VIDEO_COUNT}.md"
            fi
            README_NAMES="$README_NAMES $README_NAME"
            
            # Create a unique temp directory for this video
            TEMP_DIR="tmpvideos_${VIDEO_COUNT}"
            mkdir -p "$TEMP_DIR"
            cd "$TEMP_DIR"
            
            # Download the video
            yt-dlp --remote-components ejs:github --proxy "socks5://127.0.0.1:1080" $FORMAT_OPTS "$URL"
            
            # Check if download succeeded
            if [ $? -ne 0 ]; then
              echo "❌ Failed to download video $VIDEO_COUNT"
              # Update README to show failure
              cd ../videos
              echo "" >> "$README_NAME"
              echo "❌ Download failed for this video" >> "$README_NAME"
              cd ..
              cd ..
              rm -rf "$TEMP_DIR"
              continue
            fi
            
            # Get the downloaded file
            FILE=$(ls -1 | head -n 1)
            VIDEO_TITLE=$(echo "$FILE" | sed 's/\.[^.]*$//')
            SAFE_NAME=$(echo "$FILE" | sed 's/^[[:space:]]*//' | tr ' ' '_')
            
            # Store video info
            VIDEO_NAMES="$VIDEO_NAMES $VIDEO_TITLE"
            
            # Zip the file into the videos directory
            mkdir -p ../videos
            zip -0 -s "${{ inputs.parts_size }}m" "../videos/${SAFE_NAME}.zip" "$FILE"
            
            # Update the README with actual download links
            cd ../videos
            
            # Replace placeholder content with actual links
            echo "# 📥 Download Links - ${VIDEO_TITLE}" > "$README_NAME"
            echo "Generated on: $(date)" >> "$README_NAME"
            echo "" >> "$README_NAME"
            
            # Add links to this video's files
            for file in ${SAFE_NAME}*; do
              if [ -f "$file" ]; then
                filename=$(basename "$file")
                encoded_filename=$(python3 -c "import urllib.parse, sys; print(urllib.parse.quote(sys.argv[1]))" "$filename")
                url="https://github.com/${{ github.repository }}/raw/videos/videos/$encoded_filename"
                echo "- [Download $filename]($url)" >> "$README_NAME"
              fi
            done
            
            cd ..
            
            # Clean up temp directory
            cd ..
            rm -rf "$TEMP_DIR"
            
            echo "✅ Video $VIDEO_COUNT completed: $VIDEO_TITLE"
            echo ""
          done
          
          # Save arrays for later steps
          echo "VIDEO_NAMES=${VIDEO_NAMES# }" >> $GITHUB_ENV
          echo "README_NAMES=${README_NAMES# }" >> $GITHUB_ENV
          
          # List files in videos directory for debugging
          echo "Files in videos directory after download:"
          ls -la videos/
          
          docker stop warp || true

      - name: Commit updated READMEs and video files
        run: |
          # Add all updated README files
          for readme in videos/README*.md; do
            if [ -f "$readme" ]; then
              git add "$readme"
              echo "Added updated README: $readme"
            fi
          done
          
          # Commit README updates
          if ! git diff --cached --quiet; then
            git commit -m "[bot] Update README files with download links"
            git push
            echo "✅ Updated README files committed"
          fi
          
          # Store list of video files (exclude README files)
          ls videos/* 2>/dev/null | grep -v README > file_list.txt || true
          
          TOTAL_FILES=$(cat file_list.txt | wc -l)
          echo "Total video files to commit: $TOTAL_FILES"
          
          if [ "$TOTAL_FILES" -eq 0 ]; then
            echo "No new video files to commit"
            rm -f file_list.txt
            exit 0
          fi
          
          # Set batch size (5 files per commit)
          BATCH_SIZE=5
          BATCH_NUM=1
          
          while [ $(cat file_list.txt | wc -l) -gt 0 ]; do
            BATCH_FILES=$(head -n $BATCH_SIZE file_list.txt)
            
            tail -n +$((BATCH_SIZE + 1)) file_list.txt > temp_list.txt 2>/dev/null || touch temp_list.txt
            mv temp_list.txt file_list.txt
            
            for file in $BATCH_FILES; do
              if [ -f "$file" ]; then
                git add "$file"
                echo "  Added: $file"
              fi
            done
            
            git commit -m "[bot] Add video files batch $BATCH_NUM ($(echo $BATCH_FILES | wc -w) files)"
            git push
            
            echo "✅ Batch $BATCH_NUM committed and pushed"
            BATCH_NUM=$((BATCH_NUM + 1))
            sleep 2
          done
          
          echo "✅ All $TOTAL_FILES files committed and pushed in $((BATCH_NUM - 1)) batches"
          rm -f file_list.txt temp_list.txt

      - name: Save README names to file
        run: |
          echo "${{ env.README_NAMES }}" > readme_names.txt
          echo "${{ env.TOTAL_VIDEOS }}" > total_videos.txt
          echo "${{ env.VIDEO_NAMES }}" > video_names.txt

      - name: Upload README names artifact
        uses: actions/upload-artifact@v4
        with:
          name: readme-names
          path: readme_names.txt
          retention-days: 1

      - name: Upload total videos artifact
        uses: actions/upload-artifact@v4
        with:
          name: total-videos
          path: total_videos.txt
          retention-days: 1

      - name: Upload video names artifact
        uses: actions/upload-artifact@v4
        with:
          name: video-names
          path: video_names.txt
          retention-days: 1

  # ============================================
  # JOB 2: Send files to Bale bot using all README files
  # ============================================
  send-to-bot:
    runs-on: ubuntu-latest
    needs: download-and-release
    if: always() && needs.download-and-release.result == 'success'
    
    steps:
      - name: Mask sensitive inputs
        run: |
          echo "::add-mask::${{ inputs.bale_token }}"
          echo "::add-mask::${{ inputs.bale_chat_id }}"

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: readme-names
          path: .

      - name: Download video names artifact
        uses: actions/download-artifact@v4
        with:
          name: video-names
          path: .

      - name: Download total videos artifact
        uses: actions/download-artifact@v4
        with:
          name: total-videos
          path: .

      - name: Get video info
        id: video_info
        run: |
          if [ -f "readme_names.txt" ]; then
            README_NAMES=$(cat readme_names.txt)
            echo "README_NAMES=$README_NAMES" >> $GITHUB_ENV
          fi
          if [ -f "video_names.txt" ]; then
            VIDEO_NAMES=$(cat video_names.txt)
            echo "VIDEO_NAMES=$VIDEO_NAMES" >> $GITHUB_ENV
          fi
          if [ -f "total_videos.txt" ]; then
            TOTAL_VIDEOS=$(cat total_videos.txt)
            echo "TOTAL_VIDEOS=$TOTAL_VIDEOS" >> $GITHUB_ENV
          fi

      - name: Process each README file
        run: |
          TOKEN="${{ inputs.bale_token }}"
          CHAT_ID="${{ inputs.bale_chat_id }}"
          
          README_ARRAY=(${{ env.README_NAMES }})
          VIDEO_ARRAY=(${{ env.VIDEO_NAMES }})
          TOTAL_VIDEOS=${{ env.TOTAL_VIDEOS }}
          
          for i in "${!README_ARRAY[@]}"; do
            README_FILE="${README_ARRAY[$i]}"
            VIDEO_TITLE="${VIDEO_ARRAY[$i]}"
            VIDEO_NUM=$((i + 1))
            
            echo "Processing video $VIDEO_NUM of $TOTAL_VIDEOS: $VIDEO_TITLE"
            
            REPO="${{ github.repository }}"
            README_URL="https://raw.githubusercontent.com/${REPO}/videos/${README_FILE}"
            curl -L -o "$README_FILE" "$README_URL"
            
            if [ ! -f "$README_FILE" ]; then
              echo "❌ Could not download $README_FILE"
              continue
            fi
            
            grep -oP '\]\(\Khttps://[^)]+' "$README_FILE" > extracted_links.txt 2>/dev/null || true
            grep -oE 'https://raw\.githubusercontent\.com/[^ ]+' "$README_FILE" >> extracted_links.txt 2>/dev/null || true
            
            sort -u extracted_links.txt -o extracted_links.txt
            sed -i '/^$/d' extracted_links.txt
            
            LINK_COUNT=$(wc -l < extracted_links.txt)
            
            curl -s -X POST "https://tapi.bale.ai/bot${TOKEN}/sendMessage" \
              -d "chat_id=${CHAT_ID}" \
              -d "text=📦 Video ${VIDEO_NUM}/${TOTAL_VIDEOS}: ${VIDEO_TITLE}%0A🔗 Found ${LINK_COUNT} link(s)%0A⬇️ Downloading and sending..."
            
            mkdir -p "video_${VIDEO_NUM}"
            cd "video_${VIDEO_NUM}"
            
            LINK_NUM=1
            while IFS= read -r LINK; do
              if [ -n "$LINK" ]; then
                wget --content-disposition --trust-server-names --max-redirect=5 "$LINK"
                LINK_NUM=$((LINK_NUM + 1))
              fi
            done < ../extracted_links.txt
            
            FILE_NUM=1
            for FILE in *; do
              if [ -f "$FILE" ] && [ -s "$FILE" ]; then
                SIZE=$(stat -c%s "$FILE")
                SIZE_MB=$((SIZE / 1024 / 1024))
                curl -s -X POST "https://tapi.bale.ai/bot${TOKEN}/sendDocument" \
                  -F "chat_id=${CHAT_ID}" \
                  -F "document=@${FILE}" \
                  -F "caption=${FILE} | ${SIZE_MB}MB"
                FILE_NUM=$((FILE_NUM + 1))
                sleep 1
              fi
            done
            
            cd ..
            SENT_COUNT=$((FILE_NUM - 1))
            curl -s -X POST "https://tapi.bale.ai/bot${TOKEN}/sendMessage" \
              -d "chat_id=${CHAT_ID}" \
              -d "text=✅ Video ${VIDEO_NUM}/${TOTAL_VIDEOS} complete!%0A📹 ${VIDEO_TITLE}%0A📦 Sent ${SENT_COUNT} file(s)"
            
            rm -rf "video_${VIDEO_NUM}" extracted_links.txt "$README_FILE"
            sleep 2
          done
          
          curl -s -X POST "https://tapi.bale.ai/bot${TOKEN}/sendMessage" \
            -d "chat_id=${CHAT_ID}" \
            -d "text=🎉 ALL DONE!%0A📊 Processed ${TOTAL_VIDEOS} video(s) successfully!"

      - name: Cleanup
        run: |
          rm -f readme_names.txt video_names.txt total_videos.txt extracted_links.txt
          rm -rf video_*