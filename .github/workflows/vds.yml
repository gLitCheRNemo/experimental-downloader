name: 1- Video Downloader & Sender

on:
  workflow_dispatch:
    inputs:
      youtube_urls:
        description: '🔗 YouTube video or playlist URLs (separate multiple with commas, e.g., URL1, URL2, URL3)'
        required: true
        type: string
      quality:
        description: '🎬 Video quality'
        required: true
        default: 'best'
        type: choice
        options:
          - best
          - 2160
          - 1440
          - 1080
          - 720
          - 480
          - audio
      playlist_items:
        description: '📋 Playlist items to download (e.g., 1-10, 5, 3-19). Leave empty for all. Applied to each playlist URL.'
        required: false
        type: string
        default: ''
      parts_size:
        description: '🫙 Parts size (MB)'
        required: false
        type: string
        default: '45'
      bale_token:
        description: '🤖 Bale Bot Token (for sending files)'
        required: true
        type: string
      bale_chat_id:
        description: '💬 Bale Chat ID (for sending files)'
        required: true
        type: string

jobs:
  # ============================================
  # JOB 1: Download YouTube videos/playlists and create READMEs
  # ============================================
  download-and-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Mask sensitive inputs
        run: |
          echo "::add-mask::${{ inputs.bale_token }}"
          echo "::add-mask::${{ inputs.bale_chat_id }}"
          echo "✅ Sensitive inputs masked"

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 0

      - name: Prepare videos branch
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git fetch origin

          if git ls-remote --exit-code --heads origin videos; then
            git checkout videos
            git pull origin videos
          else
            git checkout --orphan videos
            git rm -rf . || true
            git commit --allow-empty -m "[bot] Initialize videos branch"
            git push --set-upstream origin videos
          fi

      - name: Setup FFmpeg
        run: |
          wget https://github.com/yt-dlp/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-linux64-gpl.tar.xz
          tar -xf ffmpeg-master-latest-linux64-gpl.tar.xz
          sudo mv ffmpeg-master-latest-linux64-gpl/bin/ffmpeg /usr/local/bin/
          sudo mv ffmpeg-master-latest-linux64-gpl/bin/ffprobe /usr/local/bin/
          ffmpeg -version

      - name: Setup WARP
        run: |
          docker rm -f warp 2>/dev/null || true
          docker network create warp-net 2>/dev/null || true

          docker run -d \
            --name warp \
            --restart=always \
            --network warp-net \
            -p 1080:1080 \
            --cap-add NET_ADMIN \
            --sysctl net.ipv6.conf.all.disable_ipv6=0 \
            --sysctl net.ipv4.conf.all.src_valid_mark=1 \
            -v warp-data:/var/lib/cloudflare-warp \
            caomingjun/warp

          echo "Waiting for WARP to initialize..."

          WARP_READY=false
          for i in {1..10}; do
            RESULT=$(curl -s --max-time 3 --socks5-hostname 127.0.0.1:1080 https://cloudflare.com/cdn-cgi/trace 2>/dev/null || true)

            if echo "$RESULT" | grep -qE "warp=(on|plus)"; then
              echo "WARP proxy is ready! (Took $i attempts)"
              echo "$RESULT" | grep -E "^(ip|warp|colo)="
              WARP_READY=true
              break
            fi

            echo "Attempt $i/10 - WARP not ready, waiting 3s..."
            sleep 3
          done

          if [ "$WARP_READY" = false ]; then
            echo "WARP failed to activate fully, continuing anyway..."
            echo "Last response: $RESULT"
          fi

      - name: Setup yt-dlp
        run: |
          sudo apt-get install -y python3-pip curl
          pip install yt-dlp --pre

          curl -fsSL https://deno.land/install.sh | sh
          export DENO_INSTALL="$HOME/.deno"
          export PATH="$DENO_INSTALL/bin:$PATH"
          echo "$DENO_INSTALL/bin" >> $GITHUB_PATH
          deno --version

      # ============================================
      # Split URLs into array
      # ============================================
      - name: Split URLs
        id: split_urls
        run: |
          echo "${{ inputs.youtube_urls }}" | tr ',' '\n' | sed 's/^[[:space:]]*//;s/[[:space:]]*$//' > urls_list.txt
          URL_COUNT=$(wc -l < urls_list.txt)
          echo "URL_COUNT=$URL_COUNT" >> $GITHUB_ENV
          echo "Found $URL_COUNT URL(s) to process"
          cat urls_list.txt

      # ============================================
      # Process each URL sequentially
      # ============================================
      - name: Process URLs sequentially
        run: |
          # Read all URLs into array
          mapfile -t URL_ARRAY < urls_list.txt
          TOTAL_URLS=${#URL_ARRAY[@]}
          
          # Global counter for README numbering across all URLs
          GLOBAL_README_COUNTER=1
          
          # Master video info file
          > all_video_info.txt
          
          for URL_INDEX in "${!URL_ARRAY[@]}"; do
            CURRENT_URL="${URL_ARRAY[$URL_INDEX]}"
            CURRENT_NUM=$((URL_INDEX + 1))
            
            echo "=========================================="
            echo "Processing URL $CURRENT_NUM of $TOTAL_URLS: $CURRENT_URL"
            echo "=========================================="
            
            # ============================================
            # Check if URL is a playlist
            # ============================================
            if [[ "$CURRENT_URL" == *"list="* ]] || [[ "$CURRENT_URL" == *"&list="* ]]; then
              IS_PLAYLIST="true"
              echo "Detected as playlist URL"
              
              if [ -n "${{ inputs.playlist_items }}" ]; then
                ITEMS_OPTION="--playlist-items ${{ inputs.playlist_items }}"
                echo "Using playlist items: ${{ inputs.playlist_items }}"
              else
                ITEMS_OPTION=""
              fi
              
              # Extract video IDs and titles
              yt-dlp --flat-playlist --print "%(id)s|%(title)s" $ITEMS_OPTION "$CURRENT_URL" > video_data.txt
              VIDEO_COUNT=$(wc -l < video_data.txt)
              echo "Found $VIDEO_COUNT videos in playlist"
            else
              IS_PLAYLIST="false"
              echo "Single video URL detected"
              VIDEO_ID=$(yt-dlp --get-id "$CURRENT_URL")
              VIDEO_TITLE=$(yt-dlp --get-title "$CURRENT_URL")
              echo "${VIDEO_ID}|${VIDEO_TITLE}" > video_data.txt
              VIDEO_COUNT=1
            fi
            
            # ============================================
            # Download videos
            # ============================================
            QUALITY="${{ inputs.quality }}"
            
            if [ "$QUALITY" = "audio" ]; then
              FORMAT_OPTS="-f bestaudio --extract-audio --audio-format mp3"
            elif [ "$QUALITY" = "best" ]; then
              FORMAT_OPTS="-f bestvideo+bestaudio/best --merge-output-format mp4"
            else
              FORMAT_OPTS="-f bestvideo[height<=${QUALITY}]+bestaudio/best[height<=${QUALITY}] --merge-output-format mp4"
            fi
            
            mkdir -p tmpvideos
            cd tmpvideos
            
            if [ "$IS_PLAYLIST" = "true" ]; then
              if [ -n "${{ inputs.playlist_items }}" ]; then
                yt-dlp --remote-components ejs:github --proxy "socks5://127.0.0.1:1080" \
                  $FORMAT_OPTS \
                  --playlist-items "${{ inputs.playlist_items }}" \
                  --output "%(title)s.%(ext)s" \
                  "$CURRENT_URL"
              else
                yt-dlp --remote-components ejs:github --proxy "socks5://127.0.0.1:1080" \
                  $FORMAT_OPTS \
                  --output "%(title)s.%(ext)s" \
                  "$CURRENT_URL"
              fi
            else
              yt-dlp --remote-components ejs:github --proxy "socks5://127.0.0.1:1080" \
                $FORMAT_OPTS \
                --output "%(title)s.%(ext)s" \
                "$CURRENT_URL"
            fi
            
            cd ..
            
            # ============================================
            # Process each video in this URL
            # ============================================
            mkdir -p thumbnails_temp
            VIDEO_INDEX=1
            
            while IFS='|' read -r VIDEO_ID VIDEO_TITLE; do
              if [ -z "$VIDEO_ID" ]; then
                continue
              fi
              
              echo "Processing video $VIDEO_INDEX: $VIDEO_TITLE"
              
              SAFE_NAME=$(echo "$VIDEO_TITLE" | sed 's/[^a-zA-Z0-9]/_/g' | tr -s '_' | sed 's/^_//;s/_$//')
              if [ -z "$SAFE_NAME" ]; then
                SAFE_NAME="video_$VIDEO_INDEX"
              fi
              
              # Download thumbnail
              mkdir -p "thumbnails_temp/${GLOBAL_README_COUNTER}_${SAFE_NAME}"
              
              THUMBNAIL_DOWNLOADED=false
              if wget -q --timeout=10 "https://img.youtube.com/vi/${VIDEO_ID}/maxresdefault.jpg" -O "thumbnails_temp/${GLOBAL_README_COUNTER}_${SAFE_NAME}/thumbnail.jpg" 2>/dev/null; then
                if [ -f "thumbnails_temp/${GLOBAL_README_COUNTER}_${SAFE_NAME}/thumbnail.jpg" ] && [ $(stat -c%s "thumbnails_temp/${GLOBAL_README_COUNTER}_${SAFE_NAME}/thumbnail.jpg") -gt 10000 ]; then
                  THUMBNAIL_DOWNLOADED=true
                else
                  rm -f "thumbnails_temp/${GLOBAL_README_COUNTER}_${SAFE_NAME}/thumbnail.jpg"
                fi
              fi
              
              if [ "$THUMBNAIL_DOWNLOADED" = false ]; then
                if wget -q --timeout=10 "https://img.youtube.com/vi/${VIDEO_ID}/sddefault.jpg" -O "thumbnails_temp/${GLOBAL_README_COUNTER}_${SAFE_NAME}/thumbnail.jpg" 2>/dev/null; then
                  if [ -f "thumbnails_temp/${GLOBAL_README_COUNTER}_${SAFE_NAME}/thumbnail.jpg" ] && [ $(stat -c%s "thumbnails_temp/${GLOBAL_README_COUNTER}_${SAFE_NAME}/thumbnail.jpg") -gt 5000 ]; then
                    THUMBNAIL_DOWNLOADED=true
                  else
                    rm -f "thumbnails_temp/${GLOBAL_README_COUNTER}_${SAFE_NAME}/thumbnail.jpg"
                  fi
                fi
              fi
              
              if [ "$THUMBNAIL_DOWNLOADED" = false ]; then
                if wget -q --timeout=10 "https://img.youtube.com/vi/${VIDEO_ID}/hqdefault.jpg" -O "thumbnails_temp/${GLOBAL_README_COUNTER}_${SAFE_NAME}/thumbnail.jpg" 2>/dev/null; then
                  if [ -f "thumbnails_temp/${GLOBAL_README_COUNTER}_${SAFE_NAME}/thumbnail.jpg" ] && [ $(stat -c%s "thumbnails_temp/${GLOBAL_README_COUNTER}_${SAFE_NAME}/thumbnail.jpg") -gt 2000 ]; then
                    THUMBNAIL_DOWNLOADED=true
                  else
                    rm -f "thumbnails_temp/${GLOBAL_README_COUNTER}_${SAFE_NAME}/thumbnail.jpg"
                  fi
                fi
              fi
              
              if [ "$THUMBNAIL_DOWNLOADED" = false ]; then
                touch "thumbnails_temp/${GLOBAL_README_COUNTER}_${SAFE_NAME}/thumbnail.jpg"
              fi
              
              # Find the video file
              cd tmpvideos
              VIDEO_FILE=""
              for f in *.mp4 *.mkv *.webm *.mp3 *.m4a; do
                if [ -f "$f" ]; then
                  VIDEO_FILE="$f"
                  break
                fi
              done
              
              if [ -z "$VIDEO_FILE" ]; then
                echo "Could not find video file for $VIDEO_TITLE"
                VIDEO_INDEX=$((VIDEO_INDEX + 1))
                GLOBAL_README_COUNTER=$((GLOBAL_README_COUNTER + 1))
                continue
              fi
              
              # Create video folder
              VIDEO_FOLDER="${GLOBAL_README_COUNTER}_${SAFE_NAME}"
              mkdir -p "../../$VIDEO_FOLDER"
              
              # Split the video
              echo "Splitting video into ${SAFE_NAME}.zip parts..."
              zip -0 -s "${{ inputs.parts_size }}m" "../../${VIDEO_FOLDER}/${SAFE_NAME}.zip" "$VIDEO_FILE"
              
              # Move thumbnail
              if [ -f "../thumbnails_temp/${VIDEO_FOLDER}/thumbnail.jpg" ]; then
                mv "../thumbnails_temp/${VIDEO_FOLDER}/thumbnail.jpg" "../../${VIDEO_FOLDER}/thumbnail.jpg"
              fi
              
              # Generate README
              if [ $GLOBAL_README_COUNTER -eq 1 ]; then
                README_NAME="README.md"
              else
                README_NAME="README${GLOBAL_README_COUNTER}.md"
              fi
              
              cd ../..
              
              {
                echo "# 📥 Download Links - ${VIDEO_TITLE}"
                echo ""
                echo "Generated on: $(date)"
                echo ""
                echo "## Download Links"
                echo ""
              } > "$README_NAME"
              
              # Add thumbnail link
              if [ -f "${VIDEO_FOLDER}/thumbnail.jpg" ]; then
                encoded_thumb=$(python3 -c "import urllib.parse, sys; print(urllib.parse.quote(sys.argv[1]))" "thumbnail.jpg")
                thumb_url="https://github.com/${{ github.repository }}/raw/videos/${VIDEO_FOLDER}/$encoded_thumb"
                echo "- [Download Thumbnail]($thumb_url)" >> "$README_NAME"
              fi
              
              # Add zip links with natural sorting
              ZIP_FILES=()
              for file in "${VIDEO_FOLDER}"/*.z[0-9]* "${VIDEO_FOLDER}"/*.zip; do
                if [ -f "$file" ]; then
                  ZIP_FILES+=("$(basename "$file")")
                fi
              done
              
              if [ ${#ZIP_FILES[@]} -gt 0 ]; then
                IFS=$'\n' ZIP_FILES=($(printf '%s\n' "${ZIP_FILES[@]}" | sort -V))
                unset IFS
              fi
              
              for filename in "${ZIP_FILES[@]}"; do
                encoded_filename=$(python3 -c "import urllib.parse, sys; print(urllib.parse.quote(sys.argv[1]))" "$filename")
                url="https://github.com/${{ github.repository }}/raw/videos/${VIDEO_FOLDER}/$encoded_filename"
                echo "- [Download $filename]($url)" >> "$README_NAME"
              done
              
              # Save to master video info
              echo "${VIDEO_TITLE}|${README_NAME}|${VIDEO_FOLDER}" >> ../all_video_info.txt
              
              cd tmpvideos
              
              VIDEO_INDEX=$((VIDEO_INDEX + 1))
              GLOBAL_README_COUNTER=$((GLOBAL_README_COUNTER + 1))
            done < video_data.txt
            
            cd ..
            
            # Clean up temp files for this URL
            rm -rf tmpvideos thumbnails_temp
            
            echo "✅ Finished processing URL $CURRENT_NUM of $TOTAL_URLS"
            
            # Commit after each URL to save progress
            git add .
            git commit -m "[bot] Processed URL $CURRENT_NUM: $CURRENT_URL" || true
            git push || true
            
            echo "=========================================="
          done
          
          # Move all_video_info.txt to final location
          mv all_video_info.txt video_info.txt
          
          echo "=========================================="
          echo "All URLs processed successfully"
          echo "Total README files created: $((GLOBAL_README_COUNTER - 1))"
          echo "=========================================="
          
          # Save total count for Job 2
          TOTAL_VIDEOS=$((GLOBAL_README_COUNTER - 1))
          echo "TOTAL_VIDEOS=$TOTAL_VIDEOS" >> $GITHUB_ENV

      # ============================================
      # Batch commit zip parts (5 files per commit)
      # ============================================
      - name: Batch commit zip parts
        run: |
          echo "Starting batch commits for all video folders"
          
          for VIDEO_FOLDER in */; do
            VIDEO_FOLDER="${VIDEO_FOLDER%/}"
            
            if [ ! -d "$VIDEO_FOLDER" ]; then
              continue
            fi
            if [[ "$VIDEO_FOLDER" == README* ]]; then
              continue
            fi
            if [[ "$VIDEO_FOLDER" == thumbnails_temp* ]]; then
              continue
            fi
            
            echo "Processing folder: $VIDEO_FOLDER"
            
            FILES=()
            for f in "$VIDEO_FOLDER"/*.z[0-9]* "$VIDEO_FOLDER"/*.zip; do
              if [ -f "$f" ]; then
                FILES+=("$f")
              fi
            done
            
            if [ -f "$VIDEO_FOLDER/thumbnail.jpg" ]; then
              FILES+=("$VIDEO_FOLDER/thumbnail.jpg")
            fi
            
            if [ ${#FILES[@]} -eq 0 ]; then
              echo "No files found in $VIDEO_FOLDER"
              continue
            fi
            
            TOTAL_FILES=${#FILES[@]}
            echo "Found $TOTAL_FILES files to commit in $VIDEO_FOLDER"
            
            BATCH_SIZE=5
            BATCH_NUM=1
            BATCH_FILES=()
            
            for FILE in "${FILES[@]}"; do
              BATCH_FILES+=("$FILE")
              
              if [ ${#BATCH_FILES[@]} -ge $BATCH_SIZE ]; then
                echo "Committing batch $BATCH_NUM for $VIDEO_FOLDER"
                git add "${BATCH_FILES[@]}"
                git commit -m "[bot] Add ${VIDEO_FOLDER} batch $BATCH_NUM (${#BATCH_FILES[@]} files)" || true
                git push || true
                echo "Batch $BATCH_NUM committed and pushed"
                
                BATCH_FILES=()
                BATCH_NUM=$((BATCH_NUM + 1))
                sleep 2
              fi
            done
            
            if [ ${#BATCH_FILES[@]} -gt 0 ]; then
              echo "Committing final batch for $VIDEO_FOLDER"
              git add "${BATCH_FILES[@]}"
              git commit -m "[bot] Add ${VIDEO_FOLDER} final batch (${#BATCH_FILES[@]} files)" || true
              git push || true
              echo "Final batch committed and pushed"
              sleep 2
            fi
          done

      - name: Batch commit README files
        run: |
          echo "Committing README files in batches of 5"
          
          README_FILES=()
          for f in README*.md; do
            if [ -f "$f" ]; then
              README_FILES+=("$f")
            fi
          done
          
          if [ ${#README_FILES[@]} -eq 0 ]; then
            echo "No README files to commit"
            exit 0
          fi
          
          BATCH_SIZE=5
          BATCH_NUM=1
          BATCH_README=()
          
          for README in "${README_FILES[@]}"; do
            BATCH_README+=("$README")
            
            if [ ${#BATCH_README[@]} -ge $BATCH_SIZE ]; then
              echo "Committing README batch $BATCH_NUM"
              git add "${BATCH_README[@]}"
              git commit -m "[bot] Add READMEs batch $BATCH_NUM (${#BATCH_README[@]} files)" || true
              git push || true
              echo "README batch $BATCH_NUM committed and pushed"
              
              BATCH_README=()
              BATCH_NUM=$((BATCH_NUM + 1))
              sleep 2
            fi
          done
          
          if [ ${#BATCH_README[@]} -gt 0 ]; then
            echo "Committing final README batch"
            git add "${BATCH_README[@]}"
            git commit -m "[bot] Add READMEs final batch (${#BATCH_README[@]} files)" || true
            git push || true
            echo "Final README batch committed and pushed"
          fi

      - name: Create master README
        run: |
          if [ -f "video_info.txt" ] && [ "$(wc -l < video_info.txt)" -gt 1 ]; then
            echo "Creating master README..."
            
            echo "# 🎬 Download Complete" > MASTER_README.md
            echo "" >> MASTER_README.md
            echo "Generated on: $(date)" >> MASTER_README.md
            echo "" >> MASTER_README.md
            echo "## Downloaded Videos" >> MASTER_README.md
            echo "" >> MASTER_README.md
            
            README_NUM=1
            while IFS='|' read -r title readme_name folder_name; do
              if [ $README_NUM -eq 1 ]; then
                echo "1. [${title}](./README.md)" >> MASTER_README.md
              else
                echo "${README_NUM}. [${title}](./${readme_name})" >> MASTER_README.md
              fi
              README_NUM=$((README_NUM + 1))
            done < video_info.txt
            
            git add MASTER_README.md
            git commit -m "[bot] Add master README" || true
            git push || true
          fi
          
          docker stop warp || true

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: playlist-info
          path: video_info.txt
          retention-days: 1

  # ============================================
  # JOB 2: Send files to Bale bot
  # ============================================
  send-to-bot:
    runs-on: ubuntu-latest
    needs: download-and-release
    if: always() && needs.download-and-release.result == 'success'

    steps:
      - name: Mask sensitive inputs
        run: |
          echo "::add-mask::${{ inputs.bale_token }}"
          echo "::add-mask::${{ inputs.bale_chat_id }}"

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: playlist-info
          path: .

      - name: Process and send each video
        run: |
          if [ ! -f "video_info.txt" ]; then
            echo "No video_info.txt found, nothing to send"
            exit 0
          fi
          
          TOKEN="${{ inputs.bale_token }}"
          CHAT_ID="${{ inputs.bale_chat_id }}"
          QUALITY="${{ inputs.quality }}"
          
          if [ "$QUALITY" = "best" ]; then
            QUALITY_DISPLAY="Best"
          elif [ "$QUALITY" = "audio" ]; then
            QUALITY_DISPLAY="Audio Only"
          else
            QUALITY_DISPLAY="${QUALITY}p"
          fi
          
          TOTAL_VIDEOS=$(wc -l < video_info.txt)
          
          curl -s -X POST "https://tapi.bale.ai/bot${TOKEN}/sendMessage" \
            -d "chat_id=${CHAT_ID}" \
            -d "text=🎬 *Download Started!*%0A%0A📋 Total videos: ${TOTAL_VIDEOS}%0A🎚️ Quality: ${QUALITY_DISPLAY}%0A%0A⬇️ Processing each video in order..." \
            -d "parse_mode=Markdown"
          
          VIDEO_NUM=1
          while IFS='|' read -r video_title readme_name folder_name; do
            echo "Sending video $VIDEO_NUM: $video_title"
            
            README_URL="https://raw.githubusercontent.com/${{ github.repository }}/videos/${readme_name}"
            curl -L -o "$readme_name" "$README_URL"
            
            grep -oE 'https://[^ )]+\.(z[0-9]+|zip)' "$readme_name" | sort -V > extracted_links.txt
            LINK_COUNT=$(wc -l < extracted_links.txt)
            
            THUMBNAIL_URL="https://raw.githubusercontent.com/${{ github.repository }}/videos/${folder_name}/thumbnail.jpg"
            curl -L -o "thumbnail_${VIDEO_NUM}.jpg" "$THUMBNAIL_URL" 2>/dev/null || true
            
            mkdir -p "video_${VIDEO_NUM}"
            cd "video_${VIDEO_NUM}"
            
            LINK_NUM=1
            while IFS= read -r LINK; do
              echo "Downloading part $LINK_NUM of $LINK_COUNT"
              wget --content-disposition --trust-server-names --max-redirect=5 "$LINK"
              LINK_NUM=$((LINK_NUM + 1))
            done < ../extracted_links.txt
            
            if [ -f "../thumbnail_${VIDEO_NUM}.jpg" ] && [ -s "../thumbnail_${VIDEO_NUM}.jpg" ]; then
              CAPTION=$(printf "🎬 *%s*\n🎚️ Quality: %s\n\n📦 Found %s link(s)\n⬇️ Download complete!" "$video_title" "$QUALITY_DISPLAY" "$LINK_COUNT")
              curl -s -X POST "https://tapi.bale.ai/bot${TOKEN}/sendPhoto" \
                -F "chat_id=${CHAT_ID}" \
                -F "photo=@../thumbnail_${VIDEO_NUM}.jpg" \
                -F "caption=${CAPTION}" \
                -F "parse_mode=Markdown"
            else
              TEXT_MSG=$(printf "🎬 *%s*\n🎚️ Quality: %s\n\n📦 Found %s link(s)\n⬇️ Download complete!" "$video_title" "$QUALITY_DISPLAY" "$LINK_COUNT")
              curl -s -X POST "https://tapi.bale.ai/bot${TOKEN}/sendMessage" \
                -d "chat_id=${CHAT_ID}" \
                -d "text=${TEXT_MSG}" \
                -d "parse_mode=Markdown"
            fi
            
            for FILE in *; do
              if [ -f "$FILE" ] && [ -s "$FILE" ]; then
                SIZE=$(stat -c%s "$FILE")
                SIZE_MB=$((SIZE / 1024 / 1024))
                curl -s -X POST "https://tapi.bale.ai/bot${TOKEN}/sendDocument" \
                  -F "chat_id=${CHAT_ID}" \
                  -F "document=@${FILE}" \
                  -F "caption=${FILE} | ${SIZE_MB}MB"
                sleep 1
              fi
            done
            
            cd ..
            rm -rf "video_${VIDEO_NUM}" extracted_links.txt "thumbnail_${VIDEO_NUM}.jpg"
            
            VIDEO_NUM=$((VIDEO_NUM + 1))
            sleep 2
          done < video_info.txt
          
          curl -s -X POST "https://tapi.bale.ai/bot${TOKEN}/sendMessage" \
            -d "chat_id=${CHAT_ID}" \
            -d "text=✅ *Download Complete!*%0A%0A📋 Successfully sent ${TOTAL_VIDEOS} videos%0A🎚️ Quality: ${QUALITY_DISPLAY}" \
            -d "parse_mode=Markdown"

      - name: Show summary
        run: |
          echo "## 📊 Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Item | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| Total videos | $(wc -l < video_info.txt 2>/dev/null || echo '0') |" >> $GITHUB_STEP_SUMMARY
          echo "| Quality | ${{ inputs.quality }} |" >> $GITHUB_STEP_SUMMARY

      - name: Cleanup
        run: |
          rm -f README*.md video_info.txt extracted_links.txt thumbnail_*.jpg
          rm -rf downloaded_files video_*
          echo "Cleaned up temporary files"