name: 1- Video Downloader & Sender

on:
  workflow_dispatch:
    inputs:
      youtube_url:
        description: '🔗 YouTube video URL(s)'
        required: true
        type: string
      quality:
        description: '🎬 Video quality'
        required: true
        default: 'best'
        type: choice
        options:
          - best
          - 2160
          - 1440
          - 1080
          - 720
          - 480
          - audio
      time_range:
        description: '⏱️ Time range (e.g., *1:30-3:45 or 1:30-3:45). Empty = full video.'
        required: false
        type: string
        default: ''
      parts_size:
        description: '🫙 Parts size (MB)'
        required: false
        type: string
        default: '45'
      bale_token:
        description: '🤖 Bale Bot Token (for sending files)'
        required: true
        type: string
      bale_chat_id:
        description: '💬 Bale Chat ID (for sending files)'
        required: true
        type: string

jobs:
  # ============================================
  # JOB 1: Download YouTube video and create README
  # ============================================
  download-and-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 0

      - name: Prepare videos branch
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git fetch origin

          if git ls-remote --exit-code --heads origin videos; then
            git checkout videos
            git pull origin videos
          else
            git checkout --orphan videos
            git rm -rf . || true
            git commit --allow-empty -m "[bot] Initialize videos branch"
            git push --set-upstream origin videos
          fi

      - name: Setup FFmpeg
        run: |
          wget https://github.com/yt-dlp/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-linux64-gpl.tar.xz
          tar -xf ffmpeg-master-latest-linux64-gpl.tar.xz
          sudo mv ffmpeg-master-latest-linux64-gpl/bin/ffmpeg /usr/local/bin/
          sudo mv ffmpeg-master-latest-linux64-gpl/bin/ffprobe /usr/local/bin/
          ffmpeg -version

      - name: Setup WARP
        run: |
          docker rm -f warp 2>/dev/null || true
          docker network create warp-net 2>/dev/null || true

          docker run -d \
            --name warp \
            --restart=always \
            --network warp-net \
            -p 1080:1080 \
            --cap-add NET_ADMIN \
            --sysctl net.ipv6.conf.all.disable_ipv6=0 \
            --sysctl net.ipv4.conf.all.src_valid_mark=1 \
            -v warp-data:/var/lib/cloudflare-warp \
            caomingjun/warp

          echo "Waiting for WARP to initialize..."

          WARP_READY=false
          for i in {1..10}; do
            RESULT=$(curl -s --max-time 3 --socks5-hostname 127.0.0.1:1080 https://cloudflare.com/cdn-cgi/trace 2>/dev/null || true)
            
            if echo "$RESULT" | grep -qE "warp=(on|plus)"; then
              echo "WARP proxy is ready! (Took $i attempts)"
              echo "$RESULT" | grep -E "^(ip|warp|colo)="
              WARP_READY=true
              break
            fi
            
            echo "Attempt $i/10 - WARP not ready, waiting 3s..."
            sleep 3
          done

          if [ "$WARP_READY" = false ]; then
            echo "WARP failed to activate fully, continuing anyway..."
            echo "Last response: $RESULT"
          fi

      - name: Setup yt-dlp
        run: |
          sudo apt-get install -y python3-pip curl
          pip install yt-dlp --upgrade

          curl -fsSL https://deno.land/install.sh | sh
          export DENO_INSTALL="$HOME/.deno"
          export PATH="$DENO_INSTALL/bin:$PATH"
          echo "$DENO_INSTALL/bin" >> $GITHUB_PATH
          deno --version
          
      - name: Download video
        id: download
        run: |
          QUALITY="${{ inputs.quality }}"
          TIME_RANGE="${{ inputs.time_range }}"
          
          # Build format options
          if [ "$QUALITY" = "audio" ]; then
            FORMAT_OPTS="-f bestaudio --extract-audio --audio-format mp3"
          elif [ "$QUALITY" = "best" ]; then
            FORMAT_OPTS="-f bestvideo+bestaudio/best --merge-output-format mp4"
          else
            FORMAT_OPTS="-f bestvideo[height<=${QUALITY}]+bestaudio/best[height<=${QUALITY}] --merge-output-format mp4"
          fi
          
          mkdir -p tmpvideos
          cd tmpvideos
          
          # Download based on whether time range is provided
          if [ -n "$TIME_RANGE" ]; then
            echo "=========================================="
            echo "Time range provided: $TIME_RANGE"
            echo "=========================================="
            
            # Remove the * prefix if present
            CLEAN_RANGE="${TIME_RANGE#\*}"
            START_TIME=$(echo "$CLEAN_RANGE" | cut -d'-' -f1)
            END_TIME=$(echo "$CLEAN_RANGE" | cut -d'-' -f2)
            
            echo "Start: $START_TIME, End: $END_TIME"
            
            # METHOD 1: Try --download-sections first (works on some versions)
            echo "Attempting --download-sections method..."
            if yt-dlp \
              --remote-components ejs:github \
              --proxy "socks5://127.0.0.1:1080" \
              $FORMAT_OPTS \
              --download-sections "*${START_TIME}-${END_TIME}" \
              --force-keyframes-at-cuts \
              "${{ inputs.youtube_url }}"; then
              echo "✅ --download-sections succeeded"
            else
              echo "⚠️ --download-sections failed, falling back to FFmpeg method..."
              # METHOD 2: Fallback to FFmpeg direct download (more reliable)
              yt-dlp \
                --remote-components ejs:github \
                --proxy "socks5://127.0.0.1:1080" \
                $FORMAT_OPTS \
                --downloader ffmpeg \
                --downloader-args "ffmpeg_i:-ss ${START_TIME} -to ${END_TIME}" \
                "${{ inputs.youtube_url }}"
            fi
          else
            echo "=========================================="
            echo "Downloading full video"
            echo "=========================================="
            yt-dlp \
              --remote-components ejs:github \
              --proxy "socks5://127.0.0.1:1080" \
              $FORMAT_OPTS \
              "${{ inputs.youtube_url }}"
          fi

          # Find the downloaded file
          FILE=$(ls -1 | head -n 1)
          FILE_NO_EXTENSION="${FILE%.*}"
          echo "FILE=$FILE" >> $GITHUB_ENV
          echo "FILE_NO_EXTENSION=$FILE_NO_EXTENSION" >> $GITHUB_ENV
          
          # Capture video title for header message
          VIDEO_TITLE=$(echo "$FILE" | sed 's/\.[^.]*$//')
          echo "VIDEO_TITLE=$VIDEO_TITLE" >> $GITHUB_ENV
          
          # Create a safe folder name (replace problematic characters with underscores)
          SAFE_NAME=$(echo "$FILE" | sed 's/\.[^.]*$//' | sed 's/[^a-zA-Z0-9]/_/g' | tr -s '_')
          echo "SAFE_NAME=$SAFE_NAME" >> $GITHUB_ENV
          
          # Extract video ID for thumbnail
          VIDEO_URL="${{ inputs.youtube_url }}"
          VIDEO_ID=$(echo "$VIDEO_URL" | grep -oP '(?<=v=)[^&]+|(?<=youtu\.be/)[^?]+|(?<=embed/)[^?]+|(?<=shorts/)[^?]+' | head -1)
          echo "VIDEO_ID=$VIDEO_ID" >> $GITHUB_ENV

      # ============================================
      # Download thumbnail using direct URL method
      # ============================================
      - name: Download thumbnail
        id: thumbnail
        run: |
          VIDEO_ID="${{ env.VIDEO_ID }}"
          SAFE_NAME="${{ env.SAFE_NAME }}"
          VIDEO_FOLDER="${{ env.SAFE_NAME }}"
          
          mkdir -p "$VIDEO_FOLDER"
          
          echo "=========================================="
          echo "Downloading thumbnail for video ID: $VIDEO_ID"
          echo "=========================================="
          
          THUMBNAIL_DOWNLOADED=false
          
          # Try maxresdefault.jpg (best quality)
          echo "Trying maxresdefault.jpg..."
          if wget -q --timeout=10 "https://img.youtube.com/vi/${VIDEO_ID}/maxresdefault.jpg" -O "${VIDEO_FOLDER}/thumbnail.jpg" 2>/dev/null; then
            if [ -f "${VIDEO_FOLDER}/thumbnail.jpg" ] && [ $(stat -c%s "${VIDEO_FOLDER}/thumbnail.jpg") -gt 10000 ]; then
              THUMBNAIL_DOWNLOADED=true
              echo "✅ Downloaded maxresdefault.jpg"
            else
              rm -f "${VIDEO_FOLDER}/thumbnail.jpg"
            fi
          fi
          
          # Try sddefault.jpg
          if [ "$THUMBNAIL_DOWNLOADED" = false ]; then
            echo "Trying sddefault.jpg..."
            if wget -q --timeout=10 "https://img.youtube.com/vi/${VIDEO_ID}/sddefault.jpg" -O "${VIDEO_FOLDER}/thumbnail.jpg" 2>/dev/null; then
              if [ -f "${VIDEO_FOLDER}/thumbnail.jpg" ] && [ $(stat -c%s "${VIDEO_FOLDER}/thumbnail.jpg") -gt 5000 ]; then
                THUMBNAIL_DOWNLOADED=true
                echo "✅ Downloaded sddefault.jpg"
              else
                rm -f "${VIDEO_FOLDER}/thumbnail.jpg"
              fi
            fi
          fi
          
          # Try hqdefault.jpg
          if [ "$THUMBNAIL_DOWNLOADED" = false ]; then
            echo "Trying hqdefault.jpg..."
            if wget -q --timeout=10 "https://img.youtube.com/vi/${VIDEO_ID}/hqdefault.jpg" -O "${VIDEO_FOLDER}/thumbnail.jpg" 2>/dev/null; then
              if [ -f "${VIDEO_FOLDER}/thumbnail.jpg" ] && [ $(stat -c%s "${VIDEO_FOLDER}/thumbnail.jpg") -gt 2000 ]; then
                THUMBNAIL_DOWNLOADED=true
                echo "✅ Downloaded hqdefault.jpg"
              else
                rm -f "${VIDEO_FOLDER}/thumbnail.jpg"
              fi
            fi
          fi
          
          # Set flag for later steps
          if [ "$THUMBNAIL_DOWNLOADED" = true ]; then
            echo "THUMBNAIL_EXISTS=true" >> $GITHUB_ENV
            echo "✅ Thumbnail saved to: ${VIDEO_FOLDER}/thumbnail.jpg"
          else
            echo "THUMBNAIL_EXISTS=false" >> $GITHUB_ENV
            echo "⚠️ Could not download thumbnail, continuing without it"
          fi

      - name: Create video folder and split files
        id: split
        run: |
          VIDEO_FOLDER="${{ env.SAFE_NAME }}"
          mkdir -p "$VIDEO_FOLDER"
          cd tmpvideos
          zip -0 -s "${{ inputs.parts_size }}m" "../${VIDEO_FOLDER}/${SAFE_NAME}.zip" "$FILE"
          cd ..
          
          docker stop warp || true

      - name: Determine next README filename
        id: readme_name
        run: |
          # Find the highest existing README number at the BRANCH ROOT
          HIGHEST=0
          for file in README*.md; do
            if [ -f "$file" ]; then
              if [ "$file" = "README.md" ]; then
                NUM=1
              else
                NUM=$(echo "$file" | grep -o '[0-9]\+' | head -1)
                if [ -z "$NUM" ]; then
                  NUM=1
                fi
              fi
              if [ $NUM -gt $HIGHEST ]; then
                HIGHEST=$NUM
              fi
            fi
          done
          
          NEXT_NUM=$((HIGHEST + 1))
          
          if [ $NEXT_NUM -eq 1 ]; then
            README_NAME="README.md"
          else
            README_NAME="README${NEXT_NUM}.md"
          fi
          
          echo "README_NAME=$README_NAME" >> $GITHUB_ENV
          echo "Using README file at branch root: $README_NAME"

      - name: Generate README with Download Links
        run: |
          README_NAME="${{ env.README_NAME }}"
          VIDEO_TITLE="${{ env.VIDEO_TITLE }}"
          SAFE_NAME="${{ env.SAFE_NAME }}"
          TIME_RANGE="${{ inputs.time_range }}"
          
          echo "# 📥 Download Links - ${VIDEO_TITLE}" > "$README_NAME"
          echo "Generated on: $(date)" >> "$README_NAME"
          if [ -n "$TIME_RANGE" ]; then
            echo "" >> "$README_NAME"
            echo "**⏱️ Time range:** \`${TIME_RANGE}\`" >> "$README_NAME"
          fi
          echo "" >> "$README_NAME"
          
          # Use the safe folder name
          VIDEO_FOLDER="$SAFE_NAME"
          
          echo "Video folder: $VIDEO_FOLDER"
          
          # Add links to files in this video's folder
          for file in "${VIDEO_FOLDER}"/*; do
            if [ -f "$file" ]; then
              filename=$(basename "$file")
              encoded_filename=$(python3 -c "import urllib.parse, sys; print(urllib.parse.quote(sys.argv[1]))" "$filename")
              url="https://github.com/${{ github.repository }}/raw/videos/${VIDEO_FOLDER}/$encoded_filename"
              echo "- [Download $filename]($url)" >> "$README_NAME"
            fi
          done

      - name: Save video title to file
        run: |
          echo "${{ env.VIDEO_TITLE }}" > video_title.txt

      - name: Upload video title as artifact
        uses: actions/upload-artifact@v4
        with:
          name: video-title
          path: video_title.txt
          retention-days: 1

      - name: Save README name to file
        run: |
          echo "${{ env.README_NAME }}" > readme_name.txt

      - name: Upload README name as artifact
        uses: actions/upload-artifact@v4
        with:
          name: readme-name
          path: readme_name.txt
          retention-days: 1

      - name: Upload thumbnail as artifact
        if: env.THUMBNAIL_EXISTS == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: video-thumbnail
          path: ${{ env.SAFE_NAME }}/thumbnail.jpg
          retention-days: 1

      # ============================================
      # Commit and Push in Batches of 5
      # ============================================
      - name: Commit and Push in Batches of 5
        run: |
          VIDEO_FOLDER="${{ env.SAFE_NAME }}"
          README_FILE="${{ env.README_NAME }}"
          
          # Check if folder exists and has files
          if [ ! -d "$VIDEO_FOLDER" ]; then
            echo "Video folder not found: $VIDEO_FOLDER"
            exit 0
          fi
          
          # Store list of files in a temporary file
          find "$VIDEO_FOLDER" -maxdepth 1 -type f > file_list.txt 2>/dev/null || true
          
          # Count total files
          TOTAL_FILES=$(wc -l < file_list.txt)
          echo "Total files to commit: $TOTAL_FILES"
          
          if [ "$TOTAL_FILES" -eq 0 ]; then
            echo "No files to commit"
            rm -f file_list.txt
            exit 0
          fi
          
          # Set batch size (5 files per commit)
          BATCH_SIZE=5
          BATCH_NUM=1
          
          # Process files in batches
          while [ $(wc -l < file_list.txt) -gt 0 ]; do
            # Take first BATCH_SIZE files
            BATCH_FILES=$(head -n $BATCH_SIZE file_list.txt)
            
            # Remove these files from the list for next iteration
            tail -n +$((BATCH_SIZE + 1)) file_list.txt > temp_list.txt 2>/dev/null || touch temp_list.txt
            mv temp_list.txt file_list.txt
            
            # Add this batch of files
            for file in $BATCH_FILES; do
              if [ -f "$file" ]; then
                git add "$file"
              fi
            done
            
            # Also add README.md only on first batch
            if [ $BATCH_NUM -eq 1 ] && [ -f "$README_FILE" ]; then
              git add "$README_FILE"
            fi
            
            # Commit this batch
            FILE_COUNT=$(echo "$BATCH_FILES" | wc -w)
            git commit -m "[bot] Add video files batch $BATCH_NUM ($FILE_COUNT files)"
            
            # Push after each batch
            git push
            
            echo "✅ Batch $BATCH_NUM committed and pushed"
            BATCH_NUM=$((BATCH_NUM + 1))
            
            # Small delay to avoid overwhelming GitHub
            sleep 2
          done
          
          echo "✅ All $TOTAL_FILES files committed and pushed in batches"
          rm -f file_list.txt temp_list.txt

  # ============================================
  # JOB 2: Send files to Bale bot using README links
  # ============================================
  send-to-bot:
    runs-on: ubuntu-latest
    needs: download-and-release
    if: always() && needs.download-and-release.result == 'success'
    
    steps:
      - name: Mask sensitive inputs
        run: |
          echo "::add-mask::${{ inputs.bale_token }}"
          echo "::add-mask::${{ inputs.bale_chat_id }}"

      - name: Download README name artifact
        uses: actions/download-artifact@v4
        with:
          name: readme-name
          path: .

      - name: Download video title artifact
        uses: actions/download-artifact@v4
        with:
          name: video-title
          path: .

      - name: Download thumbnail artifact
        if: always()
        uses: actions/download-artifact@v4
        with:
          name: video-thumbnail
          path: .
          continue-on-error: true

      - name: Get README name
        id: get_readme_name
        run: |
          if [ -f "readme_name.txt" ]; then
            README_NAME=$(cat readme_name.txt)
            echo "README_NAME=$README_NAME" >> $GITHUB_ENV
            echo "Using README: $README_NAME"
          else
            echo "README_NAME=README.md" >> $GITHUB_ENV
          fi

      - name: Fetch README from branch root
        id: extract
        run: |
          README_FILE="${{ env.README_NAME }}"
          BRANCH_NAME="videos"
          REPO="${{ github.repository }}"
          
          README_URL="https://raw.githubusercontent.com/${REPO}/${BRANCH_NAME}/${README_FILE}"
          echo "Fetching README from: $README_URL"
          
          curl -L -o "$README_FILE" "$README_URL"
          
          if [ ! -f "$README_FILE" ]; then
            echo "❌ Could not fetch $README_FILE from branch root: $BRANCH_NAME"
            exit 1
          fi
          
          echo "README file contents:"
          echo "=========================================="
          cat "$README_FILE"
          echo "=========================================="
          
          # Extract all download links from README
          grep -oE 'https://[^ )]+\.(z[0-9]+|zip)' "$README_FILE" > extracted_links.txt 2>/dev/null || true
          
          sort -u extracted_links.txt -o extracted_links.txt
          sed -i '/^$/d' extracted_links.txt
          
          LINK_COUNT=$(wc -l < extracted_links.txt)
          echo "LINK_COUNT=$LINK_COUNT" >> $GITHUB_ENV
          
          echo ""
          echo "Found $LINK_COUNT links in $README_FILE:"
          echo "=========================================="
          cat extracted_links.txt
          echo "=========================================="
          
          if [ "$LINK_COUNT" -eq 0 ]; then
            echo "❌ No download links found in README"
            exit 1
          fi

      - name: Download files using wget
        run: |
          mkdir -p downloaded_files
          cd downloaded_files
          
          LINK_NUM=1
          while IFS= read -r LINK; do
            if [ -n "$LINK" ]; then
              echo "=========================================="
              echo "Downloading file $LINK_NUM of ${{ env.LINK_COUNT }} from:"
              echo "$LINK"
              echo "=========================================="
              
              wget --content-disposition --trust-server-names --max-redirect=5 "$LINK"
              
              DOWNLOADED_FILE=$(ls -1 | head -n 1)
              echo "Downloaded file: $DOWNLOADED_FILE"
              
              if [ -f "$DOWNLOADED_FILE" ] && [ -s "$DOWNLOADED_FILE" ]; then
                SIZE=$(stat -c%s "$DOWNLOADED_FILE")
                SIZE_MB=$((SIZE / 1024 / 1024))
                echo "✅ Downloaded: $DOWNLOADED_FILE (${SIZE_MB}MB)"
                echo "$DOWNLOADED_FILE:SUCCESS:$SIZE" >> ../download_status.txt
              else
                echo "❌ Failed to download from: $LINK"
                echo "unknown:FAILED:0" >> ../download_status.txt
              fi
              
              LINK_NUM=$((LINK_NUM + 1))
              echo ""
            fi
          done < ../extracted_links.txt
          
          cd ..
          
          echo "Files in downloaded_files directory:"
          ls -lh downloaded_files/

      - name: Send thumbnail with caption and send files to Bale
        run: |
          TOKEN="${{ inputs.bale_token }}"
          CHAT_ID="${{ inputs.bale_chat_id }}"
          LINK_COUNT="${{ env.LINK_COUNT }}"
          VIDEO_TITLE=$(cat video_title.txt 2>/dev/null || echo "Unknown")
          TIME_RANGE="${{ inputs.time_range }}"
          
          # Build caption with time range info if provided
          if [ -n "$TIME_RANGE" ]; then
            CAPTION=$(printf "🎬 *%s*\n⏱️ Time range: %s\n\n📦 Found %s link(s)\n⬇️ Downloading and sending..." "$VIDEO_TITLE" "$TIME_RANGE" "$LINK_COUNT")
          else
            CAPTION=$(printf "🎬 *%s*\n\n📦 Found %s link(s)\n⬇️ Downloading and sending..." "$VIDEO_TITLE" "$LINK_COUNT")
          fi
          
          # Send thumbnail with caption
          if [ -f "thumbnail.jpg" ]; then
            echo "Sending thumbnail with caption..."
            curl -s -X POST "https://tapi.bale.ai/bot${TOKEN}/sendPhoto" \
              -F "chat_id=${CHAT_ID}" \
              -F "photo=@thumbnail.jpg" \
              -F "caption=${CAPTION}" \
              -F "parse_mode=Markdown"
          else
            # Fallback if no thumbnail
            if [ -n "$TIME_RANGE" ]; then
              curl -s -X POST "https://tapi.bale.ai/bot${TOKEN}/sendMessage" \
                -d "chat_id=${CHAT_ID}" \
                -d "text=🎬 *${VIDEO_TITLE}%0A⏱️ Time range: ${TIME_RANGE}%0A%0A📦 Found ${LINK_COUNT} link(s)%0A⬇️ Downloading and sending..." \
                -d "parse_mode=Markdown"
            else
              curl -s -X POST "https://tapi.bale.ai/bot${TOKEN}/sendMessage" \
                -d "chat_id=${CHAT_ID}" \
                -d "text=🎬 *${VIDEO_TITLE}%0A%0A📦 Found ${LINK_COUNT} link(s)%0A⬇️ Downloading and sending..." \
                -d "parse_mode=Markdown"
            fi
          fi
          
          # Send all downloaded files
          cd downloaded_files
          
          FILE_NUM=1
          for FILE in *; do
            if [ -f "$FILE" ] && [ -s "$FILE" ]; then
              SIZE=$(stat -c%s "$FILE")
              SIZE_MB=$((SIZE / 1024 / 1024))
              
              echo "Sending file $FILE_NUM: $FILE (${SIZE_MB}MB)"
              
              curl -s -X POST "https://tapi.bale.ai/bot${TOKEN}/sendDocument" \
                -F "chat_id=${CHAT_ID}" \
                -F "document=@${FILE}" \
                -F "caption=${FILE} | ${SIZE_MB}MB"
              
              echo "✅ Sent $FILE"
              
              FILE_NUM=$((FILE_NUM + 1))
              sleep 1
            fi
          done
          
          cd ..
          
          SENT_COUNT=$((FILE_NUM - 1))
          curl -s -X POST "https://tapi.bale.ai/bot${TOKEN}/sendMessage" \
            -d "chat_id=${CHAT_ID}" \
            -d "text=✅ Done! Sent ${SENT_COUNT} file(s) from ${LINK_COUNT} link(s)."

      - name: Show summary
        run: |
          echo "## 📊 Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Item | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| Links found | ${{ env.LINK_COUNT }} |" >> $GITHUB_STEP_SUMMARY
          if [ -f "download_status.txt" ]; then
            SUCCESS_COUNT=$(grep -c ":SUCCESS:" download_status.txt || echo "0")
            FAILED_COUNT=$(grep -c ":FAILED:" download_status.txt || echo "0")
            echo "| Successfully downloaded | $SUCCESS_COUNT |" >> $GITHUB_STEP_SUMMARY
            echo "| Failed downloads | $FAILED_COUNT |" >> $GITHUB_STEP_SUMMARY
          fi
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### README file used: ${{ env.README_NAME }} (at branch root)" >> $GITHUB_STEP_SUMMARY
          echo "### Extracted links:" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          cat extracted_links.txt >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

      - name: Cleanup
        run: |
          rm -f README*.md video_title.txt download_status.txt extracted_links.txt readme_name.txt thumbnail.jpg
          rm -rf downloaded_files tmpvideos
          echo "🧹 Cleaned up temporary files"