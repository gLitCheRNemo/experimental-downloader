name: Twitch Latest VOD Link Extractor

on:
  workflow_dispatch:
    inputs:
      channel_url:
        description: '🔗 Twitch Channel URL (e.g., https://www.twitch.tv/lirik)'
        required: true
        type: string
      bale_token:
        description: '🤖 Bale Bot Token (for sending the link)'
        required: true
        type: string
      bale_chat_id:
        description: '💬 Bale Chat ID (for sending the link)'
        required: true
        type: string

jobs:
  extract-latest-vod:
    runs-on: ubuntu-latest
    
    steps:
      - name: Mask sensitive inputs
        run: |
          echo "::add-mask::${{ inputs.bale_token }}"
          echo "::add-mask::${{ inputs.bale_chat_id }}"
          echo "✅ Sensitive inputs masked"

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js and Puppeteer
        run: |
          sudo apt-get update
          sudo apt-get install -y wget gnupg
          # Install Chrome browser
          wget -q -O - https://dl-ssl.google.com/linux/linux_signing_key.pub | sudo apt-key add -
          sudo sh -c 'echo "deb [arch=amd64] http://dl.google.com/linux/chrome/deb/ stable main" >> /etc/apt/sources.list.d/google.list'
          sudo apt-get update
          sudo apt-get install -y google-chrome-stable
          # Setup Node.js project
          mkdir -p twitch_script
          cd twitch_script
          npm init -y
          npm install puppeteer

      - name: Extract latest VOD link and title from Twitch channel
        id: extract
        run: |
          CHANNEL_URL="${{ inputs.channel_url }}"
          
          cd twitch_script
          node << 'EOF'
          const puppeteer = require('puppeteer');
          
          (async () => {
            let browser;
            try {
              console.log('🚀 Launching Chrome browser...');
              browser = await puppeteer.launch({
                executablePath: '/usr/bin/google-chrome-stable',
                args: [
                  '--no-sandbox',
                  '--disable-setuid-sandbox',
                  '--disable-dev-shm-usage',
                  '--disable-gpu',
                  '--disable-web-security',
                  '--disable-features=IsolateOrigins,site-per-process'
                ],
                headless: 'new'
              });
              
              const page = await browser.newPage();
              
              // Set viewport
              await page.setViewport({ width: 1920, height: 1080 });
              
              // Navigate to the channel's videos page
              let channelUrl = process.env.CHANNEL_URL;
              // Remove trailing slash and ensure correct format
              channelUrl = channelUrl.replace(/\/$/, '');
              const videosUrl = channelUrl + '/videos';
              
              console.log(`🌐 Navigating to: ${videosUrl}`);
              await page.goto(videosUrl, { 
                waitUntil: 'networkidle2', 
                timeout: 60000 
              });
              
              console.log('⏳ Waiting 8 seconds for page to fully load...');
              await new Promise(resolve => setTimeout(resolve, 8000));
              
              // Take a screenshot for debugging (optional)
              await page.screenshot({ path: '/tmp/twitch_page.png' });
              console.log('📸 Saved page screenshot to /tmp/twitch_page.png');
              
              // Scroll down multiple times to load more videos
              console.log('📜 Scrolling down to load videos...');
              for (let i = 0; i < 3; i++) {
                await page.evaluate(() => {
                  window.scrollBy(0, 600);
                });
                await new Promise(resolve => setTimeout(resolve, 1500));
              }
              
              // Get page HTML for debugging (first 500 chars)
              const html = await page.content();
              console.log('📄 Page HTML snippet:', html.substring(0, 500));
              
              // Try multiple methods to find the latest VOD
              let videoUrl = null;
              let videoTitle = null;
              
              // METHOD 1: Look for video links in the page
              console.log('🔍 METHOD 1: Searching for video links...');
              const allLinks = await page.$$eval('a', links => 
                links.map(a => a.href).filter(href => href && href.includes('/videos/') && !href.includes('/videos?'))
              );
              
              if (allLinks.length > 0) {
                videoUrl = allLinks[0];
                console.log(`✅ Found video link: ${videoUrl}`);
              }
              
              // METHOD 2: Look for specific Twitch video card selectors
              if (!videoUrl) {
                console.log('🔍 METHOD 2: Trying Twitch-specific selectors...');
                const selectors = [
                  'a[data-test-selector="video-card-link"]',
                  'a[data-a-target="preview-card-image-link"]',
                  '.tw-link[href*="/videos/"]',
                  'a[href*="/videos/"]'
                ];
                
                for (const selector of selectors) {
                  try {
                    const element = await page.$(selector);
                    if (element) {
                      videoUrl = await page.evaluate(el => el.href, element);
                      videoUrl = videoUrl.split('?')[0];
                      console.log(`✅ Found video with selector ${selector}: ${videoUrl}`);
                      break;
                    }
                  } catch (e) {
                    // Continue
                  }
                }
              }
              
              // METHOD 3: Extract from JavaScript-rendered content
              if (!videoUrl) {
                console.log('🔍 METHOD 3: Extracting from rendered content...');
                videoUrl = await page.evaluate(() => {
                  // Look for any element containing a video link
                  const videoElements = document.querySelectorAll('[href*="/videos/"]');
                  for (const el of videoElements) {
                    const href = el.getAttribute('href');
                    if (href && href.includes('/videos/') && !href.includes('/videos?') && !href.includes('/videos/#')) {
                      return href.startsWith('http') ? href : 'https://www.twitch.tv' + href;
                    }
                  }
                  return null;
                });
                if (videoUrl) {
                  console.log(`✅ Found video via JS evaluation: ${videoUrl}`);
                }
              }
              
              if (!videoUrl) {
                console.error('❌ Could not find any videos on this channel');
                console.log('Debug info:');
                console.log(`Channel URL: ${channelUrl}`);
                console.log(`Videos URL: ${videosUrl}`);
                console.log(`Number of links found with /videos/: ${allLinks.length}`);
                if (allLinks.length > 0) {
                  console.log('First 5 video links found:', allLinks.slice(0, 5));
                }
                process.exit(1);
              }
              
              // Extract VOD title
              console.log('🔍 Extracting VOD title...');
              try {
                // Navigate to the VOD page to get the title (more reliable)
                console.log(`🌐 Navigating to VOD page: ${videoUrl}`);
                await page.goto(videoUrl, { 
                  waitUntil: 'networkidle2', 
                  timeout: 60000 
                });
                await new Promise(resolve => setTimeout(resolve, 5000));
                
                // Try multiple title selectors on the VOD page
                const titleSelectors = [
                  '[data-test-selector="video-title"]',
                  '.tw-title',
                  'h1',
                  '.video-title',
                  '[data-a-target="video-title"]',
                  '.core-player-title'
                ];
                
                for (const selector of titleSelectors) {
                  try {
                    const titleElement = await page.$(selector);
                    if (titleElement) {
                      videoTitle = await page.evaluate(el => el.textContent.trim(), titleElement);
                      if (videoTitle && videoTitle.length > 0) {
                        console.log(`✅ Found title with selector ${selector}: ${videoTitle}`);
                        break;
                      }
                    }
                  } catch (e) {
                    // Continue
                  }
                }
                
                // Also try to get title from page metadata
                if (!videoTitle) {
                  videoTitle = await page.evaluate(() => {
                    const ogTitle = document.querySelector('meta[property="og:title"]');
                    if (ogTitle) return ogTitle.getAttribute('content');
                    const twitterTitle = document.querySelector('meta[name="twitter:title"]');
                    if (twitterTitle) return twitterTitle.getAttribute('content');
                    return document.title;
                  });
                  if (videoTitle) {
                    // Clean up Twitch-specific suffixes
                    videoTitle = videoTitle.replace(' - Twitch', '').trim();
                    console.log(`✅ Found title from metadata: ${videoTitle}`);
                  }
                }
              } catch (err) {
                console.log(`⚠️ Could not navigate to VOD page: ${err.message}`);
              }
              
              if (!videoTitle) {
                videoTitle = 'Untitled VOD';
                console.log('⚠️ Using fallback title');
              }
              
              // Clean up title (remove extra whitespace)
              videoTitle = videoTitle.replace(/\s+/g, ' ').trim();
              
              // Save to files
              const fs = require('fs');
              fs.writeFileSync('/tmp/latest_vod_url.txt', videoUrl);
              fs.writeFileSync('/tmp/vod_title.txt', videoTitle);
              
              // Extract channel name from URL
              const channelNameMatch = channelUrl.match(/(?:twitch\.tv\/)([^\/?]+)/);
              const channelName = channelNameMatch ? channelNameMatch[1] : 'Unknown';
              fs.writeFileSync('/tmp/channel_name.txt', channelName);
              
              console.log('\n📋 Extracted Information:');
              console.log(`   Channel: ${channelName}`);
              console.log(`   Title: ${videoTitle}`);
              console.log(`   URL: ${videoUrl}`);
              console.log('\n✅ Successfully extracted latest VOD!');
              
            } catch (error) {
              console.error('❌ Error:', error.message);
              process.exit(1);
            } finally {
              if (browser) {
                await browser.close();
                console.log('🔒 Browser closed.');
              }
            }
          })();
          EOF
          
          cd ..
          
          # Read the extracted data
          VOD_URL=$(cat /tmp/latest_vod_url.txt 2>/dev/null)
          VOD_TITLE=$(cat /tmp/vod_title.txt 2>/dev/null)
          CHANNEL_NAME=$(cat /tmp/channel_name.txt 2>/dev/null)
          
          if [ -z "$VOD_URL" ]; then
            echo "❌ Failed to extract VOD URL"
            echo "Check the debug output above for more information"
            exit 1
          fi
          
          if [ -z "$VOD_TITLE" ]; then
            VOD_TITLE="Untitled VOD"
          fi
          
          if [ -z "$CHANNEL_NAME" ]; then
            CHANNEL_NAME="Unknown"
          fi
          
          echo "VOD_URL=$VOD_URL" >> $GITHUB_ENV
          echo "VOD_TITLE=$VOD_TITLE" >> $GITHUB_ENV
          echo "CHANNEL_NAME=$CHANNEL_NAME" >> $GITHUB_ENV
          
          echo "✅ Extracted VOD URL: $VOD_URL"
          echo "✅ VOD Title: $VOD_TITLE"
          echo "✅ Channel: $CHANNEL_NAME"

      - name: Send VOD link with title to Bale bot
        run: |
          TOKEN="${{ inputs.bale_token }}"
          CHAT_ID="${{ inputs.bale_chat_id }}"
          VOD_URL="${{ env.VOD_URL }}"
          VOD_TITLE="${{ env.VOD_TITLE }}"
          CHANNEL_NAME="${{ env.CHANNEL_NAME }}"
          CURRENT_TIME=$(date '+%Y-%m-%d %H:%M:%S UTC')
          
          # URL encode the VOD title for safety
          ENCODED_TITLE=$(echo "$VOD_TITLE" | sed 's/ /%20/g; s/&/%26/g; s/#/%23/g')
          
          # Build message with %0A for line breaks
          MESSAGE="🎵 *Twitch Latest VOD Found!*%0A%0A📺 **Channel:** ${CHANNEL_NAME}%0A📌 **Title:** ${ENCODED_TITLE}%0A🔗 **Link:** ${VOD_URL}%0A🕐 **Fetched:** ${CURRENT_TIME}%0A%0A⬇️ You can now use this link with your video downloader."
          
          echo "Sending message to Bale Bot..."
          
          RESPONSE=$(curl -s -w "\n%{http_code}" -X POST "https://tapi.bale.ai/bot${TOKEN}/sendMessage" \
            -d "chat_id=${CHAT_ID}" \
            -d "text=${MESSAGE}" \
            -d "parse_mode=Markdown")
          
          HTTP_CODE=$(echo "$RESPONSE" | tail -n1)
          BODY=$(echo "$RESPONSE" | sed '$d')
          
          if [ "$HTTP_CODE" -eq 200 ]; then
            echo "✅ VOD link and title sent successfully to Bale!"
          else
            echo "❌ Failed to send message to Bale. HTTP code: $HTTP_CODE"
            echo "Response: $BODY"
            exit 1
          fi

      - name: Upload debug screenshot (if extraction failed)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: twitch-debug-screenshot
          path: /tmp/twitch_page.png
          retention-days: 7

      - name: Show summary
        run: |
          echo "## 📊 Twitch Latest VOD Extractor Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Item | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| Channel URL | ${{ inputs.channel_url }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Channel Name | ${{ env.CHANNEL_NAME }} |" >> $GITHUB_STEP_SUMMARY
          echo "| VOD Title | ${{ env.VOD_TITLE }} |" >> $GITHUB_STEP_SUMMARY
          echo "| VOD URL | ${{ env.VOD_URL }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Status | ✅ Link sent to Bale |" >> $GITHUB_STEP_SUMMARY

      - name: Cleanup
        run: |
          rm -f /tmp/latest_vod_url.txt /tmp/vod_title.txt /tmp/channel_name.txt /tmp/twitch_page.png
          rm -rf twitch_script
          echo "🧹 Cleaned up temporary files"