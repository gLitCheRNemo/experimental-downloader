name: 5- Send To Bot

on:
  workflow_dispatch:
    inputs:
      raw_links:
        description: 'Paste any text containing GitHub raw links (e.g., from a README.md or web page). The workflow will automatically find all https://raw.githubusercontent.com/ links even if they have brackets, parentheses, or quotes around them.'
        required: true
        type: string
      bale_token:
        description: Bale Bot Token
        required: true
        type: string
      bale_chat_id:
        description: Bale Chat ID
        required: true
        type: string

jobs:
  resend:
    runs-on: ubuntu-latest
    steps:
      - name: Mask sensitive inputs
        run: |
          echo "::add-mask::${{ inputs.bale_token }}"
          echo "::add-mask::${{ inputs.bale_chat_id }}"

      - name: Extract links from input text (handles brackets, parentheses, quotes)
        id: extract
        run: |
          # Save the input text to a file
          echo "${{ inputs.raw_links }}" > input_text.txt
          
          # Extract all raw.githubusercontent.com links using a robust pattern
          # This pattern matches the URL even if it has characters before or after
          grep -oE 'https://raw\.githubusercontent\.com/[a-zA-Z0-9._/-]+/[a-zA-Z0-9._/-]+/[a-zA-Z0-9._/-]+\.(zip|z[0-9]+|part[0-9]+|mp4|jpg|png|txt|md|html|csv|json|xml|pdf|rar|7z|tar|gz)' input_text.txt > extracted_links_raw.txt
          
          # Also match URLs that might have query parameters
          grep -oE 'https://raw\.githubusercontent\.com/[^ ]+' input_text.txt | grep -v '^$' >> extracted_links_raw.txt
          
          # Extract URLs that are inside markdown links: [text](url)
          grep -oP '\]\(\Khttps://raw\.githubusercontent\.com/[^)]+' input_text.txt >> extracted_links_raw.txt 2>/dev/null || true
          
          # Extract URLs that are inside HTML href="url"
          grep -oP 'href="\Khttps://raw\.githubusercontent\.com/[^"]+' input_text.txt >> extracted_links_raw.txt 2>/dev/null || true
          
          # Extract URLs that are inside brackets [url]
          grep -oP '\[\Khttps://raw\.githubusercontent\.com/[^\]]+' input_text.txt >> extracted_links_raw.txt 2>/dev/null || true
          
          # Extract URLs that are inside parentheses (url)
          grep -oP '\(\Khttps://raw\.githubusercontent\.com/[^)]+' input_text.txt >> extracted_links_raw.txt 2>/dev/null || true
          
          # Extract URLs that have quotes around them
          grep -oP '"\Khttps://raw\.githubusercontent\.com/[^"]+' input_text.txt >> extracted_links_raw.txt 2>/dev/null || true
          grep -oP "'\Khttps://raw\.githubusercontent\.com/[^']+" input_text.txt >> extracted_links_raw.txt 2>/dev/null || true
          
          # Sort and deduplicate
          sort -u extracted_links_raw.txt -o extracted_links.txt
          
          # Remove empty lines
          sed -i '/^$/d' extracted_links.txt
          
          # Count links
          LINK_COUNT=$(wc -l < extracted_links.txt)
          echo "LINK_COUNT=$LINK_COUNT" >> $GITHUB_ENV
          
          echo "=========================================="
          echo "Found $LINK_COUNT links in the text:"
          echo "=========================================="
          cat extracted_links.txt
          echo "=========================================="
          
          if [ "$LINK_COUNT" -eq 0 ]; then
            echo "No links found. Here are the first 500 characters of input:"
            head -c 500 input_text.txt
          fi

      - name: Check if links were found
        if: env.LINK_COUNT == 0
        run: |
          echo "❌ No raw.githubusercontent.com links found in the provided text."
          echo ""
          echo "The workflow looks for patterns like:"
          echo "  https://raw.githubusercontent.com/username/repo/branch/filename.zip"
          echo "  https://raw.githubusercontent.com/username/repo/branch/filename.z01"
          echo ""
          echo "Links can have characters before or after them like:"
          echo "  [https://raw.githubusercontent.com/...]"
          echo "  (https://raw.githubusercontent.com/...)"
          echo "  \"https://raw.githubusercontent.com/...\""
          echo "  [text](https://raw.githubusercontent.com/...)"
          exit 1

      - name: Download files using wget
        run: |
          mkdir -p downloaded_files
          cd downloaded_files
          
          LINK_NUM=1
          while IFS= read -r LINK; do
            if [ -n "$LINK" ]; then
              echo "=========================================="
              echo "Downloading file $LINK_NUM of ${{ env.LINK_COUNT }} from:"
              echo "$LINK"
              echo "=========================================="
              
              # Clean the link (remove any trailing characters like periods or commas)
              CLEAN_LINK=$(echo "$LINK" | sed 's/[.,;:]$//')
              
              # Download with wget
              wget --content-disposition --trust-server-names "$CLEAN_LINK"
              
              # Find the downloaded file
              DOWNLOADED_FILE=$(ls -1 | head -n 1)
              echo "Downloaded file: $DOWNLOADED_FILE"
              
              if [ -f "$DOWNLOADED_FILE" ] && [ -s "$DOWNLOADED_FILE" ]; then
                SIZE=$(stat -c%s "$DOWNLOADED_FILE")
                SIZE_MB=$((SIZE / 1024 / 1024))
                echo "✅ Downloaded: $DOWNLOADED_FILE (${SIZE_MB} MB)"
                echo "$DOWNLOADED_FILE:SUCCESS:$SIZE" >> ../download_status.txt
              else
                echo "❌ Failed to download from: $LINK"
                echo "unknown:FAILED:0" >> ../download_status.txt
              fi
              
              LINK_NUM=$((LINK_NUM + 1))
              echo ""
            fi
          done < ../extracted_links.txt
          
          cd ..
          
          echo "Files in downloaded_files directory:"
          ls -lh downloaded_files/

      - name: Send files to Bale bot
        run: |
          TOKEN="${{ inputs.bale_token }}"
          CHAT_ID="${{ inputs.bale_chat_id }}"
          LINK_COUNT="${{ env.LINK_COUNT }}"
          
          # Send header message with count
          curl -s -X POST "https://tapi.bale.ai/bot${TOKEN}/sendMessage" \
            -d "chat_id=${CHAT_ID}" \
            -d "text=📦 Found ${LINK_COUNT} link(s) in text. Downloading and sending..."
          
          cd downloaded_files
          
          FILE_NUM=1
          for FILE in *; do
            if [ -f "$FILE" ] && [ -s "$FILE" ]; then
              SIZE=$(stat -c%s "$FILE")
              SIZE_MB=$((SIZE / 1024 / 1024))
              
              echo "Sending file $FILE_NUM: $FILE (${SIZE_MB} MB)"
              
              curl -s -X POST "https://tapi.bale.ai/bot${TOKEN}/sendDocument" \
                -F "chat_id=${CHAT_ID}" \
                -F "document=@${FILE}" \
                -F "caption=${FILE} | ${SIZE_MB} MB"
              
              echo "✅ Sent $FILE"
              
              FILE_NUM=$((FILE_NUM + 1))
              sleep 1
            fi
          done
          
          cd ..
          
          # Send completion message
          SENT_COUNT=$((FILE_NUM - 1))
          curl -s -X POST "https://tapi.bale.ai/bot${TOKEN}/sendMessage" \
            -d "chat_id=${CHAT_ID}" \
            -d "text=✅ Done! Sent ${SENT_COUNT} file(s) from ${LINK_COUNT} link(s)."

      - name: Show summary
        run: |
          echo "## 📊 Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Item | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| Links found | ${{ env.LINK_COUNT }} |" >> $GITHUB_STEP_SUMMARY
          if [ -f "download_status.txt" ]; then
            SUCCESS_COUNT=$(grep -c ":SUCCESS:" download_status.txt || echo "0")
            FAILED_COUNT=$(grep -c ":FAILED:" download_status.txt || echo "0")
            echo "| Successfully downloaded | $SUCCESS_COUNT |" >> $GITHUB_STEP_SUMMARY
            echo "| Failed downloads | $FAILED_COUNT |" >> $GITHUB_STEP_SUMMARY
          fi
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Extracted links:" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          cat extracted_links.txt >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

      - name: Cleanup
        run: |
          rm -f download_status.txt extracted_links.txt extracted_links_raw.txt input_text.txt
          rm -rf downloaded_files
          echo "🧹 Cleaned up temporary files"