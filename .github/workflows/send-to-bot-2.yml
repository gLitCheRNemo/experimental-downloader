name: 5- Send To Bot V2

on:
  workflow_dispatch:
    inputs:
      raw_links:
        description: Raw GitHub links (one per line, or space-separated)
        required: true
        type: string
      bale_token:
        description: Bale Bot Token
        required: true
        type: string
      bale_chat_id:
        description: Bale Chat ID
        required: true
        type: string

jobs:
  resend:
    runs-on: ubuntu-latest
    steps:
      - name: Mask sensitive inputs
        run: |
          echo "::add-mask::${{ inputs.bale_token }}"
          echo "::add-mask::${{ inputs.bale_chat_id }}"

      - name: Download files in parallel (5 at a time)
        run: |
          mkdir -p downloaded_files
          cd downloaded_files
          
          # Convert multiline input to array
          LINKS_ARRAY=()
          while IFS= read -r line; do
            [ -n "$line" ] && LINKS_ARRAY+=("$line")
          done <<< "${{ inputs.raw_links }}"
          
          TOTAL_LINKS=${#LINKS_ARRAY[@]}
          echo "Total links to download: $TOTAL_LINKS"
          
          # Function to download a single file
          download_file() {
            local LINK="$1"
            local INDEX="$2"
            echo "[$INDEX] Downloading from: $LINK"
            
            # Download with wget
            wget --content-disposition --trust-server-names --timeout=30 --tries=3 "$LINK" 2>&1
            
            # Find the downloaded file
            DOWNLOADED_FILE=$(ls -t | head -1)
            
            if [ -f "$DOWNLOADED_FILE" ] && [ -s "$DOWNLOADED_FILE" ]; then
              SIZE=$(stat -c%s "$DOWNLOADED_FILE")
              SIZE_MB=$((SIZE / 1024 / 1024))
              echo "[$INDEX] ✅ Downloaded: $DOWNLOADED_FILE (${SIZE_MB} MB)"
              echo "$DOWNLOADED_FILE:SUCCESS:$SIZE" >> ../download_status.txt
            else
              echo "[$INDEX] ❌ Failed to download from: $LINK"
              echo "unknown:FAILED:0" >> ../download_status.txt
            fi
          }
          
          export -f download_file
          
          # Process links in batches of 5
          BATCH_SIZE=5
          for ((i=0; i<TOTAL_LINKS; i+=BATCH_SIZE)); do
            BATCH_END=$((i + BATCH_SIZE))
            BATCH_LINKS=("${LINKS_ARRAY[@]:i:BATCH_SIZE}")
            
            echo ""
            echo "=========================================="
            echo "Downloading batch $((i/BATCH_SIZE + 1)) (${#BATCH_LINKS[@]} files)"
            echo "=========================================="
            
            # Run downloads in parallel for this batch
            for ((j=0; j<${#BATCH_LINKS[@]}; j++)); do
              INDEX=$((i + j + 1))
              download_file "${BATCH_LINKS[$j]}" "$INDEX" &
            done
            
            # Wait for all downloads in this batch to complete
            wait
            
            echo "Batch $((i/BATCH_SIZE + 1)) completed"
            sleep 1
          done
          
          cd ..
          
          echo ""
          echo "=========================================="
          echo "All downloads completed. Files in directory:"
          ls -lh downloaded_files/
          echo "=========================================="

      - name: Send files to Bale bot
        run: |
          TOKEN="${{ inputs.bale_token }}"
          CHAT_ID="${{ inputs.bale_chat_id }}"
          
          # Send header message
          curl -s -X POST "https://tapi.bale.ai/bot${TOKEN}/sendMessage" \
            -d "chat_id=${CHAT_ID}" \
            -d "text=📦 Sending requested files..."
          
          cd downloaded_files
          
          FILE_NUM=1
          for FILE in *; do
            if [ -f "$FILE" ] && [ -s "$FILE" ]; then
              SIZE=$(stat -c%s "$FILE")
              SIZE_MB=$((SIZE / 1024 / 1024))
              
              echo "Sending file $FILE_NUM: $FILE (${SIZE_MB} MB)"
              
              curl -s -X POST "https://tapi.bale.ai/bot${TOKEN}/sendDocument" \
                -F "chat_id=${CHAT_ID}" \
                -F "document=@${FILE}" \
                -F "caption=${FILE} | ${SIZE_MB} MB"
              
              echo "✅ Sent $FILE"
              
              FILE_NUM=$((FILE_NUM + 1))
              sleep 1
            fi
          done
          
          cd ..
          
          # Send completion message
          curl -s -X POST "https://tapi.bale.ai/bot${TOKEN}/sendMessage" \
            -d "chat_id=${CHAT_ID}" \
            -d "text=✅ Done sending all requested files."

      - name: Cleanup
        run: |
          rm -f download_status.txt
          rm -rf downloaded_files
          echo "🧹 Cleaned up temporary files"