name: 5- Send To Bot V2

on:
  workflow_dispatch:
    inputs:
      raw_links:
        description: Raw GitHub links (one per line, or space-separated)
        required: true
        type: string
      bale_token:
        description: Bale Bot Token
        required: true
        type: string
      bale_chat_id:
        description: Bale Chat ID
        required: true
        type: string
      upload_delay:
        description: Delay between uploads (seconds)
        required: false
        type: string
        default: '2'

jobs:
  resend:
    runs-on: ubuntu-latest
    steps:
      - name: Mask sensitive inputs
        run: |
          echo "::add-mask::${{ inputs.bale_token }}"
          echo "::add-mask::${{ inputs.bale_chat_id }}"

      - name: Download files in parallel (5 at a time)
        run: |
          mkdir -p downloaded_files
          cd downloaded_files
          
          # Convert multiline input to array
          LINKS_ARRAY=()
          while IFS= read -r line; do
            [ -n "$line" ] && LINKS_ARRAY+=("$line")
          done <<< "${{ inputs.raw_links }}"
          
          TOTAL_LINKS=${#LINKS_ARRAY[@]}
          echo "Total links to download: $TOTAL_LINKS"
          
          # Function to download a single file
          download_file() {
            local LINK="$1"
            local INDEX="$2"
            echo "[$INDEX] Downloading from: $LINK"
            
            # Download with wget
            wget --content-disposition --trust-server-names --timeout=30 --tries=3 "$LINK" 2>&1
            
            # Find the downloaded file
            DOWNLOADED_FILE=$(ls -t | head -1)
            
            if [ -f "$DOWNLOADED_FILE" ] && [ -s "$DOWNLOADED_FILE" ]; then
              SIZE=$(stat -c%s "$DOWNLOADED_FILE")
              SIZE_MB=$((SIZE / 1024 / 1024))
              echo "[$INDEX] ✅ Downloaded: $DOWNLOADED_FILE (${SIZE_MB} MB)"
              echo "$DOWNLOADED_FILE:SUCCESS:$SIZE" >> ../download_status.txt
            else
              echo "[$INDEX] ❌ Failed to download from: $LINK"
              echo "unknown:FAILED:0" >> ../download_status.txt
            fi
          }
          
          export -f download_file
          
          # Process links in batches of 5
          BATCH_SIZE=5
          for ((i=0; i<TOTAL_LINKS; i+=BATCH_SIZE)); do
            BATCH_END=$((i + BATCH_SIZE))
            BATCH_LINKS=("${LINKS_ARRAY[@]:i:BATCH_SIZE}")
            
            echo ""
            echo "=========================================="
            echo "Downloading batch $((i/BATCH_SIZE + 1)) (${#BATCH_LINKS[@]} files)"
            echo "=========================================="
            
            # Run downloads in parallel for this batch
            for ((j=0; j<${#BATCH_LINKS[@]}; j++)); do
              INDEX=$((i + j + 1))
              download_file "${BATCH_LINKS[$j]}" "$INDEX" &
            done
            
            # Wait for all downloads in this batch to complete
            wait
            
            echo "Batch $((i/BATCH_SIZE + 1)) completed"
            sleep 1
          done
          
          cd ..
          
          echo ""
          echo "=========================================="
          echo "All downloads completed. Files in directory:"
          ls -lh downloaded_files/
          echo "=========================================="

      - name: Send files to Bale bot (with retry)
        run: |
          TOKEN="${{ inputs.bale_token }}"
          CHAT_ID="${{ inputs.bale_chat_id }}"
          UPLOAD_DELAY="${{ inputs.upload_delay }}"
          
          # Validate delay is a number
          if ! [[ "$UPLOAD_DELAY" =~ ^[0-9]+$ ]]; then
            echo "Invalid delay value. Using default 2 seconds."
            UPLOAD_DELAY=2
          fi
          
          # Retry function for sending files
          send_with_retry() {
            local FILE_PATH="$1"
            local FILE_NAME="$2"
            local FILE_SIZE_MB="$3"
            local MAX_RETRIES=3
            local ATTEMPT=1
            
            while [ $ATTEMPT -le $MAX_RETRIES ]; do
              echo "  Attempt $ATTEMPT of $MAX_RETRIES..."
              
              RESPONSE=$(curl -s -w "\n%{http_code}" -X POST "https://tapi.bale.ai/bot${TOKEN}/sendDocument" \
                -F "chat_id=${CHAT_ID}" \
                -F "document=@${FILE_PATH}" \
                -F "caption=${FILE_NAME} | ${FILE_SIZE_MB} MB")
              
              HTTP_CODE=$(echo "$RESPONSE" | tail -n1)
              
              if [ "$HTTP_CODE" -eq 200 ]; then
                echo "  ✅ Sent successfully on attempt $ATTEMPT"
                return 0
              else
                echo "  ❌ Failed with HTTP $HTTP_CODE (attempt $ATTEMPT)"
                if [ $ATTEMPT -lt $MAX_RETRIES ]; then
                  SLEEP_TIME=$((2 ** ATTEMPT))
                  echo "  ⏳ Retrying in $SLEEP_TIME seconds..."
                  sleep $SLEEP_TIME
                fi
              fi
              
              ATTEMPT=$((ATTEMPT + 1))
            done
            
            echo "  ❌ Failed after $MAX_RETRIES attempts"
            return 1
          }
          
          # Send header message
          curl -s -X POST "https://tapi.bale.ai/bot${TOKEN}/sendMessage" \
            -d "chat_id=${CHAT_ID}" \
            -d "text=📦 Sending requested files... (Delay: ${UPLOAD_DELAY}s between files)"
          
          cd downloaded_files
          
          FILE_NUM=1
          FAILED_FILES=""
          TOTAL_FILES=$(ls -1 | wc -l)
          
          for FILE in *; do
            if [ -f "$FILE" ] && [ -s "$FILE" ]; then
              SIZE=$(stat -c%s "$FILE")
              SIZE_MB=$((SIZE / 1024 / 1024))
              
              echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
              echo "📤 Sending file $FILE_NUM of $TOTAL_FILES: $FILE (${SIZE_MB} MB)"
              echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
              
              if send_with_retry "$FILE" "$FILE" "$SIZE_MB"; then
                echo "✅ Sent $FILE"
              else
                echo "❌ Failed to send $FILE after retries"
                FAILED_FILES="$FAILED_FILES $FILE"
              fi
              
              FILE_NUM=$((FILE_NUM + 1))
              
              if [ $FILE_NUM -le $TOTAL_FILES ]; then
                echo "⏳ Waiting $UPLOAD_DELAY seconds before next file..."
                sleep $UPLOAD_DELAY
              fi
            fi
          done
          
          cd ..
          
          # Send completion message
          if [ -z "$FAILED_FILES" ]; then
            curl -s -X POST "https://tapi.bale.ai/bot${TOKEN}/sendMessage" \
              -d "chat_id=${CHAT_ID}" \
              -d "text=✅ Done sending all requested files. Total: $TOTAL_FILES files"
          else
            curl -s -X POST "https://tapi.bale.ai/bot${TOKEN}/sendMessage" \
              -d "chat_id=${CHAT_ID}" \
              -d "text=⚠️ Done sending. Failed files:${FAILED_FILES}"
          fi

      - name: Cleanup
        run: |
          rm -f download_status.txt
          rm -rf downloaded_files
          echo "🧹 Cleaned up temporary files"