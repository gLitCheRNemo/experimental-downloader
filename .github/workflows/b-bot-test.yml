name: B Bot Test

on:
  workflow_dispatch:
    inputs:
      youtube_url:
        description: YouTube video URL
        required: true
        type: string
      quality:
        description: Video quality
        required: true
        default: best
        type: choice
        options:
          - best
          - 2160
          - 1440
          - 1080
          - 720
          - 480
          - audio
      parts_size:
        description: Parts size in MB
        required: false
        type: string
        default: '45'
      bale_token:
        description: Bale Bot Token
        required: true
        type: string
      bale_chat_id:
        description: Bale Chat ID
        required: true
        type: string
      delay_seconds:
        description: Delay between parts in seconds
        required: false
        type: string
        default: '2'

jobs:
  download-split-and-send:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 0

      - name: Mask sensitive inputs
        run: |
          echo "::add-mask::${{ inputs.bale_token }}"
          echo "::add-mask::${{ inputs.bale_chat_id }}"

      - name: Setup FFmpeg
        run: |
          wget https://github.com/yt-dlp/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-linux64-gpl.tar.xz
          tar -xf ffmpeg-master-latest-linux64-gpl.tar.xz
          sudo mv ffmpeg-master-latest-linux64-gpl/bin/ffmpeg /usr/local/bin/
          sudo mv ffmpeg-master-latest-linux64-gpl/bin/ffprobe /usr/local/bin/
          ffmpeg -version

      - name: Setup WARP
        run: |
          docker rm -f warp 2>/dev/null || true
          docker network create warp-net 2>/dev/null || true
          docker run -d \
            --name warp \
            --restart=always \
            --network warp-net \
            -p 1080:1080 \
            --cap-add NET_ADMIN \
            --sysctl net.ipv6.conf.all.disable_ipv6=0 \
            --sysctl net.ipv4.conf.all.src_valid_mark=1 \
            -v warp-data:/var/lib/cloudflare-warp \
            caomingjun/warp
          sleep 15

      - name: Setup yt-dlp
        run: |
          sudo apt-get install -y python3-pip curl
          pip install yt-dlp --pre
          curl -fsSL https://deno.land/install.sh | sh
          export DENO_INSTALL="$HOME/.deno"
          export PATH="$DENO_INSTALL/bin:$PATH"
          echo "$DENO_INSTALL/bin" >> $GITHUB_PATH
          deno --version

      - name: Download video
        id: download
        run: |
          QUALITY="${{ inputs.quality }}"
          if [ "$QUALITY" = "audio" ]; then
            FORMAT_OPTS="-f bestaudio --extract-audio --audio-format mp3"
          elif [ "$QUALITY" = "best" ]; then
            FORMAT_OPTS="-f bestvideo+bestaudio/best --merge-output-format mp4"
          else
            FORMAT_OPTS="-f bestvideo[height<=${QUALITY}]+bestaudio/best[height<=${QUALITY}] --merge-output-format mp4"
          fi
          mkdir -p tmpvideos
          cd tmpvideos
          yt-dlp --remote-components ejs:github --proxy "socks5://127.0.0.1:1080" $FORMAT_OPTS "${{ inputs.youtube_url }}"
          FILE=$(ls -1 | head -n 1)
          SAFE_NAME=$(echo "$FILE" | sed 's/ /_/g')
          echo "FILE=$FILE" >> $GITHUB_ENV
          echo "SAFE_NAME=$SAFE_NAME" >> $GITHUB_ENV
          docker stop warp || true

      - name: Split video
        id: split
        run: |
          PARTS_SIZE="${{ inputs.parts_size }}"
          SAFE_NAME="${{ env.SAFE_NAME }}"
          
          # Get file size in MB
          FILE_SIZE=$(stat -c%s "tmpvideos/${{ env.FILE }}")
          FILE_SIZE_MB=$((FILE_SIZE / 1024 / 1024))
          
          echo "File size: ${FILE_SIZE_MB} MB"
          echo "Split size: ${PARTS_SIZE} MB"
          
          mkdir -p parts
          rm -rf tmpzip
          mkdir tmpzip
          
          if [ $FILE_SIZE_MB -le $PARTS_SIZE ]; then
            echo "File is smaller than split size. Creating single ZIP file."
            cd tmpvideos
            zip -0 "../tmpzip/${SAFE_NAME}.zip" "${{ env.FILE }}"
            cd ..
            cd tmpzip
            mv ${SAFE_NAME}.zip ../parts/
            cd ..
            echo "SINGLE_FILE=true" >> $GITHUB_ENV
            echo "TOTAL_PARTS=1" >> $GITHUB_ENV
          else
            echo "File is larger than split size. Creating split ZIP archive."
            cd tmpvideos
            zip -r -0 -s ${PARTS_SIZE}m "../tmpzip/${SAFE_NAME}.zip" "."
            cd ..
            cd tmpzip
            mv ${SAFE_NAME}.z* ${SAFE_NAME}.zip ../parts/ 2>/dev/null || true
            cd ..
            TOTAL_PARTS=$(ls -1 parts/${SAFE_NAME}.z* 2>/dev/null | wc -l)
            echo "TOTAL_PARTS=$TOTAL_PARTS" >> $GITHUB_ENV
            echo "SINGLE_FILE=false" >> $GITHUB_ENV
          fi
          
          cd parts
          cat > README.txt << 'EOF'
            HOW TO EXTRACT:
            1. If you have a single .zip file, extract it normally with ZArchiver
            2. If you have multiple files (.z01, .z02, .zip), put ALL in same folder and extract the .zip file
          EOF
          ls -lh

      - name: Send to Bale
        run: |
          TOKEN="${{ inputs.bale_token }}"
          CHAT_ID="${{ inputs.bale_chat_id }}"
          DELAY="${{ inputs.delay_seconds }}"
          if ! [[ "$DELAY" =~ ^[0-9]+$ ]]; then
            DELAY=2
          fi
          cd parts
          SAFE_NAME="${{ env.SAFE_NAME }}"
          
          if [ -f "README.txt" ]; then
            curl -s -X POST "https://tapi.bale.ai/bot${TOKEN}/sendDocument" -F "chat_id=${CHAT_ID}" -F "document=@README.txt" -F "caption=Read this first"
            sleep $DELAY
          fi
          
          if [ "${{ env.SINGLE_FILE }}" = "true" ]; then
            # Send single zip file
            if [ -f "${SAFE_NAME}.zip" ]; then
              SIZE=$(stat -c%s "${SAFE_NAME}.zip")
              SIZE_MB=$((SIZE / 1024 / 1024))
              echo "Sending single file ${SAFE_NAME}.zip (${SIZE_MB}MB)"
              curl -s -X POST "https://tapi.bale.ai/bot${TOKEN}/sendDocument" -F "chat_id=${CHAT_ID}" -F "document=@${SAFE_NAME}.zip" -F "caption=Video: ${SAFE_NAME} | ${SIZE_MB}MB"
            fi
          else
            # Send split parts
            PART_NUM=1
            FAILED=""
            for part in $(ls ${SAFE_NAME}.z* 2>/dev/null | sort -V); do
              SIZE=$(stat -c%s "$part")
              SIZE_MB=$((SIZE / 1024 / 1024))
              echo "Sending $part (${SIZE_MB}MB) - Part $PART_NUM/${{ env.TOTAL_PARTS }}"
              curl -s -X POST "https://tapi.bale.ai/bot${TOKEN}/sendDocument" -F "chat_id=${CHAT_ID}" -F "document=@${part}" -F "caption=Part $PART_NUM/${{ env.TOTAL_PARTS }} | ${SIZE_MB}MB"
              if [ $? -ne 0 ]; then
                FAILED="$FAILED $PART_NUM"
              fi
              PART_NUM=$((PART_NUM + 1))
              sleep $DELAY
            done
            if [ -f "${SAFE_NAME}.zip" ]; then
              SIZE=$(stat -c%s "${SAFE_NAME}.zip")
              SIZE_MB=$((SIZE / 1024 / 1024))
              echo "Sending final ${SAFE_NAME}.zip (${SIZE_MB}MB)"
              curl -s -X POST "https://tapi.bale.ai/bot${TOKEN}/sendDocument" -F "chat_id=${CHAT_ID}" -F "document=@${SAFE_NAME}.zip" -F "caption=FINAL - Extract this file | ${SIZE_MB}MB"
            fi
            if [ -n "$FAILED" ]; then
              echo "Partial failure. Failed parts:$FAILED"
              exit 1
            fi
          fi
          
          curl -s -X POST "https://tapi.bale.ai/bot${TOKEN}/sendMessage" -d "chat_id=${CHAT_ID}" -d "text=Done! Delay: ${DELAY}s"

      - name: Cleanup
        run: rm -rf tmpvideos parts tmpzip