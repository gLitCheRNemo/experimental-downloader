name: 1- MD Bot - Producer

on:
  workflow_dispatch:
    inputs:
      magnet_link:
        description: Magnet link or torrent URL
        required: true
        type: string
      parts_size:
        description: Parts size in MB
        required: false
        type: string
        default: '45'
      bale_token:
        description: Bale Bot Token
        required: true
        type: string
      bale_chat_id:
        description: Bale Chat ID
        required: true
        type: string
      delay_seconds:
        description: Delay between sending parts (seconds)
        required: false
        type: string
        default: '2'

jobs:
  produce:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Mask sensitive inputs
        run: |
          echo "::add-mask::${{ inputs.bale_token }}"
          echo "::add-mask::${{ inputs.bale_chat_id }}"

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-pip aria2 zip p7zip-full
          pip install yt-dlp

      - name: Download torrent
        id: download
        run: |
          MAGNET="${{ inputs.magnet_link }}"
          mkdir -p downloads
          cd downloads
          aria2c --seed-time=0 --max-connection-per-server=16 --split=16 --console-log-level=error "$MAGNET"
          FILE=$(ls -1 | head -n 1)
          SAFE_NAME=$(echo "$FILE" | sed 's/ /_/g' | sed 's/[^a-zA-Z0-9._-]/_/g')
          echo "FILE=$FILE" >> $GITHUB_ENV
          echo "SAFE_NAME=$SAFE_NAME" >> $GITHUB_ENV
          cd ..

      - name: Split file into parts
        id: split
        run: |
          PARTS_SIZE="${{ inputs.parts_size }}"
          SAFE_NAME="${{ env.SAFE_NAME }}"
          FILE_PATH="downloads/${{ env.FILE }}"
          FILE_SIZE=$(stat -c%s "$FILE_PATH")
          FILE_SIZE_MB=$((FILE_SIZE / 1024 / 1024))
          
          mkdir -p tmpzip
          
          if [ $FILE_SIZE_MB -le $PARTS_SIZE ]; then
            zip -0 "tmpzip/${SAFE_NAME}.zip" "$FILE_PATH"
            echo "SINGLE_FILE=true" >> $GITHUB_ENV
          else
            cd downloads
            zip -r -0 -s ${PARTS_SIZE}m "../tmpzip/${SAFE_NAME}.zip" "."
            cd ..
            cd tmpzip
            TOTAL_PARTS=$(ls -1 ${SAFE_NAME}.z* 2>/dev/null | wc -l)
            echo "TOTAL_PARTS=$TOTAL_PARTS" >> $GITHUB_ENV
            echo "SINGLE_FILE=false" >> $GITHUB_ENV
            cd ..
          fi

      - name: Save parts to persistent branch (batches of 5)
        run: |
          BRANCH_NAME="md-parts"
          echo "BRANCH_NAME=$BRANCH_NAME" >> $GITHUB_ENV
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          
          # Delete old branch if exists
          git push origin --delete $BRANCH_NAME 2>/dev/null || true
          
          # Create fresh orphan branch
          git checkout --orphan $BRANCH_NAME
          git rm -rf . || true
          
          # Copy all files to the branch root
          cp -r tmpzip/* . 2>/dev/null || true
          
          # Get list of files to commit
          FILES=$(ls -1 2>/dev/null | sort -V)
          TOTAL_FILES=$(echo "$FILES" | wc -l)
          
          if [ "$TOTAL_FILES" -eq 0 ]; then
            echo "No files to commit"
            exit 1
          fi
          
          echo "Total files to commit: $TOTAL_FILES"
          
          # Commit in batches of 5
          BATCH_SIZE=5
          BATCH_NUM=1
          TEMP_LIST=$(mktemp)
          echo "$FILES" > "$TEMP_LIST"
          
          while [ $(cat "$TEMP_LIST" | wc -l) -gt 0 ]; do
            # Take first BATCH_SIZE files
            BATCH_FILES=$(head -n $BATCH_SIZE "$TEMP_LIST")
            
            # Remove these files from the list
            tail -n +$((BATCH_SIZE + 1)) "$TEMP_LIST" > "$TEMP_LIST.tmp" 2>/dev/null || true
            mv "$TEMP_LIST.tmp" "$TEMP_LIST"
            
            # Add this batch of files
            for file in $BATCH_FILES; do
              if [ -f "$file" ]; then
                git add "$file"
                echo "  Added: $file"
              fi
            done
            
            # Commit this batch
            git commit -m "[bot] Batch $BATCH_NUM: Add $(echo $BATCH_FILES | wc -w) files"
            echo "✅ Batch $BATCH_NUM committed ($(echo $BATCH_FILES | wc -w) files)"
            
            BATCH_NUM=$((BATCH_NUM + 1))
          done
          
          rm -f "$TEMP_LIST"
          
          # Push all batches to the branch
          git push origin $BRANCH_NAME
          echo "✅ All $TOTAL_FILES files pushed to branch $BRANCH_NAME in $((BATCH_NUM - 1)) batches"

      - name: Send parts to Bale one by one
        run: |
          TOKEN="${{ inputs.bale_token }}"
          CHAT_ID="${{ inputs.bale_chat_id }}"
          DELAY="${{ inputs.delay_seconds }}"
          SAFE_NAME="${{ env.SAFE_NAME }}"
          BRANCH_NAME="${{ env.BRANCH_NAME }}"
          REPO="${{ github.repository }}"
          
          if ! [[ "$DELAY" =~ ^[0-9]+$ ]]; then
            DELAY=2
          fi
          
          # Send video name with down arrow
          VIDEO_NAME=$(echo "$SAFE_NAME" | sed 's/_/ /g')
          curl -s -X POST "https://tapi.bale.ai/bot${TOKEN}/sendMessage" \
            -d "chat_id=${CHAT_ID}" \
            -d "text=${VIDEO_NAME}%0A⬇️"
          
          if [ "${{ env.SINGLE_FILE }}" = "true" ]; then
            # Send single zip file
            RAW_URL="https://raw.githubusercontent.com/${REPO}/${BRANCH_NAME}/${SAFE_NAME}.zip"
            curl -L -o "${SAFE_NAME}.zip" "$RAW_URL"
            SIZE=$(stat -c%s "${SAFE_NAME}.zip")
            SIZE_MB=$((SIZE / 1024 / 1024))
            curl -s -X POST "https://tapi.bale.ai/bot${TOKEN}/sendDocument" \
              -F "chat_id=${CHAT_ID}" \
              -F "document=@${SAFE_NAME}.zip" \
              -F "caption=${VIDEO_NAME} | ${SIZE_MB}MB"
          else
            # Send each .z* part
            TOTAL_PARTS=${{ env.TOTAL_PARTS }}
            for PART_NUM in $(seq 1 $TOTAL_PARTS); do
              PART_NUM_PADDED=$(printf "%02d" $PART_NUM)
              FILE_NAME="${SAFE_NAME}.z${PART_NUM_PADDED}"
              RAW_URL="https://raw.githubusercontent.com/${REPO}/${BRANCH_NAME}/${FILE_NAME}"
              
              echo "Downloading and sending $FILE_NAME (Part $PART_NUM of $TOTAL_PARTS)"
              curl -L -o "$FILE_NAME" "$RAW_URL"
              
              SIZE=$(stat -c%s "$FILE_NAME")
              SIZE_MB=$((SIZE / 1024 / 1024))
              
              curl -s -X POST "https://tapi.bale.ai/bot${TOKEN}/sendDocument" \
                -F "chat_id=${CHAT_ID}" \
                -F "document=@${FILE_NAME}" \
                -F "caption=Part $PART_NUM of $TOTAL_PARTS | ${SIZE_MB}MB"
              
              rm -f "$FILE_NAME"
              sleep $DELAY
            done
            
            # Send final .zip file
            RAW_URL="https://raw.githubusercontent.com/${REPO}/${BRANCH_NAME}/${SAFE_NAME}.zip"
            curl -L -o "${SAFE_NAME}.zip" "$RAW_URL"
            SIZE=$(stat -c%s "${SAFE_NAME}.zip")
            SIZE_MB=$((SIZE / 1024 / 1024))
            curl -s -X POST "https://tapi.bale.ai/bot${TOKEN}/sendDocument" \
              -F "chat_id=${CHAT_ID}" \
              -F "document=@${SAFE_NAME}.zip" \
              -F "caption=FINAL - Extract this file | ${SIZE_MB}MB"
          fi
          
          # Send completion message
          curl -s -X POST "https://tapi.bale.ai/bot${TOKEN}/sendMessage" \
            -d "chat_id=${CHAT_ID}" \
            -d "text=✅ Done! Branch: ${BRANCH_NAME} | Total parts: ${{ env.TOTAL_PARTS }} | Delay: ${DELAY}s%0A%0A⚠️ Run Cleanup when done to delete the branch."

      - name: Cleanup local files
        run: rm -rf downloads tmpzip