name: 1- MD Bot - Producer

on:
  workflow_dispatch:
    inputs:
      magnet_link:
        description: Magnet link or torrent URL
        required: true
        type: string
      parts_size:
        description: Parts size in MB
        required: false
        type: string
        default: '45'
      bale_token:
        description: Bale Bot Token
        required: true
        type: string
      bale_chat_id:
        description: Bale Chat ID
        required: true
        type: string
      delay_seconds:
        description: Delay between sending parts (seconds)
        required: false
        type: string
        default: '2'

jobs:
  produce:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Mask sensitive inputs
        run: |
          echo "::add-mask::${{ inputs.bale_token }}"
          echo "::add-mask::${{ inputs.bale_chat_id }}"

      - name: Prepare md-parts branch
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git fetch origin

          if git ls-remote --exit-code --heads origin md-parts; then
            git checkout md-parts
            git pull origin md-parts
          else
            git checkout --orphan md-parts
            git rm -rf . || true
            mkdir -p md-parts
            git commit --allow-empty -m "[bot] Initialize md-parts branch"
            git push --set-upstream origin md-parts
          fi

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-pip aria2 zip p7zip-full
          pip install yt-dlp

      - name: Download torrent
        id: download
        run: |
          MAGNET="${{ inputs.magnet_link }}"
          mkdir -p tmpmagnet
          cd tmpmagnet
          
          aria2c \
            --enable-dht=true \
            --bt-enable-lpd=true \
            --bt-max-peers=0 \
            --seed-time=0 \
            --follow-torrent=true \
            --check-integrity=true \
            --dir=. \
            "$MAGNET"
          
          echo "Download completed"
          
          # Find the downloaded file/directory
          FILE=$(ls -1 | head -n 1)
          SAFE_NAME=$(echo "$FILE" | sed 's/ /_/g' | sed 's/[^a-zA-Z0-9._-]/_/g')
          echo "FILE=$FILE" >> $GITHUB_ENV
          echo "SAFE_NAME=$SAFE_NAME" >> $GITHUB_ENV
          cd ..

      - name: Split file into parts
        id: split
        run: |
          PARTS_SIZE="${{ inputs.parts_size }}"
          SAFE_NAME="${{ env.SAFE_NAME }}"
          FILE_PATH="tmpmagnet/${{ env.FILE }}"
          
          mkdir -p md-parts
          
          # Check if it's a file or directory
          if [ -d "$FILE_PATH" ]; then
            echo "Zipping directory contents"
            cd tmpmagnet
            zip -0 -r -s ${PARTS_SIZE}m "../md-parts/${SAFE_NAME}.zip" "${{ env.FILE }}"
            cd ..
          else
            FILE_SIZE=$(stat -c%s "$FILE_PATH")
            FILE_SIZE_MB=$((FILE_SIZE / 1024 / 1024))
            
            if [ $FILE_SIZE_MB -le $PARTS_SIZE ]; then
              echo "File is smaller than split size. Creating single ZIP."
              zip -0 "md-parts/${SAFE_NAME}.zip" "$FILE_PATH"
              echo "SINGLE_FILE=true" >> $GITHUB_ENV
            else
              echo "File is larger than split size. Creating split ZIP."
              cd tmpmagnet
              zip -0 -r -s ${PARTS_SIZE}m "../md-parts/${SAFE_NAME}.zip" "${{ env.FILE }}"
              cd ..
              cd md-parts
              TOTAL_PARTS=$(ls -1 ${SAFE_NAME}.z* 2>/dev/null | wc -l)
              echo "TOTAL_PARTS=$TOTAL_PARTS" >> $GITHUB_ENV
              echo "SINGLE_FILE=false" >> $GITHUB_ENV
              cd ..
            fi
          fi

      - name: Generate README with Download Links
        run: |
          cd md-parts
          rm -f README.md
          
          echo "# 📥 Download Links" > README.md
          echo "Generated on: $(date)" >> README.md
          echo "" >> README.md
          echo "## Files in this branch:" >> README.md
          echo "" >> README.md
          
          for file in *; do
            if [ -f "$file" ] && [ "$file" != "README.md" ]; then
              filename=$(basename "$file")
              encoded_filename=$(python3 -c "import urllib.parse, sys; print(urllib.parse.quote(sys.argv[1]))" "$filename")
              url="https://github.com/${{ github.repository }}/raw/md-parts/$encoded_filename"
              echo "- [Download $filename]($url)" >> README.md
            fi
          done
          
          echo "" >> README.md
          echo "## Missing a part?" >> README.md
          echo "" >> README.md
          echo "Run the **MD Bot - Resender** workflow and enter the part number." >> README.md
          
          cd ..

      - name: Commit and Push in Batches of 5
        run: |
          # Ensure we are on the md-parts branch
          git checkout md-parts
          
          # Check if md-parts directory exists and has files
          if [ ! -d "md-parts" ] || [ -z "$(ls -A md-parts 2>/dev/null)" ]; then
            echo "No files found in md-parts directory. Skipping commit."
            exit 0
          fi
          
          # Store list of files
          ls md-parts/* 2>/dev/null > file_list.txt || true
          
          TOTAL_FILES=$(cat file_list.txt | wc -l)
          echo "Total files to commit: $TOTAL_FILES"
          
          if [ "$TOTAL_FILES" -eq 0 ]; then
            echo "No new files to commit"
            rm -f file_list.txt
            exit 0
          fi
          
          BATCH_SIZE=5
          BATCH_NUM=1
          
          while [ $(cat file_list.txt | wc -l) -gt 0 ]; do
            BATCH_FILES=$(head -n $BATCH_SIZE file_list.txt)
            
            tail -n +$((BATCH_SIZE + 1)) file_list.txt > temp_list.txt 2>/dev/null || touch temp_list.txt
            mv temp_list.txt file_list.txt
            
            echo "📦 Processing batch $BATCH_NUM with $(echo $BATCH_FILES | wc -w) files..."
            
            for file in $BATCH_FILES; do
              if [ -f "$file" ]; then
                git add "$file"
                echo "  Added: $(basename "$file")"
              fi
            done
            
            if [ $BATCH_NUM -eq 1 ] && [ -f "md-parts/README.md" ]; then
              git add md-parts/README.md
              echo "  Added: README.md"
            fi
            
            # Only commit if there are changes
            if ! git diff --cached --quiet; then
              git commit -m "[bot] Add files batch $BATCH_NUM ($(echo $BATCH_FILES | wc -w) files)"
              git push origin md-parts
              echo "✅ Batch $BATCH_NUM committed and pushed successfully"
            else
              echo "⚠️ No changes to commit in batch $BATCH_NUM"
            fi
            
            BATCH_NUM=$((BATCH_NUM + 1))
            
            sleep 2
          done
          
          echo "✅ All $TOTAL_FILES files committed and pushed successfully to md-parts branch in $((BATCH_NUM - 1)) batches"
          rm -f file_list.txt temp_list.txt

      - name: Send parts to Bale one by one
        run: |
          TOKEN="${{ inputs.bale_token }}"
          CHAT_ID="${{ inputs.bale_chat_id }}"
          DELAY="${{ inputs.delay_seconds }}"
          SAFE_NAME="${{ env.SAFE_NAME }}"
          REPO="${{ github.repository }}"
          BRANCH_NAME="md-parts"
          
          if ! [[ "$DELAY" =~ ^[0-9]+$ ]]; then
            DELAY=2
          fi
          
          # Send video name with down arrow
          VIDEO_NAME=$(echo "$SAFE_NAME" | sed 's/_/ /g')
          curl -s -X POST "https://tapi.bale.ai/bot${TOKEN}/sendMessage" \
            -d "chat_id=${CHAT_ID}" \
            -d "text=${VIDEO_NAME}%0A⬇️"
          
          if [ "${{ env.SINGLE_FILE }}" = "true" ]; then
            # Send single zip file
            RAW_URL="https://raw.githubusercontent.com/${REPO}/${BRANCH_NAME}/${SAFE_NAME}.zip"
            echo "Downloading: $RAW_URL"
            curl -L -o "${SAFE_NAME}.zip" "$RAW_URL"
            SIZE=$(stat -c%s "${SAFE_NAME}.zip")
            SIZE_MB=$((SIZE / 1024 / 1024))
            curl -s -X POST "https://tapi.bale.ai/bot${TOKEN}/sendDocument" \
              -F "chat_id=${CHAT_ID}" \
              -F "document=@${SAFE_NAME}.zip" \
              -F "caption=${VIDEO_NAME} | ${SIZE_MB}MB"
          else
            # Send each .z* part
            TOTAL_PARTS=${{ env.TOTAL_PARTS }}
            for PART_NUM in $(seq 1 $TOTAL_PARTS); do
              PART_NUM_PADDED=$(printf "%02d" $PART_NUM)
              FILE_NAME="${SAFE_NAME}.z${PART_NUM_PADDED}"
              RAW_URL="https://raw.githubusercontent.com/${REPO}/${BRANCH_NAME}/${FILE_NAME}"
              
              echo "Downloading and sending $FILE_NAME (Part $PART_NUM of $TOTAL_PARTS)"
              curl -L -o "$FILE_NAME" "$RAW_URL"
              
              if [ -f "$FILE_NAME" ]; then
                SIZE=$(stat -c%s "$FILE_NAME")
                SIZE_MB=$((SIZE / 1024 / 1024))
                
                curl -s -X POST "https://tapi.bale.ai/bot${TOKEN}/sendDocument" \
                  -F "chat_id=${CHAT_ID}" \
                  -F "document=@${FILE_NAME}" \
                  -F "caption=Part $PART_NUM of $TOTAL_PARTS | ${SIZE_MB}MB"
                
                rm -f "$FILE_NAME"
              else
                echo "Failed to download $FILE_NAME"
              fi
              
              sleep $DELAY
            done
            
            # Send final .zip file
            RAW_URL="https://raw.githubusercontent.com/${REPO}/${BRANCH_NAME}/${SAFE_NAME}.zip"
            echo "Downloading final zip: $RAW_URL"
            curl -L -o "${SAFE_NAME}.zip" "$RAW_URL"
            SIZE=$(stat -c%s "${SAFE_NAME}.zip")
            SIZE_MB=$((SIZE / 1024 / 1024))
            curl -s -X POST "https://tapi.bale.ai/bot${TOKEN}/sendDocument" \
              -F "chat_id=${CHAT_ID}" \
              -F "document=@${SAFE_NAME}.zip" \
              -F "caption=FINAL - Extract this file | ${SIZE_MB}MB"
          fi
          
          # Send completion message
          curl -s -X POST "https://tapi.bale.ai/bot${TOKEN}/sendMessage" \
            -d "chat_id=${CHAT_ID}" \
            -d "text=✅ Done! Branch: ${BRANCH_NAME} | Total parts: ${{ env.TOTAL_PARTS }} | Delay: ${DELAY}s%0A%0A⚠️ Run Cleanup when done to delete the branch."

      - name: Cleanup local files
        run: rm -rf tmpmagnet md-parts