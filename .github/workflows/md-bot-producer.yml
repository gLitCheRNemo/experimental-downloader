name: 1- MD Bot - Producer

on:
  workflow_dispatch:
    inputs:
      magnet_link:
        description: Magnet link or torrent URL
        required: true
        type: string
      parts_size:
        description: Parts size in MB
        required: false
        type: string
        default: '45'
      bale_token:
        description: Bale Bot Token
        required: true
        type: string
      bale_chat_id:
        description: Bale Chat ID
        required: true
        type: string
      delay_seconds:
        description: Delay between sending parts (seconds)
        required: false
        type: string
        default: '2'

jobs:
  produce:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Mask sensitive inputs
        run: |
          echo "::add-mask::${{ inputs.bale_token }}"
          echo "::add-mask::${{ inputs.bale_chat_id }}"

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-pip aria2 zip p7zip-full
          pip install yt-dlp

      - name: Download torrent
        id: download
        run: |
          MAGNET="${{ inputs.magnet_link }}"
          mkdir -p tmpmagnet
          cd tmpmagnet
          
          aria2c \
            --enable-dht=true \
            --bt-enable-lpd=true \
            --bt-max-peers=0 \
            --seed-time=0 \
            --follow-torrent=true \
            --check-integrity=true \
            --dir=. \
            "$MAGNET"
          
          echo "Download completed"
          
          FILE=$(ls -1 | head -n 1)
          SAFE_NAME=$(echo "$FILE" | sed 's/ /_/g' | sed 's/[^a-zA-Z0-9._-]/_/g')
          echo "FILE=$FILE" >> $GITHUB_ENV
          echo "SAFE_NAME=$SAFE_NAME" >> $GITHUB_ENV
          cd ..

      - name: Split file into parts
        id: split
        run: |
          PARTS_SIZE="${{ inputs.parts_size }}"
          SAFE_NAME="${{ env.SAFE_NAME }}"
          FILE_PATH="tmpmagnet/${{ env.FILE }}"
          
          mkdir -p split_parts
          
          if [ -d "$FILE_PATH" ]; then
            echo "Zipping directory contents"
            cd tmpmagnet
            zip -0 -r -s ${PARTS_SIZE}m "../split_parts/${SAFE_NAME}.zip" "${{ env.FILE }}"
            cd ..
          else
            FILE_SIZE=$(stat -c%s "$FILE_PATH")
            FILE_SIZE_MB=$((FILE_SIZE / 1024 / 1024))
            
            if [ $FILE_SIZE_MB -le $PARTS_SIZE ]; then
              echo "File is smaller than split size. Creating single ZIP."
              zip -0 "split_parts/${SAFE_NAME}.zip" "$FILE_PATH"
              echo "SINGLE_FILE=true" >> $GITHUB_ENV
            else
              echo "File is larger than split size. Creating split ZIP."
              cd tmpmagnet
              zip -0 -r -s ${PARTS_SIZE}m "../split_parts/${SAFE_NAME}.zip" "${{ env.FILE }}"
              cd ..
              cd split_parts
              TOTAL_PARTS=$(ls -1 ${SAFE_NAME}.z* 2>/dev/null | wc -l)
              echo "TOTAL_PARTS=$TOTAL_PARTS" >> $GITHUB_ENV
              echo "SINGLE_FILE=false" >> $GITHUB_ENV
              cd ..
            fi
          fi

      - name: Send parts to Bale FIRST
        run: |
          TOKEN="${{ inputs.bale_token }}"
          CHAT_ID="${{ inputs.bale_chat_id }}"
          DELAY="${{ inputs.delay_seconds }}"
          SAFE_NAME="${{ env.SAFE_NAME }}"
          
          if ! [[ "$DELAY" =~ ^[0-9]+$ ]]; then
            DELAY=2
          fi
          
          # Send video name with down arrow
          VIDEO_NAME=$(echo "$SAFE_NAME" | sed 's/_/ /g')
          curl -s -X POST "https://tapi.bale.ai/bot${TOKEN}/sendMessage" \
            -d "chat_id=${CHAT_ID}" \
            -d "text=${VIDEO_NAME}%0A⬇️"
          
          cd split_parts
          
          if [ "${{ env.SINGLE_FILE }}" = "true" ]; then
            # Send single zip file
            if [ -f "${SAFE_NAME}.zip" ]; then
              SIZE=$(stat -c%s "${SAFE_NAME}.zip")
              SIZE_MB=$((SIZE / 1024 / 1024))
              curl -s -X POST "https://tapi.bale.ai/bot${TOKEN}/sendDocument" \
                -F "chat_id=${CHAT_ID}" \
                -F "document=@${SAFE_NAME}.zip" \
                -F "caption=${VIDEO_NAME} | ${SIZE_MB}MB"
            fi
          else
            # Send each .z* part
            TOTAL_PARTS=${{ env.TOTAL_PARTS }}
            for PART_NUM in $(seq 1 $TOTAL_PARTS); do
              PART_NUM_PADDED=$(printf "%02d" $PART_NUM)
              FILE_NAME="${SAFE_NAME}.z${PART_NUM_PADDED}"
              
              if [ -f "$FILE_NAME" ]; then
                SIZE=$(stat -c%s "$FILE_NAME")
                SIZE_MB=$((SIZE / 1024 / 1024))
                
                echo "Sending $FILE_NAME (Part $PART_NUM of $TOTAL_PARTS)"
                curl -s -X POST "https://tapi.bale.ai/bot${TOKEN}/sendDocument" \
                  -F "chat_id=${CHAT_ID}" \
                  -F "document=@${FILE_NAME}" \
                  -F "caption=Part $PART_NUM of $TOTAL_PARTS | ${SIZE_MB}MB"
                
                sleep $DELAY
              fi
            done
            
            # Send final .zip file
            if [ -f "${SAFE_NAME}.zip" ]; then
              SIZE=$(stat -c%s "${SAFE_NAME}.zip")
              SIZE_MB=$((SIZE / 1024 / 1024))
              curl -s -X POST "https://tapi.bale.ai/bot${TOKEN}/sendDocument" \
                -F "chat_id=${CHAT_ID}" \
                -F "document=@${SAFE_NAME}.zip" \
                -F "caption=FINAL - Extract this file | ${SIZE_MB}MB"
            fi
          fi
          
          cd ..

      - name: Create branch with README at root
        run: |
          BRANCH_NAME="md-parts-$(date +'%Y%m%d-%H%M%S')"
          echo "BRANCH_NAME=$BRANCH_NAME" >> $GITHUB_ENV
          
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          
          # Create fresh orphan branch
          git checkout --orphan $BRANCH_NAME
          git rm -rf . || true
          
          # Copy split parts to root (NOT in a subfolder)
          cp -r split_parts/* . 2>/dev/null || true
          
          # Create README.md at root with download links
          cat > README.md << EOF
          # Download Links - ${SAFE_NAME}

          Generated on: $(date)

          ## Files in this branch:

          EOF
          
          for file in *; do
            if [ -f "$file" ] && [ "$file" != "README.md" ]; then
              encoded_filename=$(python3 -c "import urllib.parse, sys; print(urllib.parse.quote(sys.argv[1]))" "$file")
              echo "- [${file}](https://raw.githubusercontent.com/${{ github.repository }}/${BRANCH_NAME}/${encoded_filename})" >> README.md
            fi
          done
          
          cat >> README.md << EOF

          ## Missing a part?

          Run the **MD Bot - Resender** workflow with:
          - Branch name: \`${BRANCH_NAME}\`
          - Part numbers: (e.g., \`5 12 18\` or \`final\`)
          EOF
          
          # Add all files
          git add .
          git commit -m "[bot] Add files for ${{ env.SAFE_NAME }}"
          git push origin $BRANCH_NAME
          
          echo "✅ Branch $BRANCH_NAME created with README at root"

      - name: Send branch name to Bale
        run: |
          TOKEN="${{ inputs.bale_token }}"
          CHAT_ID="${{ inputs.bale_chat_id }}"
          BRANCH_NAME="${{ env.BRANCH_NAME }}"
          REPO="${{ github.repository }}"
          
          curl -s -X POST "https://tapi.bale.ai/bot${TOKEN}/sendMessage" \
            -d "chat_id=${CHAT_ID}" \
            -d "text=📁 Branch: ${BRANCH_NAME}%0A📂 URL: https://github.com/${REPO}/tree/${BRANCH_NAME}%0A%0A⚠️ Run Cleanup when done to delete this branch."

      - name: Cleanup local files
        run: rm -rf tmpmagnet split_parts