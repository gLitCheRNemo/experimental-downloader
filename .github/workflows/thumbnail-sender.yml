name: Thumbnail Sender

on:
  workflow_dispatch:
    inputs:
      youtube_url:
        description: '🔗 YouTube video URL'
        required: true
        type: string
      bale_token:
        description: '🤖 Bale Bot Token'
        required: true
        type: string
      bale_chat_id:
        description: '💬 Bale Chat ID'
        required: true
        type: string

jobs:
  thumbnail-sender:
    runs-on: ubuntu-latest
    
    steps:
      - name: Mask sensitive inputs
        run: |
          echo "::add-mask::${{ inputs.bale_token }}"
          echo "::add-mask::${{ inputs.bale_chat_id }}"

      - name: Setup yt-dlp
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-pip
          pip install yt-dlp

      - name: Get video info and download thumbnail
        id: download
        run: |
          URL="${{ inputs.youtube_url }}"
          
          # First, get the video title using yt-dlp
          VIDEO_TITLE=$(yt-dlp --get-title "$URL")
          echo "VIDEO_TITLE=$VIDEO_TITLE" >> $GITHUB_ENV
          echo "Video title: $VIDEO_TITLE"
          
          # Download all available thumbnail formats to see what's available
          echo "Listing available thumbnails:"
          yt-dlp --list-thumbnails "$URL"
          
          # Download the best quality thumbnail (yt-dlp will save it in its original format)
          # Using --write-thumbnail without --convert-thumbnails keeps original format
          yt-dlp --skip-download --write-thumbnail --output "thumbnail.%(ext)s" "$URL"
          
          # Find the downloaded thumbnail file (whatever extension it has)
          THUMBNAIL_FILE=$(ls thumbnail.* 2>/dev/null | head -1)
          
          if [ -z "$THUMBNAIL_FILE" ]; then
            echo "❌ Failed to download thumbnail"
            exit 1
          fi
          
          # Get the file extension
          THUMBNAIL_EXT="${THUMBNAIL_FILE##*.}"
          echo "THUMBNAIL_FILE=$THUMBNAIL_FILE" >> $GITHUB_ENV
          echo "THUMBNAIL_EXT=$THUMBNAIL_EXT" >> $GITHUB_ENV
          echo "✅ Downloaded thumbnail: $THUMBNAIL_FILE (format: $THUMBNAIL_EXT)"

      - name: Detect thumbnail extension and prepare for sending
        id: detect
        run: |
          THUMBNAIL_FILE="${{ env.THUMBNAIL_FILE }}"
          THUMBNAIL_EXT="${{ env.THUMBNAIL_EXT }}"
          
          # Verify the file exists and has content
          if [ ! -f "$THUMBNAIL_FILE" ]; then
            echo "❌ Thumbnail file not found!"
            exit 1
          fi
          
          FILE_SIZE=$(stat -c%s "$THUMBNAIL_FILE")
          echo "File size: $FILE_SIZE bytes"
          
          # Bale Bot accepts: jpg, jpeg, png, gif, webp (and more)
          case "$THUMBNAIL_EXT" in
            jpg|jpeg|png|gif|webp)
              echo "✅ Supported format: $THUMBNAIL_EXT"
              ;;
            *)
              echo "⚠️ Warning: Unusual format '$THUMBNAIL_EXT', but will attempt to send anyway"
              ;;
          esac

      - name: Send thumbnail to Bale Bot with video title as caption
        run: |
          TOKEN="${{ inputs.bale_token }}"
          CHAT_ID="${{ inputs.bale_chat_id }}"
          VIDEO_TITLE="${{ env.VIDEO_TITLE }}"
          THUMBNAIL_FILE="${{ env.THUMBNAIL_FILE }}"
          
          # Send the photo using Bale Bot API
          # The 'photo' parameter accepts file upload via @filename
          echo "Sending thumbnail to Bale Bot..."
          
          RESPONSE=$(curl -s -w "\n%{http_code}" -X POST "https://tapi.bale.ai/bot${TOKEN}/sendPhoto" \
            -F "chat_id=${CHAT_ID}" \
            -F "photo=@${THUMBNAIL_FILE}" \
            -F "caption=🎬 *${VIDEO_TITLE}*" \
            -F "parse_mode=Markdown")
          
          # Get HTTP status code (last line)
          HTTP_CODE=$(echo "$RESPONSE" | tail -n1)
          # Get response body (everything except last line)
          BODY=$(echo "$RESPONSE" | sed '$d')
          
          if [ "$HTTP_CODE" -eq 200 ]; then
            echo "✅ Thumbnail sent successfully!"
            echo "Response: $BODY"
          else
            echo "❌ Failed to send thumbnail. HTTP code: $HTTP_CODE"
            echo "Response: $BODY"
            exit 1
          fi

      - name: Show summary
        run: |
          echo "## 📸 Thumbnail Sender Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Item | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| Video URL | ${{ inputs.youtube_url }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Video Title | ${{ env.VIDEO_TITLE }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Thumbnail File | ${{ env.THUMBNAIL_FILE }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Thumbnail Format | ${{ env.THUMBNAIL_EXT }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "✅ Thumbnail sent to Bale Bot successfully!"

      - name: Cleanup
        run: |
          rm -f thumbnail.*
          echo "🧹 Cleaned up temporary files"