name: Thumbnail Sender

on:
  workflow_dispatch:
    inputs:
      youtube_url:
        description: '🔗 YouTube video URL'
        required: true
        type: string
      bale_token:
        description: '🤖 Bale Bot Token (for sending files)'
        required: true
        type: string
      bale_chat_id:
        description: '💬 Bale Chat ID (for sending files)'
        required: true
        type: string

jobs:
  # ============================================
  # JOB 1: Download thumbnail and create README
  # ============================================
  thumbnail-and-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 0

      - name: Prepare thumbnails branch
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git fetch origin

          if git ls-remote --exit-code --heads origin thumbnails; then
            git checkout thumbnails
            git pull origin thumbnails
          else
            git checkout --orphan thumbnails
            git rm -rf . || true
            mkdir -p thumbnails
            git commit --allow-empty -m "[bot] Initialize thumbnails branch"
            git push --set-upstream origin thumbnails
          fi

      # ============================================
      # EXTRACT VIDEO ID FROM YOUTUBE URL
      # Supports: youtube.com, youtu.be, m.youtube.com, etc.
      # ============================================
      - name: Extract video ID and title
        id: extract
        run: |
          URL="${{ inputs.youtube_url }}"
          
          echo "=========================================="
          echo "Extracting video ID from: $URL"
          echo "=========================================="
          
          # Extract video ID using regex (supports multiple YouTube URL formats)
          VIDEO_ID=$(echo "$URL" | grep -oP '(?<=v=)[^&]+|(?<=youtu\.be/)[^?]+|(?<=embed/)[^?]+|(?<=shorts/)[^?]+' | head -1)
          
          if [ -z "$VIDEO_ID" ]; then
            echo "❌ Failed to extract video ID from URL"
            echo "Supported formats:"
            echo "  - https://www.youtube.com/watch?v=VIDEO_ID"
            echo "  - https://youtu.be/VIDEO_ID"
            echo "  - https://www.youtube.com/embed/VIDEO_ID"
            echo "  - https://www.youtube.com/shorts/VIDEO_ID"
            exit 1
          fi
          
          echo "✅ Extracted VIDEO_ID: $VIDEO_ID"
          echo "VIDEO_ID=$VIDEO_ID" >> $GITHUB_ENV
          
          # Get video title using simple oEmbed API (no yt-dlp needed)
          echo "Fetching video title from oEmbed API..."
          TITLE=$(curl -s "https://www.youtube.com/oembed?url=https://www.youtube.com/watch?v=$VIDEO_ID&format=json" | python3 -c "import sys, json; data=json.load(sys.stdin); print(data.get('title', 'Unknown'))" 2>/dev/null || echo "Unknown")
          
          echo "✅ Video title: $TITLE"
          echo "VIDEO_TITLE=$TITLE" >> $GITHUB_ENV
          
          # Create safe filename from video title
          SAFE_NAME=$(echo "$TITLE" | sed 's/[^a-zA-Z0-9]/_/g' | tr -s '_' | sed 's/^_//;s/_$//')
          echo "SAFE_NAME=$SAFE_NAME" >> $GITHUB_ENV

      # ============================================
      # DOWNLOAD THUMBNAIL USING DIRECT URL METHOD
      # No tools required - just wget
      # ============================================
      - name: Download thumbnail
        id: download
        run: |
          VIDEO_ID="${{ env.VIDEO_ID }}"
          SAFE_NAME="${{ env.SAFE_NAME }}"
          
          mkdir -p thumbnails
          cd thumbnails
          
          echo "=========================================="
          echo "Downloading thumbnail using Direct URL Method"
          echo "=========================================="
          
          THUMBNAIL_FILE=""
          
          # Try qualities from best to worst
          # maxresdefault.jpg (1280x720) - Best quality, but not always available
          echo "Trying maxresdefault.jpg (best quality)..."
          if wget -q --timeout=10 "https://img.youtube.com/vi/${VIDEO_ID}/maxresdefault.jpg" -O "${SAFE_NAME}.jpg" 2>/dev/null; then
            if [ -f "${SAFE_NAME}.jpg" ] && [ $(stat -c%s "${SAFE_NAME}.jpg") -gt 10000 ]; then
              THUMBNAIL_FILE="${SAFE_NAME}.jpg"
              echo "✅ Downloaded maxresdefault.jpg (1280x720)"
            else
              rm -f "${SAFE_NAME}.jpg"
            fi
          fi
          
          # sddefault.jpg (640x480) - Good fallback
          if [ -z "$THUMBNAIL_FILE" ]; then
            echo "Trying sddefault.jpg (640x480)..."
            if wget -q --timeout=10 "https://img.youtube.com/vi/${VIDEO_ID}/sddefault.jpg" -O "${SAFE_NAME}.jpg" 2>/dev/null; then
              if [ -f "${SAFE_NAME}.jpg" ] && [ $(stat -c%s "${SAFE_NAME}.jpg") -gt 5000 ]; then
                THUMBNAIL_FILE="${SAFE_NAME}.jpg"
                echo "✅ Downloaded sddefault.jpg (640x480)"
              else
                rm -f "${SAFE_NAME}.jpg"
              fi
            fi
          fi
          
          # hqdefault.jpg (480x360) - Standard quality
          if [ -z "$THUMBNAIL_FILE" ]; then
            echo "Trying hqdefault.jpg (480x360)..."
            if wget -q --timeout=10 "https://img.youtube.com/vi/${VIDEO_ID}/hqdefault.jpg" -O "${SAFE_NAME}.jpg" 2>/dev/null; then
              if [ -f "${SAFE_NAME}.jpg" ] && [ $(stat -c%s "${SAFE_NAME}.jpg") -gt 2000 ]; then
                THUMBNAIL_FILE="${SAFE_NAME}.jpg"
                echo "✅ Downloaded hqdefault.jpg (480x360)"
              else
                rm -f "${SAFE_NAME}.jpg"
              fi
            fi
          fi
          
          # mqdefault.jpg (320x180) - Medium quality
          if [ -z "$THUMBNAIL_FILE" ]; then
            echo "Trying mqdefault.jpg (320x180)..."
            if wget -q --timeout=10 "https://img.youtube.com/vi/${VIDEO_ID}/mqdefault.jpg" -O "${SAFE_NAME}.jpg" 2>/dev/null; then
              if [ -f "${SAFE_NAME}.jpg" ] && [ $(stat -c%s "${SAFE_NAME}.jpg") -gt 1000 ]; then
                THUMBNAIL_FILE="${SAFE_NAME}.jpg"
                echo "✅ Downloaded mqdefault.jpg (320x180)"
              else
                rm -f "${SAFE_NAME}.jpg"
              fi
            fi
          fi
          
          # default.jpg (120x90) - Lowest quality
          if [ -z "$THUMBNAIL_FILE" ]; then
            echo "Trying default.jpg (120x90)..."
            if wget -q --timeout=10 "https://img.youtube.com/vi/${VIDEO_ID}/default.jpg" -O "${SAFE_NAME}.jpg" 2>/dev/null; then
              if [ -f "${SAFE_NAME}.jpg" ] && [ $(stat -c%s "${SAFE_NAME}.jpg") -gt 500 ]; then
                THUMBNAIL_FILE="${SAFE_NAME}.jpg"
                echo "✅ Downloaded default.jpg (120x90)"
              else
                rm -f "${SAFE_NAME}.jpg"
              fi
            fi
          fi
          
          cd ..
          
          # Final verification
          if [ -z "$THUMBNAIL_FILE" ] || [ ! -f "thumbnails/$THUMBNAIL_FILE" ]; then
            echo "❌ Failed to download thumbnail for video ID: $VIDEO_ID"
            echo ""
            echo "Possible reasons:"
            echo "  - Video is private or deleted"
            echo "  - Video ID extraction failed"
            echo "  - YouTube is blocking the request"
            exit 1
          fi
          
          # Get file size
          FILE_SIZE=$(stat -c%s "thumbnails/$THUMBNAIL_FILE")
          FILE_SIZE_KB=$((FILE_SIZE / 1024))
          
          echo "THUMBNAIL_FILE=$THUMBNAIL_FILE" >> $GITHUB_ENV
          
          echo ""
          echo "=========================================="
          echo "✅ Thumbnail downloaded successfully!"
          echo "   File: $THUMBNAIL_FILE"
          echo "   Size: ${FILE_SIZE_KB} KB"
          echo "   Path: thumbnails/$THUMBNAIL_FILE"
          echo "=========================================="

      - name: Determine next README filename
        id: readme_name
        run: |
          # Find the highest existing README number at the BRANCH ROOT
          HIGHEST=0
          for file in README*.md; do
            if [ -f "$file" ]; then
              if [ "$file" = "README.md" ]; then
                NUM=1
              else
                NUM=$(echo "$file" | grep -o '[0-9]\+' | head -1)
                if [ -z "$NUM" ]; then
                  NUM=1
                fi
              fi
              if [ $NUM -gt $HIGHEST ]; then
                HIGHEST=$NUM
              fi
            fi
          done
          
          NEXT_NUM=$((HIGHEST + 1))
          
          if [ $NEXT_NUM -eq 1 ]; then
            README_NAME="README.md"
          else
            README_NAME="README${NEXT_NUM}.md"
          fi
          
          echo "README_NAME=$README_NAME" >> $GITHUB_ENV
          echo "Using README file at branch root: $README_NAME"

      - name: Generate README with Download Link
        run: |
          README_NAME="${{ env.README_NAME }}"
          VIDEO_TITLE="${{ env.VIDEO_TITLE }}"
          THUMBNAIL_FILE="${{ env.THUMBNAIL_FILE }}"
          
          echo "# 📸 Thumbnail Download - ${VIDEO_TITLE}" > "$README_NAME"
          echo "Generated on: $(date)" >> "$README_NAME"
          echo "" >> "$README_NAME"
          
          # Add link to thumbnail file
          encoded_filename=$(python3 -c "import urllib.parse, sys; print(urllib.parse.quote(sys.argv[1]))" "$THUMBNAIL_FILE")
          url="https://github.com/${{ github.repository }}/raw/thumbnails/thumbnails/$encoded_filename"
          echo "- [Download $THUMBNAIL_FILE]($url)" >> "$README_NAME"
          
          echo "✅ Generated README: $README_NAME"

      - name: Save video title to file
        run: |
          echo "${{ env.VIDEO_TITLE }}" > video_title.txt

      - name: Upload video title as artifact
        uses: actions/upload-artifact@v4
        with:
          name: video-title
          path: video_title.txt
          retention-days: 1

      - name: Save README name to file
        run: |
          echo "${{ env.README_NAME }}" > readme_name.txt

      - name: Upload README name as artifact
        uses: actions/upload-artifact@v4
        with:
          name: readme-name
          path: readme_name.txt
          retention-days: 1

      - name: Commit and Push
        run: |
          # Add thumbnail file
          git add "thumbnails/${{ env.THUMBNAIL_FILE }}"
          echo "Added thumbnail: ${{ env.THUMBNAIL_FILE }}"
          
          # Add README file
          git add "${{ env.README_NAME }}"
          echo "Added README: ${{ env.README_NAME }}"
          
          if ! git diff --cached --quiet; then
            git commit -m "[bot] Add thumbnail: ${{ env.VIDEO_TITLE }}"
            git push
            echo "✅ Committed and pushed successfully"
          else
            echo "No changes to commit"
          fi

  # ============================================
  # JOB 2: Send thumbnail to Bale bot using README link
  # ============================================
  send-to-bot:
    runs-on: ubuntu-latest
    needs: thumbnail-and-release
    if: always() && needs.thumbnail-and-release.result == 'success'
    
    steps:
      - name: Mask sensitive inputs
        run: |
          echo "::add-mask::${{ inputs.bale_token }}"
          echo "::add-mask::${{ inputs.bale_chat_id }}"

      - name: Download README name artifact
        uses: actions/download-artifact@v4
        with:
          name: readme-name
          path: .

      - name: Download video title artifact
        uses: actions/download-artifact@v4
        with:
          name: video-title
          path: .

      - name: Get README name
        id: get_readme_name
        run: |
          if [ -f "readme_name.txt" ]; then
            README_NAME=$(cat readme_name.txt)
            echo "README_NAME=$README_NAME" >> $GITHUB_ENV
            echo "Using README: $README_NAME"
          else
            echo "README_NAME=README.md" >> $GITHUB_ENV
          fi

      - name: Fetch README from branch root and extract thumbnail link
        id: extract
        run: |
          README_FILE="${{ env.README_NAME }}"
          BRANCH_NAME="thumbnails"
          REPO="${{ github.repository }}"
          
          README_URL="https://raw.githubusercontent.com/${REPO}/${BRANCH_NAME}/${README_FILE}"
          echo "Fetching README from: $README_URL"
          
          curl -L -o "$README_FILE" "$README_URL"
          
          if [ ! -f "$README_FILE" ]; then
            echo "❌ Could not fetch $README_FILE from branch root: $BRANCH_NAME"
            exit 1
          fi
          
          echo "README file contents:"
          echo "=========================================="
          cat "$README_FILE"
          echo "=========================================="
          
          # Clear previous file
          > extracted_link.txt
          
          # Extract download link from README (using both patterns for reliability)
          grep -oE 'https://raw\.githubusercontent\.com/[^ )]+' "$README_FILE" >> extracted_link.txt 2>/dev/null || true
          grep -oP '\]\(\Khttps://[^)]+' "$README_FILE" >> extracted_link.txt 2>/dev/null || true
          
          sort -u extracted_link.txt -o extracted_link.txt
          sed -i '/^$/d' extracted_link.txt
          
          LINK_COUNT=$(wc -l < extracted_link.txt)
          echo "LINK_COUNT=$LINK_COUNT" >> $GITHUB_ENV
          
          echo ""
          echo "Found $LINK_COUNT link(s) in $README_FILE:"
          echo "=========================================="
          cat extracted_link.txt
          echo "=========================================="
          
          if [ "$LINK_COUNT" -eq 0 ]; then
            echo "❌ No download link found in README"
            exit 1
          fi
          
          # Get the first link (should be the thumbnail)
          THUMBNAIL_URL=$(head -1 extracted_link.txt)
          echo "THUMBNAIL_URL=$THUMBNAIL_URL" >> $GITHUB_ENV

      - name: Download thumbnail using wget
        run: |
          THUMBNAIL_URL="${{ env.THUMBNAIL_URL }}"
          
          echo "Downloading thumbnail from: $THUMBNAIL_URL"
          
          # Extract filename from URL
          THUMBNAIL_FILENAME=$(basename "$THUMBNAIL_URL" | sed 's/?.*//')
          echo "THUMBNAIL_FILENAME=$THUMBNAIL_FILENAME" >> $GITHUB_ENV
          
          wget --content-disposition --trust-server-names "$THUMBNAIL_URL" -O "$THUMBNAIL_FILENAME"
          
          if [ -f "$THUMBNAIL_FILENAME" ] && [ -s "$THUMBNAIL_FILENAME" ]; then
            SIZE=$(stat -c%s "$THUMBNAIL_FILENAME")
            SIZE_KB=$((SIZE / 1024))
            echo "✅ Downloaded: $THUMBNAIL_FILENAME (${SIZE_KB} KB)"
          else
            echo "❌ Failed to download thumbnail"
            exit 1
          fi

      - name: Send thumbnail to Bale bot
        run: |
          TOKEN="${{ inputs.bale_token }}"
          CHAT_ID="${{ inputs.bale_chat_id }}"
          VIDEO_TITLE=$(cat video_title.txt 2>/dev/null || echo "Unknown")
          THUMBNAIL_FILENAME="${{ env.THUMBNAIL_FILENAME }}"
          
          echo "Sending thumbnail to Bale Bot..."
          echo "Video title: $VIDEO_TITLE"
          echo "Thumbnail file: $THUMBNAIL_FILENAME"
          
          RESPONSE=$(curl -s -w "\n%{http_code}" -X POST "https://tapi.bale.ai/bot${TOKEN}/sendPhoto" \
            -F "chat_id=${CHAT_ID}" \
            -F "photo=@${THUMBNAIL_FILENAME}" \
            -F "caption=🎬 *${VIDEO_TITLE}*" \
            -F "parse_mode=Markdown")
          
          HTTP_CODE=$(echo "$RESPONSE" | tail -n1)
          BODY=$(echo "$RESPONSE" | sed '$d')
          
          if [ "$HTTP_CODE" -eq 200 ]; then
            echo "✅ Thumbnail sent successfully!"
          else
            echo "❌ Failed to send thumbnail. HTTP code: $HTTP_CODE"
            echo "Response: $BODY"
            exit 1
          fi

      - name: Show summary
        run: |
          echo "## 📸 Thumbnail Sender Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Item | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| YouTube URL | ${{ inputs.youtube_url }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Video Title | ${{ env.VIDEO_TITLE }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Thumbnail File | ${{ env.THUMBNAIL_FILENAME }} |" >> $GITHUB_STEP_SUMMARY
          echo "| README used | ${{ env.README_NAME }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "✅ Thumbnail sent to Bale Bot successfully!"

      - name: Cleanup
        run: |
          rm -f README*.md video_title.txt readme_name.txt extracted_link.txt
          rm -f *.jpg *.png *.webp
          echo "🧹 Cleaned up temporary files"