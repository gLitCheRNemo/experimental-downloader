name: 4- Web Downloader & Sender

on:
  workflow_dispatch:
    inputs:
      website_url:
        description: '🔗 Website URL to archive'
        required: true
        type: string
      output_name:
        description: '📝 Output file name (without extension)'
        required: true
        default: 'website_archive'
        type: string
      parts_size:
        description: '🫙 Parts size (MB)'
        required: false
        type: string
        default: '45'
      zip_password:
        description: '🔐 ZIP password (optional, leave empty for no password)'
        required: false
        type: string
        default: ''
      auto_delete:
        description: '🗑️ Auto-delete bot messages after 5 minutes?'
        required: false
        type: boolean
        default: false
      bale_token:
        description: '🤖 Bale Bot Token (for sending files)'
        required: true
        type: string
      bale_chat_id:
        description: '💬 Bale Chat ID (for sending files)'
        required: true
        type: string

jobs:
  # ============================================
  # JOB 1: Archive website and create README
  # ============================================
  archive-and-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
      - name: Mask sensitive inputs
        run: |
          echo "::add-mask::${{ inputs.bale_token }}"
          echo "::add-mask::${{ inputs.bale_chat_id }}"
          if [ -n "${{ inputs.zip_password }}" ]; then
            echo "::add-mask::${{ inputs.zip_password }}"
          fi

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 0

      - name: Prepare web branch
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git fetch origin

          if git ls-remote --exit-code --heads origin web; then
            git checkout web
            git pull origin web
          else
            git checkout --orphan web
            git rm -rf . || true
            mkdir -p web
            git commit --allow-empty -m "[bot] Initialize web branch"
            git push --set-upstream origin web
          fi

      - name: Setup ArchiveBox Docker
        run: docker pull archivebox/archivebox:latest

      - name: Archive Website (ArchiveBox)
        id: archive
        run: |
          WEBSITE_URL="${{ inputs.website_url }}"
          
          # Create a temporary directory for ArchiveBox data
          mkdir -p archive_data
          chmod 777 archive_data
          
          echo "=========================================="
          echo "📥 Archiving website with ArchiveBox: $WEBSITE_URL"
          echo "=========================================="
          
          # Initialize ArchiveBox
          docker run --rm -v $PWD/archive_data:/data archivebox/archivebox init --setup
          
          # Add and archive the URL
          docker run --rm -v $PWD/archive_data:/data archivebox/archivebox add "$WEBSITE_URL"
          
          echo "✅ Website archived to ./archive_data/"
          echo "Files in archive_data:"
          ls -la archive_data/

      - name: Zip Website Content
        id: zip
        run: |
          OUTPUT_NAME="${{ inputs.output_name }}"
          ZIP_PASSWORD="${{ inputs.zip_password }}"
          PARTS_SIZE="${{ inputs.parts_size }}"
          
          # Create output directory
          mkdir -p web
          
          echo "=========================================="
          echo "🗜️ Zipping archived website content..."
          echo "=========================================="
          
          # Debug: Check if archive_data exists and has content
          echo "Checking archive_data contents:"
          ls -la archive_data/
          echo "Total size:"
          du -sh archive_data/
          
          # Zip the archive data
          if [ -n "$ZIP_PASSWORD" ]; then
            echo "Creating password-protected ZIP archive (no header encryption)..."
            sudo apt-get update
            sudo apt-get install -y p7zip-full
            # Removed -mhe flag for better compatibility
            7z a -tzip -p"${ZIP_PASSWORD}" -v${PARTS_SIZE}m "web/${OUTPUT_NAME}.zip" ./archive_data
            cd web
            # Rename split parts to match expected format
            for part in ${OUTPUT_NAME}.z*; do
              if [ -f "$part" ]; then
                mv "$part" "${OUTPUT_NAME}.$(echo $part | sed 's/.*\.z//')"
              fi
            done
            cd ..
          else
            echo "Creating standard ZIP archive (no password)..."
            zip -0 -r -s ${PARTS_SIZE}m "web/${OUTPUT_NAME}.zip" ./archive_data
          fi
          
          echo "FILE_NAME=$OUTPUT_NAME" >> $GITHUB_ENV
          
          echo "✅ ZIP archive created in ./web/"
          ls -la web/
          
          # Clean up archive_data after zipping
          rm -rf archive_data
          echo "🧹 Cleaned up temporary archive_data folder"

      - name: Generate README with Download Links
        run: |
          rm -f README.md
          
          echo "# 📥 Archive Download Links" > README.md
          echo "Generated on: $(date)" >> README.md
          echo "" >> README.md
          
          if [ -n "${{ inputs.zip_password }}" ]; then
            echo "**🔐 This archive is password protected.**" >> README.md
            echo "" >> README.md
          fi
          
          for file in web/*; do
            if [ -f "$file" ]; then
              filename=$(basename "$file")
              encoded_filename=$(python3 -c "import urllib.parse, sys; print(urllib.parse.quote(sys.argv[1]))" "$filename")
              url="https://github.com/${{ github.repository }}/raw/web/web/$encoded_filename"
              echo "- [Download $filename]($url)" >> README.md
            fi
          done

      - name: Commit and Push in Batches of 5
        run: |
          # Store list of files in a temporary file
          ls web/* 2>/dev/null > file_list.txt || true
          
          # Count total files
          TOTAL_FILES=$(cat file_list.txt | wc -l)
          echo "Total files to commit: $TOTAL_FILES"
          
          if [ "$TOTAL_FILES" -eq 0 ]; then
            echo "No new files to commit"
            exit 0
          fi
          
          # Set batch size (5 files per commit)
          BATCH_SIZE=5
          BATCH_NUM=1
          
          # Process files in batches
          while [ $(cat file_list.txt | wc -l) -gt 0 ]; do
            # Take first BATCH_SIZE files
            BATCH_FILES=$(head -n $BATCH_SIZE file_list.txt)
            
            # Remove these files from the list for next iteration
            tail -n +$((BATCH_SIZE + 1)) file_list.txt > temp_list.txt 2>/dev/null || touch temp_list.txt
            mv temp_list.txt file_list.txt
            
            # Add and commit this batch
            for file in $BATCH_FILES; do
              if [ -f "$file" ]; then
                git add "$file"
              fi
            done
            
            # Also add README.md only on first batch
            if [ $BATCH_NUM -eq 1 ] && [ -f "README.md" ]; then
              git add README.md
            fi
            
            # Commit this batch
            git commit -m "[bot] Add website files batch $BATCH_NUM ($(echo $BATCH_FILES | wc -w) files)"
            
            # Push after each batch
            git push
            
            echo "✅ Batch $BATCH_NUM committed and pushed"
            BATCH_NUM=$((BATCH_NUM + 1))
            
            sleep 2
          done
          
          echo "✅ All $TOTAL_FILES files committed and pushed in batches"
          rm -f file_list.txt temp_list.txt

      - name: Upload README as artifact for next job
        uses: actions/upload-artifact@v4
        with:
          name: readme-file
          path: README.md
          retention-days: 1

  # ============================================
  # JOB 2: Send files to Bale bot using README links
  # ============================================
  send-to-bot:
    runs-on: ubuntu-latest
    needs: archive-and-release
    if: always() && needs.archive-and-release.result == 'success'
    
    outputs:
      messages_json: ${{ steps.store_messages.outputs.messages_json }}
      
    steps:
      - name: Mask sensitive inputs
        run: |
          echo "::add-mask::${{ inputs.bale_token }}"
          echo "::add-mask::${{ inputs.bale_chat_id }}"
          if [ -n "${{ inputs.zip_password }}" ]; then
            echo "::add-mask::${{ inputs.zip_password }}"
          fi

      - name: Download README artifact from previous job
        uses: actions/download-artifact@v4
        with:
          name: readme-file
          path: .

      - name: Extract links from README.md
        id: extract
        run: |
          if [ ! -f "README.md" ]; then
            echo "❌ README.md not found!"
            exit 1
          fi
          
          echo "README.md contents:"
          echo "=========================================="
          cat README.md
          echo "=========================================="
          
          # Extract all download links from README.md
          grep -oP '\]\(\Khttps://[^)]+' README.md > extracted_links.txt 2>/dev/null || true
          grep -oE 'https://raw\.githubusercontent\.com/[^ ]+' README.md >> extracted_links.txt 2>/dev/null || true
          
          sort -u extracted_links.txt -o extracted_links.txt
          sed -i '/^$/d' extracted_links.txt
          
          LINK_COUNT=$(wc -l < extracted_links.txt)
          echo "LINK_COUNT=$LINK_COUNT" >> $GITHUB_ENV
          
          echo ""
          echo "Found $LINK_COUNT links in README.md:"
          echo "=========================================="
          cat extracted_links.txt
          echo "=========================================="
          
          if [ "$LINK_COUNT" -eq 0 ]; then
            echo "❌ No download links found in README.md"
            exit 1
          fi

      - name: Download files using wget
        run: |
          mkdir -p downloaded_files
          cd downloaded_files
          
          LINK_NUM=1
          while IFS= read -r LINK; do
            if [ -n "$LINK" ]; then
              echo "=========================================="
              echo "Downloading file $LINK_NUM of ${{ env.LINK_COUNT }} from:"
              echo "$LINK"
              echo "=========================================="
              
              wget --content-disposition --trust-server-names --max-redirect=5 "$LINK"
              
              DOWNLOADED_FILE=$(ls -1 | head -n 1)
              echo "Downloaded file: $DOWNLOADED_FILE"
              
              if [ -f "$DOWNLOADED_FILE" ] && [ -s "$DOWNLOADED_FILE" ]; then
                SIZE=$(stat -c%s "$DOWNLOADED_FILE")
                SIZE_MB=$((SIZE / 1024 / 1024))
                echo "✅ Downloaded: $DOWNLOADED_FILE (${SIZE_MB} MB)"
                echo "$DOWNLOADED_FILE:SUCCESS:$SIZE" >> ../download_status.txt
              else
                echo "❌ Failed to download from: $LINK"
                echo "unknown:FAILED:0" >> ../download_status.txt
              fi
              
              LINK_NUM=$((LINK_NUM + 1))
              echo ""
            fi
          done < ../extracted_links.txt
          
          cd ..
          
          echo "Files in downloaded_files directory:"
          ls -lh downloaded_files/

      - name: Send files to Bale bot and store message IDs
        id: store_messages
        run: |
          TOKEN="${{ inputs.bale_token }}"
          CHAT_ID="${{ inputs.bale_chat_id }}"
          LINK_COUNT="${{ env.LINK_COUNT }}"
          AUTO_DELETE="${{ inputs.auto_delete }}"
          
          # Initialize JSON array for message IDs
          MESSAGE_IDS="[]"
          
          if [ -n "${{ inputs.zip_password }}" ]; then
            curl -s -X POST "https://tapi.bale.ai/bot${TOKEN}/sendMessage" \
              -d "chat_id=${CHAT_ID}" \
              -d "text=📦 Found ${LINK_COUNT} link(s) in README. Downloading and sending...%0A%0A🔐 Files are password protected."
          else
            curl -s -X POST "https://tapi.bale.ai/bot${TOKEN}/sendMessage" \
              -d "chat_id=${CHAT_ID}" \
              -d "text=📦 Found ${LINK_COUNT} link(s) in README. Downloading and sending..."
          fi
          
          cd downloaded_files
          
          FILE_NUM=1
          for FILE in *; do
            if [ -f "$FILE" ] && [ -s "$FILE" ]; then
              SIZE=$(stat -c%s "$FILE")
              SIZE_MB=$((SIZE / 1024 / 1024))
              
              echo "Sending file $FILE_NUM: $FILE (${SIZE_MB} MB)"
              
              # Send file and capture response to get message_id
              RESPONSE=$(curl -s -X POST "https://tapi.bale.ai/bot${TOKEN}/sendDocument" \
                -F "chat_id=${CHAT_ID}" \
                -F "document=@${FILE}" \
                -F "caption=${FILE} | ${SIZE_MB} MB")
              
              # Extract message_id from response
              MESSAGE_ID=$(echo "$RESPONSE" | grep -o '"message_id":[0-9]*' | head -1 | cut -d':' -f2)
              
              if [ -n "$MESSAGE_ID" ]; then
                MESSAGE_IDS=$(echo "$MESSAGE_IDS" | jq ". + [$MESSAGE_ID]")
                echo "✅ Sent $FILE (message_id: $MESSAGE_ID)"
              else
                echo "✅ Sent $FILE"
              fi
              
              FILE_NUM=$((FILE_NUM + 1))
              sleep 1
            fi
          done
          
          cd ..
          
          SENT_COUNT=$((FILE_NUM - 1))
          
          # Send completion message
          if [ -n "${{ inputs.zip_password }}" ]; then
            RESPONSE=$(curl -s -X POST "https://tapi.bale.ai/bot${TOKEN}/sendMessage" \
              -d "chat_id=${CHAT_ID}" \
              -d "text=✅ Done! Sent ${SENT_COUNT} file(s) from ${LINK_COUNT} link(s).%0A%0A🔐 Files are password protected.")
          else
            RESPONSE=$(curl -s -X POST "https://tapi.bale.ai/bot${TOKEN}/sendMessage" \
              -d "chat_id=${CHAT_ID}" \
              -d "text=✅ Done! Sent ${SENT_COUNT} file(s) from ${LINK_COUNT} link(s).")
          fi
          
          # Get completion message ID
          COMPLETION_MSG_ID=$(echo "$RESPONSE" | grep -o '"message_id":[0-9]*' | head -1 | cut -d':' -f2)
          if [ -n "$COMPLETION_MSG_ID" ]; then
            MESSAGE_IDS=$(echo "$MESSAGE_IDS" | jq ". + [$COMPLETION_MSG_ID]")
          fi
          
          # If auto-delete is enabled, send warning and store IDs
          if [ "$AUTO_DELETE" = "true" ]; then
            # Send warning message
            WARNING_RESPONSE=$(curl -s -X POST "https://tapi.bale.ai/bot${TOKEN}/sendMessage" \
              -d "chat_id=${CHAT_ID}" \
              -d "text=⚠️ **All messages from this workflow will be deleted in 5 minutes!** ⚠️%0A%0APlease download your files before then.%0A%0A🕐 Timer started...")
            
            WARNING_MSG_ID=$(echo "$WARNING_RESPONSE" | grep -o '"message_id":[0-9]*' | head -1 | cut -d':' -f2)
            if [ -n "$WARNING_MSG_ID" ]; then
              MESSAGE_IDS=$(echo "$MESSAGE_IDS" | jq ". + [$WARNING_MSG_ID]")
            fi
            
            # Save message IDs to file for the deletion job
            echo "$MESSAGE_IDS" > message_ids.json
            echo "CHAT_ID=$CHAT_ID" >> $GITHUB_ENV
            echo "TOKEN=$TOKEN" >> $GITHUB_ENV
            echo "AUTO_DELETE=true" >> $GITHUB_ENV
          fi
          
          echo "messages_json=$MESSAGE_IDS" >> $GITHUB_OUTPUT

      - name: Upload message IDs for deletion job
        if: inputs.auto_delete == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: message-ids
          path: message_ids.json
          retention-days: 1

      - name: Show summary
        run: |
          echo "## 📊 Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Item | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| Links found in README | ${{ env.LINK_COUNT }} |" >> $GITHUB_STEP_SUMMARY
          if [ -f "download_status.txt" ]; then
            SUCCESS_COUNT=$(grep -c ":SUCCESS:" download_status.txt || echo "0")
            FAILED_COUNT=$(grep -c ":FAILED:" download_status.txt || echo "0")
            echo "| Successfully downloaded | $SUCCESS_COUNT |" >> $GITHUB_STEP_SUMMARY
            echo "| Failed downloads | $FAILED_COUNT |" >> $GITHUB_STEP_SUMMARY
          fi
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Extracted links from README.md:" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          cat extracted_links.txt >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          if [ "${{ inputs.auto_delete }}" = "true" ]; then
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "🗑️ **Auto-delete enabled:** Messages will be deleted in 5 minutes." >> $GITHUB_STEP_SUMMARY
          fi

      - name: Cleanup
        run: |
          rm -f README.md download_status.txt extracted_links.txt
          rm -rf downloaded_files
          echo "🧹 Cleaned up temporary files"

  # ============================================
  # JOB 3: Delete messages after 5 minutes (if enabled)
  # ============================================
  delete-messages:
    runs-on: ubuntu-latest
    needs: [send-to-bot]
    if: inputs.auto_delete == 'true'
    
    steps:
      - name: Mask sensitive inputs
        run: |
          echo "::add-mask::${{ inputs.bale_token }}"
          echo "::add-mask::${{ inputs.bale_chat_id }}"

      - name: Download message IDs artifact
        uses: actions/download-artifact@v4
        with:
          name: message-ids
          path: .

      - name: Wait 5 minutes then delete messages
        run: |
          # Wait for 5 minutes (300 seconds)
          echo "🕐 Waiting 5 minutes before deleting messages..."
          sleep 300
          
          TOKEN="${{ inputs.bale_token }}"
          CHAT_ID="${{ inputs.bale_chat_id }}"
          
          # Read message IDs from JSON file
          if [ -f "message_ids.json" ]; then
            MESSAGE_IDS=$(cat message_ids.json)
            echo "Deleting messages: $MESSAGE_IDS"
            
            # Delete each message
            for MSG_ID in $(echo "$MESSAGE_IDS" | jq -r '.[]'); do
              echo "Deleting message $MSG_ID..."
              curl -s -X POST "https://tapi.bale.ai/bot${TOKEN}/deleteMessage" \
                -H "Content-Type: application/json" \
                -d "{\"chat_id\":$CHAT_ID,\"message_id\":$MSG_ID}"
              echo "✅ Deleted message $MSG_ID"
              sleep 1
            done
            
            # Send final confirmation
            curl -s -X POST "https://tapi.bale.ai/bot${TOKEN}/sendMessage" \
              -d "chat_id=${CHAT_ID}" \
              -d "text=🗑️ All messages from this workflow have been deleted as requested."
          else
            echo "No message IDs found to delete"
          fi

      - name: Cleanup
        run: rm -f message_ids.json