name: 4- Send To Bot

on:
  workflow_dispatch:
    inputs:
      branch_name:
        description: Branch name (e.g., md-parts-20260517-143000)
        required: true
        type: string
      part_numbers:
        description: Part numbers (e.g., 1 5 12 18 for .z01 .z05 .z12 .z18, or "final" for .zip)
        required: true
        type: string
      bale_token:
        description: Bale Bot Token
        required: true
        type: string
      bale_chat_id:
        description: Bale Chat ID
        required: true
        type: string

jobs:
  resend:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Mask sensitive inputs
        run: |
          echo "::add-mask::${{ inputs.bale_token }}"
          echo "::add-mask::${{ inputs.bale_chat_id }}"

      - name: Fetch README.md from branch root
        run: |
          BRANCH="${{ inputs.branch_name }}"
          REPO="${{ github.repository }}"
          
          # Download README.md directly from the branch root
          RAW_URL="https://raw.githubusercontent.com/${REPO}/${BRANCH}/README.md"
          echo "Downloading README from: $RAW_URL"
          
          curl -L -o README.md "$RAW_URL"
          
          if [ ! -f "README.md" ]; then
            echo "ERROR: Could not download README.md from branch $BRANCH"
            echo "Make sure the branch exists and has a README.md file at its root"
            exit 1
          fi
          
          echo "README.md downloaded successfully"
          echo ""
          echo "README.md contents:"
          echo "=========================================="
          cat README.md
          echo "=========================================="

      - name: Extract and send files by part number
        run: |
          TOKEN="${{ inputs.bale_token }}"
          CHAT_ID="${{ inputs.bale_chat_id }}"
          BRANCH="${{ inputs.branch_name }}"
          REPO="${{ github.repository }}"
          PART_NUMBERS="${{ inputs.part_numbers }}"
          
          # Find the base name from README.md (first .z file listed)
          BASE_NAME=$(grep -o '[a-zA-Z0-9_\-]*\.z[0-9][0-9]' README.md | head -1 | sed 's/\.z[0-9][0-9]$//')
          
          if [ -z "$BASE_NAME" ]; then
            # Try to find base name from .zip file in README
            BASE_NAME=$(grep -o '[a-zA-Z0-9_\-]*\.zip' README.md | head -1 | sed 's/\.zip$//')
          fi
          
          echo "Base name detected: $BASE_NAME"
          
          # Send header message
          curl -s -X POST "https://tapi.bale.ai/bot${TOKEN}/sendMessage" \
            -d "chat_id=${CHAT_ID}" \
            -d "text=📦 Resending missing parts from branch: ${BRANCH}%0A📁 Base name: ${BASE_NAME}%0A🔢 Part numbers: ${PART_NUMBERS}"
          
          # Process each part number
          for PART_NUM in $PART_NUMBERS; do
            echo "=========================================="
            echo "Processing part number: $PART_NUM"
            echo "=========================================="
            
            if [ "$PART_NUM" = "final" ] || [ "$PART_NUM" = "0" ]; then
              FILE_NAME="${BASE_NAME}.zip"
              CAPTION="📦 FINAL PART (Extract this file)"
              # Verify file exists in README
              if ! grep -q "$FILE_NAME" README.md; then
                echo "❌ $FILE_NAME not found in README.md"
                curl -s -X POST "https://tapi.bale.ai/bot${TOKEN}/sendMessage" \
                  -d "chat_id=${CHAT_ID}" \
                  -d "text=❌ Final .zip file not found in branch"
                continue
              fi
            else
              # Format with leading zero (1 -> 01, 15 -> 15)
              PART_NUM_PADDED=$(printf "%02d" $PART_NUM)
              FILE_NAME="${BASE_NAME}.z${PART_NUM_PADDED}"
              CAPTION="📦 Missing Part ${PART_NUM}"
              
              # Verify file exists in README
              if ! grep -q "$FILE_NAME" README.md; then
                echo "❌ $FILE_NAME not found in README.md"
                curl -s -X POST "https://tapi.bale.ai/bot${TOKEN}/sendMessage" \
                  -d "chat_id=${CHAT_ID}" \
                  -d "text=❌ Part ${PART_NUM} (${FILE_NAME}) not found in branch"
                continue
              fi
            fi
            
            echo "Found in README: $FILE_NAME"
            
            # Construct raw URL
            RAW_URL="https://raw.githubusercontent.com/${REPO}/${BRANCH}/${FILE_NAME}"
            echo "Downloading from: $RAW_URL"
            
            curl -L -o "$FILE_NAME" "$RAW_URL"
            
            if [ -f "$FILE_NAME" ]; then
              SIZE=$(stat -c%s "$FILE_NAME")
              SIZE_MB=$((SIZE / 1024 / 1024))
              
              echo "Sending $FILE_NAME to Bale..."
              curl -s -X POST "https://tapi.bale.ai/bot${TOKEN}/sendDocument" \
                -F "chat_id=${CHAT_ID}" \
                -F "document=@${FILE_NAME}" \
                -F "caption=${CAPTION} | ${SIZE_MB} MB"
              
              echo "✅ Sent $FILE_NAME"
              rm -f "$FILE_NAME"
            else
              echo "❌ Failed to download $FILE_NAME"
              curl -s -X POST "https://tapi.bale.ai/bot${TOKEN}/sendMessage" \
                -d "chat_id=${CHAT_ID}" \
                -d "text=❌ Failed to download part ${PART_NUM}"
            fi
            
            # Small delay between files
            sleep 1
          done
          
          curl -s -X POST "https://tapi.bale.ai/bot${TOKEN}/sendMessage" \
            -d "chat_id=${CHAT_ID}" \
            -d "text=✅ Done resending requested parts."

      - name: Cleanup
        run: rm -f README.md