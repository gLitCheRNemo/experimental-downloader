name: 2- Send To Bot

on:
  workflow_dispatch:
    inputs:
      raw_links:
        description: 'Raw GitHub links (one per line, or space-separated). If provided, branch_name and part_numbers are ignored.'
        required: false
        type: string
      branch_name:
        description: 'Branch name (e.g., videos). Used with readme_numbers and part_numbers if raw_links is empty.'
        required: false
        type: string
      readme_numbers:
        description: '📄 README numbers (e.g., 1, 1,2,5, 3,7). 1=README.md, 2=README2.md, etc. Use comma for multiple.'
        required: false
        default: '1'
        type: string
      part_numbers:
        description: 'Part numbers or ranges (e.g., 1-10, 1-5,2,7-10). Use comma for multiple. "final" or "0" for final .zip.'
        required: false
        type: string
      include_thumbnail:
        description: '🖼️ Include thumbnail with caption for each README - searches README for thumbnail.jpg link'
        required: false
        default: 'false'
        type: boolean
      bale_token:
        description: 'Bale Bot Token'
        required: true
        type: string
      bale_chat_id:
        description: 'Bale Chat ID'
        required: true
        type: string

jobs:
  resend:
    runs-on: ubuntu-latest
    steps:
      - name: Mask sensitive inputs
        run: |
          echo "::add-mask::${{ inputs.bale_token }}"
          echo "::add-mask::${{ inputs.bale_chat_id }}"

      - name: Determine source and extract links
        id: extract
        run: |
          RAW_LINKS="${{ inputs.raw_links }}"
          BRANCH_NAME="${{ inputs.branch_name }}"
          README_NUMBERS="${{ inputs.readme_numbers }}"
          PART_NUMBERS="${{ inputs.part_numbers }}"
          INCLUDE_THUMBNAIL="${{ inputs.include_thumbnail }}"
          
          > all_links_and_metadata.txt
          > readme_list.txt
          
          # Function to expand ranges like 1-10 into a list of numbers
          expand_ranges() {
            local input="$1"
            local result=""
            for token in $input; do
              if [[ "$token" =~ ^([0-9]+)-([0-9]+)$ ]]; then
                start=${BASH_REMATCH[1]}
                end=${BASH_REMATCH[2]}
                if [ $start -le $end ]; then
                  for ((i=start; i<=end; i++)); do
                    result="$result $i"
                  done
                else
                  for ((i=start; i>=end; i--)); do
                    result="$result $i"
                  done
                fi
              else
                result="$result $token"
              fi
            done
            echo "$result"
          }
          
          # Function to split part numbers by comma and expand each
          parse_part_numbers() {
            local input="$1"
            local result=""
            IFS=',' read -ra PARTS <<< "$input"
            for part in "${PARTS[@]}"; do
              part=$(echo "$part" | sed 's/^[[:space:]]*//;s/[[:space:]]*$//')
              if [ -n "$part" ]; then
                expanded=$(expand_ranges "$part")
                result="$result $expanded"
              fi
            done
            echo "$result"
          }
          
          # Function to split README numbers by comma
          parse_readme_numbers() {
            local input="$1"
            local result=""
            IFS=',' read -ra NUMS <<< "$input"
            for num in "${NUMS[@]}"; do
              num=$(echo "$num" | sed 's/^[[:space:]]*//;s/[[:space:]]*$//')
              if [ -n "$num" ]; then
                result="$result $num"
              fi
            done
            echo "$result"
          }
          
          # Determine README filename based on number
          get_readme_filename() {
            local num="$1"
            if [ -z "$num" ] || [ "$num" = "1" ]; then
              echo "README.md"
            else
              echo "README${num}.md"
            fi
          }
          
          # Extract video title from README
          extract_video_title() {
            local readme_file="$1"
            local title=$(grep -oP '^# 📥 Download Links - \K.*' "$readme_file" 2>/dev/null | head -1)
            if [ -z "$title" ]; then
              title=$(grep -oP '^# \K.*' "$readme_file" 2>/dev/null | head -1)
            fi
            if [ -z "$title" ]; then
              title="Video"
            fi
            echo "$title"
          }
          
          # Extract thumbnail link from README
          extract_thumbnail_link() {
            local readme_file="$1"
            local thumb_link=$(grep -oP '\]\(\Khttps://[^)]+thumbnail\.jpg' "$readme_file" 2>/dev/null | head -1)
            if [ -z "$thumb_link" ]; then
              thumb_link=$(grep -oP '\]\(\Khttps://[^)]+\.jpg' "$readme_file" 2>/dev/null | head -1)
            fi
            echo "$thumb_link"
          }
          
          # Case 1: raw_links is provided (use it directly)
          if [ -n "$RAW_LINKS" ]; then
            echo "Using raw_links input"
            echo "$RAW_LINKS" | tr ' ' '\n' | grep -E 'https?://' > all_links.txt
            echo "SOURCE=raw_links" >> $GITHUB_ENV
            echo "INCLUDE_THUMBNAIL=false" >> $GITHUB_ENV
            echo "SINGLE_BATCH=true" >> $GITHUB_ENV
          
          # Case 2: branch_name is provided
          elif [ -n "$BRANCH_NAME" ]; then
            echo "Using branch_name: $BRANCH_NAME"
            
            # Parse README numbers
            README_NUMS=$(parse_readme_numbers "$README_NUMBERS")
            echo "README numbers to process: $README_NUMS"
            
            # Parse part numbers
            PARSED_PARTS=$(parse_part_numbers "$PART_NUMBERS")
            echo "Part numbers/range to process: $PARSED_PARTS"
            
            # Split parsed parts into an array
            PART_ARRAY=($PARSED_PARTS)
            
            REPO="${{ github.repository }}"
            README_INDEX=0
            
            # Track overall sequence number for display
            TOTAL_BATCHES=$(echo "$README_NUMS" | wc -w)
            
            # Create a file that stores per-README link batches
            > batch_info.txt
            
            for README_NUM in $README_NUMS; do
              README_FILE=$(get_readme_filename "$README_NUM")
              echo "Processing README: $README_FILE"
              
              # Fetch the README
              README_URL="https://raw.githubusercontent.com/${REPO}/${BRANCH_NAME}/${README_FILE}"
              echo "Fetching README from: $README_URL"
              
              curl -L -o "README_${README_NUM}.md" "$README_URL"
              
              if [ ! -f "README_${README_NUM}.md" ]; then
                echo "❌ Could not fetch $README_FILE from branch: $BRANCH_NAME"
                continue
              fi
              
              echo "✅ $README_FILE fetched successfully"
              
              # Extract title and thumbnail if enabled
              if [ "$INCLUDE_THUMBNAIL" = "true" ]; then
                VIDEO_TITLE=$(extract_video_title "README_${README_NUM}.md")
                THUMBNAIL_LINK=$(extract_thumbnail_link "README_${README_NUM}.md")
                echo "TITLE_${README_INDEX}=$VIDEO_TITLE" >> batch_info.txt
                echo "THUMBNAIL_${README_INDEX}=$THUMBNAIL_LINK" >> batch_info.txt
                echo "✅ Extracted title for README ${README_NUM}: $VIDEO_TITLE"
              fi
              
              # Determine which parts to extract for this README
              if [ $README_INDEX -lt ${#PART_ARRAY[@]} ]; then
                PART_NUM="${PART_ARRAY[$README_INDEX]}"
              else
                PART_NUM="${PART_ARRAY[-1]}"
              fi
              
              echo "  Looking for part number(s): $PART_NUM"
              
              # Create a temporary file for this README's links
              > "links_${README_INDEX}.txt"
              
              # Check if it's "final" or "0" for the final .zip
              if [ "$PART_NUM" = "final" ] || [ "$PART_NUM" = "0" ]; then
                LINK=$(grep -oP '\]\(\Khttps://[^)]+\.zip' "README_${README_NUM}.md" | head -1)
                if [ -n "$LINK" ]; then
                  echo "$LINK" >> "links_${README_INDEX}.txt"
                  echo "  Found link for final .zip"
                fi
              elif [[ "$PART_NUM" == *" "* ]]; then
                # Multiple part numbers (space-separated)
                for p in $PART_NUM; do
                  if [ "$p" = "final" ] || [ "$p" = "0" ]; then
                    LINK=$(grep -oP '\]\(\Khttps://[^)]+\.zip' "README_${README_NUM}.md" | head -1)
                    if [ -n "$LINK" ]; then
                      echo "$LINK" >> "links_${README_INDEX}.txt"
                      echo "  Found link for final .zip"
                    fi
                  else
                    PART_NUM_PADDED=$(printf "%02d" $p)
                    LINK=$(grep -oP '\]\(\Khttps://[^)]+\.z'"${PART_NUM_PADDED}" "README_${README_NUM}.md" | head -1)
                    if [ -n "$LINK" ]; then
                      echo "$LINK" >> "links_${README_INDEX}.txt"
                      echo "  Found link for .z${PART_NUM_PADDED}"
                    fi
                  fi
                done
              else
                # Single part number
                PART_NUM_PADDED=$(printf "%02d" $PART_NUM)
                LINK=$(grep -oP '\]\(\Khttps://[^)]+\.z'"${PART_NUM_PADDED}" "README_${README_NUM}.md" | head -1)
                if [ -n "$LINK" ]; then
                  echo "$LINK" >> "links_${README_INDEX}.txt"
                  echo "  Found link for .z${PART_NUM_PADDED}"
                fi
              fi
              
              # Record how many links in this batch
              LINK_COUNT=$(wc -l < "links_${README_INDEX}.txt")
              echo "LINK_COUNT_${README_INDEX}=$LINK_COUNT" >> batch_info.txt
              echo "README_NUM_${README_INDEX}=$README_NUM" >> batch_info.txt
              
              README_INDEX=$((README_INDEX + 1))
            done
            
            echo "TOTAL_BATCHES=$README_INDEX" >> $GITHUB_ENV
            echo "SOURCE=branch_specific" >> $GITHUB_ENV
            echo "INCLUDE_THUMBNAIL=$INCLUDE_THUMBNAIL" >> $GITHUB_ENV
          
          else
            echo "❌ No input provided. Please provide either:"
            echo "  - raw_links (direct links), or"
            echo "  - branch_name (with optional readme_numbers and part_numbers)"
            exit 1
          fi

      - name: Process and send each README batch
        if: env.SOURCE == 'branch_specific'
        run: |
          TOKEN="${{ inputs.bale_token }}"
          CHAT_ID="${{ inputs.bale_chat_id }}"
          QUALITY="${{ inputs.quality }}"
          INCLUDE_THUMBNAIL="${{ env.INCLUDE_THUMBNAIL }}"
          TOTAL_BATCHES="${{ env.TOTAL_BATCHES }}"
          
          echo "Processing $TOTAL_BATCHES README batch(es)"
          
          BATCH_NUM=1
          while [ $BATCH_NUM -le $TOTAL_BATCHES ]; do
            BATCH_INDEX=$((BATCH_NUM - 1))
            
            # Get info for this batch
            LINK_FILE="links_${BATCH_INDEX}.txt"
            LINK_COUNT=$(cat "links_${BATCH_INDEX}.txt" | wc -l)
            README_NUM=$(grep "README_NUM_${BATCH_INDEX}=" batch_info.txt | cut -d'=' -f2)
            
            echo "=========================================="
            echo "Processing batch $BATCH_NUM of $TOTAL_BATCHES (README${README_NUM}.md)"
            echo "Found $LINK_COUNT links in this batch"
            echo "=========================================="
            
            # Download thumbnail for this batch if enabled
            if [ "$INCLUDE_THUMBNAIL" = "true" ]; then
              VIDEO_TITLE=$(grep "TITLE_${BATCH_INDEX}=" batch_info.txt | cut -d'=' -f2-)
              THUMBNAIL_LINK=$(grep "THUMBNAIL_${BATCH_INDEX}=" batch_info.txt | cut -d'=' -f2)
              
              if [ -n "$THUMBNAIL_LINK" ]; then
                echo "Downloading thumbnail from: $THUMBNAIL_LINK"
                curl -L -o "thumbnail_${BATCH_NUM}.jpg" "$THUMBNAIL_LINK"
                if [ -f "thumbnail_${BATCH_NUM}.jpg" ] && [ -s "thumbnail_${BATCH_NUM}.jpg" ]; then
                  CAPTION=$(printf "🎬 *%s*\n\n📋 Batch %s of %s\n📦 Found %s link(s)\n⬇️ Downloading and sending..." "$VIDEO_TITLE" "$BATCH_NUM" "$TOTAL_BATCHES" "$LINK_COUNT")
                  curl -s -X POST "https://tapi.bale.ai/bot${TOKEN}/sendPhoto" \
                    -F "chat_id=${CHAT_ID}" \
                    -F "photo=@thumbnail_${BATCH_NUM}.jpg" \
                    -F "caption=${CAPTION}" \
                    -F "parse_mode=Markdown"
                  echo "✅ Sent thumbnail for batch $BATCH_NUM"
                else
                  echo "⚠️ Failed to download thumbnail for batch $BATCH_NUM, sending text instead"
                  TEXT_MSG=$(printf "🎬 *%s*\n\n📋 Batch %s of %s\n📦 Found %s link(s)\n⬇️ Downloading and sending..." "$VIDEO_TITLE" "$BATCH_NUM" "$TOTAL_BATCHES" "$LINK_COUNT")
                  curl -s -X POST "https://tapi.bale.ai/bot${TOKEN}/sendMessage" \
                    -d "chat_id=${CHAT_ID}" \
                    -d "text=${TEXT_MSG}" \
                    -d "parse_mode=Markdown"
                fi
              else
                TEXT_MSG=$(printf "📋 Batch %s of %s\n📦 Found %s link(s)\n⬇️ Downloading and sending..." "$BATCH_NUM" "$TOTAL_BATCHES" "$LINK_COUNT")
                curl -s -X POST "https://tapi.bale.ai/bot${TOKEN}/sendMessage" \
                  -d "chat_id=${CHAT_ID}" \
                  -d "text=${TEXT_MSG}"
              fi
            else
              TEXT_MSG=$(printf "📋 Batch %s of %s\n📦 Found %s link(s)\n⬇️ Downloading and sending..." "$BATCH_NUM" "$TOTAL_BATCHES" "$LINK_COUNT")
              curl -s -X POST "https://tapi.bale.ai/bot${TOKEN}/sendMessage" \
                -d "chat_id=${CHAT_ID}" \
                -d "text=${TEXT_MSG}"
            fi
            
            # Download files for this batch
            mkdir -p "downloaded_batch_${BATCH_NUM}"
            cd "downloaded_batch_${BATCH_NUM}"
            
            LINK_NUM=1
            while IFS= read -r LINK; do
              if [ -n "$LINK" ]; then
                echo "Downloading file $LINK_NUM of $LINK_COUNT"
                wget --content-disposition --trust-server-names --max-redirect=5 "$LINK"
                echo "✅ Downloaded: $(ls -1 | head -n 1)"
                LINK_NUM=$((LINK_NUM + 1))
              fi
            done < "../$LINK_FILE"
            
            # Send files for this batch
            for FILE in *; do
              if [ -f "$FILE" ] && [ -s "$FILE" ]; then
                SIZE=$(stat -c%s "$FILE")
                SIZE_MB=$((SIZE / 1024 / 1024))
                curl -s -X POST "https://tapi.bale.ai/bot${TOKEN}/sendDocument" \
                  -F "chat_id=${CHAT_ID}" \
                  -F "document=@${FILE}" \
                  -F "caption=${FILE} | ${SIZE_MB} MB"
                sleep 1
              fi
            done
            
            cd ..
            
            # Clean up batch files
            rm -rf "downloaded_batch_${BATCH_NUM}"
            rm -f "thumbnail_${BATCH_NUM}.jpg"
            
            BATCH_NUM=$((BATCH_NUM + 1))
            sleep 2
          done
          
          # Send completion message
          curl -s -X POST "https://tapi.bale.ai/bot${TOKEN}/sendMessage" \
            -d "chat_id=${CHAT_ID}" \
            -d "text=✅ *Complete!*%0A%0A📋 Successfully sent ${TOTAL_BATCHES} batch(es)" \
            -d "parse_mode=Markdown"

      - name: Process raw_links (single batch)
        if: env.SOURCE == 'raw_links'
        run: |
          TOKEN="${{ inputs.bale_token }}"
          CHAT_ID="${{ inputs.bale_chat_id }}"
          LINK_COUNT=$(wc -l < all_links.txt)
          
          curl -s -X POST "https://tapi.bale.ai/bot${TOKEN}/sendMessage" \
            -d "chat_id=${CHAT_ID}" \
            -d "text=📦 Found ${LINK_COUNT} link(s). Downloading and sending..."
          
          mkdir -p downloaded_files
          cd downloaded_files
          
          LINK_NUM=1
          while IFS= read -r LINK; do
            if [ -n "$LINK" ]; then
              echo "Downloading file $LINK_NUM of $LINK_COUNT"
              wget --content-disposition --trust-server-names --max-redirect=5 "$LINK"
              LINK_NUM=$((LINK_NUM + 1))
            fi
          done < ../all_links.txt
          
          for FILE in *; do
            if [ -f "$FILE" ] && [ -s "$FILE" ]; then
              SIZE=$(stat -c%s "$FILE")
              SIZE_MB=$((SIZE / 1024 / 1024))
              curl -s -X POST "https://tapi.bale.ai/bot${TOKEN}/sendDocument" \
                -F "chat_id=${CHAT_ID}" \
                -F "document=@${FILE}" \
                -F "caption=${FILE} | ${SIZE_MB} MB"
              sleep 1
            fi
          done
          
          cd ..
          
          curl -s -X POST "https://tapi.bale.ai/bot${TOKEN}/sendMessage" \
            -d "chat_id=${CHAT_ID}" \
            -d "text=✅ Done! Sent ${LINK_COUNT} file(s)."

      - name: Show summary
        run: |
          echo "## 📊 Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Item | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| Source | ${{ env.SOURCE }} |" >> $GITHUB_STEP_SUMMARY
          if [ "${{ env.SOURCE }}" = "branch_specific" ]; then
            echo "| Total batches | ${{ env.TOTAL_BATCHES }} |" >> $GITHUB_STEP_SUMMARY
          fi

      - name: Cleanup
        run: |
          rm -f README*.md links_*.txt batch_info.txt all_links.txt thumbnail_*.jpg
          rm -rf downloaded_files downloaded_batch_*
          echo "🧹 Cleaned up temporary files"