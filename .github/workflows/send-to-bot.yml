name: 2- Send To Bot

on:
  workflow_dispatch:
    inputs:
      raw_links:
        description: 'Raw GitHub links (one per line, or space-separated). If provided, branch_name and part_numbers are ignored.'
        required: false
        type: string
      branch_name:
        description: 'Branch name (e.g., videos). Used with readme_numbers and part_numbers if raw_links is empty.'
        required: false
        type: string
      readme_numbers:
        description: '📄 README numbers (e.g., 1, 1,2,5, 3,7, or "all"). 1=README.md, 2=README2.md, etc. Use comma for multiple. "all" processes all README files in the branch.'
        required: false
        default: '1'
        type: string
      part_numbers:
        description: 'Part numbers or ranges (e.g., 1-10, 1-5,2,7-10, or "all"). Use comma for multiple. "all" gets all parts from .z01 up to final .zip.'
        required: false
        type: string
        default: 'all'
      include_thumbnail:
        description: '🖼️ Include thumbnail with caption for each README - searches README for thumbnail.jpg link'
        required: false
        default: 'false'
        type: boolean
      bale_token:
        description: 'Bale Bot Token'
        required: true
        type: string
      bale_chat_id:
        description: 'Bale Chat ID'
        required: true
        type: string

jobs:
  resend:
    runs-on: ubuntu-latest
    steps:
      - name: Mask sensitive inputs
        run: |
          echo "::add-mask::${{ inputs.bale_token }}"
          echo "::add-mask::${{ inputs.bale_chat_id }}"

      - name: Determine source and extract links
        id: extract
        run: |
          RAW_LINKS="${{ inputs.raw_links }}"
          BRANCH_NAME="${{ inputs.branch_name }}"
          README_NUMBERS="${{ inputs.readme_numbers }}"
          PART_NUMBERS="${{ inputs.part_numbers }}"
          INCLUDE_THUMBNAIL="${{ inputs.include_thumbnail }}"
          
          > readme_batches.txt
          
          # Function to expand ranges like 1-10 into a list of numbers
          expand_ranges() {
            local input="$1"
            local result=""
            for token in $input; do
              if [[ "$token" =~ ^([0-9]+)-([0-9]+)$ ]]; then
                start=${BASH_REMATCH[1]}
                end=${BASH_REMATCH[2]}
                if [ $start -le $end ]; then
                  for ((i=start; i<=end; i++)); do
                    result="$result $i"
                  done
                else
                  for ((i=start; i>=end; i--)); do
                    result="$result $i"
                  done
                fi
              else
                result="$result $token"
              fi
            done
            echo "$result"
          }
          
          # Function to split part numbers by comma and expand each
          parse_part_numbers() {
            local input="$1"
            local result=""
            IFS=',' read -ra PARTS <<< "$input"
            for part in "${PARTS[@]}"; do
              part=$(echo "$part" | sed 's/^[[:space:]]*//;s/[[:space:]]*$//')
              if [ -n "$part" ]; then
                if [ "$part" = "all" ]; then
                  result="all"
                  break
                else
                  expanded=$(expand_ranges "$part")
                  result="$result $expanded"
                fi
              fi
            done
            echo "$result"
          }
          
          # Function to split README numbers by comma
          parse_readme_numbers() {
            local input="$1"
            local result=""
            IFS=',' read -ra NUMS <<< "$input"
            for num in "${NUMS[@]}"; do
              num=$(echo "$num" | sed 's/^[[:space:]]*//;s/[[:space:]]*$//')
              if [ -n "$num" ]; then
                result="$result $num"
              fi
            done
            echo "$result"
          }
          
          # Determine README filename based on number
          get_readme_filename() {
            local num="$1"
            if [ -z "$num" ] || [ "$num" = "1" ]; then
              echo "README.md"
            else
              echo "README${num}.md"
            fi
          }
          
          # Extract video title from README
          extract_video_title() {
            local readme_file="$1"
            local title=$(grep -oP '^# 📥 Download Links - \K.*' "$readme_file" 2>/dev/null | head -1)
            if [ -z "$title" ]; then
              title=$(grep -oP '^# \K.*' "$readme_file" 2>/dev/null | head -1)
            fi
            if [ -z "$title" ]; then
              title="Video"
            fi
            echo "$title"
          }
          
          # Extract thumbnail link from README
          extract_thumbnail_link() {
            local readme_file="$1"
            local thumb_link=$(grep -oP '\]\(\Khttps://[^)]+thumbnail\.jpg' "$readme_file" 2>/dev/null | head -1)
            if [ -z "$thumb_link" ]; then
              thumb_link=$(grep -oP '\]\(\Khttps://[^)]+\.jpg' "$readme_file" 2>/dev/null | head -1)
            fi
            echo "$thumb_link"
          }
          
          # Function to extract all part numbers from a README (from .z01 to .zNN to final .zip)
          extract_all_parts_from_readme() {
            local readme_file="$1"
            local output_file="$2"
            local base_url=""
            local link_count=0
            
            # Extract the base URL pattern from the README
            FIRST_Z01=$(grep -oP '\]\(\Khttps://[^)]+\.z01' "$readme_file" 2>/dev/null | head -1)
            if [ -n "$FIRST_Z01" ]; then
              BASE_URL="${FIRST_Z01%.z01}"
            else
              FIRST_Z=$(grep -oP '\]\(\Khttps://[^)]+\.z[0-9]+' "$readme_file" 2>/dev/null | head -1)
              if [ -n "$FIRST_Z" ]; then
                BASE_URL="${FIRST_Z%.z*}"
              fi
            fi
            
            if [ -n "$BASE_URL" ]; then
              # Find all .zNN parts by incrementing until not found
              PART_NUM=1
              while true; do
                PART_NUM_PADDED=$(printf "%02d" $PART_NUM)
                LINK="${BASE_URL}.z${PART_NUM_PADDED}"
                if grep -q "$LINK" "$readme_file"; then
                  echo "$LINK" >> "$output_file"
                  link_count=$((link_count + 1))
                  PART_NUM=$((PART_NUM + 1))
                else
                  break
                fi
              done
              
              # Get the final .zip link
              ZIP_LINK="${BASE_URL}.zip"
              if grep -q "$ZIP_LINK" "$readme_file"; then
                echo "$ZIP_LINK" >> "$output_file"
                link_count=$((link_count + 1))
              fi
            else
              # Fallback: extract all links from README
              grep -oP '\]\(\Khttps://[^)]+' "$readme_file" >> "$output_file" 2>/dev/null || true
              grep -oE 'https://raw\.githubusercontent\.com/[^ ]+' "$readme_file" >> "$output_file" 2>/dev/null || true
              link_count=$(wc -l < "$output_file")
            fi
            
            echo "$link_count"
          }
          
          # Case 1: raw_links is provided (use it directly)
          if [ -n "$RAW_LINKS" ]; then
            echo "Using raw_links input"
            echo "$RAW_LINKS" | tr ' ' '\n' | grep -E 'https?://' > all_links.txt
            LINK_COUNT=$(wc -l < all_links.txt)
            echo "LINKS_FILE=all_links.txt" >> $GITHUB_ENV
            echo "TOTAL_BATCHES=1" >> $GITHUB_ENV
            echo "SOURCE=raw_links" >> $GITHUB_ENV
            echo "INCLUDE_THUMBNAIL=false" >> $GITHUB_ENV
            # Create batch info for raw links
            echo "TITLE_0=Raw Links" >> batch_info.txt
            echo "THUMBNAIL_0=" >> batch_info.txt
            echo "LINK_COUNT_0=$LINK_COUNT" >> batch_info.txt
            echo "LINKS_FILE_0=all_links.txt" >> batch_info.txt
          
          # Case 2: branch_name is provided
          elif [ -n "$BRANCH_NAME" ]; then
            echo "Using branch_name: $BRANCH_NAME"
            
            # Fetch the branch to get README files
            git fetch origin "$BRANCH_NAME" 2>/dev/null || true
            
            # Parse README numbers (support comma separator and "all")
            if [ "$README_NUMBERS" = "all" ]; then
              echo "Getting all README files from branch..."
              README_FILES_LIST=$(git ls-tree origin/"$BRANCH_NAME" --name-only | grep -E '^README[0-9]*\.md$' | sort -V)
              README_NUMS=""
              for rf in $README_FILES_LIST; do
                if [ "$rf" = "README.md" ]; then
                  README_NUMS="$README_NUMS 1"
                else
                  NUM=$(echo "$rf" | grep -o '[0-9]\+' | head -1)
                  README_NUMS="$README_NUMS $NUM"
                fi
              done
              echo "Found README numbers: $README_NUMS"
            else
              README_NUMS=$(parse_readme_numbers "$README_NUMBERS")
            fi
            echo "README numbers to process: $README_NUMS"
            
            REPO="${{ github.repository }}"
            BATCH_INDEX=0
            > batch_info.txt
            
            for README_NUM in $README_NUMS; do
              README_FILE=$(get_readme_filename "$README_NUM")
              echo "Processing README: $README_FILE"
              
              # Fetch the README
              README_URL="https://raw.githubusercontent.com/${REPO}/${BRANCH_NAME}/${README_FILE}"
              echo "Fetching README from: $README_URL"
              
              curl -L -o "README_${README_NUM}.md" "$README_URL"
              
              if [ ! -f "README_${README_NUM}.md" ]; then
                echo "❌ Could not fetch $README_FILE from branch: $BRANCH_NAME"
                continue
              fi
              
              echo "✅ $README_FILE fetched successfully"
              
              # Extract title and thumbnail for this README
              VIDEO_TITLE=$(extract_video_title "README_${README_NUM}.md")
              THUMBNAIL_LINK=$(extract_thumbnail_link "README_${README_NUM}.md")
              
              echo "TITLE_${BATCH_INDEX}=${VIDEO_TITLE}" >> batch_info.txt
              echo "THUMBNAIL_${BATCH_INDEX}=${THUMBNAIL_LINK}" >> batch_info.txt
              echo "README_NUM_${BATCH_INDEX}=${README_NUM}" >> batch_info.txt
              
              # Extract links for this README
              LINKS_FILE="links_batch_${BATCH_INDEX}.txt"
              > "$LINKS_FILE"
              
              if [ "$PART_NUMBERS" = "all" ]; then
                echo "  Using 'all' mode - extracting all parts from this README"
                LINK_COUNT=$(extract_all_parts_from_readme "README_${README_NUM}.md" "$LINKS_FILE")
              else
                PARSED_PARTS=$(parse_part_numbers "$PART_NUMBERS")
                if [ "$PARSED_PARTS" = "all" ]; then
                  echo "  Using 'all' mode - extracting all parts from this README"
                  LINK_COUNT=$(extract_all_parts_from_readme "README_${README_NUM}.md" "$LINKS_FILE")
                else
                  LINK_COUNT=0
                  for PART_NUM in $PARSED_PARTS; do
                    if [ "$PART_NUM" = "final" ] || [ "$PART_NUM" = "0" ]; then
                      LINK=$(grep -oP '\]\(\Khttps://[^)]+\.zip' "README_${README_NUM}.md" | head -1)
                      if [ -n "$LINK" ]; then
                        echo "$LINK" >> "$LINKS_FILE"
                        LINK_COUNT=$((LINK_COUNT + 1))
                        echo "  Found link for final .zip"
                      fi
                    else
                      PART_NUM_PADDED=$(printf "%02d" $PART_NUM)
                      LINK=$(grep -oP '\]\(\Khttps://[^)]+\.z'"${PART_NUM_PADDED}" "README_${README_NUM}.md" | head -1)
                      if [ -n "$LINK" ]; then
                        echo "$LINK" >> "$LINKS_FILE"
                        LINK_COUNT=$((LINK_COUNT + 1))
                        echo "  Found link for .z${PART_NUM_PADDED}"
                      fi
                    fi
                  done
                fi
              fi
              
              echo "LINK_COUNT_${BATCH_INDEX}=${LINK_COUNT}" >> batch_info.txt
              echo "LINKS_FILE_${BATCH_INDEX}=${LINKS_FILE}" >> batch_info.txt
              
              echo "  Found $LINK_COUNT links for README ${README_NUM}"
              
              BATCH_INDEX=$((BATCH_INDEX + 1))
            done
            
            TOTAL_BATCHES=$BATCH_INDEX
            echo "TOTAL_BATCHES=$TOTAL_BATCHES" >> $GITHUB_ENV
            echo "SOURCE=branch_specific" >> $GITHUB_ENV
            echo "INCLUDE_THUMBNAIL=$INCLUDE_THUMBNAIL" >> $GITHUB_ENV
          
          else
            echo "❌ No input provided. Please provide either:"
            echo "  - raw_links (direct links), or"
            echo "  - branch_name (with optional readme_numbers and part_numbers)"
            exit 1
          fi

      - name: Process and send each batch
        run: |
          TOKEN="${{ inputs.bale_token }}"
          CHAT_ID="${{ inputs.bale_chat_id }}"
          TOTAL_BATCHES="${{ env.TOTAL_BATCHES }}"
          INCLUDE_THUMBNAIL="${{ env.INCLUDE_THUMBNAIL }}"
          
          echo "Processing $TOTAL_BATCHES batch(es)"
          
          for BATCH_NUM in $(seq 1 $TOTAL_BATCHES); do
            BATCH_INDEX=$((BATCH_NUM - 1))
            
            # Get info for this batch
            LINKS_FILE=$(grep "LINKS_FILE_${BATCH_INDEX}=" batch_info.txt | cut -d'=' -f2-)
            LINK_COUNT=$(grep "LINK_COUNT_${BATCH_INDEX}=" batch_info.txt | cut -d'=' -f2)
            VIDEO_TITLE=$(grep "TITLE_${BATCH_INDEX}=" batch_info.txt | cut -d'=' -f2-)
            THUMBNAIL_LINK=$(grep "THUMBNAIL_${BATCH_INDEX}=" batch_info.txt | cut -d'=' -f2-)
            README_NUM=$(grep "README_NUM_${BATCH_INDEX}=" batch_info.txt | cut -d'=' -f2)
            
            echo "=========================================="
            echo "Processing batch $BATCH_NUM of $TOTAL_BATCHES (README${README_NUM}.md)"
            echo "Found $LINK_COUNT links in this batch"
            echo "Video title: $VIDEO_TITLE"
            echo "=========================================="
            
            # Download and send thumbnail for this batch if enabled
            if [ "$INCLUDE_THUMBNAIL" = "true" ] && [ -n "$THUMBNAIL_LINK" ]; then
              echo "Downloading thumbnail from: $THUMBNAIL_LINK"
              curl -L -o "thumbnail_${BATCH_NUM}.jpg" "$THUMBNAIL_LINK"
              if [ -f "thumbnail_${BATCH_NUM}.jpg" ] && [ -s "thumbnail_${BATCH_NUM}.jpg" ]; then
                # Caption with THIS BATCH's link count
                CAPTION=$(printf "🎬 *%s*\n\n📦 Found %s link(s)\n⬇️ Downloading and sending..." "$VIDEO_TITLE" "$LINK_COUNT")
                curl -s -X POST "https://tapi.bale.ai/bot${TOKEN}/sendPhoto" \
                  -F "chat_id=${CHAT_ID}" \
                  -F "photo=@thumbnail_${BATCH_NUM}.jpg" \
                  -F "caption=${CAPTION}" \
                  -F "parse_mode=Markdown"
                echo "✅ Sent thumbnail for batch $BATCH_NUM"
              else
                echo "⚠️ Failed to download thumbnail, sending text instead"
                TEXT_MSG=$(printf "🎬 *%s*\n\n📦 Found %s link(s)\n⬇️ Downloading and sending..." "$VIDEO_TITLE" "$LINK_COUNT")
                curl -s -X POST "https://tapi.bale.ai/bot${TOKEN}/sendMessage" \
                  -d "chat_id=${CHAT_ID}" \
                  -d "text=${TEXT_MSG}" \
                  -d "parse_mode=Markdown"
              fi
            else
              # No thumbnail - send text message for this batch
              TEXT_MSG=$(printf "📋 Batch %s of %s (README%s.md)\n📦 Found %s link(s)\n⬇️ Downloading and sending..." "$BATCH_NUM" "$TOTAL_BATCHES" "$README_NUM" "$LINK_COUNT")
              curl -s -X POST "https://tapi.bale.ai/bot${TOKEN}/sendMessage" \
                -d "chat_id=${CHAT_ID}" \
                -d "text=${TEXT_MSG}"
            fi
            
            # Download files for this batch
            mkdir -p "downloaded_batch_${BATCH_NUM}"
            cd "downloaded_batch_${BATCH_NUM}"
            
            LINK_NUM=1
            while IFS= read -r LINK; do
              if [ -n "$LINK" ]; then
                echo "Downloading file $LINK_NUM of $LINK_COUNT"
                wget --content-disposition --trust-server-names --max-redirect=5 "$LINK"
                LINK_NUM=$((LINK_NUM + 1))
              fi
            done < "../$LINKS_FILE"
            
            # Send files for this batch
            for FILE in *; do
              if [ -f "$FILE" ] && [ -s "$FILE" ]; then
                SIZE=$(stat -c%s "$FILE")
                SIZE_MB=$((SIZE / 1024 / 1024))
                curl -s -X POST "https://tapi.bale.ai/bot${TOKEN}/sendDocument" \
                  -F "chat_id=${CHAT_ID}" \
                  -F "document=@${FILE}" \
                  -F "caption=${FILE} | ${SIZE_MB}MB"
                sleep 1
              fi
            done
            
            cd ..
            
            # Clean up batch files
            rm -rf "downloaded_batch_${BATCH_NUM}"
            rm -f "thumbnail_${BATCH_NUM}.jpg"
            
            sleep 2
          done
          
          # Send completion message
          if [ "$TOTAL_BATCHES" -gt 1 ]; then
            curl -s -X POST "https://tapi.bale.ai/bot${TOKEN}/sendMessage" \
              -d "chat_id=${CHAT_ID}" \
              -d "text=✅ *Complete!*%0A%0A📋 Successfully sent ${TOTAL_BATCHES} batches" \
              -d "parse_mode=Markdown"
          fi

      - name: Show summary
        run: |
          echo "## 📊 Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Item | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| Source | ${{ env.SOURCE }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Total batches | ${{ env.TOTAL_BATCHES }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Thumbnail mode | ${{ env.INCLUDE_THUMBNAIL }} |" >> $GITHUB_STEP_SUMMARY

      - name: Cleanup
        run: |
          rm -f README*.md batch_info.txt links_batch_*.txt thumbnail_*.jpg
          rm -rf downloaded_batch_*
          echo "🧹 Cleaned up temporary files"