name: 2- Send To Bot

on:
  workflow_dispatch:
    inputs:
      raw_links:
        description: 'Raw GitHub links (one per line, or space-separated). If provided, branch_name and part_numbers are ignored.'
        required: false
        type: string
      branch_name:
        description: 'Branch name (e.g., videos). Used with readme_number and part_numbers if raw_links is empty.'
        required: false
        type: string
      readme_number:
        description: '📄 README file number (e.g., 1=README.md, 2=README2.md, 7=README7.md, etc.)'
        required: false
        default: '1'
        type: string
      part_numbers:
        description: 'Part numbers or ranges (e.g., 1-10 15 20-25 final). 1-10 includes parts 1 through 10.'
        required: false
        type: string
      include_thumbnail:
        description: '🖼️ Include thumbnail with caption (like VDS) - searches README for thumbnail.jpg link'
        required: false
        default: 'false'
        type: boolean
      bale_token:
        description: 'Bale Bot Token'
        required: true
        type: string
      bale_chat_id:
        description: 'Bale Chat ID'
        required: true
        type: string

jobs:
  resend:
    runs-on: ubuntu-latest
    steps:
      - name: Mask sensitive inputs
        run: |
          echo "::add-mask::${{ inputs.bale_token }}"
          echo "::add-mask::${{ inputs.bale_chat_id }}"

      - name: Determine source and extract links
        id: extract
        run: |
          RAW_LINKS="${{ inputs.raw_links }}"
          BRANCH_NAME="${{ inputs.branch_name }}"
          README_NUMBER="${{ inputs.readme_number }}"
          PART_NUMBERS="${{ inputs.part_numbers }}"
          INCLUDE_THUMBNAIL="${{ inputs.include_thumbnail }}"
          
          > extracted_links.txt
          
          # Function to expand ranges like 1-10 into a list of numbers
          expand_ranges() {
            local input="$1"
            local result=""
            for token in $input; do
              if [[ "$token" =~ ^([0-9]+)-([0-9]+)$ ]]; then
                start=${BASH_REMATCH[1]}
                end=${BASH_REMATCH[2]}
                if [ $start -le $end ]; then
                  for ((i=start; i<=end; i++)); do
                    result="$result $i"
                  done
                else
                  for ((i=start; i>=end; i--)); do
                    result="$result $i"
                  done
                fi
              else
                result="$result $token"
              fi
            done
            echo "$result"
          }
          
          # Determine README filename based on number (supports any number)
          get_readme_filename() {
            local num="$1"
            if [ -z "$num" ] || [ "$num" = "1" ]; then
              echo "README.md"
            else
              echo "README${num}.md"
            fi
          }
          
          # Extract video title from README (for thumbnail mode)
          extract_video_title() {
            local readme_file="$1"
            # Look for "# 📥 Download Links - VIDEO_TITLE" pattern
            local title=$(grep -oP '^# 📥 Download Links - \K.*' "$readme_file" 2>/dev/null | head -1)
            if [ -z "$title" ]; then
              # Fallback: look for any H1 heading
              title=$(grep -oP '^# \K.*' "$readme_file" 2>/dev/null | head -1)
            fi
            if [ -z "$title" ]; then
              title="Video"
            fi
            echo "$title"
          }
          
          # Extract thumbnail link from README
          extract_thumbnail_link() {
            local readme_file="$1"
            # Look for thumbnail.jpg in download links
            local thumb_link=$(grep -oP '\]\(\Khttps://[^)]+thumbnail\.jpg' "$readme_file" 2>/dev/null | head -1)
            if [ -z "$thumb_link" ]; then
              # Fallback: look for any .jpg that might be thumbnail
              thumb_link=$(grep -oP '\]\(\Khttps://[^)]+\.jpg' "$readme_file" 2>/dev/null | head -1)
            fi
            echo "$thumb_link"
          }
          
          # Case 1: raw_links is provided (use it directly)
          if [ -n "$RAW_LINKS" ]; then
            echo "Using raw_links input"
            echo "$RAW_LINKS" | tr ' ' '\n' | grep -E 'https?://' >> extracted_links.txt
            echo "SOURCE=raw_links" >> $GITHUB_ENV
            echo "INCLUDE_THUMBNAIL=false" >> $GITHUB_ENV
          
          # Case 2: branch_name is provided
          elif [ -n "$BRANCH_NAME" ]; then
            echo "Using branch_name: $BRANCH_NAME"
            
            README_FILE=$(get_readme_filename "$README_NUMBER")
            echo "Using README file: $README_FILE"
            
            # Fetch the selected README from the branch
            REPO="${{ github.repository }}"
            README_URL="https://raw.githubusercontent.com/${REPO}/${BRANCH_NAME}/${README_FILE}"
            echo "Fetching README from: $README_URL"
            
            curl -L -o README.md "$README_URL"
            
            if [ ! -f "README.md" ]; then
              echo "❌ Could not fetch $README_FILE from branch: $BRANCH_NAME"
              echo "Available README files in branch:"
              git ls-tree $BRANCH_NAME --name-only | grep -i readme || echo "None found"
              exit 1
            fi
            
            echo "✅ $README_FILE fetched successfully"
            
            # Extract video title and thumbnail for thumbnail mode
            if [ "$INCLUDE_THUMBNAIL" = "true" ]; then
              VIDEO_TITLE=$(extract_video_title "README.md")
              THUMBNAIL_LINK=$(extract_thumbnail_link "README.md")
              echo "VIDEO_TITLE=$VIDEO_TITLE" >> $GITHUB_ENV
              echo "THUMBNAIL_LINK=$THUMBNAIL_LINK" >> $GITHUB_ENV
              echo "✅ Extracted title: $VIDEO_TITLE"
              if [ -n "$THUMBNAIL_LINK" ]; then
                echo "✅ Found thumbnail link"
              else
                echo "⚠️ No thumbnail found in README"
              fi
            fi
            
            # If part_numbers are provided, extract specific links
            if [ -n "$PART_NUMBERS" ]; then
              echo "Extracting specific part numbers: $PART_NUMBERS"
              
              # Expand ranges in part_numbers
              EXPANDED_PARTS=$(expand_ranges "$PART_NUMBERS")
              echo "Expanded part numbers: $EXPANDED_PARTS"
              
              for PART_NUM in $EXPANDED_PARTS; do
                if [ "$PART_NUM" = "final" ] || [ "$PART_NUM" = "0" ]; then
                  LINK=$(grep -oP '\]\(\Khttps://[^)]+\.zip' README.md | head -1)
                  if [ -n "$LINK" ]; then
                    echo "$LINK" >> extracted_links.txt
                    echo "Found link for final .zip"
                  fi
                else
                  PART_NUM_PADDED=$(printf "%02d" $PART_NUM)
                  LINK=$(grep -oP '\]\(\Khttps://[^)]+\.z'"${PART_NUM_PADDED}" README.md | head -1)
                  if [ -n "$LINK" ]; then
                    echo "$LINK" >> extracted_links.txt
                    echo "Found link for .z${PART_NUM_PADDED}"
                  fi
                fi
              done
              echo "SOURCE=branch_specific" >> $GITHUB_ENV
            else
              # No part_numbers - download ALL links from the README
              echo "No part numbers provided - downloading ALL links from $README_FILE"
              grep -oP '\]\(\Khttps://[^)]+' README.md >> extracted_links.txt 2>/dev/null || true
              grep -oE 'https://raw\.githubusercontent\.com/[^ ]+' README.md >> extracted_links.txt 2>/dev/null || true
              sort -u extracted_links.txt -o extracted_links.txt
              sed -i '/^$/d' extracted_links.txt
              echo "SOURCE=branch_all" >> $GITHUB_ENV
            fi
            
            echo "INCLUDE_THUMBNAIL=$INCLUDE_THUMBNAIL" >> $GITHUB_ENV
          
          else
            echo "❌ No input provided. Please provide either:"
            echo "  - raw_links (direct links), or"
            echo "  - branch_name (with optional readme_number and part_numbers)"
            exit 1
          fi
          
          # Clean up extracted links
          sed -i 's/^[[:space:]]*//;s/[[:space:]]*$//' extracted_links.txt
          sed -i '/^$/d' extracted_links.txt
          
          LINK_COUNT=$(wc -l < extracted_links.txt)
          echo "LINK_COUNT=$LINK_COUNT" >> $GITHUB_ENV
          
          echo "=========================================="
          echo "Found $LINK_COUNT links to process:"
          echo "=========================================="
          cat extracted_links.txt
          echo "=========================================="
          
          if [ "$LINK_COUNT" -eq 0 ]; then
            echo "❌ No links found to process"
            exit 1
          fi

      - name: Download thumbnail (if enabled)
        if: env.INCLUDE_THUMBNAIL == 'true' && env.THUMBNAIL_LINK != ''
        run: |
          echo "Downloading thumbnail from: ${{ env.THUMBNAIL_LINK }}"
          curl -L -o thumbnail.jpg "${{ env.THUMBNAIL_LINK }}"
          if [ -f "thumbnail.jpg" ] && [ -s "thumbnail.jpg" ]; then
            echo "✅ Thumbnail downloaded successfully"
            echo "THUMBNAIL_DOWNLOADED=true" >> $GITHUB_ENV
          else
            echo "⚠️ Failed to download thumbnail"
            echo "THUMBNAIL_DOWNLOADED=false" >> $GITHUB_ENV
          fi

      - name: Download files using wget
        run: |
          mkdir -p downloaded_files
          cd downloaded_files
          
          LINK_NUM=1
          while IFS= read -r LINK; do
            if [ -n "$LINK" ]; then
              echo "=========================================="
              echo "Downloading file $LINK_NUM of ${{ env.LINK_COUNT }} from:"
              echo "$LINK"
              echo "=========================================="
              
              wget --content-disposition --trust-server-names --max-redirect=5 "$LINK"
              
              DOWNLOADED_FILE=$(ls -1 | head -n 1)
              echo "Downloaded file: $DOWNLOADED_FILE"
              
              if [ -f "$DOWNLOADED_FILE" ] && [ -s "$DOWNLOADED_FILE" ]; then
                SIZE=$(stat -c%s "$DOWNLOADED_FILE")
                SIZE_MB=$((SIZE / 1024 / 1024))
                echo "✅ Downloaded: $DOWNLOADED_FILE (${SIZE_MB} MB)"
                echo "$DOWNLOADED_FILE:SUCCESS:$SIZE" >> ../download_status.txt
              else
                echo "❌ Failed to download from: $LINK"
                echo "unknown:FAILED:0" >> ../download_status.txt
              fi
              
              LINK_NUM=$((LINK_NUM + 1))
              echo ""
            fi
          done < ../extracted_links.txt
          
          cd ..
          
          echo "Files in downloaded_files directory:"
          ls -lh downloaded_files/

      - name: Send files to Bale bot (with or without thumbnail)
        run: |
          TOKEN="${{ inputs.bale_token }}"
          CHAT_ID="${{ inputs.bale_chat_id }}"
          LINK_COUNT="${{ env.LINK_COUNT }}"
          INCLUDE_THUMBNAIL="${{ env.INCLUDE_THUMBNAIL }}"
          VIDEO_TITLE="${{ env.VIDEO_TITLE }}"
          
          # Send initial message or thumbnail with caption
          if [ "$INCLUDE_THUMBNAIL" = "true" ] && [ -f "thumbnail.jpg" ] && [ -s "thumbnail.jpg" ]; then
            echo "Sending thumbnail with caption (VDS style)..."
            CAPTION=$(printf "🎬 *%s*\n\n📦 Found %s link(s)\n⬇️ Downloading and sending..." "$VIDEO_TITLE" "$LINK_COUNT")
            curl -s -X POST "https://tapi.bale.ai/bot${TOKEN}/sendPhoto" \
              -F "chat_id=${CHAT_ID}" \
              -F "photo=@thumbnail.jpg" \
              -F "caption=${CAPTION}" \
              -F "parse_mode=Markdown"
          else
            curl -s -X POST "https://tapi.bale.ai/bot${TOKEN}/sendMessage" \
              -d "chat_id=${CHAT_ID}" \
              -d "text=📦 Found ${LINK_COUNT} link(s). Downloading and sending..."
          fi
          
          cd downloaded_files
          
          FILE_NUM=1
          for FILE in *; do
            if [ -f "$FILE" ] && [ -s "$FILE" ]; then
              SIZE=$(stat -c%s "$FILE")
              SIZE_MB=$((SIZE / 1024 / 1024))
              
              echo "Sending file $FILE_NUM: $FILE (${SIZE_MB} MB)"
              
              curl -s -X POST "https://tapi.bale.ai/bot${TOKEN}/sendDocument" \
                -F "chat_id=${CHAT_ID}" \
                -F "document=@${FILE}" \
                -F "caption=${FILE} | ${SIZE_MB} MB"
              
              echo "✅ Sent $FILE"
              
              FILE_NUM=$((FILE_NUM + 1))
              sleep 1
            fi
          done
          
          cd ..
          
          SENT_COUNT=$((FILE_NUM - 1))
          curl -s -X POST "https://tapi.bale.ai/bot${TOKEN}/sendMessage" \
            -d "chat_id=${CHAT_ID}" \
            -d "text=✅ Done! Sent ${SENT_COUNT} file(s) from ${LINK_COUNT} link(s)."

      - name: Show summary
        run: |
          echo "## 📊 Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Item | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| Source | ${{ env.SOURCE }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Links found | ${{ env.LINK_COUNT }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Thumbnail mode | ${{ env.INCLUDE_THUMBNAIL }} |" >> $GITHUB_STEP_SUMMARY
          if [ -n "${{ env.VIDEO_TITLE }}" ]; then
            echo "| Video title | ${{ env.VIDEO_TITLE }} |" >> $GITHUB_STEP_SUMMARY
          fi
          if [ -f "download_status.txt" ]; then
            SUCCESS_COUNT=$(grep -c ":SUCCESS:" download_status.txt || echo "0")
            FAILED_COUNT=$(grep -c ":FAILED:" download_status.txt || echo "0")
            echo "| Successfully downloaded | $SUCCESS_COUNT |" >> $GITHUB_STEP_SUMMARY
            echo "| Failed downloads | $FAILED_COUNT |" >> $GITHUB_STEP_SUMMARY
          fi
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Processed links:" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          cat extracted_links.txt >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

      - name: Cleanup
        run: |
          rm -f README.md download_status.txt extracted_links.txt input_text.txt thumbnail.jpg
          rm -rf downloaded_files
          echo "🧹 Cleaned up temporary files"