name: 2- Send To Bot

on:
  workflow_dispatch:
    inputs:
      raw_links:
        description: 'Raw GitHub links (one per line, or space-separated). If provided, branch_name and part_numbers are ignored.'
        required: false
        type: string
      branch_name:
        description: 'Branch name (e.g., videos). Used with readme_numbers and part_numbers if raw_links is empty.'
        required: false
        type: string
      readme_numbers:
        description: '📄 README numbers (e.g., 1, 1,2,5, 3,7, or "all"). 1=README.md, 2=README2.md, etc. Use comma for multiple. "all" processes all README files in the branch.'
        required: false
        default: '1'
        type: string
      part_numbers:
        description: 'Part numbers or ranges (e.g., 1-10, 1-5,2,7-10, or "all"). Use comma for multiple. "all" gets all parts from .z01 up to final .zip.'
        required: false
        type: string
        default: 'all'
      include_thumbnail:
        description: '🖼️ Include thumbnail with caption (like VDS) - searches README for thumbnail.jpg link'
        required: false
        default: 'false'
        type: boolean
      bale_token:
        description: 'Bale Bot Token'
        required: true
        type: string
      bale_chat_id:
        description: 'Bale Chat ID'
        required: true
        type: string

jobs:
  resend:
    runs-on: ubuntu-latest
    steps:
      - name: Mask sensitive inputs
        run: |
          echo "::add-mask::${{ inputs.bale_token }}"
          echo "::add-mask::${{ inputs.bale_chat_id }}"

      - name: Determine source and extract links
        id: extract
        run: |
          RAW_LINKS="${{ inputs.raw_links }}"
          BRANCH_NAME="${{ inputs.branch_name }}"
          README_NUMBERS="${{ inputs.readme_numbers }}"
          PART_NUMBERS="${{ inputs.part_numbers }}"
          INCLUDE_THUMBNAIL="${{ inputs.include_thumbnail }}"
          
          > all_extracted_links.txt
          > readme_files_list.txt
          
          # Function to expand ranges like 1-10 into a list of numbers
          expand_ranges() {
            local input="$1"
            local result=""
            for token in $input; do
              if [[ "$token" =~ ^([0-9]+)-([0-9]+)$ ]]; then
                start=${BASH_REMATCH[1]}
                end=${BASH_REMATCH[2]}
                if [ $start -le $end ]; then
                  for ((i=start; i<=end; i++)); do
                    result="$result $i"
                  done
                else
                  for ((i=start; i>=end; i--)); do
                    result="$result $i"
                  done
                fi
              else
                result="$result $token"
              fi
            done
            echo "$result"
          }
          
          # Function to split part numbers by comma and expand each
          parse_part_numbers() {
            local input="$1"
            local result=""
            # Split by comma
            IFS=',' read -ra PARTS <<< "$input"
            for part in "${PARTS[@]}"; do
              # Trim whitespace
              part=$(echo "$part" | sed 's/^[[:space:]]*//;s/[[:space:]]*$//')
              if [ -n "$part" ]; then
                if [ "$part" = "all" ]; then
                  result="all"
                  break
                else
                  expanded=$(expand_ranges "$part")
                  result="$result $expanded"
                fi
              fi
            done
            echo "$result"
          }
          
          # Function to split README numbers by comma
          parse_readme_numbers() {
            local input="$1"
            local result=""
            IFS=',' read -ra NUMS <<< "$input"
            for num in "${NUMS[@]}"; do
              num=$(echo "$num" | sed 's/^[[:space:]]*//;s/[[:space:]]*$//')
              if [ -n "$num" ]; then
                result="$result $num"
              fi
            done
            echo "$result"
          }
          
          # Determine README filename based on number
          get_readme_filename() {
            local num="$1"
            if [ -z "$num" ] || [ "$num" = "1" ]; then
              echo "README.md"
            else
              echo "README${num}.md"
            fi
          }
          
          # Function to get all README files from a branch
          get_all_readme_files() {
            local branch="$1"
            local repo="$2"
            local files=$(git ls-tree "$branch" --name-only | grep -E '^README[0-9]*\.md$' | sort -V)
            echo "$files"
          }
          
          # Function to extract all part numbers from a README (from .z01 to .zNN to final .zip)
          extract_all_parts_from_readme() {
            local readme_file="$1"
            local base_url=""
            local all_links=""
            
            # Extract the base URL pattern from the README
            # Look for first .z01 link to get the pattern
            FIRST_Z01=$(grep -oP '\]\(\Khttps://[^)]+\.z01' "$readme_file" 2>/dev/null | head -1)
            if [ -n "$FIRST_Z01" ]; then
              # Remove .z01 from the end to get base URL
              BASE_URL="${FIRST_Z01%.z01}"
            else
              # Try to find any .zNN pattern
              FIRST_Z=$(grep -oP '\]\(\Khttps://[^)]+\.z[0-9]+' "$readme_file" 2>/dev/null | head -1)
              if [ -n "$FIRST_Z" ]; then
                BASE_URL="${FIRST_Z%.z*}"
              fi
            fi
            
            if [ -n "$BASE_URL" ]; then
              echo "Found base URL: $BASE_URL"
              
              # Find all .zNN parts by incrementing until not found
              PART_NUM=1
              while true; do
                PART_NUM_PADDED=$(printf "%02d" $PART_NUM)
                LINK="${BASE_URL}.z${PART_NUM_PADDED}"
                if grep -q "$LINK" "$readme_file"; then
                  echo "$LINK" >> all_extracted_links.txt
                  echo "Found link for .z${PART_NUM_PADDED}"
                  PART_NUM=$((PART_NUM + 1))
                else
                  break
                fi
              done
              
              # Get the final .zip link
              ZIP_LINK="${BASE_URL}.zip"
              if grep -q "$ZIP_LINK" "$readme_file"; then
                echo "$ZIP_LINK" >> all_extracted_links.txt
                echo "Found link for final .zip"
              fi
            else
              # Fallback: extract all links from README
              grep -oP '\]\(\Khttps://[^)]+' "$readme_file" >> all_extracted_links.txt 2>/dev/null || true
              grep -oE 'https://raw\.githubusercontent\.com/[^ ]+' "$readme_file" >> all_extracted_links.txt 2>/dev/null || true
            fi
          }
          
          # Extract video title from README
          extract_video_title() {
            local readme_file="$1"
            local title=$(grep -oP '^# 📥 Download Links - \K.*' "$readme_file" 2>/dev/null | head -1)
            if [ -z "$title" ]; then
              title=$(grep -oP '^# \K.*' "$readme_file" 2>/dev/null | head -1)
            fi
            if [ -z "$title" ]; then
              title="Video"
            fi
            echo "$title"
          }
          
          # Extract thumbnail link from README
          extract_thumbnail_link() {
            local readme_file="$1"
            local thumb_link=$(grep -oP '\]\(\Khttps://[^)]+thumbnail\.jpg' "$readme_file" 2>/dev/null | head -1)
            if [ -z "$thumb_link" ]; then
              thumb_link=$(grep -oP '\]\(\Khttps://[^)]+\.jpg' "$readme_file" 2>/dev/null | head -1)
            fi
            echo "$thumb_link"
          }
          
          # Case 1: raw_links is provided (use it directly)
          if [ -n "$RAW_LINKS" ]; then
            echo "Using raw_links input"
            echo "$RAW_LINKS" | tr ' ' '\n' | grep -E 'https?://' >> all_extracted_links.txt
            echo "SOURCE=raw_links" >> $GITHUB_ENV
            echo "INCLUDE_THUMBNAIL=false" >> $GITHUB_ENV
          
          # Case 2: branch_name is provided
          elif [ -n "$BRANCH_NAME" ]; then
            echo "Using branch_name: $BRANCH_NAME"
            
            # Fetch the branch to get README files
            git fetch origin "$BRANCH_NAME" 2>/dev/null || true
            
            # Parse README numbers (support comma separator and "all")
            if [ "$README_NUMBERS" = "all" ]; then
              echo "Getting all README files from branch..."
              README_FILES_LIST=$(git ls-tree origin/"$BRANCH_NAME" --name-only | grep -E '^README[0-9]*\.md$' | sort -V)
              README_NUMS=""
              for rf in $README_FILES_LIST; do
                if [ "$rf" = "README.md" ]; then
                  README_NUMS="$README_NUMS 1"
                else
                  NUM=$(echo "$rf" | grep -o '[0-9]\+' | head -1)
                  README_NUMS="$README_NUMS $NUM"
                fi
              done
              echo "Found README numbers: $README_NUMS"
            else
              README_NUMS=$(parse_readme_numbers "$README_NUMBERS")
            fi
            echo "README numbers to process: $README_NUMS"
            
            REPO="${{ github.repository }}"
            TOTAL_README_COUNT=0
            
            # First, collect all README files to process
            for README_NUM in $README_NUMS; do
              README_FILE=$(get_readme_filename "$README_NUM")
              echo "Processing README: $README_FILE"
              
              # Fetch the README
              README_URL="https://raw.githubusercontent.com/${REPO}/${BRANCH_NAME}/${README_FILE}"
              echo "Fetching README from: $README_URL"
              
              curl -L -o "README_${README_NUM}.md" "$README_URL"
              
              if [ ! -f "README_${README_NUM}.md" ]; then
                echo "❌ Could not fetch $README_FILE from branch: $BRANCH_NAME"
                continue
              fi
              
              echo "✅ $README_FILE fetched successfully"
              echo "$README_NUM|README_${README_NUM}.md" >> readme_files_list.txt
              TOTAL_README_COUNT=$((TOTAL_README_COUNT + 1))
              
              # For thumbnail mode, extract title and thumbnail from first README
              if [ "$INCLUDE_THUMBNAIL" = "true" ] && [ $TOTAL_README_COUNT -eq 1 ]; then
                VIDEO_TITLE=$(extract_video_title "README_${README_NUM}.md")
                THUMBNAIL_LINK=$(extract_thumbnail_link "README_${README_NUM}.md")
                echo "VIDEO_TITLE=$VIDEO_TITLE" >> $GITHUB_ENV
                echo "THUMBNAIL_LINK=$THUMBNAIL_LINK" >> $GITHUB_ENV
                echo "✅ Extracted title: $VIDEO_TITLE"
              fi
            done
            
            # Process each README
            README_INDEX=0
            for README_INFO in $(cat readme_files_list.txt); do
              README_NUM=$(echo "$README_INFO" | cut -d'|' -f1)
              README_FILE=$(echo "$README_INFO" | cut -d'|' -f2)
              
              echo "Extracting from README ${README_NUM} ($README_FILE)"
              
              # Check if part_numbers is "all"
              if [ "$PART_NUMBERS" = "all" ]; then
                echo "  Using 'all' mode - extracting all parts from this README"
                extract_all_parts_from_readme "$README_FILE"
              else
                # Parse part numbers
                PARSED_PARTS=$(parse_part_numbers "$PART_NUMBERS")
                
                # Check if result is "all"
                if [ "$PARSED_PARTS" = "all" ]; then
                  echo "  Using 'all' mode - extracting all parts from this README"
                  extract_all_parts_from_readme "$README_FILE"
                else
                  # Process specific part numbers
                  for PART_NUM in $PARSED_PARTS; do
                    if [ "$PART_NUM" = "final" ] || [ "$PART_NUM" = "0" ]; then
                      LINK=$(grep -oP '\]\(\Khttps://[^)]+\.zip' "$README_FILE" | head -1)
                      if [ -n "$LINK" ]; then
                        echo "$LINK" >> all_extracted_links.txt
                        echo "  Found link for final .zip"
                      fi
                    else
                      PART_NUM_PADDED=$(printf "%02d" $PART_NUM)
                      LINK=$(grep -oP '\]\(\Khttps://[^)]+\.z'"${PART_NUM_PADDED}" "$README_FILE" | head -1)
                      if [ -n "$LINK" ]; then
                        echo "$LINK" >> all_extracted_links.txt
                        echo "  Found link for .z${PART_NUM_PADDED}"
                      fi
                    fi
                  done
                fi
              fi
              
              README_INDEX=$((README_INDEX + 1))
            done
            
            echo "SOURCE=branch_specific" >> $GITHUB_ENV
            echo "INCLUDE_THUMBNAIL=$INCLUDE_THUMBNAIL" >> $GITHUB_ENV
          
          else
            echo "❌ No input provided. Please provide either:"
            echo "  - raw_links (direct links), or"
            echo "  - branch_name (with optional readme_numbers and part_numbers)"
            exit 1
          fi
          
          # Clean up extracted links
          sed -i 's/^[[:space:]]*//;s/[[:space:]]*$//' all_extracted_links.txt
          sed -i '/^$/d' all_extracted_links.txt
          
          LINK_COUNT=$(wc -l < all_extracted_links.txt)
          echo "LINK_COUNT=$LINK_COUNT" >> $GITHUB_ENV
          
          echo "=========================================="
          echo "Found $LINK_COUNT links to process:"
          echo "=========================================="
          cat all_extracted_links.txt
          echo "=========================================="
          
          if [ "$LINK_COUNT" -eq 0 ]; then
            echo "❌ No links found to process"
            exit 1
          fi
          
          # Copy to standard filename for subsequent steps
          cp all_extracted_links.txt extracted_links.txt

      - name: Download thumbnail (if enabled)
        if: env.INCLUDE_THUMBNAIL == 'true' && env.THUMBNAIL_LINK != ''
        run: |
          echo "Downloading thumbnail from: ${{ env.THUMBNAIL_LINK }}"
          curl -L -o thumbnail.jpg "${{ env.THUMBNAIL_LINK }}"
          if [ -f "thumbnail.jpg" ] && [ -s "thumbnail.jpg" ]; then
            echo "✅ Thumbnail downloaded successfully"
            echo "THUMBNAIL_DOWNLOADED=true" >> $GITHUB_ENV
          else
            echo "⚠️ Failed to download thumbnail"
            echo "THUMBNAIL_DOWNLOADED=false" >> $GITHUB_ENV
          fi

      - name: Download files using wget
        run: |
          mkdir -p downloaded_files
          cd downloaded_files
          
          LINK_NUM=1
          while IFS= read -r LINK; do
            if [ -n "$LINK" ]; then
              echo "=========================================="
              echo "Downloading file $LINK_NUM of ${{ env.LINK_COUNT }} from:"
              echo "$LINK"
              echo "=========================================="
              
              wget --content-disposition --trust-server-names --max-redirect=5 "$LINK"
              
              DOWNLOADED_FILE=$(ls -1 | head -n 1)
              echo "Downloaded file: $DOWNLOADED_FILE"
              
              if [ -f "$DOWNLOADED_FILE" ] && [ -s "$DOWNLOADED_FILE" ]; then
                SIZE=$(stat -c%s "$DOWNLOADED_FILE")
                SIZE_MB=$((SIZE / 1024 / 1024))
                echo "✅ Downloaded: $DOWNLOADED_FILE (${SIZE_MB} MB)"
                echo "$DOWNLOADED_FILE:SUCCESS:$SIZE" >> ../download_status.txt
              else
                echo "❌ Failed to download from: $LINK"
                echo "unknown:FAILED:0" >> ../download_status.txt
              fi
              
              LINK_NUM=$((LINK_NUM + 1))
              echo ""
            fi
          done < ../extracted_links.txt
          
          cd ..
          
          echo "Files in downloaded_files directory:"
          ls -lh downloaded_files/

      - name: Send files to Bale bot (with or without thumbnail)
        run: |
          TOKEN="${{ inputs.bale_token }}"
          CHAT_ID="${{ inputs.bale_chat_id }}"
          LINK_COUNT="${{ env.LINK_COUNT }}"
          INCLUDE_THUMBNAIL="${{ env.INCLUDE_THUMBNAIL }}"
          VIDEO_TITLE="${{ env.VIDEO_TITLE }}"
          
          if [ "$INCLUDE_THUMBNAIL" = "true" ] && [ -f "thumbnail.jpg" ] && [ -s "thumbnail.jpg" ]; then
            echo "Sending thumbnail with caption (VDS style)..."
            CAPTION=$(printf "🎬 *%s*\n\n📦 Found %s link(s)\n⬇️ Downloading and sending..." "$VIDEO_TITLE" "$LINK_COUNT")
            curl -s -X POST "https://tapi.bale.ai/bot${TOKEN}/sendPhoto" \
              -F "chat_id=${CHAT_ID}" \
              -F "photo=@thumbnail.jpg" \
              -F "caption=${CAPTION}" \
              -F "parse_mode=Markdown"
          else
            curl -s -X POST "https://tapi.bale.ai/bot${TOKEN}/sendMessage" \
              -d "chat_id=${CHAT_ID}" \
              -d "text=📦 Found ${LINK_COUNT} link(s). Downloading and sending..."
          fi
          
          cd downloaded_files
          
          FILE_NUM=1
          for FILE in *; do
            if [ -f "$FILE" ] && [ -s "$FILE" ]; then
              SIZE=$(stat -c%s "$FILE")
              SIZE_MB=$((SIZE / 1024 / 1024))
              
              echo "Sending file $FILE_NUM: $FILE (${SIZE_MB} MB)"
              
              curl -s -X POST "https://tapi.bale.ai/bot${TOKEN}/sendDocument" \
                -F "chat_id=${CHAT_ID}" \
                -F "document=@${FILE}" \
                -F "caption=${FILE} | ${SIZE_MB} MB"
              
              echo "✅ Sent $FILE"
              
              FILE_NUM=$((FILE_NUM + 1))
              sleep 1
            fi
          done
          
          cd ..
          
          SENT_COUNT=$((FILE_NUM - 1))
          curl -s -X POST "https://tapi.bale.ai/bot${TOKEN}/sendMessage" \
            -d "chat_id=${CHAT_ID}" \
            -d "text=✅ Done! Sent ${SENT_COUNT} file(s) from ${LINK_COUNT} link(s)."

      - name: Show summary
        run: |
          echo "## 📊 Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Item | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| Source | ${{ env.SOURCE }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Links found | ${{ env.LINK_COUNT }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Thumbnail mode | ${{ env.INCLUDE_THUMBNAIL }} |" >> $GITHUB_STEP_SUMMARY
          if [ -n "${{ env.VIDEO_TITLE }}" ]; then
            echo "| Video title | ${{ env.VIDEO_TITLE }} |" >> $GITHUB_STEP_SUMMARY
          fi
          if [ -f "download_status.txt" ]; then
            SUCCESS_COUNT=$(grep -c ":SUCCESS:" download_status.txt || echo "0")
            FAILED_COUNT=$(grep -c ":FAILED:" download_status.txt || echo "0")
            echo "| Successfully downloaded | $SUCCESS_COUNT |" >> $GITHUB_STEP_SUMMARY
            echo "| Failed downloads | $FAILED_COUNT |" >> $GITHUB_STEP_SUMMARY
          fi
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Processed links:" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          cat extracted_links.txt >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

      - name: Cleanup
        run: |
          rm -f README*.md download_status.txt extracted_links.txt all_extracted_links.txt readme_files_list.txt input_text.txt thumbnail.jpg
          rm -rf downloaded_files
          echo "🧹 Cleaned up temporary files"