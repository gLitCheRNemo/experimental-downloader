name: 4- Send To Bot

on:
  workflow_dispatch:
    inputs:
      raw_links:
        description: Raw GitHub links (one per line, or space-separated)
        required: true
        type: string
      bale_token:
        description: Bale Bot Token
        required: true
        type: string
      bale_chat_id:
        description: Bale Chat ID
        required: true
        type: string

jobs:
  resend:
    runs-on: ubuntu-latest
    steps:
      - name: Mask sensitive inputs
        run: |
          echo "::add-mask::${{ inputs.bale_token }}"
          echo "::add-mask::${{ inputs.bale_chat_id }}"

      - name: Download files from raw links
        run: |
          mkdir -p downloaded_files
          cd downloaded_files
          
          # Convert multiline input to space-separated and process
          LINKS=$(echo "${{ inputs.raw_links }}" | tr '\n' ' ')
          
          FILE_NUM=1
          for LINK in $LINKS; do
            echo "=========================================="
            echo "Downloading file $FILE_NUM from:"
            echo "$LINK"
            echo "=========================================="
            
            # Extract filename from URL
            FILENAME=$(basename "$LINK" | sed 's/\?.*//')
            
            # Download with wget
            wget --tries=3 --timeout=30 --progress=bar:force -O "$FILENAME" "$LINK"
            
            if [ -f "$FILENAME" ] && [ -s "$FILENAME" ]; then
              SIZE=$(stat -c%s "$FILENAME")
              SIZE_MB=$((SIZE / 1024 / 1024))
              echo "✅ Downloaded: $FILENAME (${SIZE_MB} MB)"
              echo "$FILENAME:SUCCESS:$SIZE" >> ../download_status.txt
            else
              echo "❌ Failed to download: $FILENAME"
              echo "$FILENAME:FAILED:0" >> ../download_status.txt
            fi
            
            FILE_NUM=$((FILE_NUM + 1))
            echo ""
          done
          
          cd ..
          
          echo "Files in downloaded_files directory:"
          ls -lh downloaded_files/

      - name: Send files to Bale bot
        run: |
          TOKEN="${{ inputs.bale_token }}"
          CHAT_ID="${{ inputs.bale_chat_id }}"
          
          # Send header message
          curl -s -X POST "https://tapi.bale.ai/bot${TOKEN}/sendMessage" \
            -d "chat_id=${CHAT_ID}" \
            -d "text=📦 Sending requested files..."
          
          cd downloaded_files
          
          FILE_NUM=1
          for FILE in *; do
            if [ -f "$FILE" ] && [ -s "$FILE" ]; then
              SIZE=$(stat -c%s "$FILE")
              SIZE_MB=$((SIZE / 1024 / 1024))
              
              echo "Sending file $FILE_NUM: $FILE (${SIZE_MB} MB)"
              
              curl -s -X POST "https://tapi.bale.ai/bot${TOKEN}/sendDocument" \
                -F "chat_id=${CHAT_ID}" \
                -F "document=@${FILE}" \
                -F "caption=${FILE} | ${SIZE_MB} MB"
              
              echo "✅ Sent $FILE"
              
              FILE_NUM=$((FILE_NUM + 1))
              sleep 1
            fi
          done
          
          cd ..
          
          # Send completion message
          curl -s -X POST "https://tapi.bale.ai/bot${TOKEN}/sendMessage" \
            -d "chat_id=${CHAT_ID}" \
            -d "text=✅ Done sending all requested files."

      - name: Cleanup
        run: |
          rm -f download_status.txt
          rm -rf downloaded_files
          echo "🧹 Cleaned up temporary files"