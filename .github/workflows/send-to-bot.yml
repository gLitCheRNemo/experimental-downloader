name: 2- Send To Bot

on:
  workflow_dispatch:
    inputs:
      raw_links:
        description: 'Raw GitHub links (one per line, or space-separated)'
        required: false
        type: string
      branch_name:
        description: 'Branch name (e.g., videos)'
        required: false
        type: string
      part_numbers:
        description: 'Part numbers, ranges, or "all" (e.g., 1-10 15 final)'
        required: false
        type: string
      bale_token:
        description: 'Bale Bot Token'
        required: true
        type: string
      bale_chat_id:
        description: 'Bale Chat ID'
        required: true
        type: string

jobs:
  resend:
    runs-on: ubuntu-latest
    steps:
      - name: Mask sensitive inputs
        run: |
          echo "::add-mask::${{ inputs.bale_token }}"
          echo "::add-mask::${{ inputs.bale_chat_id }}"

      - name: Create output file
        run: |
          > extracted_links.txt
          echo "LINK_COUNT=0" >> $GITHUB_ENV

      - name: Process raw_links if provided
        if: ${{ inputs.raw_links != '' }}
        run: |
          echo "Using raw_links input"
          echo "${{ inputs.raw_links }}" | tr ' ' '\n' | grep -E 'https?://' >> extracted_links.txt
          echo "SOURCE=raw_links" >> $GITHUB_ENV

      - name: Process branch method if raw_links is empty
        if: ${{ inputs.raw_links == '' && inputs.branch_name != '' && inputs.part_numbers != '' }}
        run: |
          BRANCH_NAME="${{ inputs.branch_name }}"
          PART_NUMBERS="${{ inputs.part_numbers }}"
          REPO="${{ github.repository }}"
          
          echo "Using branch_name: $BRANCH_NAME"
          echo "Part numbers: $PART_NUMBERS"
          
          # Fetch README.md
          README_URL="https://raw.githubusercontent.com/${REPO}/${BRANCH_NAME}/README.md"
          echo "Fetching README from: $README_URL"
          
          curl --fail -L -o README.md "$README_URL"
          
          if [ ! -f "README.md" ]; then
            echo "ERROR: Could not fetch README.md"
            exit 1
          fi
          
          echo "README.md contents:"
          cat README.md
          
          # Handle "all" keyword
          if echo "$PART_NUMBERS" | grep -q "all"; then
            echo "Detected 'all' keyword"
            # Extract all .zxx numbers
            ALL_PARTS=$(grep -o '\.z[0-9][0-9]' README.md | sed 's/\.z//' | sort -u | tr '\n' ' ')
            PART_NUMBERS="$ALL_PARTS final"
            echo "Expanded to: $PART_NUMBERS"
          fi
          
          # Process each part number
          for PART in $PART_NUMBERS; do
            if [ "$PART" = "final" ] || [ "$PART" = "0" ]; then
              # Find .zip link
              LINK=$(grep -o 'https://[^ )]*\.zip' README.md | head -1)
              if [ -n "$LINK" ]; then
                echo "$LINK" >> extracted_links.txt
                echo "Found .zip link"
              fi
            elif [[ "$PART" =~ ^[0-9]+$ ]]; then
              # Format number with leading zero
              PADDED=$(printf "%02d" $PART)
              LINK=$(grep -o "https://[^ )]*\.z${PADDED}" README.md | head -1)
              if [ -n "$LINK" ]; then
                echo "$LINK" >> extracted_links.txt
                echo "Found .z${PADDED} link"
              fi
            elif [[ "$PART" =~ ^([0-9]+)-([0-9]+)$ ]]; then
              # Handle range like 1-10
              START=${BASH_REMATCH[1]}
              END=${BASH_REMATCH[2]}
              if [ $START -le $END ]; then
                for ((i=START; i<=END; i++)); do
                  PADDED=$(printf "%02d" $i)
                  LINK=$(grep -o "https://[^ )]*\.z${PADDED}" README.md | head -1)
                  if [ -n "$LINK" ]; then
                    echo "$LINK" >> extracted_links.txt
                  fi
                done
              else
                for ((i=START; i>=END; i--)); do
                  PADDED=$(printf "%02d" $i)
                  LINK=$(grep -o "https://[^ )]*\.z${PADDED}" README.md | head -1)
                  if [ -n "$LINK" ]; then
                    echo "$LINK" >> extracted_links.txt
                  fi
                done
              fi
            fi
          done
          
          echo "SOURCE=branch" >> $GITHUB_ENV

      - name: Check if branch method failed due to missing inputs
        if: ${{ inputs.raw_links == '' && (inputs.branch_name == '' || inputs.part_numbers == '') }}
        run: |
          echo "ERROR: Please provide either:"
          echo "  - raw_links, OR"
          echo "  - branch_name AND part_numbers"
          exit 1

      - name: Count and validate links
        run: |
          LINK_COUNT=$(wc -l < extracted_links.txt)
          echo "LINK_COUNT=$LINK_COUNT" >> $GITHUB_ENV
          
          echo "=========================================="
          echo "Found $LINK_COUNT links to process:"
          echo "=========================================="
          cat extracted_links.txt
          echo "=========================================="
          
          if [ "$LINK_COUNT" -eq 0 ]; then
            echo "ERROR: No links found to process"
            exit 1
          fi

      - name: Download files using wget
        run: |
          mkdir -p downloaded_files
          cd downloaded_files
          
          LINK_NUM=1
          while IFS= read -r LINK; do
            if [ -n "$LINK" ]; then
              echo "Downloading file $LINK_NUM of ${{ env.LINK_COUNT }}: $LINK"
              
              wget --content-disposition --trust-server-names --max-redirect=5 "$LINK"
              
              DOWNLOADED_FILE=$(ls -1 | head -n 1)
              echo "Downloaded: $DOWNLOADED_FILE"
              
              if [ -f "$DOWNLOADED_FILE" ] && [ -s "$DOWNLOADED_FILE" ]; then
                SIZE=$(stat -c%s "$DOWNLOADED_FILE")
                SIZE_MB=$((SIZE / 1024 / 1024))
                echo "✅ Downloaded: $DOWNLOADED_FILE (${SIZE_MB} MB)"
              else
                echo "❌ Failed to download: $LINK"
              fi
              
              LINK_NUM=$((LINK_NUM + 1))
              echo ""
            fi
          done < ../extracted_links.txt
          
          cd ..

      - name: Send files to Bale bot
        run: |
          TOKEN="${{ inputs.bale_token }}"
          CHAT_ID="${{ inputs.bale_chat_id }}"
          LINK_COUNT="${{ env.LINK_COUNT }}"
          
          curl -s -X POST "https://tapi.bale.ai/bot${TOKEN}/sendMessage" \
            -d "chat_id=${CHAT_ID}" \
            -d "text=📦 Found ${LINK_COUNT} link(s). Sending files..."
          
          cd downloaded_files
          
          FILE_NUM=1
          for FILE in *; do
            if [ -f "$FILE" ] && [ -s "$FILE" ]; then
              SIZE=$(stat -c%s "$FILE")
              SIZE_MB=$((SIZE / 1024 / 1024))
              
              echo "Sending: $FILE (${SIZE_MB} MB)"
              
              curl -s -X POST "https://tapi.bale.ai/bot${TOKEN}/sendDocument" \
                -F "chat_id=${CHAT_ID}" \
                -F "document=@${FILE}" \
                -F "caption=${FILE} | ${SIZE_MB} MB"
              
              echo "✅ Sent $FILE"
              
              FILE_NUM=$((FILE_NUM + 1))
              sleep 1
            fi
          done
          
          cd ..
          
          SENT_COUNT=$((FILE_NUM - 1))
          curl -s -X POST "https://tapi.bale.ai/bot${TOKEN}/sendMessage" \
            -d "chat_id=${CHAT_ID}" \
            -d "text=✅ Done! Sent ${SENT_COUNT} file(s)."

      - name: Cleanup
        run: |
          rm -f README.md extracted_links.txt
          rm -rf downloaded_files