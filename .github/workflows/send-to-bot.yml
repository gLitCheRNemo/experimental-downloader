name: 4- Send To Bale

on:
  workflow_dispatch:
    inputs:
      branch_name:
        description: Branch name (e.g., md-parts-20260517-143000)
        required: true
        type: string
      part_numbers:
        description: Part numbers (e.g., 1 5 12 18 for .z01 .z05 .z12 .z18, or "final" for .zip)
        required: true
        type: string
      bale_token:
        description: Bale Bot Token
        required: true
        type: string
      bale_chat_id:
        description: Bale Chat ID
        required: true
        type: string

jobs:
  resend:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Mask sensitive inputs
        run: |
          echo "::add-mask::${{ inputs.bale_token }}"
          echo "::add-mask::${{ inputs.bale_chat_id }}"

      - name: Fetch README.md and detect base name
        run: |
          BRANCH="${{ inputs.branch_name }}"
          REPO="${{ github.repository }}"
          
          # Download README.md directly from the branch root
          RAW_URL="https://raw.githubusercontent.com/${REPO}/${BRANCH}/README.md"
          echo "Downloading README from: $RAW_URL"
          
          wget --quiet --show-progress -O README.md "$RAW_URL"
          
          if [ ! -f "README.md" ]; then
            echo "ERROR: Could not download README.md from branch $BRANCH"
            exit 1
          fi
          
          echo "README.md downloaded successfully"
          echo ""
          echo "README.md contents:"
          echo "=========================================="
          cat README.md
          echo "=========================================="
          
          # Detect base name from README (first .z file listed)
          BASE_NAME=$(grep -o '[a-zA-Z0-9_\-]*\.z[0-9][0-9]' README.md | head -1 | sed 's/\.z[0-9][0-9]$//')
          
          if [ -z "$BASE_NAME" ]; then
            # Try to find base name from .zip file in README
            BASE_NAME=$(grep -o '[a-zA-Z0-9_\-]*\.zip' README.md | head -1 | sed 's/\.zip$//')
          fi
          
          echo "BASE_NAME=$BASE_NAME" >> $GITHUB_ENV

      - name: Download missing files (wget)
        run: |
          BRANCH="${{ inputs.branch_name }}"
          REPO="${{ github.repository }}"
          PART_NUMBERS="${{ inputs.part_numbers }}"
          BASE_NAME="${{ env.BASE_NAME }}"
          
          if [ -z "$BASE_NAME" ]; then
            echo "ERROR: Could not detect base name from README.md"
            exit 1
          fi
          
          # Create directory for downloads
          mkdir -p downloaded_files
          cd downloaded_files
          
          # Download each requested part
          for PART_NUM in $PART_NUMBERS; do
            echo "=========================================="
            echo "Downloading part number: $PART_NUM"
            echo "=========================================="
            
            if [ "$PART_NUM" = "final" ] || [ "$PART_NUM" = "0" ]; then
              FILE_NAME="${BASE_NAME}.zip"
            else
              PART_NUM_PADDED=$(printf "%02d" $PART_NUM)
              FILE_NAME="${BASE_NAME}.z${PART_NUM_PADDED}"
            fi
            
            # Construct raw URL
            RAW_URL="https://raw.githubusercontent.com/${REPO}/${BRANCH}/${FILE_NAME}"
            echo "Raw URL: $RAW_URL"
            
            # Download with wget
            echo "Downloading $FILE_NAME..."
            wget --tries=3 --timeout=30 --progress=bar:force -O "$FILE_NAME" "$RAW_URL"
            
            if [ -f "$FILE_NAME" ] && [ -s "$FILE_NAME" ]; then
              SIZE=$(stat -c%s "$FILE_NAME")
              SIZE_MB=$((SIZE / 1024 / 1024))
              echo "✅ Downloaded: $FILE_NAME (${SIZE_MB} MB)"
              echo "$FILE_NAME:SUCCESS:$SIZE" >> ../download_status.txt
            else
              echo "❌ Failed to download $FILE_NAME"
              echo "$FILE_NAME:FAILED:0" >> ../download_status.txt
            fi
            
            echo ""
          done
          
          cd ..
          
          # List downloaded files
          echo "Files in downloaded_files directory:"
          ls -lh downloaded_files/

      - name: Verify downloads
        run: |
          if [ ! -f "download_status.txt" ]; then
            echo "No downloads attempted"
            exit 1
          fi
          
          echo "Download verification:"
          echo "=========================================="
          cat download_status.txt
          echo "=========================================="
          
          # Count successful downloads
          SUCCESS_COUNT=$(grep -c ":SUCCESS:" download_status.txt || echo "0")
          FAILED_COUNT=$(grep -c ":FAILED:" download_status.txt || echo "0")
          
          echo "Successful downloads: $SUCCESS_COUNT"
          echo "Failed downloads: $FAILED_COUNT"
          
          if [ "$SUCCESS_COUNT" -eq 0 ]; then
            echo "No files were downloaded successfully"
            exit 1
          fi
          
          echo "VERIFICATION_PASSED=true" >> $GITHUB_ENV

      - name: Send files to Bale bot
        run: |
          TOKEN="${{ inputs.bale_token }}"
          CHAT_ID="${{ inputs.bale_chat_id }}"
          BRANCH="${{ inputs.branch_name }}"
          PART_NUMBERS="${{ inputs.part_numbers }}"
          BASE_NAME="${{ env.BASE_NAME }}"
          
          # Send header message
          curl -s -X POST "https://tapi.bale.ai/bot${TOKEN}/sendMessage" \
            -d "chat_id=${CHAT_ID}" \
            -d "text=📦 Sending missing parts from branch: ${BRANCH}%0A📁 Base name: ${BASE_NAME}%0A🔢 Part numbers: ${PART_NUMBERS}"
          
          cd downloaded_files
          
          # Process each file in order
          PART_LIST=($PART_NUMBERS)
          FILE_INDEX=0
          
          for PART_NUM in $PART_NUMBERS; do
            FILE_INDEX=$((FILE_INDEX + 1))
            
            if [ "$PART_NUM" = "final" ] || [ "$PART_NUM" = "0" ]; then
              FILE_NAME="${BASE_NAME}.zip"
              CAPTION="📦 FINAL PART (Extract this file)"
            else
              PART_NUM_PADDED=$(printf "%02d" $PART_NUM)
              FILE_NAME="${BASE_NAME}.z${PART_NUM_PADDED}"
              CAPTION="📦 Missing Part ${PART_NUM}"
            fi
            
            if [ -f "$FILE_NAME" ] && [ -s "$FILE_NAME" ]; then
              SIZE=$(stat -c%s "$FILE_NAME")
              SIZE_MB=$((SIZE / 1024 / 1024))
              
              echo "Sending file $FILE_INDEX: $FILE_NAME (${SIZE_MB} MB)"
              
              curl -s -X POST "https://tapi.bale.ai/bot${TOKEN}/sendDocument" \
                -F "chat_id=${CHAT_ID}" \
                -F "document=@${FILE_NAME}" \
                -F "caption=${CAPTION} | ${SIZE_MB} MB"
              
              echo "✅ Sent $FILE_NAME"
              
              # Small delay between sends
              sleep 1
            else
              echo "❌ File not found: $FILE_NAME"
              curl -s -X POST "https://tapi.bale.ai/bot${TOKEN}/sendMessage" \
                -d "chat_id=${CHAT_ID}" \
                -d "text=❌ Could not send ${FILE_NAME} (file missing or empty)"
            fi
          done
          
          cd ..
          
          # Send completion message
          curl -s -X POST "https://tapi.bale.ai/bot${TOKEN}/sendMessage" \
            -d "chat_id=${CHAT_ID}" \
            -d "text=✅ Done sending requested parts from branch: ${BRANCH}"

      - name: Cleanup
        run: |
          rm -f README.md download_status.txt
          rm -rf downloaded_files
          echo "🧹 Cleaned up temporary files"