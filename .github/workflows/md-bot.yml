name: MD Bot

on:
  workflow_dispatch:
    inputs:
      magnet:
        description: '🧲 Magnet link (torrent)'
        required: true
        type: string
      result_name:
        description: '📝 Name for the downloaded content'
        required: true
        type: string
        default: 'download'
      use_warp:
        description: '🛡️ Use WARP (sometimes helps | +40s)'
        required: true
        default: false
        type: boolean
      parts_size:
        description: '🫙 Parts size (MB)'
        required: false
        type: string
        default: '45'
      bale_token:
        description: '🤖 Bale Bot Token'
        required: true
        type: string
      bale_chat_id:
        description: '💬 Bale Chat ID'
        required: true
        type: string
      delay_seconds:
        description: '⏱️ Delay between sending parts (seconds)'
        required: false
        type: string
        default: '2'

jobs:
  download-split-and-send:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 0

      - name: Mask sensitive inputs
        run: |
          echo "::add-mask::${{ inputs.bale_token }}"
          echo "::add-mask::${{ inputs.bale_chat_id }}"

      - name: Setup WARP
        if: ${{ inputs.use_warp == 'true' }}
        run: |
          docker rm -f warp 2>/dev/null || true
          docker network create warp-net 2>/dev/null || true
          docker run -d \
            --name warp \
            --restart=always \
            --network warp-net \
            -p 1080:1080 \
            --cap-add NET_ADMIN \
            --sysctl net.ipv6.conf.all.disable_ipv6=0 \
            --sysctl net.ipv4.conf.all.src_valid_mark=1 \
            -v warp-data:/var/lib/cloudflare-warp \
            caomingjun/warp
          echo "Waiting for WARP to initialize..."
          sleep 15

      - name: Setup aria2
        run: |
          sudo apt-get install -y aria2
          aria2c --version

      - name: Download torrent
        id: download
        run: |
          mkdir -p download_tmp
          cd download_tmp
          MAGNET="${{ inputs.magnet }}"
          RESULT_NAME="${{ inputs.result_name }}"

          if [ "${{ inputs.use_warp }}" = "true" ]; then
            export http_proxy=socks5h://127.0.0.1:1080
            export https_proxy=socks5h://127.0.0.1:1080
          fi

          aria2c \
            --enable-dht=true \
            --bt-enable-lpd=true \
            --bt-max-peers=0 \
            --seed-time=0 \
            --follow-torrent=true \
            --check-integrity=true \
            --dir=. \
            "$MAGNET"

          echo "Download completed"

          # Find the downloaded file or folder
          DOWNLOADED_ITEM=$(ls -1 | head -n 1)
          echo "DOWNLOADED_ITEM=$DOWNLOADED_ITEM" >> $GITHUB_ENV
          
          SAFE_NAME=$(echo "$RESULT_NAME" | sed 's/ /_/g')
          echo "SAFE_NAME=$SAFE_NAME" >> $GITHUB_ENV

      - name: Split into ZIP parts
        id: split
        run: |
          PARTS_SIZE="${{ inputs.parts_size }}"
          SAFE_NAME="${{ env.SAFE_NAME }}"
          DOWNLOADED_ITEM="${{ env.DOWNLOADED_ITEM }}"
          
          mkdir -p parts
          cd download_tmp
          
          # Check if downloaded item is a file or folder
          if [ -f "$DOWNLOADED_ITEM" ]; then
            # Single file
            FILE_SIZE=$(stat -c%s "$DOWNLOADED_ITEM")
            FILE_SIZE_MB=$((FILE_SIZE / 1024 / 1024))
            
            if [ $FILE_SIZE_MB -le $PARTS_SIZE ]; then
              echo "File is smaller than split size. Creating single ZIP."
              zip -0 "../parts/${SAFE_NAME}.zip" "$DOWNLOADED_ITEM"
              echo "SINGLE_FILE=true" >> $GITHUB_ENV
              echo "TOTAL_PARTS=1" >> $GITHUB_ENV
            else
              echo "File is larger than split size. Creating split ZIP."
              zip -0 -s ${PARTS_SIZE}m "../parts/${SAFE_NAME}.zip" "$DOWNLOADED_ITEM"
              echo "SINGLE_FILE=false" >> $GITHUB_ENV
              cd ../parts
              TOTAL_PARTS=$(ls -1 ${SAFE_NAME}.z* 2>/dev/null | wc -l)
              echo "TOTAL_PARTS=$TOTAL_PARTS" >> $GITHUB_ENV
              cd ../download_tmp
            fi
          else
            # Folder - zip recursively
            echo "Downloaded content is a folder. Creating split ZIP recursively."
            zip -r -0 -s ${PARTS_SIZE}m "../parts/${SAFE_NAME}.zip" "$DOWNLOADED_ITEM"
            cd ../parts
            if ls ${SAFE_NAME}.z* 1> /dev/null 2>&1; then
              TOTAL_PARTS=$(ls -1 ${SAFE_NAME}.z* | wc -l)
              echo "TOTAL_PARTS=$TOTAL_PARTS" >> $GITHUB_ENV
              echo "SINGLE_FILE=false" >> $GITHUB_ENV
            else
              echo "SINGLE_FILE=true" >> $GITHUB_ENV
              echo "TOTAL_PARTS=1" >> $GITHUB_ENV
            fi
          fi
          
          cd ../parts
          ls -lh

      - name: Send to Bale
        run: |
          TOKEN="${{ inputs.bale_token }}"
          CHAT_ID="${{ inputs.bale_chat_id }}"
          DELAY="${{ inputs.delay_seconds }}"
          if ! [[ "$DELAY" =~ ^[0-9]+$ ]]; then
            DELAY=2
          fi
          cd parts
          SAFE_NAME="${{ env.SAFE_NAME }}"
          
          # Send name with down arrow
          NAME=$(echo "$SAFE_NAME" | sed 's/_/ /g')
          curl -s -X POST "https://tapi.bale.ai/bot${TOKEN}/sendMessage" \
            -d "chat_id=${CHAT_ID}" \
            -d "text=${NAME}%0A⬇️"
          
          if [ "${{ env.SINGLE_FILE }}" = "true" ]; then
            # Send single file
            if [ -f "${SAFE_NAME}.zip" ]; then
              SIZE=$(stat -c%s "${SAFE_NAME}.zip")
              SIZE_MB=$((SIZE / 1024 / 1024))
              echo "Sending ${SAFE_NAME}.zip (${SIZE_MB}MB)"
              curl -s -X POST "https://tapi.bale.ai/bot${TOKEN}/sendDocument" \
                -F "chat_id=${CHAT_ID}" \
                -F "document=@${SAFE_NAME}.zip" \
                -F "caption=${NAME} | ${SIZE_MB}MB"
            fi
          else
            # Send split parts
            PART_NUM=1
            FAILED=""
            TOTAL_PARTS="${{ env.TOTAL_PARTS }}"
            
            for part in $(ls ${SAFE_NAME}.z* 2>/dev/null | sort -V); do
              SIZE=$(stat -c%s "$part")
              SIZE_MB=$((SIZE / 1024 / 1024))
              echo "Sending $part (${SIZE_MB}MB) - Part $PART_NUM/$TOTAL_PARTS"
              curl -s -X POST "https://tapi.bale.ai/bot${TOKEN}/sendDocument" \
                -F "chat_id=${CHAT_ID}" \
                -F "document=@${part}" \
                -F "caption=Part $PART_NUM/$TOTAL_PARTS | ${SIZE_MB}MB"
              if [ $? -ne 0 ]; then
                FAILED="$FAILED $PART_NUM"
              fi
              PART_NUM=$((PART_NUM + 1))
              sleep $DELAY
            done
            
            # Send final .zip
            if [ -f "${SAFE_NAME}.zip" ]; then
              SIZE=$(stat -c%s "${SAFE_NAME}.zip")
              SIZE_MB=$((SIZE / 1024 / 1024))
              echo "Sending final ${SAFE_NAME}.zip (${SIZE_MB}MB)"
              curl -s -X POST "https://tapi.bale.ai/bot${TOKEN}/sendDocument" \
                -F "chat_id=${CHAT_ID}" \
                -F "document=@${SAFE_NAME}.zip" \
                -F "caption=FINAL - Extract this file | ${SIZE_MB}MB"
            fi
            
            if [ -n "$FAILED" ]; then
              echo "Partial failure. Failed parts:$FAILED"
              exit 1
            fi
          fi
          
          curl -s -X POST "https://tapi.bale.ai/bot${TOKEN}/sendMessage" \
            -d "chat_id=${CHAT_ID}" \
            -d "text=✅ Done! Delay: ${DELAY}s"

      - name: Cleanup
        run: rm -rf download_tmp parts